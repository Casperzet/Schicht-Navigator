      for (const title of lines) {
        r = await C.task(me.id, { title, dept: ui.sheetVal('tk-dept'), act: ui.sheetVal('tk-act'), due, u: !!ui.sheetVal('tk-u'), proofRequired: !!ui.sheetVal('tk-proof'), escalate: !!ui.sheetVal('tk-esc') });
        if (!r.ok) break;
      }
      if (r.ok) { const d = await SN.dist.run(me.id); ui.result(r, lines.length + ' gesendet. ' + SN.dist.resultText(d)); ui.closeSheet(); return; }
    } else if (mode === 'kudos') {
      const text = String(ui.sheetVal('ku-text') || '').trim();
      if (!text) return ui.toast('Bitte kurz schreiben, wofür.', 'warn');
      r = await C.kudos(me.id, ui.sheetVal('ku-to'), text);
    }
    if (ui.result(r, mode === 'kudos' ? 'Lob gesendet 💛' : 'Gesendet – du siehst live, wer es gelesen und quittiert hat')) { ui.closeSheet(); ui.go('inbox', {}); ui.sub('inTab', 'sent'); }
  });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/40-inbox.js konnte nicht geladen werden:", e); }

/* ===== src/views/45-photo.js ===== */
try {
/* ==========================================================================
   Fotobericht – Schichtleitung meldet laufend per Foto an die Filialleitung
   Schichtleitung: Kamera zuerst (1 Tap) → Kategorie → optional Text → Senden.
   Filialleitung/Admin: Foto-Feed, Ungesehenes zuerst, Schnellantwort.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, O = SN.ops, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  let shots = [];        // [{url, busy}]
  let cat = 'order';

  const isBoss = (me) => M.isAdmin(me);
  const unseenFor = (me) => SN.store.list('items').filter((it) => it.kind === 'photo' && C.isRecipient(it, me.id) && !(it.seen || {})[me.id]);

  function photoCard(it, me, now) {
    const seenBy = Object.keys(it.seen || {}).filter((id) => id !== it.from);
    const replies = (it.thread || []).filter((t) => t.type !== 'fwd');
    const fresh = C.isRecipient(it, me.id) && !(it.seen || {})[me.id];
    return '<article class="sn-card sn-photo-card' + (it.u ? ' sn-card--urgent' : '') + (fresh ? ' is-new' : '') + '" data-item="' + it.id + '">'
      + (it.u ? '<div class="sn-card__flag">🔥 Dringend</div>' : '')
      + (it.photosRemoved && !(it.photos || []).length ? '<p class="sn-photo-card__gone">🗑 ' + U.fmt.count(it.photosRemoved, 'Foto', 'Fotos') + ' nach Löschfrist entfernt (Datenschutz)</p>' : '')
      + '<div class="sn-photo-card__media" data-act="ph-open" data-id="' + it.id + '">' + (it.photos || []).slice(0, 4).map((p, i) => '<img alt="Fotobericht ' + (i + 1) + '" loading="lazy" src="' + esc(p) + '">').join('') + (fresh ? '<span class="sn-photo-card__new">Neu</span>' : '') + '</div>'
      + '<div class="sn-photo-card__body"><div class="sn-card__head"><h3 class="sn-card__title">' + esc(it.title) + '</h3>'
      + '<span class="sn-receipt sn-receipt--' + (replies.length ? 'ack' : seenBy.length ? 'read' : 'sent') + '">' + (replies.length ? 'beantwortet' : seenBy.length ? 'gesehen' : 'gesendet') + '</span></div>'
      + '<p class="sn-muted sn-small">' + esc((it.from === me.id ? 'Du' : M.name(it.from)) + ' · ' + (it.dept || '') + ' · ' + U.fmt.when(it.createdAt) + (it.from === me.id ? ' · an ' + M.labelFor(C.recipients(it)) : '')) + '</p>'
      + (it.body ? '<p class="sn-card__body">' + esc(it.body) + '</p>' : '')
      + replies.map((r) => '<p class="sn-photo-card__reply"><b>' + esc(M.first(r.by)) + ':</b> ' + esc(r.text) + ' <small>' + U.fmt.time(r.at) + '</small></p>').join('')
      + (C.isRecipient(it, me.id) ? '<div class="sn-chips">' + O.PHOTO_REPLIES.map((q) => '<button type="button" class="sn-chip sn-chip--outline" data-act="ph-reply" data-id="' + it.id + '" data-x="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div>' : '')
      + '</div></article>';
  }

  function leadView({ me, now }) {
    const mine = C.sentBy(me.id, 'photo').filter((it) => now - it.createdAt < 2 * U.DAY);
    const today = mine.filter((it) => U.fmt.dayKey(it.createdAt) === U.fmt.dayKey(now));
    const to = M.labelFor(O.photoTargets('fl', now));
    let h = '<section class="sn-shoot">'
      + (shots.length
        ? '<div class="sn-shoot__strip">' + shots.map((s, i) => '<figure><img alt="Aufnahme ' + (i + 1) + '" src="' + esc(s.url) + '"><button type="button" aria-label="Foto entfernen" data-act="ph-del" data-i="' + i + '">×</button></figure>').join('')
          + (shots.length < 4 ? '<label class="sn-shoot__more" for="ph-cam">' + icon('plus') + '<span>Noch ein Foto</span></label>' : '') + '</div>'
        : '<label class="sn-shoot__cam" for="ph-cam"><span class="sn-shoot__lens">' + icon('camera', 'sn-icon--lg') + '</span><b>Foto aufnehmen</b><small>Geht direkt an ' + esc(to) + '</small></label>')
      + '<input type="file" id="ph-cam" accept="image/*" capture="environment" hidden data-change="ph-shot">'
      + '</section>';
    if (shots.length) {
      h += '<div class="sn-chips sn-chips--scroll" role="radiogroup" aria-label="Kategorie">' + O.PHOTO_CATS.map((c) => '<button type="button" role="radio" aria-checked="' + (c.key === cat) + '" class="sn-chip ' + (c.key === cat ? 'sn-chip--solid' : 'sn-chip--outline') + '" data-act="ph-cat" data-k="' + c.key + '">' + c.icon + ' ' + esc(c.label) + '</button>').join('') + '</div>'
        + '<div class="sn-field"><label class="sn-label" for="ph-text">Kurz dazu (optional)</label><input class="sn-input" id="ph-text" placeholder="z. B. Aktion Gang 7 steht, 2 Paletten offen"></div>'
        + '<div class="sn-row" style="gap:8px"><label class="sn-check"><input type="checkbox" id="ph-u">🔥 Dringend</label><label class="sn-check"><input type="checkbox" id="ph-admin">auch Admin vom Dienst</label></div>'
        + '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" data-act="ph-send" id="ph-send">' + icon('send') + '<span>An ' + esc(to) + ' senden</span></button>';
    }
    h += '<div class="sn-row sn-row--between"><h2 class="sn-section-title">Heute gemeldet</h2><span class="sn-chip sn-chip--outline">' + today.length + ' Fotoberichte</span></div>'
      + (mine.length ? mine.map((it) => photoCard(it, me, now)).join('') : P.empty('Noch kein Fotobericht', 'Ein Foto sagt der Filialleitung mehr als ein Anruf.'));
    return h;
  }

  function bossView({ me, now, sub }) {
    const all = U.sortBy(SN.store.list('items').filter((it) => it.kind === 'photo' && (C.isRecipient(it, me.id) || M.isAdmin(me)) && now - it.createdAt < 3 * U.DAY), (it) => -it.createdAt);
    const f = sub.phF || 'new';
    const unseen = all.filter((it) => !(it.seen || {})[me.id] && it.from !== me.id);
    const list = f === 'new' ? unseen : all;
    return '<div class="sn-segment sn-segment--sticky" role="tablist"><button type="button" role="tab" class="sn-segment__tab" data-act="ph-f" data-k="new" aria-selected="' + (f === 'new') + '">Ungesehen' + (unseen.length ? ' <span class="sn-badge">' + unseen.length + '</span>' : '') + '</button>'
      + '<button type="button" role="tab" class="sn-segment__tab" data-act="ph-f" data-k="all" aria-selected="' + (f === 'all') + '">Alle (' + all.length + ')</button></div>'
      + (list.length ? list.map((it) => photoCard(it, me, now)).join('') : P.empty(f === 'new' ? 'Alles gesehen' : 'Noch keine Fotoberichte', 'Neue Fotos der Schichtleitung erscheinen hier sofort.', f === 'new'));
  }

  ui.registerView('photo', {
    label: 'Foto', icon: 'camera', groups: ['lead', 'admin'], order: 15,
    render: (ctx) => (isBoss(ctx.me) ? bossView(ctx) : leadView(ctx)),
    badge: (me) => (isBoss(me) ? unseenFor(me).length : C.sentBy(me.id, 'photo').filter((it) => (it.thread || []).some((t) => t.by !== me.id && t.at > (it.readReplies || 0))).length),
  });

  ui.onChange('ph-shot', async (el) => {
    const f = el.files && el.files[0]; if (!f) return;
    const img = await U.shrinkImage(f, 1280, 0.72);
    const i = shots.push({ url: img.dataUrl, busy: true }) - 1;
    ui.render(true);
    try { shots[i].url = await SN.store.upload(img.blob, img.dataUrl); } catch (e) { ui.toast('Foto konnte nicht hochgeladen werden – wird im Bericht mitgeschickt.', 'warn'); }
    shots[i].busy = false;
  });
  ui.on('ph-del', (el) => { shots.splice(+el.dataset.i, 1); ui.render(true); });
  ui.on('ph-cat', (el) => { cat = el.dataset.k; ui.render(true); });
  ui.on('ph-f', (el) => ui.sub('phF', el.dataset.k));
  ui.on('ph-send', async (el) => {
    if (shots.some((s) => s.busy)) return ui.toast('Foto wird noch hochgeladen …', 'info');
    el.disabled = true;
    const me = SN.session.me();
    const txt = String(ui.sheetVal('ph-text') || '').trim();
    let body = txt, orig;
    if (txt && SN.ai.available().text) { const t = await SN.ai.toGerman(txt); if (t && t.from && t.from !== 'de') { body = t.text; orig = txt; } }
    const r = await O.photoReport(me.id, { cat, dept: M.deptOf(me, SN.clock.now()), body, orig, photos: shots.map((s) => s.url), u: !!ui.sheetVal('ph-u') });
    if (r.ok && ui.sheetVal('ph-admin')) await O.photoReport(me.id, { cat, dept: M.deptOf(me, SN.clock.now()), body, orig, photos: shots.map((s) => s.url), u: !!ui.sheetVal('ph-u'), to: 'admin' });
    if (ui.result(r, 'Gesendet – du siehst, wann es gesehen wird')) { shots = []; cat = 'order'; ui.render(false); } else el.disabled = false;
  });
  ui.on('ph-reply', async (el) => {
    const me = SN.session.me();
    await C.markSeen(el.dataset.id, me.id);
    ui.result(await C.reply(el.dataset.id, me.id, el.dataset.x), 'Antwort gesendet');
  });
  ui.on('ph-open', async (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    const me = SN.session.me();
    if (it.from === me.id && (it.thread || []).length) await SN.store.patch('items', it.id, { readReplies: SN.clock.now() });
    else await C.markSeen(it.id, me.id);
    ui.sheet(it.title, '<div class="sn-photo-full">' + (it.photos || []).map((p) => '<img alt="Foto" src="' + esc(p) + '">').join('') + '</div>' + (it.body ? '<p>' + esc(it.body) + '</p>' : '')
      + '<p class="sn-muted sn-small">' + esc(M.name(it.from) + ' · ' + U.fmt.when(it.createdAt)) + '</p>'
      + '<div class="sn-field"><label class="sn-label" for="it-reply">Antwort</label><textarea class="sn-textarea" id="it-reply" rows="2"></textarea></div>',
    P.btn('Antwort senden', 'it-reply', { id: it.id }, 'primary', 'send'));
  });
  SN.photoOpen = () => ui.go('photo', {});
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/45-photo.js konnte nicht geladen werden:", e); }

/* ===== src/views/50-chat.js ===== */
try {
/* ==========================================================================
   Chat (M6): 1:1, Abteilungskanal, Kanal „Leitung“. Lesehaken, Schnellantworten,
   Übersetzen-Knopf an jeder Nachricht, Direkt-Knöpfe zu den Admins.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  const tr = {};
  let openTid = null;

  function threadView(tid, me, now, draft) {
    const msgs = C.messages(tid);
    const info = C.threadInfo(tid);
    const quick = M.isLead(me) ? ['Danke!', 'Bitte zur Info kommen', 'Pause jetzt möglich', 'Komm bitte zur Rampe'] : ['Verstanden', 'Ich komme', 'Brauche Hilfe', 'Bin in der Pause'];
    let lastDay = '';
    const canTr = SN.ai.available().text;
    const body = msgs.map((m) => {
      const out = m.by === me.id;
      const day = U.fmt.dayKey(m.at);
      const sep = day !== lastDay ? '<p class="sn-chat__day">' + esc(U.fmt.date(m.at)) + '</p>' : '';
      lastDay = day;
      return sep + '<div class="sn-bubble' + (out ? ' sn-bubble--out' : '') + '">'
        + (!out && info.type !== 'dm' ? '<p class="sn-bubble__author">' + esc(M.name(m.by)) + '</p>' : '')
        + (m.text ? '<p class="sn-bubble__text">' + esc(m.text) + '</p>' : '')
        + (m.photo ? '<img alt="Foto" src="' + esc(m.photo) + '" style="max-width:100%;border-radius:8px">' : '')
        + (tr[m.id] ? '<p class="sn-translation">🌐 ' + esc(tr[m.id]) + '</p>' : '')
        + '<div class="sn-bubble__meta">' + U.fmt.time(m.at)
        + (out ? ' <span class="sn-receipt sn-receipt--' + C.receipt(tid, m) + '">' + (C.receipt(tid, m) === 'read' ? 'gelesen' : 'gesendet') + '</span>' : '')
        + (!out && canTr && m.text && !tr[m.id] ? ' <button type="button" class="sn-link" data-act="chat-tr" data-tid="' + esc(tid) + '" data-id="' + m.id + '">Übersetzen</button>' : '')
        + '</div></div>';
    }).join('');
    return '<div class="sn-row sn-row--between"><button type="button" class="sn-btn sn-btn--ghost" data-act="chat-back">' + icon('back') + '<span>Chats</span></button><h2 class="sn-section-title" style="margin:0">' + esc(C.threadTitle(tid, me.id)) + '</h2></div>'
      + (info.type === 'dm' ? '<p class="sn-muted sn-small">🔒 Nur ihr beide seht diesen Chat.</p>' : info.type === 'lead' ? '<p class="sn-muted sn-small">Kanal für Schichtleitung und höher – Abstimmung ohne WhatsApp.</p>' : '')
      + '<div class="sn-chat" id="chat-list">' + (body || P.empty('Noch keine Nachrichten', 'Schreib die erste oder tippe eine Schnellantwort.')) + '</div>'
      + '<div class="sn-chips">' + quick.map((q) => '<button type="button" class="sn-chip sn-chip--outline" data-act="chat-quick" data-x="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div>'
      + '<div class="sn-composer"><label class="sn-sr-only" for="chat-in">Nachricht</label><input class="sn-input" id="chat-in" autocomplete="off" placeholder="Nachricht" data-enter="chat-send" value="' + esc(draft || '') + '">'
      + (SN.ai.dictation.available() ? '<button type="button" class="sn-btn sn-btn--icon" data-act="mic" data-target="chat-in">' + icon('mic') + '<span>Sprechen</span></button>' : '')
      + '<button type="button" class="sn-btn sn-btn--primary sn-btn--icon" data-act="chat-send">' + icon('send') + '<span>Senden</span></button></div>';
  }

  function listView(me) {
    const th = C.threadsFor(me.id);
    const admins = M.admins().map(M.emp).filter(Boolean);
    return '<h2 class="sn-section-title">Direkt zu den Admins</h2><div class="sn-chips">' + admins.filter((a) => a.id !== me.id).map((a) => '<button type="button" class="sn-chip sn-chip--solid" data-act="chat-open" data-tid="' + esc(C.threadId.dm(me.id, a.id)) + '">' + esc(a.name) + (M.adminOnDuty(SN.clock.now()) === a.id ? ' · vom Dienst' : '') + '</button>').join('') + '</div>'
      + '<button type="button" class="sn-btn sn-btn--secondary sn-btn--block" data-act="chat-new">' + icon('plus') + '<span>Neuer Chat mit Kolleg/in</span></button>'
      + P.sec('Chats', th.length) + '<ul class="sn-list">' + th.map((t) => {
        const last = C.messages(t.id).slice(-1)[0];
        return '<li class="sn-list__item"><button type="button" class="sn-card sn-card--tap" data-act="chat-open" data-tid="' + esc(t.id) + '" style="width:100%;text-align:left;padding:12px"><span class="sn-list__body"><span class="sn-list__title">' + (t.type === 'lead' ? '🛡 ' : t.type === 'dept' ? '# ' : '') + esc(t.title) + (t.unread ? ' <span class="sn-badge">' + t.unread + '</span>' : '') + '</span>'
          + '<span class="sn-list__sub">' + (last ? esc(M.first(last.by) + ': ' + (last.text || '📷 Foto')) + ' · ' + esc(U.fmt.ago(last.at)) : 'Noch keine Nachrichten') + '</span></span></button></li>';
      }).join('') + '</ul>';
  }

  function render({ me, now, params }) {
    if (params.tid && params.tid !== openTid) { openTid = params.tid; params.tid = null; }
    if (openTid && !C.canUseThread(openTid, me.id)) openTid = null;
    return openTid ? threadView(openTid, me, now, params.draft) : listView(me);
  }
  function mount(root, { me }) {
    if (!openTid) return;
    const l = root.querySelector('#chat-list');
    if (l) root.scrollTop = root.scrollHeight;
    if (C.unread(openTid, me.id)) C.chatRead(openTid, me.id);
    ui.params.draft = '';
  }

  ui.registerView('chat', {
    label: 'Chat', icon: 'chat', groups: ['emp', 'lead', 'admin', 'clean'], order: 40, render, mount,
    badge: (me) => C.totalUnread(me.id),
  });
  ui.on('chat-open', (el) => { openTid = el.dataset.tid; ui.go('chat', {}); });
  ui.on('chat-back', () => { openTid = null; ui.render(false); });
  async function send(text) {
    const me = SN.session.me();
    const r = await C.chatSend(openTid, me.id, { text, lang: me.lang });
    if (r.ok) { const i = document.getElementById('chat-in'); if (i) { i.value = ''; } ui.render(true); const n = document.getElementById('chat-in'); if (n) n.focus(); }
    else ui.result(r);
  }
  ui.on('chat-send', () => { const v = String(ui.sheetVal('chat-in') || '').trim(); if (v) send(v); });
  ui.on('chat-quick', (el) => send(el.dataset.x));
  ui.on('chat-tr', async (el) => {
    const m = C.messages(el.dataset.tid).find((x) => x.id === el.dataset.id); if (!m) return;
    el.disabled = true; el.textContent = 'Übersetze …';
    const r = await SN.ai.translate(m.text, SN.session.me().lang || 'de');
    if (!r) return ui.toast('Übersetzung nur in Claude verfügbar.', 'warn');
    tr[m.id] = r.text; ui.render(true);
  });
  ui.on('chat-new', () => {
    const me = SN.session.me();
    ui.sheet('Neuer Chat', '<div class="sn-field"><label class="sn-label" for="cn-p">Mit wem?</label><select class="sn-select" id="cn-p">'
      + U.sortBy(M.staff().filter((e) => e.id !== me.id), (e) => e.name).map((e) => '<option value="' + e.id + '">' + esc(e.name + ' · ' + M.role(e).label + (e.dept ? ' · ' + e.dept : '')) + '</option>').join('') + '</select></div>',
    '<button type="button" class="sn-btn sn-btn--primary sn-btn--block" data-act="chat-new-go">Chat öffnen</button>');
  });
  ui.on('chat-new-go', () => { openTid = C.threadId.dm(SN.session.id, ui.sheetVal('cn-p')); ui.closeSheet(); ui.go('chat', {}); });
  SN.chatOpen = (tid) => { openTid = tid; ui.go('chat', {}); };
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/50-chat.js konnte nicht geladen werden:", e); }

/* ===== src/views/60-live.js ===== */
try {
/* ==========================================================================
   Live (Admin/Filialleitung) und Team (Schicht-/Teamleitung) – S1
   Oben „Brennpunkte“ mit Direkt-Aktion, darunter die Personen der Schicht mit
   Status. Je Person: Auftrag, Chat, Umsetzen. Keine Ranglisten.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;

  function scopeOf(me) {
    if (M.isAdmin(me)) return null;
    if (me.role === 'tl' && me.group && M.DEPT_GROUPS[me.group]) return M.DEPT_GROUPS[me.group].depts;
    return me.scope && me.scope.length ? me.scope : [me.dept];
  }

  function hotspots(me, now, scope) {
    let hs = C.hotspots(now);
    if (scope) hs = hs.filter((h) => !h.item ? scope.includes(h.dept) : (h.item.kind === 'sos' || !h.item.dept || scope.includes(h.item.dept)));
    if (!hs.length) return '';
    return P.sec('Brennpunkte', hs.length) + hs.slice(0, 8).map((h) => {
      const it = h.item;
      let act = '';
      if (h.type === 'report' && it) act = P.btn('Übernehmen', 'it-take', { id: it.id }, 'primary') + P.btn('Ansehen', 'it-open', { id: it.id }, 'ghost');
      else if (h.type === 'post' && it) act = P.btn('Nachfassen', 'it-remind', { id: it.id }, 'secondary', 'bell');
      else if (h.type === 'task' && it) act = P.btn('Verteilen', 'live-dist', {}, 'primary') + P.btn('Zuteilen', 'it-assign', { id: it.id }, 'ghost');
      else if (h.type === 'call' && it) act = P.btn('Ansehen', 'it-open', { id: it.id }, 'secondary');
      else if (h.type === 'sos' && it) act = P.btn('Ansehen', 'it-open', { id: it.id }, 'primary');
      else if (h.type === 'dept') act = P.btn('Verteilen', 'live-dist', { dept: h.dept }, 'secondary');
      return '<div class="sn-card' + (h.level >= 2 ? ' sn-card--escalated' : h.type === 'sos' ? ' sn-card--urgent' : '') + '" style="padding:12px"><p style="margin:0 0 8px;font-weight:600">' + esc(h.text) + '</p><div class="sn-card__actions">' + act + '</div></div>';
    }).join('');
  }

  function person(e, now) {
    const s = SN.dist.status(e, now);
    const st = s.key === 'pause' ? 'pause' : s.key === 'away' || s.key === 'off' ? 'off' : '';
    const lim = SN.dist.limitOf(e, now), load = SN.dist.loadOf(e.id);
    return '<div class="sn-card" style="padding:10px" data-n="' + esc((e.name + ' ' + (M.deptOf(e, now) || '')).toLowerCase()) + '"><div class="sn-person-row">'
      + '<span class="sn-avatar' + (M.isLead(e) ? ' sn-avatar--lead' : '') + '">' + esc(P.initials(e.name)) + '<span class="sn-avatar__status' + (st ? ' sn-avatar__status--' + st : '') + '" aria-hidden="true"></span></span>'
      + '<div><p><b>' + esc(e.name) + '</b> <span class="sn-muted sn-small">' + esc(M.role(e).label) + ' · ' + esc(M.deptOf(e, now) || '') + (e.loan && e.loan.until > now ? ' ↔' : '') + '</span></p>'
      + '<p class="sn-muted sn-small">' + esc(s.text) + (lim ? ' · ' + Math.round(load / lim * 100) + ' % verplant' : '') + '</p></div></div>'
      + '<div class="sn-card__actions">' + P.btn('Auftrag', 'p-task', { id: e.id }, 'secondary', 'plus') + P.btn('Chat', 'p-chat', { id: e.id }, 'ghost', 'chat') + P.btn('Umsetzen', 'p-move', { id: e.id }, 'ghost', 'forward') + '</div></div>';
  }

  function render({ me, now, sub }) {
    const scope = scopeOf(me);
    const on = M.staff().filter((e) => e.role !== 'clean' && !M.isAdmin(e) && M.onDuty(e, now) && (!scope || scope.includes(M.deptOf(e, now))));
    const sts = on.map((e) => SN.dist.status(e, now).key);
    const free = sts.filter((k) => k === 'free').length, pause = sts.filter((k) => k === 'pause').length;
    const openRep = SN.store.list('items').filter((it) => (it.kind === 'report' || it.kind === 'absence') && !C.isFinal(it) && (!scope || scope.includes(it.dept))).length;
    const pa = SN.dist.pauseAlerts(now);
    let h = '<div class="sn-kpis"><div class="sn-kpi"><span class="sn-kpi__value">' + on.length + '</span><span class="sn-kpi__label">im Dienst</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + free + '</span><span class="sn-kpi__label">frei</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + pause + '</span><span class="sn-kpi__label">Pause</span></div>'
      + '<div class="sn-kpi' + (openRep ? ' sn-kpi--alert' : '') + '"><span class="sn-kpi__value">' + openRep + '</span><span class="sn-kpi__label">Meldungen</span></div></div>';
    if (scope) h += '<p class="sn-muted sn-small">Dein Bereich: ' + esc(scope.join(', ')) + '</p>';
    h += hotspots(me, now, scope);
    const over = (pa.over || []).filter((x) => !scope || scope.includes(M.deptOf(M.emp(x.id || x), now)));
    if (over.length) h += '<div class="sn-alert sn-alert--warn sn-alert--card"><p class="sn-alert__title">☕ Pause überzogen: ' + esc(over.map((x) => M.first(x.id || x)).join(', ')) + '</p><p class="sn-alert__text">Kurz nachfragen – ohne Vorwurf, vielleicht ist etwas passiert.</p></div>';
    h += '<div class="sn-row" style="gap:8px;margin:12px 0">' + P.btn('Schnellruf', 'call-sheet', {}, 'secondary', 'bell') + P.btn('Neu verteilen', 'live-dist', {}, 'secondary', 'users') + '</div>';
    const dept = sub.liveDept || '';
    const q = (sub.liveQ || '').toLowerCase();
    const opts = scope || M.DEPTS;
    h += '<div class="sn-filter"><div><label class="sn-label sn-sr-only" for="live-q">Suche</label><input class="sn-input" id="live-q" placeholder="Name suchen" data-change="live-q" value="' + esc(sub.liveQ || '') + '"></div>'
      + '<div><label class="sn-label sn-sr-only" for="live-dept">Abteilung</label><select class="sn-select" id="live-dept" data-change="live-dept"><option value="">Alle Abteilungen</option>' + opts.map((d) => '<option value="' + esc(d) + '"' + (d === dept ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</select></div></div>';
    const order = { free: 0, work: 1, pause: 2, away: 3, off: 4 };
    const list = U.sortBy(on.filter((e) => (!dept || M.deptOf(e, now) === dept) && (!q || e.name.toLowerCase().includes(q))), (e) => order[SN.dist.status(e, now).key] * 1000 + (M.deptOf(e, now) || '').charCodeAt(0));
    h += P.sec('Personen', list.length) + (list.length ? list.map((e) => person(e, now)).join('') : P.empty('Niemand gefunden', 'Filter ändern oder Schicht prüfen.'));
    return h;
  }

  const fab = () => ({ label: 'Senden', icon: 'send', act: 'send-sheet' });
  ui.registerView('live', { label: 'Live', icon: 'users', groups: ['admin'], order: 10, render, fab,
    badge: (me) => C.hotspots(SN.clock.now()).filter((h) => h.level >= 2).length });
  ui.registerView('team', { label: 'Team', icon: 'users', groups: ['lead'], order: 22, render, fab, show: () => false });

  ui.onChange('live-q', (el) => ui.sub('liveQ', el.value));
  ui.onChange('live-dept', (el) => ui.sub('liveDept', el.value));
  ui.on('live-dist', async (el) => { const r = await SN.dist.run(SN.session.id, undefined, el.dataset.dept ? { dept: el.dataset.dept } : undefined); ui.toast(SN.dist.resultText(r)); });
  ui.on('p-chat', (el) => SN.chatOpen(C.threadId.dm(SN.session.id, el.dataset.id)));

  ui.on('p-task', (el) => {
    const e = M.emp(el.dataset.id), now = SN.clock.now();
    ui.sheet('Auftrag für ' + e.name, '<p class="sn-muted sn-small">Frei: ' + U.fmt.dur(SN.dist.freeOf(e, now)) + ' bis zum Limit · ' + esc(SN.dist.status(e, now).text) + '</p>'
      + '<div class="sn-field"><label class="sn-label" for="pt-title">Was ist zu tun?</label><textarea class="sn-textarea" id="pt-title" rows="2"></textarea></div>'
      + '<div class="sn-field"><label class="sn-label" for="pt-act">Tätigkeit</label><select class="sn-select" id="pt-act">' + M.ACTS.map((a) => '<option' + ((e.acts || [])[0] === a.key ? ' selected' : '') + ' value="' + esc(a.key) + '">' + esc(a.label + ((e.acts || []).includes(a.key) ? ' ✓' : '')) + '</option>').join('') + '</select></div>'
      + '<label class="sn-check"><input type="checkbox" id="pt-u">🔥 Dringend</label>',
    P.btn('Senden', 'p-task-go', { id: e.id }, 'primary', 'send'));
  });
  ui.on('p-task-go', async (el) => {
    const me = SN.session.me(), e = M.emp(el.dataset.id), now = SN.clock.now();
    const title = String(ui.sheetVal('pt-title') || '').trim();
    if (!title) return ui.toast('Bitte beschreiben, was zu tun ist.', 'warn');
    const w = M.shiftWindow(e, now);
    const r = await C.task(me.id, { title, dept: M.deptOf(e, now), act: ui.sheetVal('pt-act'), owner: e.id, u: !!ui.sheetVal('pt-u'), due: w && w.e > now ? w.e : now + 2 * U.HOUR, escalate: true });
    if (ui.result(r, 'Auftrag an ' + M.first(e.id) + ' gesendet')) ui.closeSheet();
  });
  ui.on('p-move', (el) => {
    const e = M.emp(el.dataset.id);

/* ===== src/views/65-goods.js ===== */
try {
/* ==========================================================================
   Lieferung – KKP · Paletten · Boxen → Personen → Touren mit Laufweg
   Schnell: Zähler + „Abteilungen je KKP“. Genau: je KKP Abteilungen antippen.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, O = SN.ops, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  const st = { kkp: 6, pal: 2, box: 4, avg: 4, exact: false, units: null, title: 'LKW Zentrallager' };
  const SHELF = M.DEPTS.filter((d) => !['Kasse', 'Info', 'Lager', 'Wareneinnahme', 'Leergut'].includes(d));

  function units() {
    if (st.exact && st.units) return st.units;
    return O.unitsFromCounts({ kkp: st.kkp, pal: st.pal, box: st.box, avg: st.avg }, SHELF);
  }
  const stepper = (k, label, sub, ic) => '<div class="sn-stepper"><span class="sn-stepper__icon" aria-hidden="true">' + ic + '</span><span class="sn-stepper__text"><b>' + esc(label) + '</b><small>' + esc(sub) + '</small></span>'
    + '<button type="button" class="sn-stepper__btn" data-act="gd-step" data-k="' + k + '" data-d="-1" aria-label="' + esc(label) + ' weniger">−</button><output class="sn-stepper__val" aria-live="polite">' + st[k] + '</output>'
    + '<button type="button" class="sn-stepper__btn" data-act="gd-step" data-k="' + k + '" data-d="1" aria-label="' + esc(label) + ' mehr">+</button></div>';

  function render({ me, now }) {
    const cfg = O.effortCfg();
    const us = units();
    const p = O.planDelivery(us, now);
    let h = '<section class="sn-card sn-goods"><h2 class="sn-section-title" style="margin-top:0">🚚 Was ist angekommen?</h2>'
      + '<div class="sn-field"><label class="sn-label" for="gd-title">Lieferung</label><input class="sn-input" id="gd-title" value="' + esc(st.title) + '" data-change="gd-title"></div>'
      + stepper('kkp', 'KKP', cfg.kkp + ' Min + ' + cfg.kkpDept + ' je Abteilung', '🛒')
      + stepper('pal', 'Paletten', cfg.pal + ' Min je Palette', '🟫')
      + stepper('box', 'Boxen', 'graue Kisten · ' + cfg.box + ' Min', '📥')
      + '<fieldset class="sn-choices sn-choices--row"><legend class="sn-label">Abteilungen je KKP (Ø)</legend>' + [1, 2, 3, 4, 5, 6].map((n) => '<label class="sn-choice"><input type="radio" name="gd-avg" value="' + n + '" data-change="gd-avg"' + (n === st.avg ? ' checked' : '') + '><span>' + n + '</span></label>').join('') + '</fieldset>'
      + '<label class="sn-switch">Jede KKP genau erfassen<input type="checkbox" role="switch" data-change="gd-exact"' + (st.exact ? ' checked' : '') + '></label></section>';

    if (st.exact) {
      h += '<h2 class="sn-section-title">KKP einzeln <small>Abteilungen antippen</small></h2>' + us.map((u, i) => u.type !== 'kkp' ? '' : '<div class="sn-card sn-kkp"><b>🛒 KKP ' + (i + 1) + '</b> <small class="sn-muted">' + (u.depts || []).length + ' Abteilungen · ' + O.unitMin(u, cfg) + ' Min</small><div class="sn-chips">'
        + SHELF.map((d) => '<button type="button" class="sn-chip ' + ((u.depts || []).includes(d) ? 'sn-chip--solid' : 'sn-chip--outline') + '" data-act="gd-dept" data-i="' + i + '" data-d="' + esc(d) + '">' + (M.DEPT_ICONS[d] || '') + ' ' + esc(d) + '</button>').join('') + '</div></div>').join('');
    }

    // Schema: Einheiten → Minuten → Personen
    const t = (k) => us.filter((u) => u.type === k);
    const tm = (k) => t(k).reduce((s, u) => s + O.unitMin(u, cfg), 0);
    h += '<section class="sn-card sn-schema" aria-label="Schema Aufwand und Personen">'
      + '<div class="sn-schema__row">' + ['kkp', 'pal', 'box'].map((k) => '<div class="sn-schema__cell"><span class="sn-schema__icon">' + O.UNIT[k].icon + '</span><b>' + t(k).length + '</b><small>' + esc(O.UNIT[k].label + (k === 'box' ? 'en' : k === 'pal' ? 'n' : '')) + '</small><i>' + U.fmt.dur(tm(k)) + '</i></div>').join('') + '</div>'
      + '<div class="sn-schema__arrow" aria-hidden="true">▼</div>'
      + '<div class="sn-schema__result"><div><b>' + U.fmt.dur(p.min) + '</b><small>Arbeit gesamt</small></div><div class="is-main"><b>' + p.people + '</b><small>' + (p.people === 1 ? 'Person' : 'Personen') + '</small></div><div><b>' + (p.duration ? 'ca. ' + U.fmt.dur(p.duration) : '–') + '</b><small>bis fertig</small></div></div>'
      + '<p class="sn-muted sn-small">' + (p.available < p.want ? '⚠ Gebraucht ' + p.want + ', im Dienst und frei nur ' + p.available + ' – dauert länger. Hilfe über „Schnellruf“ holen.' : 'Ziel: in ca. ' + cfg.target + ' Min verräumt. Frei im Dienst: ' + p.available + '.') + '</p></section>';

    if (p.rounds.length) {
      h += '<h2 class="sn-section-title">Touren <small>Laufweg in Filial-Reihenfolge</small></h2>' + p.rounds.map((r, i) => '<div class="sn-card sn-route"><div class="sn-row sn-row--between"><b>Tour ' + (i + 1) + '</b><span class="sn-chip">' + U.fmt.dur(r.min) + '</span></div>'
        + '<p class="sn-small">' + r.units.map((u) => O.UNIT[u.type].icon + ' ' + O.UNIT[u.type].label).join(' · ') + '</p>'
        + '<ol class="sn-route__path">' + r.depts.map((d) => '<li>' + (M.DEPT_ICONS[d] || '') + ' ' + esc(d) + '</li>').join('') + '</ol></div>').join('');
    }
    h += '<label class="sn-check"><input type="checkbox" id="gd-u">🔥 Dringend (Ware steht im Gang)</label>'
      + '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" data-act="gd-go">' + icon('users') + '<span>Anlegen und ' + p.people + ' Touren verteilen</span></button>';
    const tr = U.sortBy(SN.store.list('trucks').filter((x) => U.fmt.dayKey(x.at) === U.fmt.dayKey(now)), (x) => -x.at);
    if (tr.length) h += P.sec('Heute angekommen', tr.length) + tr.map((x) => '<div class="sn-card" style="padding:12px"><b>🚚 ' + esc(x.title) + '</b><p class="sn-small">' + (x.kkp || 0) + ' KKP · ' + (x.pal || 0) + ' Paletten · ' + (x.box || 0) + ' Boxen · ' + U.fmt.dur(x.min || 0) + ' · ' + U.fmt.count(x.people || 0, 'Tour', 'Touren') + ' · ' + esc(U.fmt.time(x.at)) + '</p></div>').join('');
    return h;
  }

  ui.registerView('ware', { groups: ['lead', 'admin'], order: 70, render });
  ui.on('gd-step', (el) => { const k = el.dataset.k; st[k] = Math.max(0, Math.min(60, st[k] + +el.dataset.d)); st.units = null; if (st.exact) st.units = units0(); ui.render(true); });
  ui.onChange('gd-avg', (el) => { st.avg = +el.value; st.units = null; if (st.exact) st.units = units0(); ui.render(true); });
  ui.onChange('gd-title', (el) => { st.title = el.value; });
  ui.onChange('gd-exact', (el) => { st.exact = el.checked; st.units = el.checked ? units0() : null; ui.render(true); });
  function units0() { return O.unitsFromCounts({ kkp: st.kkp, pal: st.pal, box: st.box, avg: st.avg }, SHELF); }
  ui.on('gd-dept', (el) => {
    const u = st.units[+el.dataset.i]; const d = el.dataset.d;
    u.depts = (u.depts || []).includes(d) ? u.depts.filter((x) => x !== d) : (u.depts || []).concat(d).slice(0, 8);
    ui.render(true);
  });
  ui.on('gd-go', async (el) => {
    el.disabled = true;
    const r = await O.createDelivery(SN.session.id, st.title, units(), { u: !!ui.sheetVal('gd-u') });
    el.disabled = false;
    if (ui.result(r, r.ok ? r.tasks + ' Touren angelegt. ' + SN.dist.resultText(r.dist) : '')) { st.units = null; st.exact = false; }
  });
  SN.goodsOpen = () => ui.go('ware', {});
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/65-goods.js konnte nicht geladen werden:", e); }

/* ===== src/views/70-me.js ===== */
try {
/* ==========================================================================
   Ich: Profil, Pause, Mein Plan (mit KI-Scan + Prüfansicht), Ausfall melden,
   Schichtanfragen (nur als Anfrage, S2), Übergabe (Leitung), Stimmung (anonym)
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  let draftPlan = null;

  function defaultPlan(me) {
    const f = me.sh !== 'Spät';
    return M.DAYS.map((d, i) => ({ d, off: i >= 5, s: f ? '06:00' : '14:00', e: f ? '14:00' : '22:00', p: SN.dist.pauseFor(me.h || 8) }));
  }
  function week(days, now) {
    const ti = (new Date(now).getDay() + 6) % 7;
    return '<div class="sn-week">' + days.map((x, i) => {
      const s = U.fmt.hm(x.s) / 60, e = U.fmt.hm(x.e) / 60;
      return '<div class="' + (i === ti ? 'is-today' : '') + '"><b>' + esc(x.d) + '</b>' + (x.off ? '<span class="sn-muted sn-small">frei</span>' : '<span class="sn-track"><i style="left:' + ((s - 5) / 18 * 100) + '%;width:' + ((e - s) / 18 * 100) + '%">' + esc(x.s + '–' + x.e) + ' · ☕' + (x.p == null ? '' : x.p) + '</i></span>') + '</div>';
    }).join('') + '</div>';
  }
  function planEditor(days) {
    return '<p class="sn-muted">Bitte prüfen und bei Bedarf korrigieren, dann übernehmen.</p>' + days.map((x, i) => '<fieldset class="sn-plan-row"><legend class="sn-label">' + esc(x.d) + '</legend>'
      + '<label class="sn-check"><input type="checkbox" id="pl-off-' + i + '"' + (x.off ? ' checked' : '') + '>frei</label>'
      + '<div class="sn-filter"><input class="sn-input" id="pl-s-' + i + '" type="time" value="' + esc(x.s) + '" aria-label="Beginn ' + esc(x.d) + '"><input class="sn-input" id="pl-e-' + i + '" type="time" value="' + esc(x.e) + '" aria-label="Ende ' + esc(x.d) + '"><input class="sn-input" id="pl-p-' + i + '" type="number" min="0" max="90" value="' + (x.p == null ? '' : x.p) + '" aria-label="Pause Minuten ' + esc(x.d) + '"></div></fieldset>').join('');
  }

  function render({ me, now }) {
    const lim = SN.dist.limitOf(me, now);
    const plan = SN.store.peek('plans', me.id);
    const days = (plan && plan.days) || defaultPlan(me);
    let h = '<section class="sn-card" style="padding:14px"><div class="sn-person-row"><span class="sn-avatar sn-avatar--lead">' + esc(P.initials(me.name)) + '</span><div><p><b>' + esc(me.name) + '</b></p><p class="sn-muted sn-small">' + esc(M.role(me).label + (me.dept ? ' · ' + M.deptOf(me, now) : '') + ' · ' + (me.sh || '')) + '</p></div></div>'
      + (me.role !== 'clean' && !M.isAdmin(me) ? '<p class="sn-small">Pause heute: ' + SN.dist.pauseOf(me, now) + ' Min · Limit: ' + U.fmt.dur(lim) + ' (20 % bleiben für Kunden)</p>' : '') + '</section>';

    // Ausfall melden (selbst)
    h += P.sec('Ich falle aus') + '<div class="sn-row" style="gap:8px">' + P.btn('Krank', 'abs', { t: 'sick' }, 'secondary') + P.btn('Verspäte mich', 'abs', { t: 'late' }, 'secondary') + '</div>'
      + '<p class="sn-muted sn-small">Geht sofort an deine Schichtleitung. Bei Krankheit fragt die App automatisch, wer einspringen kann.</p>';

    // Schichtanfragen
    const reqs = SN.store.list('items').filter((it) => it.kind === 'shiftreq' && (C.isRecipient(it, me.id) || it.from === me.id) && now - it.createdAt < 7 * U.DAY);
    h += P.sec('Schichtanfragen', reqs.filter((r) => !C.isFinal(r)).length || '') + (reqs.length ? P.list(U.sortBy(reqs, (r) => -r.createdAt), me, now) : '<p class="sn-muted sn-small">Änderungen an deinem Plan kommen nur als Anfrage – du entscheidest.</p>')
      + P.btn(M.isLead(me) ? 'Schicht anfragen' : 'Tausch vorschlagen', 'sr-new', {}, 'ghost', 'plus');

    // Plan
    h += P.sec('Mein Plan') + week(days, now) + P.btn('Wochenplan der Filiale', 'go-week', {}, 'ghost', 'tasks')
      + '<div class="sn-row" style="gap:8px;margin-top:8px"><label class="sn-btn sn-btn--secondary" for="plan-photo">' + icon('camera') + '<span>Plan-Foto lesen</span></label><input type="file" id="plan-photo" accept="image/*" capture="environment" hidden data-change="plan-photo">'
      + P.btn('Bearbeiten', 'plan-edit', {}, 'ghost') + '</div>';

    // Übergabe (Leitung)
    if (M.isLead(me)) {
      const s = C.handoverSummary(M.currentShift(now) || me.sh, now);
      h += P.sec('Schichtübergabe') + '<div class="sn-card" style="padding:12px"><p class="sn-small">' + 'Automatisch dabei: ' + esc(s.text) + '</p>'
        + '<div class="sn-field"><label class="sn-label" for="ho-notes">Hinweise für die nächste Schicht</label><textarea class="sn-textarea" id="ho-notes" rows="2" placeholder="z. B. Kühlregal 3 tropft, Techniker kommt 15 Uhr"></textarea></div>'
        + P.btn('Übergabe senden', 'ho-send', {}, 'primary', 'send') + '</div>';
    }

    // Stimmung am Schichtende (anonym)
    const w = M.shiftWindow(me, now);
    const key = 'mood.' + me.id + '.' + U.fmt.dayKey(now);
    if (w && now > w.e - 90 * U.MIN && !U.ls.get(key, false)) {
      h += P.sec('Wie war deine Schicht?') + '<div class="sn-mood">' + ['😀', '🙂', '😐', '🙁'].map((m, i) => '<button type="button" data-act="mood" data-v="' + (i + 1) + '" aria-label="' + ['Sehr gut', 'Gut', 'Geht so', 'Schlecht'][i] + '">' + m + '</button>').join('') + '</div><p class="sn-muted sn-small">Anonym. Die Filialleitung sieht nur die Summe der Schicht, ab 5 Antworten.</p>';
    }
    h += P.sec('Darstellung') + '<div class="sn-row" style="gap:8px">' + ['auto', 'light', 'dark'].map((t) => P.btn(t === 'auto' ? 'Automatisch' : t === 'light' ? 'Hell' : 'Dunkel', 'theme', { t }, U.ls.get('theme', 'auto') === t ? 'primary' : 'ghost')).join('') + '</div>';
    h += '<button type="button" class="sn-btn sn-btn--danger sn-btn--block" style="margin-top:20px" data-act="logout">Abmelden</button>';
    return h;
  }

  ui.registerView('me', { label: 'Ich', icon: 'user', groups: ['emp', 'lead', 'admin', 'clean'], order: 90, render, show: (me) => !M.isAdmin(me),
    badge: (me) => SN.store.list('items').filter((it) => it.kind === 'shiftreq' && !C.isFinal(it) && C.isRecipient(it, me.id) && it.state !== 'taken').length });

  ui.on('abs', (el) => {
    const late = el.dataset.t === 'late';
    ui.sheet(late ? 'Ich verspäte mich' : 'Ich bin krank', (late ? '<fieldset class="sn-choices"><legend class="sn-label">Wie lange ungefähr?</legend>' + ['15', '30', '60'].map((m, i) => '<label class="sn-choice"><input type="radio" name="abs-m" value="' + m + '"' + (i ? '' : ' checked') + '><span>' + m + ' Min</span></label>').join('') + '</fieldset>' : '<p>Gute Besserung! Deine Schichtleitung bekommt sofort Bescheid. Die Krankmeldung (AU) gibst du wie gewohnt ab.</p>')
      + '<div class="sn-field"><label class="sn-label" for="abs-note">Hinweis (optional)</label><input class="sn-input" id="abs-note"></div>', P.btn('Senden', 'abs-go', { t: el.dataset.t }, 'primary', 'send'));
  });
  ui.on('abs-go', async (el) => {
    const r = await C.reportAbsence(SN.session.id, { type: el.dataset.t, minutes: +(P.picked('abs-m') || 0) || null, note: ui.sheetVal('abs-note') || '' });
    if (ui.result(r, 'Gemeldet – die Schichtleitung sieht es sofort' + (r.standin ? ', Einspringer werden gefragt' : ''))) ui.closeSheet();
  });

  ui.on('sr-new', () => {
    const me = SN.session.me();
    const people = U.sortBy(M.staff().filter((e) => e.id !== me.id && e.role !== 'clean' && (!M.isLead(me) ? !M.isLead(e) || e.role === 'sl' : true)), (e) => e.name);
    ui.sheet(M.isLead(me) ? 'Schicht anfragen' : 'Tausch vorschlagen', '<div class="sn-field"><label class="sn-label" for="sr-to">An</label><select class="sn-select" id="sr-to">' + people.map((e) => '<option value="' + e.id + '">' + esc(e.name + ' · ' + (e.dept || '')) + '</option>').join('') + '</select></div>'
      + '<div class="sn-filter"><div class="sn-field"><label class="sn-label" for="sr-day">Tag</label><select class="sn-select" id="sr-day">' + M.DAYS.slice(0, 6).map((d) => '<option>' + d + '</option>').join('') + '</select></div>'
      + '<div class="sn-field"><label class="sn-label" for="sr-sh">Schicht</label><select class="sn-select" id="sr-sh"><option>Früh</option><option>Spät</option></select></div></div>'
      + '<div class="sn-field"><label class="sn-label" for="sr-note">Nachricht</label><input class="sn-input" id="sr-note"></div>'
      + (M.isLead(me) ? '' : '<p class="sn-muted sn-small">Ein Tausch braucht danach die Freigabe der Schichtleitung.</p>'),
    P.btn('Anfrage senden', 'sr-go', {}, 'primary', 'send'));
  });
  ui.on('sr-go', async () => {
    const me = SN.session.me();
    const r = await C.shiftRequest(me.id, ui.sheetVal('sr-to'), { day: ui.sheetVal('sr-day'), shift: ui.sheetVal('sr-sh'), note: ui.sheetVal('sr-note') || '', swap: !M.isLead(me) });
    if (ui.result(r, 'Anfrage gesendet – du siehst die Antwort hier')) ui.closeSheet();
  });
  ui.on('ho-send', async () => { const r = await C.sendHandover(SN.session.id, { notes: ui.sheetVal('ho-notes') || '' }); ui.result(r, 'Übergabe gesendet – die nächste Schicht muss quittieren'); });
  ui.on('mood', async (el) => {
    const me = SN.session.me();
    await C.vote(+el.dataset.v, me.sh);
    U.ls.set('mood.' + me.id + '.' + U.fmt.dayKey(SN.clock.now()), true);
    ui.toast('Danke! Anonym gespeichert.'); ui.render(true);
  });
  ui.on('theme', (el) => { U.ls.set('theme', el.dataset.t); applyTheme(); ui.render(true); });
  function applyTheme() { const t = U.ls.get('theme', 'auto'); if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; }
  applyTheme();

  /* ---------- Plan: Bearbeiten und KI-Scan ------------------------------------ */
  function openEditor(days, title) {
    draftPlan = U.clone(days);
    ui.sheet(title || 'Plan bearbeiten', planEditor(draftPlan), P.btn('Übernehmen', 'plan-save', {}, 'primary', 'check'));
  }
  ui.on('plan-edit', () => { const me = SN.session.me(); const p = SN.store.peek('plans', me.id); openEditor((p && p.days) || defaultPlan(me)); });
  ui.on('plan-save', async () => {
    const days = draftPlan.map((x, i) => ({ d: x.d, off: !!ui.sheetVal('pl-off-' + i), s: ui.sheetVal('pl-s-' + i) || x.s, e: ui.sheetVal('pl-e-' + i) || x.e, p: ui.sheetVal('pl-p-' + i) === '' ? null : +ui.sheetVal('pl-p-' + i) }));
    const bad = days.find((x) => !x.off && U.fmt.hm(x.e) <= U.fmt.hm(x.s));
    if (bad) return ui.toast(bad.d + ': Ende liegt vor Beginn.', 'warn');
    const me = SN.session.me();
    const r = await SN.store.put('plans', me.id, { id: me.id, week: U.fmt.dayKey(SN.clock.now()), days });
    if (r.ok) { ui.toast('Plan gespeichert'); ui.closeSheet(); } else ui.toast('Nicht gespeichert.', 'warn');
  });
  ui.onChange('plan-photo', async (el) => {
    const f = el.files && el.files[0]; if (!f) return;
    if (!SN.ai.available().images) return ui.toast('Plan lesen geht nur in der Claude-Ansicht. Bitte „Bearbeiten“ nutzen.', 'warn');
    ui.toast('Plan wird gelesen …', 'info');
    const img = await U.shrinkImage(f, 1400, 0.75);
    const me = SN.session.me();
    const o = await SN.ai.image('Das Foto zeigt einen gedruckten Wochen-Dienstplan. Finde die Zeile für "' + me.name + '" (sonst die erste Zeile). Antworte NUR mit JSON-Array mit genau 7 Objekten für Mo bis So: {"d":"Mo","off":true/false,"s":"HH:MM","e":"HH:MM","p":Pause in Minuten oder null}. off=true bei frei, Urlaub oder krank.', [img.blob]);
    if (!Array.isArray(o)) return ui.toast('Plan konnte nicht gelesen werden. Bitte gerader fotografieren.', 'warn');
    const days = M.DAYS.map((d) => { const x = o.find((y) => y && y.d === d) || { off: true }; return { d, off: !!x.off, s: x.s || '06:00', e: x.e || '14:00', p: x.p == null ? null : +x.p }; });

/* ===== src/views/75-week.js ===== */
try {
/* ==========================================================================
   Wochenplan – Arbeitstage, Lagerlast und Aufgaben je Person
   Oben: Mo–Sa mit Balken „Bedarf ↔ Kapazität“. Darunter der gewählte Tag als
   Zeitleiste (06–22 Uhr) je Person mit den verteilten Aufgaben.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, O = SN.ops, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  const H0 = 6, H1 = 22;
  const hrs = (m) => (m >= 120 ? Math.round(m / 60) + ' Std' : U.fmt.dur(m));
  const pos = (h) => ((h - H0) / (H1 - H0) * 100).toFixed(2) + '%';

  function render({ me, now, sub }) {
    const days = O.week(now);
    const todayKey = U.fmt.dayKey(now);
    const selKey = sub.wkDay || (days.find((d) => d.key === todayKey) || days[0]).key;
    const loads = days.map((d) => O.dayLoad(d));
    const L = loads.find((l) => l.day.key === selKey) || loads[0];
    const maxNeed = Math.max(1, ...loads.map((l) => l.need));
    let h = '<div class="sn-week-strip" role="tablist" aria-label="Wochentage">' + loads.map((l) => {
      const pct = l.need / maxNeed * 130; // relativ zum stärksten Tag der Woche
      const lvl = l.pct > 100 ? 'over' : l.pct > 80 || l.need === maxNeed ? 'warn' : 'ok';
      return '<button type="button" role="tab" aria-selected="' + (l.day.key === selKey) + '" class="sn-wday sn-wday--' + lvl + (l.day.key === todayKey ? ' is-today' : '') + '" data-act="wk-day" data-k="' + l.day.key + '">'
        + '<span class="sn-wday__d">' + esc(l.day.label) + '</span><span class="sn-wday__n">' + new Date(l.day.date).getDate() + '.</span>'
        + '<span class="sn-wday__bar" aria-hidden="true"><i style="height:' + Math.max(4, pct / 1.3) + '%"></i></span>'
        + '<span class="sn-wday__p">' + (l.need ? hrs(l.need) : '–') + '</span><span class="sn-wday__s">' + l.staff.length + ' 👤</span></button>';
    }).join('') + '</div>';

    const f = L.forecast || {};
    h += '<section class="sn-card sn-daycard"><div class="sn-row sn-row--between"><h2 class="sn-section-title" style="margin:0">' + esc(L.day.label + ', ' + U.fmt.date(L.day.date).split(', ')[1]) + '</h2>'
      + '<span class="sn-chip ' + (L.pct > 100 ? 'sn-chip--urgent' : L.pct > 80 ? 'sn-chip--warn' : 'sn-chip--ok') + '">' + (L.pct > 100 ? 'Überlastet' : L.pct > 80 ? 'Knapp' : 'Im Rahmen') + '</span></div>'
      + '<div class="sn-kpis"><div class="sn-kpi"><span class="sn-kpi__value">' + hrs(L.need) + '</span><span class="sn-kpi__label">Lager-Bedarf</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + hrs(L.cap) + '</span><span class="sn-kpi__label">Kapazität (80 %)</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + hrs(L.planned) + '</span><span class="sn-kpi__label">schon verteilt</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + L.staff.length + '</span><span class="sn-kpi__label">eingeplant</span></div></div>'
      + '<p class="sn-small">Erwartet: ' + (f.kkp || 0) + ' KKP (Ø ' + (f.avg || 4) + ' Abt.) · ' + (f.pal || 0) + ' Paletten · ' + (f.box || 0) + ' Boxen</p>'
      + (M.isLead(me) ? '<div class="sn-row" style="gap:8px">' + P.btn('Lieferung erwarten', 'wk-fc', { k: L.day.key }, 'secondary', 'plus') + P.btn('Aufgaben verteilen', 'wk-dist', { k: L.day.key }, 'primary', 'users') + '</div>' : '')
      + '</section>';

    // Zeitleiste
    const tasks = SN.store.list('items').filter((it) => it.kind === 'task' && it.plannedFor === L.day.key);
    const staff = U.sortBy(L.staff, (e) => O.shiftOn(e, L.day.wd).s * 100 + e.name.charCodeAt(0));
    h += '<section class="sn-card sn-timeline-day"><div class="sn-tl-axis" aria-hidden="true">' + [6, 10, 14, 18, 22].map((x) => '<span style="left:' + pos(x) + '">' + String(x).padStart(2, '0') + '</span>').join('') + '</div>'
      + staff.map((e) => {
        const s = O.shiftOn(e, L.day.wd);
        const mine = tasks.filter((it) => it.owner === e.id);
        const used = mine.reduce((a, it) => a + (it.min || 0), 0), lim = SN.dist.limitOf(e);
        return '<div class="sn-tl-row' + (e.id === me.id ? ' is-me' : '') + '"><div class="sn-tl-name"><b>' + esc(e.name.split(' ')[0]) + ' ' + esc((e.name.split(' ')[1] || '').slice(0, 1)) + '.</b><small>' + esc(e.dept || '') + '</small></div>'
          + '<div class="sn-tl-track"><span class="sn-tl-shift sn-tl-shift--' + (e.sh === 'Spät' ? 'late' : 'early') + '" style="left:' + pos(s.s) + ';width:calc(' + pos(s.e) + ' - ' + pos(s.s) + ')"><i style="width:' + Math.min(100, lim ? used / lim * 100 : 0) + '%"></i></span></div>'
          + (mine.length ? '<div class="sn-tl-tasks">' + mine.map((it) => '<span class="sn-chip sn-chip--outline">' + esc(it.title.replace(/^Warenverräumung (\(KKP-Ware\) )?– /, '📦 ')) + ' · ' + it.min + '′</span>').join('') + '</div>' : '')
          + '</div>';
      }).join('') + (staff.length ? '' : P.empty('Niemand eingeplant')) + '<p class="sn-muted sn-small">Balken = Schicht · dunkle Füllung = verplante Zeit bis zum Limit (80 % der Arbeitszeit).</p></section>';
    return h;
  }

  ui.registerView('week', { groups: ['lead', 'admin', 'emp'], order: 75, render });
  ui.on('wk-day', (el) => ui.sub('wkDay', el.dataset.k));
  ui.on('wk-fc', (el) => {
    const f = O.forecast(el.dataset.k) || { kkp: 8, pal: 3, box: 6, avg: 4 };
    const n = (id, l, v) => '<div class="sn-field"><label class="sn-label" for="' + id + '">' + l + '</label><input class="sn-input" type="number" min="0" max="80" id="' + id + '" value="' + v + '" inputmode="numeric"></div>';
    ui.sheet('Erwartete Lieferung', '<div class="sn-filter">' + n('fc-kkp', '🛒 KKP', f.kkp || 0) + n('fc-pal', '🟫 Paletten', f.pal || 0) + n('fc-box', '📥 Boxen', f.box || 0) + '</div>' + n('fc-avg', 'Ø Abteilungen je KKP', f.avg || 4),
      P.btn('Speichern', 'wk-fc-save', { k: el.dataset.k }, 'primary', 'check'));
  });
  ui.on('wk-fc-save', async (el) => {
    const v = (id) => Math.max(0, parseInt(ui.sheetVal(id), 10) || 0);
    await O.setForecast(el.dataset.k, { kkp: v('fc-kkp'), pal: v('fc-pal'), box: v('fc-box'), avg: Math.min(6, Math.max(1, v('fc-avg') || 4)) });
    ui.toast('Prognose gespeichert'); ui.closeSheet();
  });
  ui.on('wk-dist', async (el) => {
    const day = O.week(SN.clock.now()).find((d) => d.key === el.dataset.k);
    const r = await O.distributeDay(SN.session.id, day);
    ui.result(r, r.ok ? r.made + ' Aufgaben verteilt' + (r.rest > 0 ? ' · ' + U.fmt.dur(r.rest) + ' passen nicht ins Limit' : '') : '');
  });
  SN.weekOpen = () => ui.go('week', {});
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/75-week.js konnte nicht geladen werden:", e); }

/* ===== src/views/80-more.js ===== */
try {
/* ==========================================================================
   Mehr (Admin/Filialleitung): Wareneingang, Restware/Bruch, Vorlagen, Team,

   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  const deptOpts = (sel) => M.DEPTS.map((d) => '<option value="' + esc(d) + '"' + (d === sel ? ' selected' : '') + '>' + esc(d) + '</option>').join('');

  /* ---------- Wareneingang (S3) -------------------------------------------------- */
  function goods(me, now) {

      + '<div class="sn-field"><label class="sn-label" for="tr-disp">Displays</label><input class="sn-input" type="number" min="0" id="tr-disp" value="0" inputmode="numeric"></div></div>'

      + P.btn('Anlegen und Team einplanen', 'tr-add', {}, 'primary', 'users') + '</section>'
      + P.sec('Heute', tr.length) + (tr.map((t) => { const ef = SN.dist.truckEffort(t); return '<div class="sn-card" style="padding:12px"><b>🚚 ' + esc(t.title) + '</b><p class="sn-small">' + t.pal + ' Paletten · ' + t.kkp + ' KKP · ' + t.disp + ' Displays · ca. ' + U.fmt.dur(ef.min) + ' · ' + U.fmt.count(ef.people, 'Person', 'Personen') + ' · ' + esc(U.fmt.ago(t.at)) + '</p></div>'; }).join('') || P.empty('Noch keine Lieferung'));
  }
  ui.on('tr-add', async () => {
    const me = SN.session.me(), now = SN.clock.now();

  }
  ui.on('rest-new', () => ui.sheet('Restware erfassen', '<p class="sn-muted">Ware, die nicht ins Regal passte. Daraus wird automatisch ein Auftrag „einräumen“.</p>'

    + '<div class="sn-field"><label class="sn-label" for="rs-dept">Abteilung</label><select class="sn-select" id="rs-dept">' + deptOpts((SN.session.me() || {}).dept) + '</select></div>'

  ui.on('rest-go', async () => {

      + '<div class="sn-field"><label class="sn-label" for="se-lang">Sprache für Übersetzungen</label><select class="sn-select" id="se-lang">' + Object.entries(SN.ai.LANGS).map(([k, l]) => '<option value="' + k + '"' + (k === (e.lang || 'de') ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select></div>'
      + '<fieldset class="sn-choices"><legend class="sn-label">Tätigkeiten (wichtig für die Verteilung)</legend>' + M.ACTS.map((a) => '<label class="sn-choice"><input type="checkbox" name="se-acts" value="' + esc(a.key) + '"' + ((e.acts || []).includes(a.key) ? ' checked' : '') + '><span>' + esc(a.label) + '</span></label>').join('') + '</fieldset>'
      + '<label class="sn-check"><input type="checkbox" id="se-fa"' + (e.firstAid ? ' checked' : '') + '>Ersthelfer/in</label><label class="sn-check"><input type="checkbox" id="se-kasse"' + (e.kasse ? ' checked' : '') + '>Kassenberechtigt</label>'
      + '<div class="sn-field"><label class="sn-label" for="se-pin">PIN ' + (e.id ? '(leer lassen = unverändert)' : '(4–6 Ziffern)') + '</label><input class="sn-input" id="se-pin" inputmode="numeric" maxlength="6"></div>',
    P.btn('Speichern', 'st-save', { id: e.id || '' }, 'primary', 'check') + (e.id && e.id !== SN.session.id ? P.btn('Entfernen', 'st-del', { id: e.id }, 'ghost') : ''));
  });
  ui.on('st-save', async (el) => {
    const name = String(ui.sheetVal('se-name') || '').trim(); if (name.length < 2) return ui.toast('Bitte einen Namen eingeben.', 'warn');
    const pin = String(ui.sheetVal('se-pin') || '').trim();
    if (pin && !/^\d{4,6}$/.test(pin)) return ui.toast('PIN: 4 bis 6 Ziffern.', 'warn');
    const id = el.dataset.id || U.id('e');
    const acts = Array.from(document.querySelectorAll('input[name="se-acts"]:checked')).map((x) => x.value);
    const base = el.dataset.id ? U.clone(M.emp(id)) : { id };
    Object.assign(base, { name, role: ui.sheetVal('se-role'), dept: ui.sheetVal('se-dept'), sh: ui.sheetVal('se-sh'), h: +ui.sheetVal('se-h') || 8, lang: ui.sheetVal('se-lang'), acts, firstAid: !!ui.sheetVal('se-fa'), kasse: !!ui.sheetVal('se-kasse') });
    if (pin) base.pin = pin;
    const r = await SN.store.put('staff', id, base);
    if (!r.ok) return ui.toast('Nicht gespeichert.', 'warn');
    await C.log(SN.session.id, (el.dataset.id ? 'Person geändert: ' : 'Person angelegt: ') + name);
    ui.toast('Gespeichert'); ui.closeSheet();
  });
  ui.on('st-del', async (el) => { const n = M.name(el.dataset.id); await SN.store.del('staff', el.dataset.id); await C.log(SN.session.id, 'Person entfernt: ' + n); ui.toast('Entfernt'); ui.closeSheet(); });

  /* ---------- Einstellungen ------------------------------------------------------- */
  function settings(me, now) {
    const s = M.settings(), cur = M.adminOnDuty(now);
    return '<section class="sn-card" style="padding:14px"><h3 class="sn-section-title" style="margin-top:0">🛡 Admin vom Dienst</h3><p class="sn-small">Bekommt Defekte und eskalierte Meldungen. Jetzt: <b>' + esc(M.name(cur)) + '</b></p>'
      + '<div class="sn-chips">' + M.admins().map((id) => '<button type="button" class="sn-chip' + (id === cur ? ' sn-chip--solid' : ' sn-chip--outline') + '" data-act="duty" data-id="' + id + '">' + esc(M.name(id)) + '</button>').join('') + '</div></section>'
      + '<section class="sn-card" style="padding:14px"><h3 class="sn-section-title" style="margin-top:0">⏰ Eskalationsfristen (Minuten ohne Reaktion)</h3>'
      + Object.entries(M.DEADLINE_LABELS).map(([k, l]) => '<div class="sn-field"><label class="sn-label" for="dl-' + k + '">' + esc(l) + '</label><input class="sn-input" type="number" min="1" max="240" id="dl-' + k + '" value="' + s.deadlines[k] + '"></div>').join('')
      + P.btn('Fristen speichern', 'dl-save', {}, 'primary', 'check') + '</section>'
      + '<p class="sn-muted sn-small">Kette: zuständige Schichtleitung → Teamleitung → Admin vom Dienst → Filialleitung. Benachrichtigungen nur während der eigenen Schicht.</p>';
  }
  ui.on('duty', async (el) => { await SN.store.patch('settings', 'main', { adminOnDuty: el.dataset.id }); await C.log(SN.session.id, 'Admin vom Dienst: ' + M.name(el.dataset.id)); ui.toast(M.first(el.dataset.id) + ' ist jetzt Admin vom Dienst'); });
  ui.on('dl-save', async () => {
    const d = {}; for (const k of Object.keys(M.DEADLINE_LABELS)) d[k] = Math.max(1, num('dl-' + k) || M.DEFAULT_DEADLINES[k]);
    await SN.store.patch('settings', 'main', { deadlines: d }); await C.log(SN.session.id, 'Eskalationsfristen geändert'); ui.toast('Fristen gespeichert');
  });

  /* ---------- Stimmung, Protokoll ----------------------------------------------- */
  function mood(now) {
    let h = '<p class="sn-muted">Anonym, nur als Summe je Schicht und erst ab 5 Antworten. Keine Auswertung einzelner Personen.</p>';
    for (let i = 0; i < 7; i++) {
      const d = U.fmt.dayKey(now - i * U.DAY);
      for (const sh of M.SHIFT_NAMES) {
        const a = C.moodAggregate(d, sh);
        h += '<div class="sn-card" style="padding:10px"><b>' + esc(U.fmt.date(now - i * U.DAY) + ' · ' + sh) + '</b>' + (a ? '<div class="sn-bars">' + ['😀', '🙂', '😐', '🙁'].map((m, k) => '<div><span>' + m + '</span><i style="width:' + Math.round((a.c[k + 1] || 0) / a.n * 100) + '%"></i><span>' + (a.c[k + 1] || 0) + '</span></div>').join('') + '</div>' : '<p class="sn-muted sn-small">Weniger als 5 Antworten – nicht angezeigt.</p>') + '</div>';
      }
    }
    return h;
  }
  function logView(now) {
    const l = SN.store.peek('log', U.fmt.dayKey(now));
    const e = l ? l.entries.slice().reverse() : [];
    return '<p class="sn-muted">Änderungen an Team, Plänen, Zuteilungen und Einstellungen – nachvollziehbar statt „über Nacht geändert“.</p>' + (e.length ? '<ol class="sn-timeline">' + e.map((x) => '<li><time>' + U.fmt.time(x.at) + '</time> ' + esc(M.name(x.by) + ': ' + x.text) + '</li>').join('') + '</ol>' : P.empty('Heute noch keine Änderungen'));
  }

  function render({ me, now, sub }) {
    const tabs = [['goods', '🚚 Lieferung'], ['stock', '📦 Restware'], ['tpl', '🔁 Vorlagen'], ['team', '👥 Team'], ['set', '⚙️ Einstellungen'], ['mood', '🙂 Stimmung'], ['log', '🧾 Protokoll']];
    const t = sub.moreTab || 'goods';
    const head = '<div class="sn-chips" role="tablist">' + tabs.map(([k, l]) => '<button type="button" role="tab" class="sn-chip' + (k === t ? ' sn-chip--solid' : ' sn-chip--outline') + '" aria-selected="' + (k === t) + '" data-act="more-tab" data-k="' + k + '">' + l + '</button>').join('') + '</div>';
    const body = t === 'goods' ? SN.ui.views.ware.render({ me, now, sub, params: {} }) : t === 'stock' ? stock() : t === 'tpl' ? templates() : t === 'team' ? team(sub) : t === 'set' ? settings(me, now) : t === 'mood' ? mood(now) : logView(now);
    const quick = '<div class="sn-quicklinks">' + P.btn('Wochenplan', 'go-week', {}, 'secondary', 'tasks') + (M.canAiAssist(me) ? P.btn('KI-Diktat', 'go-ai', {}, 'secondary', 'mic') : '') + P.btn('Ich / Abmelden', 'go-me', {}, 'ghost', 'user') + '</div>';
    return quick + head + body;
  }
  ui.registerView('more', { label: 'Mehr', icon: 'menu', groups: ['admin'], order: 50, render });
  ui.on('more-tab', (el) => ui.sub('moreTab', el.dataset.k));
  ui.on('go-week', () => ui.go('week', {}));
  ui.on('go-ai', () => ui.go('ai', {}));
  ui.on('go-me', () => ui.go('me', {}));

  /* ---------- KI-Sprachassistent (K1) ---------------------------------------------- */
  let found = [];
  function aiRender({ me }) {
    const can = SN.ai.available();
    return '<p class="sn-muted">Sprich oder tippe, was wer machen soll. Die KI legt daraus Aufträge an – du bestätigst vor dem Senden. Beispiel: „Anna soll in der Drogerie die Lücken füllen, dringend. Kemal baut das Aktionsregal Getränke auf.“</p>'
      + (can.text ? '' : '<div class="sn-alert sn-alert--info sn-alert--card"><p class="sn-alert__title">KI nur in der Claude-Ansicht verfügbar.</p></div>')
      + '<div class="sn-field"><label class="sn-label" for="ai-text">Diktat</label><textarea class="sn-textarea" id="ai-text" rows="4"></textarea></div>'
      + '<div class="sn-row" style="gap:8px">' + (can.dictation ? P.btn('Sprechen', 'mic', { target: 'ai-text' }, 'secondary', 'mic') : '') + P.btn('Aufträge erkennen', 'ai-go', {}, 'primary') + '</div>'
      + (found.length ? P.sec('Erkannt – bitte prüfen', found.length) + found.map((f, i) => '<div class="sn-card' + (f.u ? ' sn-card--urgent' : '') + '" style="padding:12px"><b>' + (f.u ? '🔥 ' : '') + esc(f.t) + '</b><p class="sn-small">' + esc(f.dept + ' · ' + f.act) + '</p>'
        + '<div class="sn-field"><label class="sn-label" for="ai-who-' + i + '">Für ' + (f.who && !f.wid ? '<span class="sn-chip sn-chip--urgent">„' + esc(f.who) + '“ nicht gefunden</span>' : '') + '</label><select class="sn-select" id="ai-who-' + i + '"><option value="">Automatisch verteilen</option>' + U.sortBy(SN.dist.candidates(SN.clock.now()), (e) => e.name).map((e) => '<option value="' + e.id + '"' + (e.id === f.wid ? ' selected' : '') + '>' + esc(e.name) + '</option>').join('') + '</select></div></div>').join('')
        + P.btn('Alle senden und verteilen', 'ai-send', {}, 'primary', 'send') : '');
  }
  ui.registerView('ai', { label: 'KI', icon: 'mic', groups: ['admin'], order: 60, render: aiRender, allow: (me) => M.canAiAssist(me), show: () => false });
  ui.on('ai-go', async (el) => {
    const tx = String(ui.sheetVal('ai-text') || '').trim(); if (!tx) return ui.toast('Bitte zuerst sprechen oder tippen.', 'warn');
    el.disabled = true;
    const out = await SN.ai.json('Ein Admin einer Supermarkt-Filiale diktiert Aufträge (beliebige Sprache): ' + JSON.stringify(tx) + '. Antworte NUR mit JSON-Array von Objekten {"t":"Auftrag auf Deutsch","dept":"einer von: ' + M.DEPTS.join(', ') + '","act":"einer von: ' + M.ACTS.map((a) => a.key).join(', ') + '","u":true wenn dringend,"who":"Name der Person oder leer"}.', { tier: 'default' });
    el.disabled = false;
    if (!Array.isArray(out)) return ui.toast('Nicht erkannt. KI nur in Claude verfügbar.', 'warn');
    const cands = SN.dist.candidates(SN.clock.now());
    found = out.filter((x) => x && x.t).map((x) => {
      const w = String(x.who || '').toLowerCase().trim();
      const hit = w ? cands.filter((e) => e.name.toLowerCase() === w || e.name.toLowerCase().split(' ')[0] === w.split(' ')[0]) : [];
      return { t: String(x.t).slice(0, 140), dept: M.DEPTS.includes(x.dept) ? x.dept : 'Info', act: M.ACT_MIN[x.act] ? x.act : 'Sonstiges', u: !!x.u, who: x.who || '', wid: hit.length === 1 ? hit[0].id : '' };
    });
    ui.render(true);
  });
  ui.on('ai-send', async () => {
    const me = SN.session.me(), now = SN.clock.now();
    let n = 0;
    for (let i = 0; i < found.length; i++) {
      const f = found[i], wid = ui.sheetVal('ai-who-' + i) || null;
      const r = await C.task(me.id, { title: f.t, dept: f.dept, act: f.act, u: f.u, owner: wid || undefined, due: now + 4 * U.HOUR, escalate: true });
      if (r.ok) n++; else ui.toast(f.t + ': ' + r.reason, 'warn');
    }
    const d = await SN.dist.run(me.id);
    found = []; ui.toast(n + ' Aufträge gesendet. ' + SN.dist.resultText(d)); ui.render(true);
  });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/80-more.js konnte nicht geladen werden:", e); }

/* ===== src/views/90-clean.js ===== */
try {
/* ==========================================================================
   Reinigung: Aufträge aus Meldungen „Reinigung nötig“ – Übernehmen, Sauber.
   Der Melder sieht sofort „Reinigung kommt“ und „Sauber“.
   ========================================================================== */
(function (SN) {
  'use strict';
  const C = SN.comm, ui = SN.ui, P = SN.parts;
  function render({ me, now }) {
    const open = C.inbox(me.id);
    const done = SN.store.list('items').filter((it) => it.kind === 'report' && it.cat === 'clean' && it.state === 'done' && now - (it.doneAt || 0) < SN.util.DAY);
    return P.sec('Offen', open.length) + P.list(open, me, now, P.empty('Alles sauber', 'Neue Aufträge erscheinen hier sofort – mit Ort und Foto.', true))
      + (done.length ? P.sec('Heute erledigt', done.length) + P.list(done, me, now, '', { compact: true }) : '');
  }
  ui.registerView('clean', { label: 'Reinigung', icon: 'tasks', groups: ['clean'], order: 10, render, badge: (me) => C.inbox(me.id).length });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/90-clean.js konnte nicht geladen werden:", e); }

/* ===== src/ui/boot.js ===== */
try {
/* ==========================================================================
   boot.js – startet die App (immer das LETZTE Modul im Build)
   --------------------------------------------------------------------------
   1. KI-Hülle vorbereiten (SN.ai.init, parallel)
   2. Modus wählen: db verfügbar → Auswahl „Demo“ / „Filialbetrieb“, sonst Demo.
      URL-Parameter ?mode=demo|db überspringt die Auswahl (Tests).
   3. SN.store.init(mode); im Demo außerhalb 06–21:30 Uhr spielt die Uhr um 10:30
      (abschaltbar mit ?realtime=1).
   4. SN.ui.start({mode}) aufrufen, falls die Oberfläche (src/ui/shell.js) da ist,
      sonst eine einfache Platzhalterseite.
   SN.ready: Promise, löst nach dem Start auf mit {mode, fallback}.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util;
  const byId = (id) => document.getElementById(id);

  function param(name) {
    try { return new URLSearchParams(window.location.search).get(name); } catch (e) { return null; }
  }

  function showStatus(st) {
    const el = byId('hdr-status');
    if (!el) return;
    el.dataset.status = st;
    el.textContent = SN.store.STATUS_TEXT[st] || st;
  }

  /** Einfache Modus-Auswahl (die Oberfläche kann SN.ui.chooseMode() selbst anbieten) */
  function chooseMode() {
    if (SN.ui && typeof SN.ui.chooseMode === 'function') return Promise.resolve(SN.ui.chooseMode());
    const last = U.ls.get('mode', 'db');
    return new Promise((resolve) => {
      const v = byId('view');
      v.innerHTML = '<h2 class="sn-section-title">Wie möchtest du starten?</h2>'
        + '<div class="sn-boot-choice">'
        + '<button type="button" data-mode="db"' + (last === 'db' ? ' autofocus' : '') + '><strong>🏪 Filialbetrieb</strong><span>Gemeinsame Live-Daten für alle mit Zugriff</span></button>'
        + '<button type="button" data-mode="demo"' + (last === 'demo' ? ' autofocus' : '') + '><strong>🧪 Demo</strong><span>Ausprobieren mit Beispieldaten, nichts wird gespeichert</span></button>'
        + '</div>';
      v.addEventListener('click', function onClick(ev) {
        const b = ev.target.closest('[data-mode]');
        if (!b) return;
        v.removeEventListener('click', onClick);
        U.ls.set('mode', b.dataset.mode);
        v.innerHTML = '<p class="sn-boot">Wird geladen …</p>';
        resolve(b.dataset.mode);
      });
    });
  }

  /* ---------- Server-Verbindung (APK, eigene Filial-Server) ------------- */
  const isApp = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  async function sameOriginServer() {
    if (!/^https?:$/.test(location.protocol) || isApp()) return null;
    try { const r = await fetch('/api/health', { cache: 'no-store' }); if (!r.ok) return null; const j = await r.json(); return j && j.ok ? { url: location.origin, keyRequired: j.keyRequired } : null; } catch (e) { return null; }
  }
  async function testServer(cfg) {
    const base = cfg.url.replace(/\/+$/, '');
    const h = await fetch(base + '/api/health', { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
    if (!h || !h.ok) return 'Server nicht erreichbar. Adresse prüfen (mit https://).';
    const r = await fetch(base + '/api/snapshot', { headers: cfg.key ? { Authorization: 'Bearer ' + cfg.key } : {} }).catch(() => null);
    if (!r) return 'Server nicht erreichbar.';
    if (r.status === 401) return 'Filial-Schlüssel falsch.';
    return r.ok ? '' : 'Server meldet Fehler ' + r.status + '.';
  }
  function serverForm(pre, msg) {
    return new Promise((resolve) => {
      const v = byId('view');
      v.innerHTML = '<section class="sn-login"><h2 class="sn-section-title">Mit Filial-Server verbinden</h2>'
        + '<p class="sn-muted">Einmalig pro Gerät. Adresse und Filial-Schlüssel bekommst du von der Filialleitung.</p>'
        + (msg ? '<div class="sn-alert sn-alert--warn sn-alert--card" role="alert"><p class="sn-alert__title">' + U.esc(msg) + '</p></div>' : '')
        + '<div class="sn-field"><label class="sn-label" for="sv-url">Server-Adresse</label><input class="sn-input" id="sv-url" inputmode="url" autocomplete="url" placeholder="https://schicht.example.de" value="' + U.esc(pre.url || '') + '"></div>'
        + '<div class="sn-field"><label class="sn-label" for="sv-key">Filial-Schlüssel</label><input class="sn-input" id="sv-key" type="password" autocomplete="off" value="' + U.esc(pre.key || '') + '"></div>'
        + '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" id="sv-go">Verbinden</button>'
        + '<button type="button" class="sn-btn sn-btn--ghost sn-btn--block" id="sv-demo">Erst mal Demo ansehen</button></section>';
      byId('sv-demo').onclick = () => resolve(null);
      byId('sv-go').onclick = async () => {
        const cfg = { url: byId('sv-url').value.trim(), key: byId('sv-key').value.trim() };
        if (!/^https?:\/\//.test(cfg.url)) cfg.url = 'https://' + cfg.url;
        byId('sv-go').textContent = 'Verbinde …';
        const err = await testServer(cfg);
        if (err) { resolve(serverForm(cfg, err)); return; }
        U.ls.set('server', cfg);
        resolve(cfg);
      };
    });
  }
  /** Ermittelt {mode, server?}: URL-Parameter → gespeicherte Verbindung → gleicher Server → App → Claude-db → Demo */
  async function pickServer() {
    const qs = param('server');
    if (qs) { const cfg = { url: qs, key: param('key') || '' }; U.ls.set('server', cfg); return cfg; }
    const saved = U.ls.get('server', null);
    if (saved && saved.url) return saved;
    const same = await sameOriginServer();
    if (same) return serverForm({ url: same.url }, '');
    if (isApp()) return serverForm({ url: window.SN_DEFAULT_SERVER || '' }, '');
    return null;
  }
  SN.serverReset = () => { U.ls.set('server', null); location.reload(); };

  /** Platzhalter, solange es noch keine Oberfläche (SN.ui) gibt */
  function placeholder(r) {
    const staff = SN.store.list('staff');
    const items = SN.store.list('items');
    byId('view').innerHTML = '<div class="sn-card" style="padding:16px">'
      + '<h2 class="sn-section-title" style="margin-top:0">Kern geladen</h2>'
      + '<p>Modus: <strong>' + U.esc(r.mode === 'db' ? 'Filialbetrieb' : 'Demo') + '</strong>'
      + (r.fallback ? ' (Filialbetrieb nicht verfügbar)' : '') + '</p>'
      + '<p>' + U.esc(U.fmt.count(staff.length, 'Konto', 'Konten')) + ' · ' + U.esc(U.fmt.count(items.length, 'Vorgang', 'Vorgänge')) + '</p>'
      + '<p class="sn-muted">Die Oberfläche (src/ui/shell.js) ist noch nicht eingebaut.</p></div>';
  }

  async function boot() {
    const aiReady = SN.ai.init().catch(() => null);
    const forced = param('mode');
    let mode = 'demo';
    let server = null;
    if (forced !== 'demo' && forced !== 'db') server = await pickServer();
    if (server) mode = 'server';
    else if (forced !== 'demo') {
      const caps = await SN.store.detect();
      if (caps.db) mode = forced === 'db' ? 'db' : await chooseMode();
    }
    if (mode === 'demo' && !param('realtime')) {
      const off = SN.demo.clockOffset(Date.now());
      if (off) SN.clock.offset(off);
    }
    SN.store.onStatus(showStatus);
    showStatus('loading');
    let r = await SN.store.init(mode, server ? { server } : undefined);
    if (!r.ok && mode === 'server') {
      // Verbindung fehlgeschlagen (z. B. Schlüssel geändert) → neu eingeben
      const cfg = await serverForm(server, r.code === 'not_granted' ? 'Filial-Schlüssel ungültig.' : 'Server nicht erreichbar.');
      r = await SN.store.init(cfg ? 'server' : 'demo', cfg ? { server: cfg } : undefined);
    }
    showStatus(SN.store.status);
    await aiReady;
    document.documentElement.dataset.snMode = r.mode;
    if (SN.ui && typeof SN.ui.start === 'function') await SN.ui.start({ mode: r.mode, fallback: !!r.fallback });
    else placeholder(r);
    document.documentElement.dataset.snReady = '1';
    return { mode: r.mode, fallback: !!r.fallback };
  }

  function start() {
    SN.ready = boot().catch((e) => {
      console.error('[SN] Start fehlgeschlagen', e);
      const v = byId('view');
      if (v) v.innerHTML = '<p role="alert">Der Schicht-Navigator konnte nicht starten. Bitte Seite neu laden.</p>';
      throw e;
    });
    SN.ready.catch(() => {});
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/ui/boot.js konnte nicht geladen werden:", e); }
</script>
