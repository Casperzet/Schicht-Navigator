/* Fotobericht: Kamera-Knopf wie ein echtes Objektiv */
.sn-shoot { margin: 6px 0 14px; }
.sn-shoot__cam { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 230px; border-radius: 26px; cursor: pointer; text-align: center;
  background: radial-gradient(120% 90% at 50% 0%, #2a2a2a 0%, #0d0d0d 70%); color: #fff; box-shadow: var(--sn-depth-2); }
.sn-shoot__cam b { font: 700 22px/1.1 var(--sn-font-display, sans-serif); }
.sn-shoot__cam small { opacity: .75; }
.sn-shoot__lens { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 35% 30%, #ff5a62 0%, #e10915 38%, #8f040b 100%); box-shadow: 0 0 0 8px #fff, 0 0 0 12px #e10915, 0 12px 26px rgba(225,9,21,.5); }
.sn-shoot__lens .sn-icon { width: 44px; height: 44px; }
.sn-shoot__strip { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.sn-shoot__strip figure { position: relative; margin: 0; }
.sn-shoot__strip img { width: 100%; height: 150px; object-fit: cover; border-radius: 16px; box-shadow: var(--sn-depth-1); }
.sn-shoot__strip button { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); display: grid; place-items: center; background: rgba(17,17,17,.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; }
.sn-shoot__more { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 150px; border: 2px dashed var(--sn-border-strong, #999); border-radius: 16px; cursor: pointer; font-weight: 600; }
.sn-photo-card { padding: 0; overflow: hidden; margin-bottom: 12px; }
.sn-photo-card.is-new { outline: 3px solid var(--sn-accent, #e10915); outline-offset: -3px; }
.sn-photo-card__media { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(45%, 1fr)); gap: 2px; background: #000; cursor: zoom-in; }
.sn-photo-card__media img { width: 100%; height: 200px; object-fit: cover; display: block; }
.sn-photo-card__new { position: absolute; top: 10px; left: 10px; background: linear-gradient(145deg, #ee1722, #c8060f); color: #fff; font-weight: 800; padding: 4px 12px; border-radius: 999px; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
.sn-photo-card__body { padding: 12px 14px 14px; }
.sn-photo-card__reply { margin: 6px 0; padding: 8px 10px; background: var(--sn-surface-2, #f2f2f2); border-radius: 12px; }
.sn-photo-full img { width: 100%; border-radius: 12px; margin-bottom: 8px; }

/* Lieferung: Zähler, Schema, Touren */
.sn-goods { padding: 14px; }
.sn-stepper { display: grid; grid-template-columns: 40px 1fr 52px 48px 52px; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--sn-border, #e5e5e5); }
.sn-stepper__icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; background: var(--sn-urgent-bg); color: var(--sn-accent-text); }
.sn-stepper__icon .sn-icon { width: 24px; height: 24px; }
.sn-stepper__text b { display: block; font-size: 18px; }
.sn-stepper__text small { color: var(--sn-text-muted, #555); }
.sn-stepper__btn { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 18px; border: 0; cursor: pointer; background: linear-gradient(145deg, #2c2c31, #111); color: #fff; box-shadow: 0 6px 14px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.18); transition: transform var(--sn-dur-fast) var(--sn-ease-out); }
.sn-stepper__btn:last-child { background: linear-gradient(145deg, #ee1722, #c8060f); box-shadow: 0 6px 14px rgba(225,9,21,.3), inset 0 1px 0 rgba(255,255,255,.3); }
.sn-stepper__btn:active { transform: scale(.94); }
.sn-stepper__btn .sn-icon { width: 26px; height: 26px; stroke-width: 2.4; }
.sn-stepper__val { text-align: center; font: 700 26px/1 var(--sn-font-display, sans-serif); font-variant-numeric: tabular-nums; }
.sn-choices--row { display: flex; gap: 6px; flex-wrap: wrap; }
.sn-choices--row .sn-choice { flex: 1 0 40px; }
.sn-kkp { padding: 12px; }
.sn-schema { padding: 14px; background: linear-gradient(180deg, #fff, #f6f6f6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sn-schema { background: var(--sn-surface, #1e1e1e); } }
:root[data-theme="dark"] .sn-schema { background: var(--sn-surface, #1e1e1e); }
.sn-schema__row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sn-schema__cell { display: flex; flex-direction: column; align-items: center; padding: 10px 4px; border-radius: 14px; background: var(--sn-surface, #fff); box-shadow: var(--sn-depth-1); }
.sn-schema__icon { display: grid; place-items: center; color: var(--sn-accent-text); }
.sn-schema__cell b { font: 700 28px/1 var(--sn-font-display, sans-serif); }
.sn-schema__cell small { color: var(--sn-text-muted, #555); }
.sn-schema__cell i { font-style: normal; font-weight: 600; font-size: 13px; margin-top: 2px; }
.sn-schema__arrow { display: grid; place-items: center; color: var(--sn-accent-text, #e10915); margin: 4px 0; }
.sn-schema__result { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; align-items: stretch; }
.sn-schema__result > div { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px; border-radius: 14px; background: #111; color: #fff; text-align: center; }
.sn-schema__result > div.is-main { background: linear-gradient(180deg, #f2232d, #c4060f); }
.sn-schema__result b { font: 700 24px/1.05 var(--sn-font-display, sans-serif); }
.sn-schema__result .is-main b { font-size: 40px; }
.sn-schema__result small { opacity: .85; font-size: 12px; }
.sn-route { padding: 12px; }
.sn-route__path { list-style: none; display: flex; flex-wrap: wrap; gap: 4px; padding: 0; margin: 6px 0 0; }
.sn-route__path li { padding: 4px 10px; border-radius: 999px; background: var(--sn-surface-2, #f1f1f1); font-size: 14px; font-weight: 600; }
.sn-route__path li + li::before { content: "→ "; color: var(--sn-accent, #e10915); }

/* Wochenplan */
.sn-week-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 4px 0 12px; }
.sn-wday { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px; border-radius: 16px; border: 1px solid var(--sn-border, #ddd); background: var(--sn-surface, #fff); color: var(--sn-text, #111); cursor: pointer; box-shadow: var(--sn-depth-1); font: inherit; }
.sn-wday[aria-selected="true"] { background: #111; color: #fff; border-color: #111; }
.sn-wday.is-today .sn-wday__d { color: var(--sn-accent-text, #c00812); }
.sn-wday[aria-selected="true"].is-today .sn-wday__d { color: #ff6b72; }
.sn-wday__d { font-weight: 800; }
.sn-wday__n { font-size: 12px; opacity: .7; }
.sn-wday__bar { position: relative; width: 14px; height: 56px; border-radius: 7px; background: var(--sn-surface-2, #eee); overflow: hidden; margin: 4px 0; }
.sn-wday__bar i { position: absolute; left: 0; right: 0; bottom: 0; background: #1f9d55; border-radius: 7px; }
.sn-wday--warn .sn-wday__bar i { background: #f59e0b; }
.sn-wday--over .sn-wday__bar i { background: #e10915; }
.sn-wday__p { font-size: 12px; font-weight: 700; }
.sn-wday__s { font-size: 11px; opacity: .75; }
.sn-daycard { padding: 14px; }
.sn-timeline-day { padding: 12px; }
.sn-tl-axis { position: relative; height: 18px; margin-left: 86px; font-size: 11px; color: var(--sn-text-muted, #555); }
.sn-tl-axis span { position: absolute; transform: translateX(-50%); }
.sn-tl-row { display: grid; grid-template-columns: 80px 1fr; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px solid var(--sn-border, #eee); }
.sn-tl-row.is-me .sn-tl-name b { color: var(--sn-accent-text, #c00812); }
.sn-tl-name b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sn-tl-name small { display: block; font-size: 11px; color: var(--sn-text-muted, #555); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sn-tl-track { position: relative; height: 22px; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 1px), var(--sn-border, #e6e6e6) calc(25% - 1px) 25%); border-radius: 6px; }
.sn-tl-shift { position: absolute; top: 3px; bottom: 3px; border-radius: 8px; background: #e7e7e7; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.15) inset; }
.sn-tl-shift--late { background: #d6d6d6; }
.sn-tl-shift i { display: block; height: 100%; background: linear-gradient(90deg, #111, #e10915); }
.sn-tl-tasks { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
.sn-tl-tasks .sn-chip { font-size: 12px; min-height: 0; padding: 2px 8px; }
.sn-photo-card__gone { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; padding: 14px; background: var(--sn-surface-2, #f1f1f1); color: var(--sn-text-muted, #555); font-weight: 600; text-align: center; }
.sn-photo-card__media:empty { display: none; }
.sn-scanlist { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; }
.sn-scanlist li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; border-radius: 10px; background: var(--sn-surface-2, #f1f1f1); font-weight: 600; }
.sn-scanlist li small { font-weight: 500; color: var(--sn-text-muted, #555); }
.sn-scanlist li.is-next { outline: 2px solid var(--sn-accent, #e10915); }
.sn-scanlist li.is-done { opacity: .6; text-decoration: line-through; }
#scan-video { width: 100%; max-height: 220px; object-fit: cover; border-radius: 12px; background: #000; }
.sn-roster { width: 100%; border-collapse: collapse; font-size: 14px; }
.sn-roster td { padding: 6px 4px; border-top: 1px solid var(--sn-border, #e5e5e5); vertical-align: top; }
.sn-roster .is-miss { color: var(--sn-accent-text, #c00812); font-weight: 700; }

/* Icons in kleinen Inline-Kontexten */
.sn-week .sn-track i .sn-icon { width: 12px; height: 12px; vertical-align: -2px; stroke-width: 2.2; }
.sn-wday__s { display: inline-flex; align-items: center; gap: 2px; }
.sn-route__path .sn-icon, .sn-kudos .sn-icon { vertical-align: -3px; color: var(--sn-accent-text, #c00812); }
.sn-roster small { display: inline-flex; align-items: center; gap: 4px; }
.sn-cat { box-shadow: var(--sn-depth-1); border-width: 1px; border-color: var(--sn-glass-line, #ddd); background: var(--sn-glass-bg-strong, #fff); border-radius: 20px; }
.sn-cat[aria-pressed="true"] { border-color: var(--sn-accent, #e10915); box-shadow: inset 0 0 0 2px var(--sn-accent, #e10915), var(--sn-depth-1); }
.sn-view-loading { opacity: .6; }
.sn-login { padding: 20px 16px; }
.sn-login > :first-child { margin-top: 0; }
.sn-main:focus, .sn-main:focus-visible { outline: none; }
.sn-nav__glider.is-none { opacity: 0; }
.sn-section-title .sn-icon { color: var(--sn-accent-text); }
.sn-badge--urgent { display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; padding: 0 7px 0 5px; }
.sn-list__title { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.sn-list__sub { display: block; }
.sn-header__action[hidden] { display: none; }

/* ===== src/views/12-cockpit.css ===== */
/* Steuerpult (Schichtleitung) – Präfix .sn-cp-; Glas-Fallback, wird vom Design (.sn-glass, .sn-iconbadge, .sn-pill) überschrieben */
.sn-cp-glass { background: color-mix(in srgb, var(--sn-surface, #fff) 86%, transparent); border: 1px solid var(--sn-border, #d9d9de); backdrop-filter: blur(8px) saturate(1.2); -webkit-backdrop-filter: blur(8px) saturate(1.2); }
.sn-cp-iconbadge { flex: none; display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--sn-surface-2, #f3f3f5); color: var(--sn-text, #141414); }
.sn-cp-pill { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 2px 10px 2px 6px; border-radius: 999px; font-size: var(--sn-text-xs, 13px); font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.sn-cp-pill .sn-icon { width: 16px; height: 16px; }
.sn-cp-pill--ok { background: var(--sn-ok-bg); color: var(--sn-ok-fg); border-color: var(--sn-ok-line); }
.sn-cp-pill--warn { background: var(--sn-warn-bg); color: var(--sn-warn-fg); border-color: var(--sn-warn-line); }
.sn-cp-pill--crit { background: var(--sn-urgent-bg); color: var(--sn-urgent-fg); border-color: var(--sn-urgent-line); border-style: dashed; }

/* Kopf */
.sn-cp-head { padding: 12px; margin-bottom: 12px; }
.sn-cp-head__row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sn-cp-head__title { margin: 0; font: 700 22px/1.1 var(--sn-font-display, sans-serif); }
.sn-cp-head__stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.sn-cp-switch { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 12px; border-radius: 14px; border: 2px solid var(--sn-border-strong, #7d828b); background: var(--sn-surface, #fff); color: var(--sn-text, #141414); font: 600 14px/1.1 var(--sn-font-body, sans-serif); text-align: left; cursor: pointer; }
.sn-cp-switch small { display: block; font-weight: 700; color: var(--sn-text-muted, #50555c); }
.sn-cp-switch[aria-checked="true"] { background: var(--sn-brand-black, #141414); color: #fff; border-color: var(--sn-brand-black, #141414); }
.sn-cp-switch[aria-checked="true"] small { color: #fff; }
.sn-cp-quiet { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0; padding: 8px 10px; border-radius: 12px; background: var(--sn-surface-2, #f3f3f5); font-size: var(--sn-text-sm, 14px); }
.sn-cp-quiet .sn-icon { flex: none; width: 20px; height: 20px; }

/* Als Nächstes */
.sn-cp-next { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.sn-cp-step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px 12px; margin: 0; border-left: 6px solid var(--sn-warn-line, #d98a00); }
.sn-cp-step--crit { border-left-color: var(--sn-urgent-line, #e10915); }
.sn-cp-step .sn-btn { grid-column: 1 / -1; }
.sn-cp-step__title { margin: 0; font-weight: 700; font-size: var(--sn-text-md, 16px); overflow-wrap: anywhere; }
.sn-cp-step__no { color: var(--sn-accent-text, #c00812); }
.sn-cp-step p { margin: 0; }

/* Nach oben melden */
.sn-cp-up { padding: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.sn-cp-up .sn-label { margin: 0; }
.sn-cp-lage { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sn-cp-lagebtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 6px 4px; border-radius: 14px; border: 2px solid var(--sn-text, #141414); background: var(--sn-surface, #fff); color: var(--sn-text, #141414); font: 700 14px/1.15 var(--sn-font-body, sans-serif); text-align: center; cursor: pointer; }
.sn-cp-lagebtn:active { transform: scale(.97); }
.sn-cp-lagebtn--ok { border-color: var(--sn-ok-line); background: var(--sn-ok-bg); color: var(--sn-ok-fg); }
.sn-cp-lagebtn--tight { border-color: var(--sn-warn-line); background: var(--sn-warn-bg); color: var(--sn-warn-fg); }
.sn-cp-lagebtn--help { border-color: var(--sn-urgent-line); background: var(--sn-urgent-bg); color: var(--sn-urgent-fg); border-style: dashed; }
.sn-cp-last { display: flex; gap: 6px; align-items: center; margin: 0; }
.sn-cp-last .sn-icon { width: 18px; height: 18px; flex: none; }
.sn-cp-strip { min-width: 0; display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px 2px 6px; margin: 0 -2px; }
.sn-cp-chip { flex: none; scroll-snap-align: start; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--sn-border-strong, #7d828b); background: var(--sn-surface, #fff); color: var(--sn-text, #141414); font: 600 15px/1 var(--sn-font-body, sans-serif); cursor: pointer; }
.sn-cp-chip--photo { background: var(--sn-brand-black, #141414); color: #fff; border-color: var(--sn-brand-black, #141414); }
.sn-cp-chip:active { transform: scale(.97); }

/* Ampel */
.sn-cp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sn-cp-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 120px; padding: 10px; margin: 0; text-align: left; color: var(--sn-text, #141414); font: inherit; cursor: pointer; border-top: 5px solid var(--sn-ok-line, #1f8a46); }
.sn-cp-tile--warn { border-top-color: var(--sn-warn-line, #d98a00); }
.sn-cp-tile--crit { border-top-color: var(--sn-urgent-line, #e10915); border-top-width: 8px; }
.sn-cp-tile:active { transform: scale(.98); }
.sn-cp-tile__top { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.sn-cp-tile__name { font: 700 18px/1.1 var(--sn-font-display, sans-serif); }
.sn-cp-tile__reason { font-size: var(--sn-text-sm, 14px); color: var(--sn-text-muted, #50555c); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sn-cp-signals { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.sn-cp-signal { display: grid; gap: 6px; justify-items: start; padding-bottom: 10px; border-bottom: 1px solid var(--sn-border, #d9d9de); }
.sn-cp-signal p { margin: 0; overflow-wrap: anywhere; }
.sn-cp-foot { display: flex; flex-wrap: wrap; gap: 8px; }

/* Rundgänge */
.sn-cp-check { padding: 10px 12px; margin-bottom: 8px; display: grid; gap: 8px; }
.sn-cp-check__row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.sn-cp-check__text { display: grid; gap: 4px; justify-items: start; min-width: 0; }
.sn-cp-check__title { margin: 0; font-weight: 700; }
.sn-cp-points { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.sn-cp-pt { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--sn-border, #d9d9de); }
.sn-cp-pt__text { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.sn-cp-pt__btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sn-cp-opt { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 6px 8px; border-radius: 12px; border: 2px solid var(--sn-border-strong, #7d828b); background: var(--sn-surface, #fff); color: var(--sn-text, #141414); font: 600 15px/1.1 var(--sn-font-body, sans-serif); cursor: pointer; }
.sn-cp-opt[aria-pressed="true"].sn-cp-opt--ok { background: var(--sn-ok-bg); color: var(--sn-ok-fg); border-color: var(--sn-ok-line); }
.sn-cp-opt[aria-pressed="true"].sn-cp-opt--miss { background: var(--sn-urgent-bg); color: var(--sn-urgent-fg); border-color: var(--sn-urgent-line); border-style: dashed; }
.sn-cp-opt[aria-pressed="true"] span::after { content: " ✓"; }
.sn-cp-pt__fix { display: flex; gap: 6px; align-items: flex-start; margin: 0; color: var(--sn-urgent-fg, #9e0610); }
.sn-cp-pt__fix .sn-icon { width: 18px; height: 18px; flex: none; }
.sn-cp-check .sn-btn[aria-disabled="true"] { opacity: .6; }

/* Mein Team */
.sn-cp-person { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px; margin-bottom: 8px; }
.sn-cp-person__text p { margin: 0; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.sn-cp-person__text .sn-icon { width: 16px; height: 16px; flex: none; }
.sn-cp-ellip { display: block !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sn-cp-person__btns { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sn-cp-person__btns .sn-btn { width: 100%; }
@media (prefers-reduced-motion: reduce) { .sn-cp-tile:active, .sn-cp-chip:active, .sn-cp-lagebtn:active { transform: none; } }

/* ===== src/views/14-overview.css ===== */
/* Übersicht und Personal (Filialleitung). Fallback unter dem Präfix .sn-ov- / .sn-st-,
   nutzt nur Tokens aus design/tokens.css (Hell und Dunkel). */
.sn-ov > * + * { margin-top: var(--sn-space-3, 12px); }
.sn-ov .sn-segment + .sn-chips, .sn-ov .sn-segment + .sn-segment { margin-top: var(--sn-space-2, 8px); }
.sn-ov .sn-chip[data-act], .sn-ov .sn-chip[aria-pressed] { min-height: 48px; padding: 0 14px; cursor: pointer; font: inherit; font-size: var(--sn-text-sm, 14px); font-weight: 600; }
.sn-ov .sn-chip .sn-icon { width: 18px; height: 18px; }
.sn-ov .sn-section-title { margin-top: var(--sn-space-5, 20px); }
.sn-ov .sn-segment--sticky { margin-top: 0; }

/* Kennzahlen */
.sn-ov-kpi { font: inherit; color: inherit; width: 100%; min-height: 88px; }
.sn-ov-kpi__top { display: flex; align-items: center; gap: 8px; }
.sn-ov-kpi__top .sn-icon { width: 22px; height: 22px; flex: none; }
.sn-ov-kpi__hint { font-size: var(--sn-text-sm, 13px); color: var(--sn-text-muted); }
.sn-kpi--alert .sn-ov-kpi__hint { color: var(--sn-urgent-fg); }
.sn-ov-kpi--wide { grid-column: 1 / -1; min-height: 72px; }
.sn-ov-kpi[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sn-focus, #0b57d0); }
.sn-ov-kpis3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sn-ov-kpis3 .sn-kpi { cursor: default; min-height: 76px; }
.sn-ov-ctx { margin: 4px 2px; }

/* Verlauf */
.sn-ov-chart { padding: var(--sn-space-3, 12px); }
.sn-ov-h { margin: 0; font-size: var(--sn-text-md, 16px); font-weight: 700; }
.sn-ov-bars { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; align-items: end; margin-top: 8px; }
.sn-ov-bar { display: grid; grid-template-rows: 18px 72px 18px; justify-items: center; font-size: 12px; }
.sn-ov-bar__n { font-weight: 700; font-variant-numeric: tabular-nums; }
.sn-ov-bar__col { width: 100%; max-width: 28px; height: 72px; display: flex; flex-direction: column-reverse; background: var(--sn-surface-2, #f7f7f8); border-radius: 6px; overflow: hidden; border: 1px solid var(--sn-border); }
.sn-ov-bar__open { display: block; background: var(--sn-accent, #e10915); }
.sn-ov-bar__done { display: block; background: var(--sn-neutral-line, #8b9099); background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255, 255, 255, .45) 4px 6px); }
.sn-ov-bar__h { color: var(--sn-text-muted); font-variant-numeric: tabular-nums; }
.sn-ov-bar.is-now .sn-ov-bar__h { color: var(--sn-text); font-weight: 700; }
.sn-ov-legend { margin: 8px 0 0; font-size: var(--sn-text-sm, 13px); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.sn-ov-key { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--sn-border); }
.sn-ov-key--open { background: var(--sn-accent, #e10915); }
.sn-ov-key--done { background: var(--sn-neutral-line, #8b9099); }

/* Filter und Liste */
.sn-ov .sn-filter { align-items: stretch; }
.sn-ov .sn-filter .sn-select { min-height: 48px; }
.sn-ov-urgent { flex: 0 0 auto !important; }
.sn-ov-stale { flex-wrap: wrap; gap: 6px; }
.sn-ov-listhead { margin-top: var(--sn-space-5, 20px) !important; }
.sn-ov-item { margin-top: var(--sn-space-3, 12px); }
.sn-ov-item .sn-card { margin: 0 !important; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.sn-ov-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; background: var(--sn-surface); border: 1px solid var(--sn-border); border-top: 0; border-radius: 0 0 var(--sn-radius-md, 12px) var(--sn-radius-md, 12px); }
.sn-ov-actions .sn-btn { flex: 1 1 auto; min-height: 48px; }

/* Anwesenheit */
.sn-ov-away { padding-top: 8px; padding-bottom: 8px; align-items: flex-start; }
.sn-ov-away .sn-list__body { min-width: 0; }
.sn-ov-away .sn-chip { margin-top: 4px; white-space: normal; }
.sn-ov-depts { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sn-ov-dept { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; text-align: left; min-height: 56px; padding: 8px 12px; font: inherit; color: var(--sn-text); background: var(--sn-surface); border: 1px solid var(--sn-border); border-radius: var(--sn-radius-md, 12px); cursor: pointer; }
.sn-ov-dept.is-short { border: 2px solid var(--sn-warn-line); background: var(--sn-warn-bg); color: var(--sn-warn-fg); }
.sn-ov-dept.is-sel { box-shadow: 0 0 0 3px var(--sn-focus, #0b57d0); }
.sn-ov-dept__name { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
.sn-ov-dept__name .sn-icon, .sn-ov-dept__txt .sn-icon { width: 18px; height: 18px; flex: none; }
.sn-ov-dept__n { font-variant-numeric: tabular-nums; }
.sn-ov-dept__bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--sn-surface-3, #e8e8eb); overflow: hidden; }
.sn-ov-dept__bar i { display: block; height: 100%; background: var(--sn-ok-line, #1f8a46); }
.sn-ov-dept.is-short .sn-ov-dept__bar i { background: var(--sn-warn-line); }
.sn-ov-dept__txt { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: var(--sn-text-sm, 13px); color: var(--sn-text-muted); }
.sn-ov-dept.is-short .sn-ov-dept__txt { color: var(--sn-warn-fg); font-weight: 700; }
.sn-ov-plain { padding: 10px; }
.sn-ov-links { flex-wrap: wrap; margin-top: var(--sn-space-5, 20px); }

/* Personal */
.sn-st-row { width: 100%; text-align: left; padding: 10px 12px; font: inherit; color: var(--sn-text); min-height: 64px; cursor: pointer; display: block; }
.sn-st-row + .sn-st-row, .sn-st-list > li + li { margin-top: 6px; }
.sn-st-list { list-style: none; margin: 0; padding: 0; }
.sn-st-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.sn-st-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.sn-st-grid .sn-btn { min-height: 52px; }
.sn-st-facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 8px 0; font-size: var(--sn-text-sm, 14px); }
.sn-st-facts dt { color: var(--sn-text-muted); }
.sn-st-facts dd { margin: 0; font-weight: 600; }
.sn-st-pin { font: 700 32px/1.2 var(--sn-font-display, inherit); letter-spacing: .3em; text-align: center; padding: 12px; background: var(--sn-surface-2); border-radius: var(--sn-radius-md, 12px); font-variant-numeric: tabular-nums; }
.sn-st-log { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: var(--sn-text-sm, 14px); }
.sn-st-log time { color: var(--sn-text-muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.sn-st-plan { display: grid; grid-template-columns: 44px 1fr; gap: 6px 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--sn-border); }
.sn-st-plan .sn-filter { margin: 0; grid-column: 1 / -1; }
.sn-st-plan .sn-input { min-width: 0; }

.sn-sheet [hidden], .sn-ov [hidden] { display: none !important; }
.sn-sheet .sn-select, .sn-sheet .sn-input { width: 100%; }
.sn-sheet .sn-row .sn-input { flex: 1; }
.sn-sheet fieldset.sn-choices { border: 0; padding: 0; margin: 0 0 12px; display: block; min-width: 0; }
.sn-sheet fieldset.sn-choices > .sn-choices { display: grid; gap: 6px; }</style>
</head>

window.SN = window.SN || {};
/* ===== src/core/util.js ===== */
try {
/* ==========================================================================
   SN.util · SN.clock – kleine Helfer ohne Fachlogik
   --------------------------------------------------------------------------
   - SN.clock: einzige Zeitquelle der App (in Tests überschreibbar)
   - Text/HTML: esc, fmt.*
   - Daten: id, clone, deepMerge, deepFreeze, uniq, sortBy
   - DOM: $, $$, shrinkImage, dataUrlToBlob, vibrate
   - Lokaler Speicher: ls.get/ls.set (immer in try/catch)
   ========================================================================== */
(function (SN) {
  'use strict';

  const MIN = 60 * 1000;
  const HOUR = 60 * MIN;
  const DAY = 24 * HOUR;

  /* ---------- Uhr ---------------------------------------------------- */
  // Zeitquelle: Date.now() + Versatz, oder eine feste Zeit (Tests).
  let fixed = null;
  let offset = 0;
  const clock = {
    now() { return fixed !== null ? fixed : Date.now() + offset; },
    /** Feste Zeit setzen (Zahl oder Date); null hebt sie auf. */
    set(ts) { fixed = ts === null ? null : +ts; },
    /** Uhr um ms vorspulen (feste Zeit oder Versatz). */
    advance(ms) { if (fixed !== null) fixed += ms; else offset += ms; },
    /** Laufende Uhr mit Versatz (z. B. Demo außerhalb der Ladenzeiten). */
    offset(ms) { fixed = null; offset = ms; },
    reset() { fixed = null; offset = 0; },
  };

  /* ---------- Text ---------------------------------------------------- */
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  /** HTML-sicher maskieren (für alle Nutzerinhalte in Template-Strings). */
  function esc(v) {
    return v === null || v === undefined ? '' : String(v).replace(/[&<>"']/g, (c) => ESC[c]);
  }

  const pad = (n) => (n < 10 ? '0' : '') + n;
  const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

  const fmt = {
    /** 09:05 */

    /** Mo, 23.11. */
    date(ts) { const d = new Date(ts); return WD[d.getDay()] + ', ' + pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.'; },
    /** Heute 09:05 · Gestern 18:10 · Mo, 23.11. 09:05 */
    when(ts) {
      const k = fmt.dayKey(ts);
      const now = clock.now();
      if (k === fmt.dayKey(now)) return 'Heute ' + fmt.time(ts);
      if (k === fmt.dayKey(now - DAY)) return 'Gestern ' + fmt.time(ts);
      return fmt.date(ts) + ' ' + fmt.time(ts);
    },
    /** Minuten → „45 Min“ / „1 Std 30 Min“ */

      min = Math.max(0, Math.round(min));

    async function attempt(col, id, op, data) {
      try { await run(col, id, op, data); return { ok: true }; } catch (e) {
        const code = (e && e.code) || 'unavailable';
        if (code === 'unavailable') {
          // vorübergehend: genau einmal nach kurzer, zufälliger Pause wiederholen
          await new Promise((r) => setTimeout(r, 300 + Math.random() * 700));
          try { await run(col, id, op, data); return { ok: true }; } catch (e2) { return { ok: false, code: (e2 && e2.code) || 'unavailable' }; }
        }
        return { ok: false, code };
      }
    }

    return {
      async start() {
        setStatus('loading');
        for (const col of COLS) subscribe(col);
        // Ladezeitlimit: ohne bestätigten Snapshot nach 10 s → „offline“ bzw. „veraltet“
        timer = setTimeout(() => {
          if (allLoaded()) return;
          const any = COLS.some((c) => S.remote[c].size);
          setStatus(any ? 'stale' : 'offline');
          resolveReady();
        }, LOAD_LIMIT_MS);
        return readyP;
      },
      write(col, id, op, data) {
        const key = col + '/' + id;
        const entry = { op, data };
        (overlay[key] = overlay[key] || []).push(entry);
        const prev = queues[key] || Promise.resolve();
        const p = prev.then(async () => {
          // ab jetzt kennt die db die Änderung (Latenzausgleich) → aus dem Overlay nehmen
          const i = overlay[key].indexOf(entry);
          if (i >= 0) overlay[key].splice(i, 1);
          if (!overlay[key].length) delete overlay[key];
          const res = await attempt(col, id, op, data);
          if (!res.ok) {
            if (res.code === 'invalid_argument' && viewer.canWrite !== true) { S.readOnly = true; setStatus('offline'); }
            if (TERMINAL.includes(res.code)) { S.readOnly = true; setStatus('offline'); }
            emitError(res.code, { col, id, op });
            rebuild(col); // optimistische Änderung zurücknehmen
          }
          return res;
        }).catch((e) => { console.error('[SN.store] Schreibfehler', e); return { ok: false, code: 'unavailable' }; });
        queues[key] = p;
        p.then(() => { if (queues[key] === p) delete queues[key]; });
        return p;
      },
      async get(col, id) {
        try {
          const s = await ref(col, id).get();
          return s.exists ? withId(id, s.data()) : null;
        } catch (e) { emitError((e && e.code) || 'unavailable', { col, id }); return null; }
      },
      stop() {
        clearTimeout(timer);
        for (const c of Object.keys(unsubs)) if (unsubs[c]) unsubs[c]();
      },
      prefRef(uid) { return db.doc('data/users/' + uid + '/prefs'); },
    };

  // cfg = {url: 'https://…', key: 'Filial-Schlüssel'}. Server ist die Wahrheit; eigene Änderungen
  // werden sofort lokal gezeigt und vom Server per Event bestätigt. Ohne Netz: Warteschlange.
  function serverBackend(cfg) {
    const base = String(cfg.url || '').replace(/\/+$/, '');
    const hdr = (json) => Object.assign(cfg.key ? { Authorization: 'Bearer ' + cfg.key } : {}, json ? { 'Content-Type': 'application/json' } : {});
    const OUTBOX = 'outbox.' + base;
    let es = null, retryT = null, stopped = false;
    let outbox = U.ls.get(OUTBOX, []);
    const saveOutbox = () => U.ls.set(OUTBOX, outbox);

    function applyRemote(col, id, doc) {
      if (!S.cache[col]) return;
      if (doc) S.cache[col].set(id, withId(id, U.clone(doc))); else S.cache[col].delete(id);
      touch(col);
    }
    async function snapshot() {
      const r = await fetch(base + '/api/snapshot', { headers: hdr() });
      if (r.status === 401) { const e = new Error('unauthorized'); e.code = 'not_granted'; throw e; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      for (const col of COLS) {
        S.cache[col] = new Map();
        for (const d of (j.cols && j.cols[col]) || []) S.cache[col].set(d.id, withId(d.id, U.clone(d)));
        S.loaded[col] = true; touch(col);
      }
      // noch nicht übertragene eigene Änderungen wieder darüberlegen
      for (const o of outbox) applyLocal(o.col, o.id, o.op, o.data);
    }
    function listen() {
      if (es) es.close();
      es = new EventSource(base + '/api/events' + (cfg.key ? '?key=' + encodeURIComponent(cfg.key) : ''));
      es.onopen = () => { setStatus('live'); flushOutbox(); };
      es.onmessage = (ev) => { try { const m = JSON.parse(ev.data); if (!outbox.some((o) => o.col === m.col && o.id === m.id)) applyRemote(m.col, m.id, m.doc); } catch (e) { /* ignorieren */ } };
      es.onerror = () => {
        setStatus('offline');
        if (es && es.readyState === 2 && !stopped) { clearTimeout(retryT); retryT = setTimeout(() => resync(), 4000); }
      };
    }
    async function resync() { try { await snapshot(); listen(); } catch (e) { setStatus('offline'); retryT = setTimeout(resync, 6000); } }
    async function sendOne(o) {
      const u = base + '/api/doc/' + o.col + '/' + encodeURIComponent(o.id);
      const r = await fetch(u, { method: o.op === 'del' ? 'DELETE' : o.op === 'put' ? 'PUT' : 'PATCH', headers: hdr(true), body: o.op === 'del' ? undefined : JSON.stringify(o.data) });
      if (r.status === 401) return { ok: false, code: 'not_granted' };
      if (!r.ok) return { ok: false, code: r.status === 413 ? 'invalid_argument' : 'unavailable', fatal: r.status >= 400 && r.status < 500 };
      return { ok: true };
    }

    async function flushOutbox() {
      if (flushing) return; flushing = true;
      try {
        while (outbox.length) {
          let r;
          try { r = await sendOne(outbox[0]); } catch (e) { r = { ok: false, code: 'unavailable' }; }
          if (!r.ok && !r.fatal) { setStatus('offline'); break; }
          outbox.shift(); saveOutbox();
        }
      } finally { flushing = false; }
    }
    window.addEventListener('online', () => { flushOutbox(); });
    return {
      async start() {
        setStatus('loading');
        try { await snapshot(); } catch (e) {
          if (e.code === 'not_granted') { emitError('not_granted', {}); throw e; }
          // offline gestartet: zuletzt bekannte Daten gibt es nicht – leer starten, später nachladen
          for (const col of COLS) S.loaded[col] = true;
          setStatus('offline'); retryT = setTimeout(resync, 5000); return;
        }
        listen();
      },
      async write(col, id, op, data) {
        const o = { col, id, op, data: data ? U.clone(data) : null };
        if (outbox.length) { outbox.push(o); saveOutbox(); flushOutbox(); return { ok: true, queued: true }; }
        try {
          const r = await sendOne(o);
          if (r.ok || r.fatal) return r;
        } catch (e) { /* Netz weg */ }
        outbox.push(o); saveOutbox(); setStatus('offline');
        return { ok: true, queued: true };
      },
      get(col, id) { return Promise.resolve(S.cache[col].get(id) || null); },
      stop() { stopped = true; if (es) es.close(); clearTimeout(retryT); },
      /** Foto hochladen → absolute URL (mit Schlüssel, damit <img> lädt) */
      async upload(blob) {
        const r = await fetch(base + '/api/media', { method: 'POST', headers: Object.assign(hdr(), { 'Content-Type': blob.type || 'image/jpeg' }), body: blob });
        if (!r.ok) throw new Error('Upload fehlgeschlagen (' + r.status + ')');
        const j = await r.json();
        return base + j.url + (cfg.key ? '?key=' + encodeURIComponent(cfg.key) : '');
      },
      pending: () => outbox.length,
      async login(id, pin) {
        try {
          const r = await fetch(base + '/api/login', { method: 'POST', headers: hdr(true), body: JSON.stringify({ id, pin }) });
          if (r.status === 429) return { ok: false, reason: 'Zu viele Versuche. Bitte 5 Minuten warten.' };
          if (!r.ok) return { ok: false, reason: r.status === 403 ? 'PIN falsch.' : 'Anmelden nicht möglich (' + r.status + ').' };
          return { ok: true };
        } catch (e) { return { ok: false, offline: true, reason: 'Keine Verbindung zum Server.' }; }
      },
    };
  }

  /** Ist der Filialbetrieb möglich? → {db: boolean} */

   * Store starten. mode 'demo' | 'db'.

   * Löst auf mit {ok, mode, status, fallback?}. Ist db nicht verfügbar, wird Demo genutzt.

        await S.backend.start();
        S.ready = true;
        return { ok: true, mode: 'db', status: S.status };

    }

    const breakage = [{ id: 'demo-b1', reason: 'Glasbruch', dept: 'Konserven', name: 'Gurken im Glas', qty: 2, by: p1('Konserven'), at: T - 3 * HOUR }];
    const log = [{ id: day, d: day, entries: [
      { at: T - 25 * HOUR, by: kasse1, text: 'Schichtanfrage angenommen: Mi Früh' },
      { at: T - 50 * MIN, by: sick.id, text: 'Ausfall gemeldet: Krank: ' + sick.name },
    ] }];
    // Platzhalter-„Foto“ für den Nachweis (kleines SVG)
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="320" height="200" fill="#e9ecef"/><text x="160" y="105" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#555">Foto-Nachweis (Demo)</text></svg>';
    const media = [{ id: 'demo-m1', at: T - 12 * MIN, by: getr, type: 'image/svg+xml', data: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) }];

/* ===== src/core/comm.js ===== */
try {
/* ==========================================================================
   SN.comm – Kommunikationsmotor (M1) + Chat
   --------------------------------------------------------------------------
   Ein Modell für alle Vorgänge („Items“, Collection items):
     {id, kind, from, to:{type, ids[], shift?}, title, body, lang, orig?, u,
      createdAt, ackDue, state, acks:{empId:ts}, seen:{empId:ts}, owner,
      esc:{level, at, history:[{level, at, ids, key?, fwd?, by?}]}, thread:[]}
   kind: post | task | report | call | sos | handover | shiftreq | absence
   state: sent → seen → taken → done (außerdem closed/accepted/declined/cancelled)

   Regeln:
   - Jede Aktion schreibt über SN.store (patch mit tiefem Merge → gleichzeitige
     Quittungen verschiedener Personen kollidieren nicht).
   - Aktionen liefern Promise<{ok, item?, reason?}>; reason ist deutscher Text.
   - escalateDue(now) ist idempotent: Stufe und Zeitpunkte werden aus der
     Frist berechnet (nicht aus „jetzt“), mehrere Geräte schreiben dasselbe.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model;
  const MIN = U.MIN;
  const now0 = (n) => (n === undefined ? SN.clock.now() : n);

  /* ---------- Lesen ------------------------------------------------------ */
  const items = () => SN.store.list('items');
  const get = (idOrItem) => (typeof idOrItem === 'string' ? SN.store.peek('items', idOrItem) : idOrItem
    ? SN.store.peek('items', idOrItem.id) || idOrItem : null);
  const isFinal = (it) => M.FINAL_STATES.includes(it.state);
  const ok = (extra) => Object.assign({ ok: true }, extra);
  const fail = (reason) => Promise.resolve({ ok: false, reason });
  const PREFIX = { post: 'po', task: 'ta', report: 're', call: 'ca', sos: 'so', handover: 'ho', shiftreq: 'sr', absence: 'ab', photo: 'ph' };

  /** Empfänger eines Vorgangs (ohne Absender); Auftrag: Besitzer oder Abteilung */
  function recipients(it) {
    if (!it) return [];
    if (it.kind === 'task' && it.owner) return [it.owner];
    const ids = M.resolveTo(it.to);
    return it.to && it.to.type === 'person' && it.kind === 'task' ? ids : ids.filter((id) => id !== it.from);
  }
  const isRecipient = (it, empId) => recipients(it).includes(empId);

  /** Alle Beteiligten: Absender, Empfänger, Besitzer, Eskalationsstufen, Antwortende */
  function involved(it) {
    const h = (it.esc && it.esc.history) || [];
    return U.uniq([it.from, it.owner].concat(recipients(it), ...h.map((x) => x.ids || []), Object.keys(it.answers || {})));
  }
  /** Personen der aktuellen Eskalationsstufe (wen es gerade betrifft) */
  function currentIds(it) {
    const h = (it.esc && it.esc.history) || [];
    const last = h[h.length - 1];
    return last && last.ids ? last.ids : recipients(it);
  }

  /** Quittungszähler einer Anweisung: {done, total, open[], acked[]} */
  function ackStats(it) {
    const rec = recipients(it);
    const acks = it.acks || {};
    const acked = rec.filter((id) => acks[id]);
    return { done: acked.length, total: rec.length, acked, open: rec.filter((id) => !acks[id]) };
  }

  /** Zusagen eines Rufs: {yes[], no[], need, enough} */
  function callStatus(it) {
    const a = it.answers || {};
    const yes = Object.keys(a).filter((id) => a[id].a === 'yes');
    const no = Object.keys(a).filter((id) => a[id].a === 'no');
    const need = it.need === undefined ? 1 : it.need;
    return { yes, no, need, enough: need > 0 && yes.length >= need };
  }

  /** Braucht der Vorgang keine weitere Eskalation? */
  function satisfied(it) {
    if (isFinal(it)) return true;
    switch (it.kind) {
      case 'report': case 'absence': return it.state === 'taken';
      case 'call': return it.need === 0 || callStatus(it).enough;
      case 'sos': return Object.keys(it.answers || {}).length > 0;
      case 'post': return !it.needAck || ackStats(it).open.length === 0;
      case 'handover': return Object.keys(it.acks || {}).length > 0;
      case 'photo': return Object.keys(it.seen || {}).some((id) => id !== it.from) || it.state === 'taken';
      case 'task': return !it.escalate || it.state === 'done';
      default: return true;
    }
  }

  /* ---------- Senden ------------------------------------------------------ */
  /**
   * Vorgang anlegen. draft: beliebige Felder (kind, to, title, body, u, …).
   * Absender = by. Setzt Status, Frist (ackDue) und Eskalationsstartpunkt.
   */
  function send(draft, by, now) {
    now = now0(now);
    const me = M.emp(by);
    const kind = draft.kind || 'post';
    const it = Object.assign({
      kind, to: { type: 'person', ids: [] }, title: '', body: '', lang: 'de', u: false,
      state: 'sent', acks: {}, seen: {}, owner: null, thread: [],
      dept: me ? M.deptOf(me, now) : null, shift: M.currentShift(now) || (me && me.sh) || 'Früh',
    }, U.clone(draft), { id: draft.id || U.id(PREFIX[kind] || 'it'), from: by, createdAt: now });
    const min = M.deadlineMin(it);
    if (it.kind === 'task') it.ackDue = it.escalate && it.due ? it.due : null;
    else if (it.kind === 'post') it.ackDue = it.needAck ? now + min * MIN : null;
    else if (it.kind === 'shiftreq') it.ackDue = null;
    else it.ackDue = M.ackStart(it, now) + min * MIN;
    const rec = recipients(it);
    if (!rec.length && it.ackDue) it.ackDue = now; // niemand erreichbar → sofort eine Stufe höher
    it.esc = { level: 0, at: now, history: [{ level: 0, at: now, ids: rec }] };
    return SN.store.put('items', it.id, it).then((r) => (r.ok ? ok({ item: get(it.id) || it }) : { ok: false, reason: SN.store.ERROR_TEXT[r.code] || 'Nicht gespeichert.' }));
  }

  /** Anweisung / Info (M2). opts: {to, title, body, needAck, u, ackMin, briefing, kudos} */
  function post(by, opts) {
    return send(Object.assign({ kind: 'post', needAck: false }, opts), by);
  }

  /** Auftrag (M3). opts: {title, dept, act, min, due, u, owner, proofRequired, escalate, checklist[], templateId} */
  function task(by, opts) {
    const o = Object.assign({}, opts);
    o.act = o.act || 'Sonstiges';
    o.min = o.min || M.ACT_MIN[o.act] || 20;
    o.to = o.owner ? { type: 'person', ids: [o.owner] } : { type: 'dept', ids: [o.dept || 'Trocken sortiment'] };
    if (o.owner) {
      const chk = SN.dist ? SN.dist.canTake(M.emp(o.owner), o) : { ok: true };
      if (!chk.ok) return fail(chk.reason);
    }
    return send(Object.assign({ kind: 'task' }, o), by);
  }

  /**
   * Meldung von unten (M4). opts: {cat, dept, body, orig, lang, photos[], u}
   * Routing automatisch an die zuständige Person (Kategorie + Abteilung + Schicht).
   */
  function report(by, opts, now) {
    now = now0(now);
    const me = M.emp(by);
    const c = M.CAT[opts.cat] || M.CAT.other;
    const dept = c.dept || opts.dept || (me && M.deptOf(me, now)) || 'Info';
    const shift = M.currentShift(now) || (me && me.sh) || 'Früh';
    const ids = M.responsibleFor(c.key, dept, shift, now).filter((id) => id !== by);
    return send(Object.assign({}, opts, {
      kind: 'report', cat: c.key, dept, shift, title: opts.title || c.label,
      to: { type: 'person', ids: ids.length ? ids : M.responsibleFor(c.key, dept, shift, now) },
    }), by, now);
  }

  /* ---------- Reaktionen ------------------------------------------------- */
  /** Gesehen markieren (schreibt nur beim ersten Mal) */
  function markSeen(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it || (it.seen && it.seen[by])) return Promise.resolve(ok({ item: it, unchanged: true }));
    const p = { seen: { [by]: now } };
    if (it.state === 'sent' && isRecipient(it, by)) p.state = 'seen';
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Quittieren („Gelesen und verstanden“, Übergabe-Empfang) */
  function ack(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    if (it.acks && it.acks[by]) return Promise.resolve(ok({ item: it, unchanged: true }));
    const p = { acks: { [by]: now } };
    if (!it.seen || !it.seen[by]) p.seen = { [by]: now };
    if (it.kind === 'handover') { p.state = 'done'; p.doneAt = now; p.doneBy = by; }
    else if (it.state === 'sent') p.state = 'seen';
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Übernehmen (Meldung, Auftrag, Ausfall). Aufträge nur innerhalb des Limits. */
  function take(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    if (isFinal(it)) return fail('Schon abgeschlossen.');
    if (it.owner && it.owner !== by) return fail('Schon übernommen von ' + M.name(it.owner) + '.');
    if (it.kind === 'task' && it.owner !== by) {
      const chk = SN.dist.canTake(M.emp(by), it, now);
      if (!chk.ok) return fail(chk.reason);
    }
    const p = { owner: by, state: 'taken', takenAt: now, seen: { [by]: (it.seen && it.seen[by]) || now } };
    if (it.kind === 'task') { p.to = { type: 'person', ids: [by] }; p.startedAt = now; }
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Auftrag starten („Gesehen/Starte“) – zugeteilter Auftrag wird „in Arbeit“ */
  function start(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'task') return fail('Auftrag nicht gefunden.');
    if (it.owner && it.owner !== by) return fail('Der Auftrag gehört ' + M.name(it.owner) + '.');
    if (!it.owner) return take(it, by, now);
    return SN.store.patch('items', it.id, { state: 'taken', startedAt: now, seen: { [by]: (it.seen && it.seen[by]) || now } })
      .then(() => ok({ item: get(it.id) }));
  }

  /** Weitergeben an andere Personen (Kette startet bei den neuen Empfängern neu) */
  function forward(ref, by, toIds, note, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    toIds = U.uniq([].concat(toIds || [])).filter((id) => M.emp(id));
    if (!toIds.length) return fail('Bitte eine Person wählen.');
    const draft = Object.assign({}, it, { to: { type: 'person', ids: toIds }, owner: null });
    const min = M.deadlineMin(draft);
    const hist = ((it.esc && it.esc.history) || []).concat([{ level: 0, at: now, ids: toIds, fwd: true, by }]);
    const thread = (it.thread || []).concat([{ by, at: now, type: 'fwd', text: note || '', ids: toIds }]);
    return SN.store.patch('items', it.id, {
      to: { type: 'person', ids: toIds }, owner: null, state: 'sent',
      ackDue: min ? now + min * MIN : it.ackDue || null,
      esc: { level: 0, at: now, history: hist }, thread,
    }).then(() => ok({ item: get(it.id) }));
  }

  /**
   * Erledigt. opts: {text} kurze Antwort an den Melder, {photo} Foto-Nachweis (Media-ID).
   * Aufträge mit proofRequired brauchen ein Foto; die Leitung gibt frei (approve).
   */
  function done(ref, by, opts, now) {
    const it = get(ref); now = now0(now); opts = opts || {};
    if (!it) return fail('Vorgang nicht gefunden.');
    if (isFinal(it)) return Promise.resolve(ok({ item: it, unchanged: true }));
    if (it.kind === 'task' && it.proofRequired && !opts.photo) return fail('Bitte ein Foto als Nachweis anhängen.');
    const p = { state: 'done', doneAt: now, doneBy: by, owner: it.owner || by };
    if (opts.photo) { p.proof = opts.photo; p.approved = null; }
    if (opts.text) p.thread = (it.thread || []).concat([{ by, at: now, type: 'done', text: opts.text }]);
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Foto-Nachweis freigeben (yes) oder zurück zum Nachbessern */
  function approve(ref, by, yes, note, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'task') return fail('Auftrag nicht gefunden.');
    const thread = note ? (it.thread || []).concat([{ by, at: now, type: yes ? 'ok' : 'redo', text: note }]) : undefined;
    const p = yes ? { approved: true, approvedBy: by, approvedAt: now } : { approved: false, state: 'taken', doneAt: null };
    if (thread) p.thread = thread;
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Antwort / Rückfrage im Verlauf eines Vorgangs */
  function reply(ref, by, text, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    if (!String(text || '').trim()) return fail('Bitte einen Text eingeben.');
    const thread = (it.thread || []).concat([{ by, at: now, type: 'msg', text: String(text).trim() }]).slice(-100);
    return SN.store.patch('items', it.id, { thread, seen: { [by]: now } }).then(() => ok({ item: get(it.id) }));
  }

  /** Nachfassen: erinnert alle, die noch nicht quittiert haben → {ok, count} */
  function remind(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    const open = it.kind === 'call'
      ? recipients(it).filter((id) => !(it.answers || {})[id])
      : ackStats(it).open;
    if (!open.length) return Promise.resolve(ok({ count: 0, item: it }));
    const n = ((it.remind && it.remind.n) || 0) + 1;
    return SN.store.patch('items', it.id, { remind: { at: now, by, ids: open, n } })
      .then(() => ok({ count: open.length, item: get(it.id) }));
  }

  /** Auftrag zurückgeben (mit Grund) – wird wieder frei, nicht erneut an dieselbe Person */
  function giveBack(ref, by, reason, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'task') return fail('Auftrag nicht gefunden.');
    if (!String(reason || '').trim()) return fail('Bitte einen Grund angeben.');
    const thread = (it.thread || []).concat([{ by, at: now, type: 'back', text: reason }]);
    return SN.store.patch('items', it.id, {
      owner: null, state: 'sent', help: false, startedAt: null, to: { type: 'dept', ids: [it.dept] },
      returned: { [by]: now }, thread,
    }).then(() => ok({ item: get(it.id) }));
  }

  /** Auftrag aus einer Meldung (Meldung gilt als übernommen) */
  async function toTask(ref, by, extra, now) {
    const it = get(ref); now = now0(now);
    if (!it) return { ok: false, reason: 'Meldung nicht gefunden.' };
    const actFor = { gap: 'Lücken füllen', price: 'Etikettierung', clean: 'Sonstiges', bottle: 'Leergut', delivery: 'Wareneinnahme' };
    const r = await task(by, Object.assign({
      title: it.title + (it.body ? ': ' + it.body : ''), dept: it.dept, act: actFor[it.cat] || 'Sonstiges',
      u: it.u, due: now + 60 * MIN, src: it.id, photos: it.photos || [],
    }, extra || {}));
    if (!r.ok) return r;
    const thread = (it.thread || []).concat([{ by, at: now, type: 'task', text: 'Auftrag erstellt', ref: r.item.id }]);
    await SN.store.patch('items', it.id, { owner: it.owner || by, state: it.state === 'done' ? 'done' : 'taken', takenAt: it.takenAt || now, thread, taskId: r.item.id });
    return ok({ item: r.item, report: get(it.id) });
  }

  /* ---------- Eskalation -------------------------------------------------- */
  /**
   * Fällige Vorgänge eine (oder mehrere) Stufen hochsetzen. Idempotent:
   * Zeitpunkte = abgelaufene Fristen, nicht „jetzt“. Schließt außerdem Rufe
   * mit genug Zusagen. Liefert die IDs geänderter Vorgänge.
   */
  function escalateDue(now) {
    now = now0(now);
    const changed = [];
    for (const it of items()) {
      if (it.kind === 'call' && it.state !== 'closed' && !isFinal(it) && callStatus(it).enough) {
        SN.store.patch('items', it.id, { state: 'closed', closedAt: now });
        changed.push(it.id);
        continue;
      }
      if (!it.ackDue || now < it.ackDue || satisfied(it)) continue;
      const chain = M.escalationChain(it, now);
      const max = chain.length - 1;
      let lvl = (it.esc && it.esc.level) || 0;
      if (lvl >= max) continue;
      const step = M.deadlineMin(it) * MIN || 5 * MIN;
      const hist = ((it.esc && it.esc.history) || []).slice();
      let due = it.ackDue;
      while (now >= due && lvl < max) {
        lvl++;
        hist.push({ level: lvl, at: due, ids: chain[lvl].ids, key: chain[lvl].key });
        due += step;
      }
      SN.store.patch('items', it.id, { esc: { level: lvl, at: hist[hist.length - 1].at, history: hist }, ackDue: due });
      changed.push(it.id);
    }
    return changed;
  }

  /** „Wartet auf …“-Text (leer, wenn nichts mehr offen ist) */
  function waitingOn(ref, now) {
    const it = get(ref); now = now0(now);
    if (!it) return '';
    const since = (ts) => U.fmt.dur(Math.max(0, (now - ts) / MIN));
    if (it.state === 'done') return it.doneBy ? 'Erledigt von ' + M.name(it.doneBy) : 'Erledigt';
    if (it.state === 'closed') return 'Geschlossen';
    if (it.state === 'accepted') return 'Angenommen';
    if (it.state === 'declined') return 'Abgelehnt';
    if (it.state === 'cancelled') return 'Zurückgezogen';
    switch (it.kind) {
      case 'post': {
        if (!it.needAck) return '';
        const s = ackStats(it);
        return s.open.length ? 'Wartet auf ' + U.fmt.count(s.open.length, 'Quittung', 'Quittungen') + ' (' + s.done + ' von ' + s.total + ')' : 'Alle haben quittiert';
      }
      case 'call': {
        const c = callStatus(it);
        if (c.need === 0) return 'Info an alle im Dienst';
        return 'Wartet auf Zusagen (' + c.yes.length + ' von ' + c.need + ')';
      }
      case 'task':
        if (it.owner) return (it.state === 'taken' ? 'In Arbeit bei ' : 'Zugeteilt an ') + M.name(it.owner);
        return 'Wartet auf Übernahme';
      case 'shiftreq':
        if (it.state === 'taken') return 'Wartet auf Freigabe der Leitung';
        return 'Wartet auf Antwort von ' + M.labelFor(recipients(it));
      case 'sos':
        if (Object.keys(it.answers || {}).length) return 'Hilfe kommt: ' + Object.keys(it.answers).map(M.first).join(', ');
        break;
      default:
        if (it.state === 'taken' && it.owner) return 'In Arbeit bei ' + M.name(it.owner);
    }
    const h = (it.esc && it.esc.history) || [];
    const last = h[h.length - 1] || { at: it.createdAt, ids: recipients(it) };
    const ids = last.ids || [];
    const label = last.key === 'slOpen' ? 'Schichtleitung' : last.key && M.STEP_LABEL[last.key] ? M.STEP_LABEL[last.key] : M.labelFor(ids);
    const isName = ids.length === 1 && label === M.name(ids[0]);
    const who = !isName && ids.length && ids.length <= 3 ? label + ' (' + ids.map(M.first).join(', ') + ')' : label;
    return 'Wartet auf ' + who + ' seit ' + since(last.at);
  }

  /** Zeitleiste eines Vorgangs für Melder und Empfänger: [{at, text, kind}] */
  function timeline(ref) {
    const it = get(ref);
    if (!it) return [];
    const out = [{ at: it.createdAt, kind: 'sent', text: 'Gesendet an ' + M.labelFor(((it.esc && it.esc.history[0]) || {}).ids || recipients(it)) }];
    for (const [id, ts] of Object.entries(it.seen || {})) if (id !== it.from) out.push({ at: ts, kind: 'seen', text: 'Gesehen von ' + M.name(id) });
    for (const [id, ts] of Object.entries(it.acks || {})) out.push({ at: ts, kind: 'ack', text: 'Quittiert von ' + M.name(id) });
    for (const h of ((it.esc && it.esc.history) || []).slice(1)) {
      out.push({ at: h.at, kind: h.fwd ? 'fwd' : 'esc', text: h.fwd ? 'Weitergegeben an ' + M.labelFor(h.ids || []) : 'Eskaliert an ' + (M.STEP_LABEL[h.key] || 'Schichtleitung') + ' (' + (h.ids || []).map(M.first).join(', ') + ')' });
    }
    for (const [id, a] of Object.entries(it.answers || {})) {
      out.push({ at: a.at, kind: 'answer', text: M.name(id) + ': ' + (a.a === 'yes' ? 'Ich komme' : a.a === 'coming' ? 'Hilfe kommt, ich gehe hin' : 'Kann nicht') });
    }
    if (it.takenAt && it.owner) out.push({ at: it.takenAt, kind: 'taken', text: 'Übernommen von ' + M.name(it.owner) });
    for (const t of it.thread || []) {
      if (t.type === 'fwd') continue;
      out.push({ at: t.at, kind: t.type || 'msg', text: M.name(t.by) + ': ' + (t.text || '') });
    }
    if (it.doneAt && it.state === 'done') out.push({ at: it.doneAt, kind: 'done', text: 'Erledigt' + (it.doneBy ? ' von ' + M.name(it.doneBy) : '') });
    if (it.closedAt) out.push({ at: it.closedAt, kind: 'closed', text: 'Geschlossen' });
    if (it.answeredAt) out.push({ at: it.answeredAt, kind: it.state, text: M.STATES[it.state] || '' });
    return U.sortBy(out, (x) => x.at);
  }

  /* ---------- Schnellruf (M5) -------------------------------------------- */
  /** Passende Personen für einen Ruf: im Dienst, nicht in Pause, passende Abteilung/Berechtigung */
  function callTargets(type, by, now) {
    now = now0(now);
    const c = M.CALL[type] || M.CALL.info;
    return M.staff().filter((e) => {
      if (e.id === by || !M.onDuty(e, now) || M.inPause(e) || e.role === 'clean') return false;
      if (!c.depts) return true;
      if (M.level(e) > 1) return false; // Leitung wird über die Eskalation erreicht
      return c.depts.includes(M.deptOf(e, now)) || (c.skill && e[c.skill]);
    }).map((e) => e.id);
  }
  /** Ruf auslösen: type kasse|info|goods|meeting. opts: {note, dept} */
  function call(by, type, opts, now) {
    now = now0(now); opts = opts || {};
    const c = M.CALL[type];
    if (!c) return fail('Unbekannter Ruf.');
    const ids = opts.ids || callTargets(type, by, now);
    const me = M.emp(by);
    return send({
      kind: 'call', type, title: c.label, body: opts.note || '', u: type !== 'meeting', need: M.callNeed(type), answers: {},
      dept: c.dept || opts.dept || (me && M.deptOf(me, now)), to: { type: 'person', ids }, standinFor: opts.standinFor || null,
    }, by, now);
  }
  /** Antwort auf einen Ruf: yes = „Ich komme“, sonst „Kann nicht“. Schließt bei genug Zusagen. */
  async function answerCall(ref, by, yes, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'call') return { ok: false, reason: 'Ruf nicht gefunden.' };
    if (isFinal(it)) return { ok: false, reason: 'Der Ruf ist schon geschlossen. Danke!' };
    await SN.store.patch('items', it.id, { answers: { [by]: { a: yes ? 'yes' : 'no', at: now } }, seen: { [by]: (it.seen && it.seen[by]) || now } });
    const cur = get(it.id);
    let closed = false;
    if (yes && callStatus(cur).enough && cur.state !== 'closed') {
      await SN.store.patch('items', it.id, { state: 'closed', closedAt: now });
      closed = true;
    }
    return ok({ item: get(it.id), closed });
  }

  /* ---------- SOS (M7) ---------------------------------------------------- */
  /** SOS: an Leitung und Admins im Dienst (Fallback: alle Leitungen) */
  function sos(by, type, note, now) {
    now = now0(now);
    const t = M.SOS_TYPES.find((x) => x.key === type) || M.SOS_TYPES[0];
    const leads = M.staff().filter((e) => e.id !== by && M.isLead(e) && M.onDuty(e, now)).map((e) => e.id);
    let ids = U.uniq(leads.concat(M.adminOnDuty(now))).filter((id) => id !== by);
    if (!ids.length) ids = M.staff().filter((e) => e.id !== by && M.isLead(e)).map((e) => e.id);
    return send({ kind: 'sos', type: t.key, title: 'SOS: ' + t.label, body: note || '', u: true, answers: {}, tel: t.tel, to: { type: 'person', ids } }, by, now);
  }
  /** Leitung antwortet „Hilfe kommt, ich gehe hin“ */
  function sosRespond(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'sos') return fail('SOS nicht gefunden.');
    return SN.store.patch('items', it.id, {
      answers: { [by]: { a: 'coming', at: now } }, owner: it.owner || by, state: isFinal(it) ? it.state : 'taken',
      takenAt: it.takenAt || now, seen: { [by]: (it.seen && it.seen[by]) || now },
    }).then(() => ok({ item: get(it.id) }));
  }
  /** Ersthelfer/innen mit Status {id, name, onDuty, inPause} */
  function firstAiders(now) {
    now = now0(now);
    return M.staff().filter((e) => e.firstAid).map((e) => ({ id: e.id, name: e.name, onDuty: M.onDuty(e, now), inPause: M.inPause(e), dept: M.deptOf(e, now) }));
  }

  /* ---------- Schichtübergabe (M8) --------------------------------------- */
  /** Zusammenfassung für die Übergabe: offene Aufträge, Meldungen, Restware, Reinigung */
  function handoverSummary(shift, now) {
    now = now0(now);
    const open = items().filter((it) => !isFinal(it));
    const tasks = open.filter((it) => it.kind === 'task' && (!shift || it.shift === shift || !it.owner));
    const reports = open.filter((it) => it.kind === 'report' && it.cat !== 'clean');
    const cleaning = open.filter((it) => it.kind === 'report' && it.cat === 'clean');
    const rest = SN.store.list('rest').filter((r) => !r.done);
    const lines = [];
    if (tasks.length) lines.push(U.fmt.count(tasks.length, 'offener Auftrag', 'offene Aufträge'));
    if (reports.length) lines.push(U.fmt.count(reports.length, 'offene Meldung', 'offene Meldungen'));
    if (rest.length) lines.push(U.fmt.count(rest.length, 'Posten Restware', 'Posten Restware'));
    if (cleaning.length) lines.push(U.fmt.count(cleaning.length, 'Reinigung offen', 'Reinigungen offen'));
    return {
      shift, at: now,
      tasks: tasks.map((t) => ({ id: t.id, title: t.title, dept: t.dept, u: !!t.u, owner: t.owner })),
      reports: reports.map((r) => ({ id: r.id, title: r.title, dept: r.dept, u: !!r.u })),
      cleaning: cleaning.map((r) => ({ id: r.id, title: r.title, dept: r.dept })),
      rest: rest.map((r) => ({ id: r.id, name: r.name || r.note || 'Restware', dept: r.dept, place: r.place })),
      text: lines.length ? lines.join(', ') : 'Keine offenen Punkte',
    };
  }
  /** Übergabe an die nächste Schicht senden (Empfang muss quittiert werden) */
  function sendHandover(by, opts, now) {
    now = now0(now); opts = opts || {};
    const me = M.emp(by);
    const from = opts.fromShift || M.currentShift(now) || (me && me.sh) || 'Früh';
    const to = opts.toShift || M.nextShift(from);
    let ids = M.staff().filter((e) => e.role === 'sl' && e.sh === to).map((e) => e.id);
    if (!ids.length) ids = M.adminOnDuty(now);
    const sum = handoverSummary(from, now);
    return send({
      kind: 'handover', title: 'Übergabe ' + from + ' → ' + to, body: opts.notes || '', fromShift: from, toShift: to,
      summary: sum, shift: to, to: { type: 'person', ids: ids.filter((id) => id !== by) },
    }, by, now);
  }

  /* ---------- Schichtänderung nur als Anfrage (S2) ----------------------- */
  /** Anfrage: opts {day, date, shift, note, swap:boolean} – swap braucht Freigabe der Leitung */
  function shiftRequest(by, toId, opts, now) {
    opts = opts || {};
    if (!M.emp(toId)) return fail('Person nicht gefunden.');
    if (SN.ops && opts.day && opts.shift && !opts.swap) {
      const rc = SN.ops.restCheck(M.emp(toId), opts.day, opts.shift);
      if (!rc.ok) return fail(M.first(toId) + ': ' + rc.reason);
    }
    const title = opts.swap ? 'Schichttausch: ' + (opts.day || '') + ' ' + (opts.shift || '') : 'Kannst du ' + (opts.day || '') + ' ' + (opts.shift || '') + ' übernehmen?';
    return send({ kind: 'shiftreq', title: title.replace(/\s+/g, ' ').trim(), body: opts.note || '', req: { day: opts.day || null, date: opts.date || null, shift: opts.shift || null, swap: !!opts.swap }, to: { type: 'person', ids: [toId] } }, by, now);
  }
  /** Annehmen/Ablehnen. Tausch: annehmen → wartet auf Freigabe (state taken) */
  async function answerShiftReq(ref, by, accept, note, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'shiftreq') return { ok: false, reason: 'Anfrage nicht gefunden.' };
    if (isFinal(it)) return { ok: false, reason: 'Die Anfrage ist schon beantwortet.' };
    if (!isRecipient(it, by)) return { ok: false, reason: 'Die Anfrage ist nicht an dich gerichtet.' };
    if (accept && SN.ops && it.req && it.req.day && it.req.shift) {
      const rc = SN.ops.restCheck(M.emp(by), it.req.day, it.req.shift);
      if (!rc.ok) return { ok: false, reason: rc.reason };
    }
    const swap = it.req && it.req.swap;
    const state = !accept ? 'declined' : swap ? 'taken' : 'accepted';
    const p = { state, answeredAt: now, answeredBy: by, owner: accept ? by : null, seen: { [by]: (it.seen && it.seen[by]) || now } };
    if (note) p.thread = (it.thread || []).concat([{ by, at: now, type: 'msg', text: note }]);
    await SN.store.patch('items', it.id, p);
    if (state !== 'taken') await log(by, 'Schichtanfrage ' + (accept ? 'angenommen' : 'abgelehnt') + ': ' + M.name(by) + ' · ' + it.title, now);
    return ok({ item: get(it.id) });
  }
  /** Tausch freigeben (Leitung) */
  async function approveSwap(ref, by, yes, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'shiftreq') return { ok: false, reason: 'Anfrage nicht gefunden.' };
    if (!M.isLead(M.emp(by))) return { ok: false, reason: 'Nur die Leitung kann freigeben.' };
    await SN.store.patch('items', it.id, { state: yes ? 'accepted' : 'declined', approvedBy: by, approvedAt: now });
    await log(by, 'Schichttausch ' + (yes ? 'freigegeben' : 'abgelehnt') + ': ' + it.title + ' (' + M.name(it.from) + ' ↔ ' + M.name(it.owner) + ')', now);
    return ok({ item: get(it.id) });
  }

  /* ---------- Ausfall + Einspringer-Anfrage (S2) ------------------------- */
  /**
   * Ausfall melden: opts {type: sick|late|other, minutes, note, forId}
   * → sofort an die Schichtleitung; bei „krank“ zusätzlich „Wer kann einspringen?“
   *   an passende Kolleg/innen (gleiche Abteilung, nicht abwesend).
   */
  async function reportAbsence(by, opts, now) {
    now = now0(now); opts = opts || {};
    const who = M.emp(opts.forId || by);
    if (!who) return { ok: false, reason: 'Person nicht gefunden.' };
    const type = M.ABSENCE_TYPES[opts.type] ? opts.type : 'sick';
    const dept = M.deptOf(who, now);
    const shift = who.sh || M.currentShift(now) || 'Früh';
    let ids = M.shiftLeads(dept, shift).filter((id) => id !== by);
    if (!ids.length) ids = M.adminOnDuty(now);
    const title = M.ABSENCE_TYPES[type] + ': ' + who.name + (type === 'late' && opts.minutes ? ' (ca. ' + opts.minutes + ' Min)' : '');
    const r = await send({ kind: 'absence', type, title, body: opts.note || '', person: who.id, minutes: opts.minutes || null, dept, shift, u: type === 'sick', to: { type: 'person', ids } }, by, now);
    if (!r.ok) return r;
    let standin = null;
    if (type === 'sick') {
      const w = M.shiftWindow(who, now);
      await SN.store.patch('staff', who.id, { away: { type, at: now, until: w ? w.e : U.startOfDay(now) + U.DAY } });
      const cand = M.staff().filter((e) => e.id !== who.id && e.id !== by && M.level(e) <= 2 && e.role !== 'clean'
        && M.deptOf(e, now) === dept && !M.isAway(e, now)).map((e) => e.id);
      if (cand.length) {
        const c = await call(by, 'standin', { ids: cand, note: who.name + ' fällt aus (' + dept + ', ' + shift + '). Wer kann einspringen?', dept, standinFor: r.item.id }, now);
        if (c.ok) { standin = c.item; await SN.store.patch('items', r.item.id, { standinCall: standin.id }); }
      }
    }
    await log(by, 'Ausfall gemeldet: ' + title, now);
    return ok({ item: get(r.item.id), standin });
  }

  /* ---------- Kudos (S6), Stimmung (S7), Protokoll ----------------------- */
  /** Lob senden (keine Zähler, keine Ranglisten) */
  function kudos(by, toId, text) {
    return post(by, { to: { type: 'person', ids: [toId] }, title: 'Danke!', body: text || '', kudos: true });
  }
  /** Stimmung abgeben (anonym, nur Aggregat je Tag + Schicht): value 1..4 (1 = sehr gut, 4 = schlecht) */
  function vote(value, shift, now) {
    now = now0(now);
    const v = Math.min(4, Math.max(1, Math.round(value)));
    const d = U.fmt.dayKey(now);
    shift = shift || M.currentShift(now) || 'Früh';
    const id = d + '_' + U.slug(shift);
    const cur = SN.store.peek('mood', id);
    const c = Object.assign({ 1: 0, 2: 0, 3: 0, 4: 0 }, (cur && cur.c) || {});
    c[v] += 1; // Hinweis: letzter Schreiber gewinnt; selten, akzeptiert
    return SN.store.patch('mood', id, { d, sh: shift, c }).then(() => ok());
  }
  /** Aggregat für die Filialleitung: null unter 5 Antworten */
  function moodAggregate(day, shift) {
    const doc = SN.store.peek('mood', day + '_' + U.slug(shift));
    if (!doc) return null;
    const n = [1, 2, 3, 4].reduce((s, k) => s + (doc.c[k] || 0), 0);
    if (n < 5) return null;
    return { n, c: Object.assign({}, doc.c), avg: [1, 2, 3, 4].reduce((s, k) => s + k * (doc.c[k] || 0), 0) / n };
  }
  /** Änderungsprotokoll, ein Dokument je Tag (max. 300 Einträge) */
  function log(by, text, now) {
    now = now0(now);
    const id = U.fmt.dayKey(now);
    const cur = SN.store.peek('log', id);
    const entries = ((cur && cur.entries) || []).concat([{ at: now, by, text }]).slice(-300);
    return SN.store.patch('log', id, { d: id, entries });
  }

  /* ---------- Vorlagen (M3) ---------------------------------------------- */
  /** Vorlagen, die heute fällig und noch nicht angelegt sind */
  function dueTemplates(now) {
    now = now0(now);
    const day = U.fmt.dayKey(now);
    const wd = (new Date(now).getDay() + 6) % 7; // 0 = Mo
    return SN.store.list('templates').filter((t) => (!t.days || t.days.includes(wd)) && t.lastRun !== day);
  }
  /** Vorlage heute als Auftrag anlegen (Checklisten mit Uhrzeit eskalieren, wenn nicht abgehakt) */
  async function runTemplate(tpl, by, now) {
    now = now0(now);
    const at = tpl.at ? U.startOfDay(now) + U.fmt.hm(tpl.at) * MIN : now + 60 * MIN;
    const r = await task(by, {
      title: tpl.title, dept: tpl.dept, act: tpl.act, min: tpl.min, u: !!tpl.u, due: at, templateId: tpl.id,
      checklist: (tpl.checklist || []).map((t) => ({ text: t, done: false })), escalate: !!tpl.escalate, proofRequired: !!tpl.proofRequired,
    });
    if (r.ok) await SN.store.patch('templates', tpl.id, { lastRun: U.fmt.dayKey(now) });
    return r;
  }
  /** Checklisten-Punkt abhaken */
  function checkItem(ref, by, index, value) {
    const it = get(ref);
    if (!it || !Array.isArray(it.checklist) || !it.checklist[index]) return fail('Punkt nicht gefunden.');
    const list = it.checklist.map((c, i) => (i === index ? Object.assign({}, c, { done: value !== false, by, at: SN.clock.now() }) : c));
    return SN.store.patch('items', it.id, { checklist: list }).then(() => ok({ item: get(it.id) }));
  }

  /* ---------- Abfragen für Ansichten -------------------------------------- */
  /** Sortierung: Dringendes zuerst, dann früheste Frist, dann neueste */
  const dueOf = (it) => it.due || it.ackDue || Infinity;
  const urgentFirst = (a) => a.slice().sort((x, y) => (y.u ? 1 : 0) - (x.u ? 1 : 0) || (dueOf(x) - dueOf(y)) || (y.createdAt - x.createdAt));
  const INBOX_KINDS = ['report', 'absence', 'call', 'sos', 'handover', 'shiftreq', 'photo'];

  /** Eingang: Vorgänge, die mich betreffen (Empfänger, Eskalationsstufe, Besitzer), offen */
  function inbox(empId) {
    return urgentFirst(items().filter((it) => INBOX_KINDS.includes(it.kind) && !isFinal(it) && it.from !== empId
      && (involved(it).includes(empId))));
  }
  /** Meine Aufträge (offen), dringend zuerst, dann Frist */
  const notFuture = (it) => !it.plannedFor || it.plannedFor <= U.fmt.dayKey(now0());
  const myTasks = (empId) => urgentFirst(items().filter((it) => it.kind === 'task' && it.owner === empId && it.state !== 'done' && notFuture(it)));
  /** Freie Aufträge (optional Abteilung) */
  const freeTasks = (dept) => urgentFirst(items().filter((it) => it.kind === 'task' && !it.owner && !isFinal(it) && notFuture(it) && (!dept || it.dept === dept)));
  /** Erledigte Aufträge einer Person (neueste zuerst) */
  const doneTasks = (empId) => U.sortBy(items().filter((it) => it.kind === 'task' && it.state === 'done' && it.owner === empId), (it) => -(it.doneAt || 0));
  /** Zu quittieren: Pflicht-Infos und Übergaben, die ich noch nicht quittiert habe */
  const toAck = (empId) => urgentFirst(items().filter((it) => (it.kind === 'post' && it.needAck || it.kind === 'handover')
    && !isFinal(it) && isRecipient(it, empId) && !(it.acks || {})[empId]));
  /** Infos/Anweisungen an mich (neueste zuerst) */
  const postsFor = (empId) => U.sortBy(items().filter((it) => it.kind === 'post' && isRecipient(it, empId)), (it) => -it.createdAt);
  /** Von mir gesendet (neueste zuerst) */
  const sentBy = (empId, kind) => U.sortBy(items().filter((it) => it.from === empId && (!kind || it.kind === kind)), (it) => -it.createdAt);
  /** Offene Rufe an mich ohne meine Antwort */
  const openCalls = (empId) => items().filter((it) => it.kind === 'call' && !isFinal(it) && isRecipient(it, empId) && !(it.answers || {})[empId]);
  /** Aktive SOS (nicht abgeschlossen) */
  const activeSos = () => items().filter((it) => it.kind === 'sos' && !isFinal(it));
  /** Kurzbriefing meiner Schicht heute (neuestes) */
  function briefingFor(empId, now) {
    now = now0(now);
    const d = U.fmt.dayKey(now);
    const l = items().filter((it) => it.kind === 'post' && it.briefing && isRecipient(it, empId) && U.fmt.dayKey(it.createdAt) === d);
    return U.sortBy(l, (it) => -it.createdAt)[0] || null;
  }

  /**
   * Brennpunkte für Leitungs-Live (S1): [{type, item?, dept?, level, text}]
   * type: report | post | task | call | sos | dept
   */
  function hotspots(now) {
    now = now0(now);
    const out = [];
    for (const it of items()) {
      if (isFinal(it)) continue;
      const lvl = (it.esc && it.esc.level) || 0;
      if (it.kind === 'sos') out.push({ type: 'sos', item: it, level: 9, text: it.title + ' · ' + waitingOn(it, now) });
      else if ((it.kind === 'report' || it.kind === 'absence') && it.state !== 'taken') out.push({ type: 'report', item: it, level: lvl + (it.u ? 1 : 0), text: (it.u ? 'Dringend: ' : '') + it.title + ' · ' + waitingOn(it, now) });
      else if (it.kind === 'post' && it.needAck && ((it.esc && it.esc.level > 0) || (it.ackDue && now >= it.ackDue)) && ackStats(it).open.length) out.push({ type: 'post', item: it, level: lvl, text: it.title + ' · ' + waitingOn(it, now) });
      else if (it.kind === 'task' && it.u && !it.owner) out.push({ type: 'task', item: it, level: 1, text: 'Dringend: ' + it.title + ' · unbesetzt' });
      else if (it.kind === 'call' && it.need > 0 && !callStatus(it).enough) out.push({ type: 'call', item: it, level: lvl + 1, text: it.title + ' · ' + waitingOn(it, now) });
    }
    if (SN.dist) for (const d of SN.dist.overloaded(now)) out.push({ type: 'dept', dept: d.dept, level: 0, text: d.dept + ' überlastet: ' + U.fmt.dur(d.open) + ' offen, ' + U.fmt.count(d.people, 'Person', 'Personen') + ' da' });
    return U.sortBy(out, (x) => -x.level);
  }

  /** Vorgänge, die gelöscht werden können (abgeschlossen und älter als days Tage) */
  function prunable(days, now) {
    now = now0(now);
    const lim = now - (days || 14) * U.DAY;
    return items().filter((it) => isFinal(it) && (it.doneAt || it.closedAt || it.answeredAt || it.createdAt) < lim).map((it) => it.id);
  }

  /* ==========================================================================
     Chat (M6): ein Dokument je Thread in chats
       {id, type: dm|dept|lead, members?[], dept?, msgs:{msgId: msg}, read:{empId: ts}, last}
       msg = {id, by, at, text, photo?, lang?}
     Nachrichten als Objekt (nicht Array): gleichzeitiges Senden merged ohne Verlust.
     Über 200 Nachrichten wird auf die neuesten 180 verdichtet (put).
     ========================================================================== */
  const CHAT_MAX = 200, CHAT_KEEP = 180;
  const threadId = {
    dm: (a, b) => 'dm~' + [a, b].sort().join('~'),
    dept: (dept) => 'dept~' + U.slug(dept),
    lead: () => 'lead',
  };
  /** Thread-Metadaten aus der ID: {type, members?, dept?} */
  function threadInfo(tid) {
    if (tid === 'lead') return { type: 'lead' };
    if (tid.startsWith('dm~')) return { type: 'dm', members: tid.slice(3).split('~') };
    if (tid.startsWith('dept~')) {
      const slug = tid.slice(5);
      return { type: 'dept', dept: M.DEPTS.find((d) => U.slug(d) === slug) || slug };
    }
    return { type: 'unknown' };
  }
  /** Darf empId diesen Thread lesen/schreiben? */
  function canUseThread(tid, empId) {
    const e = M.emp(empId);
    const info = threadInfo(tid);
    if (!e) return false;
    if (info.type === 'lead') return M.inLeadChannel(e);
    if (info.type === 'dm') return info.members.includes(empId);
    if (info.type === 'dept') return M.isLead(e) || e.dept === info.dept || M.deptOf(e) === info.dept;
    return false;
  }
  /** Titel eines Threads aus Sicht von empId */
  function threadTitle(tid, empId) {
    const info = threadInfo(tid);
    if (info.type === 'lead') return 'Leitung';
    if (info.type === 'dept') return M.deptLabel(info.dept);
    if (info.type === 'dm') return M.name(info.members.find((m) => m !== empId) || empId);
    return tid;
  }
  /** Nachrichten eines Threads, chronologisch */
  function messages(tid) {
    const t = SN.store.peek('chats', tid);
    return t ? U.sortBy(Object.values(t.msgs || {}).filter(Boolean), (m) => m.at) : [];
  }

  /** Nachricht senden: msg {text, photo?, lang?} */
  async function chatSend(tid, by, msg, now) {
    now = now0(now); msg = msg || {};

    });

  SN.comm = {
    // Lesen
    get, isFinal, recipients, isRecipient, involved, currentIds, ackStats, callStatus, satisfied,
    // Kern M1
    send, post, task, report, markSeen, ack, take, start, forward, done, approve, reply, remind, giveBack, toTask,

    // S6, S7, Protokoll, Vorlagen
