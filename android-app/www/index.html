try {
/* ==========================================================================

   --------------------------------------------------------------------------

   Reihenfolge: dringend → Frist. Stufen: 1) gleiche Abteilung + passende Tätigkeit,
   2) gleiche Abteilung, 3) passende Tätigkeit, 4) beliebig. Geringste Auslastung
   gewinnt; außerhalb der eigenen Abteilung = „Hilfe“. In Pause bekommt niemand etwas.
   Pausenregel: bis 6 Std keine, bis 8 Std 30 Min, darüber 45 Min; Erinnerung nach 5,5 Std.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model;
  const MIN = U.MIN, HOUR = U.HOUR;
  const now0 = (n) => (n === undefined ? SN.clock.now() : n);
  const SHARE = 0.8;

  /** Pausenanspruch in Minuten für Arbeitsstunden h */
  const pauseFor = (h) => (h <= 6 ? 0 : h <= 8 ? 30 : 45);

  /** Arbeitsstunden heute (Plan oder Vertragsstunden pro Tag) */
  function hoursOf(e, now) {

    return (e && e.h) || 8;
  }
  /** Pause heute in Minuten (Plan-Angabe hat Vorrang) */
  function pauseOf(e, now) {
    const w = M.shiftWindow(e, now0(now));
    if (w && w.p !== null && w.p !== undefined && SN.store.peek('plans', e.id)) return w.p;
    return pauseFor(hoursOf(e, now));
  }
  /** Limit in Minuten */
  function limitOf(e, now) {

  }

  const openTask = (it) => it.kind === 'task' && it.state !== 'done' && !M.FINAL_STATES.includes(it.state);

  function loadOf(empId, items) {
    return (items || SN.store.list('items')).reduce((s, it) => s + (openTask(it) && it.owner === empId ? (it.min || 0) : 0), 0);
  }
  const freeOf = (e, now) => Math.max(0, limitOf(e, now) - loadOf(e.id));

  function canTake(e, task, now) {
    now = now0(now);
    if (!e) return { ok: false, reason: 'Person nicht gefunden.' };
    const fn = e.name.split(' ')[0];
    if (M.inPause(e)) return { ok: false, reason: fn + ' ist in Pause. In der Pause gibt es keine Aufträge.' };
    if (M.isAway(e, now)) return { ok: false, reason: fn + ' ist heute abwesend.' };
    const lim = limitOf(e, now);
    const ld = loadOf(e.id);

    const all = SN.store.list('items');
    const tasks = SN.comm.urgentFirst(all.filter((it) => openTask(it) && !it.owner && (!opts.dept || it.dept === opts.dept)));
    const people = opts.people || candidates(now);
    const load = {}, lim = {};

      const min = t.min || M.ACT_MIN[t.act] || 20;

      const inDept = (e) => M.deptOf(e, now) === t.dept;

          if (r < rp || (r === rp && load[e.id] < load[pick.id])) pick = e;
        }
        if (pick) break;
      }

  }

  /** Verteilen und speichern → {assigned, rest, assign[]} */
  async function run(by, now, opts) {
    now = now0(now);
    const p = plan(now, opts);
    await Promise.all(p.assign.map((a) => SN.store.patch('items', a.id, {
      owner: a.owner, help: a.help, to: { type: 'person', ids: [a.owner] }, assignedAt: now, assignedBy: by || null,
    })));

  const resultText = (r) => 'Verteilt: ' + r.assigned + (r.rest ? ', passt nicht ins Limit: ' + r.rest : '');

  const takenToday = (e, now) => (e.pu && e.pu.day === U.fmt.dayKey(now) ? e.pu.min || 0 : 0);

  /**
   * Pausenstatus → {state, need, taken, left, over, until, remindAt}

  }
  /** Pause beenden; verbrauchte Minuten werden für heute addiert */
  function endPause(empId, now) {

    if (!e || !e.brk) return Promise.resolve({ ok: false, reason: 'Keine Pause aktiv.' });

      .then(() => ({ ok: true, used }));
  }
  /**
   * Pausenhinweise (ohne Ranking): due = Erinnerung fällig, over = Pause überzogen
   * → {due: [empId], over: [{id, over}]}; optional nur eine Schicht.
   */
  function pauseAlerts(now, shift) {
    now = now0(now);

      if (shift && e.sh !== shift) continue;
      if (!M.onDuty(e, now) && !e.brk) continue;

  }

  /* ---------- Live-Status, Abteilungen, Umsetzen ------------------------- */
  /** Status für Live-Listen → {key: free|work|pause|away|off, text} */
  function status(e, now) {
    now = now0(now);
    if (M.isAway(e, now)) return { key: 'away', text: 'Abwesend' };
    if (e.brk) {
      const s = pauseStatus(e, now);
      return { key: 'pause', text: s.state === 'over' ? 'Pause überzogen um ' + s.over + ' Min' : 'Pause bis ' + U.fmt.time(s.until) };
    }
    if (!M.onDuty(e, now)) return { key: 'off', text: 'Nicht im Dienst' };
    const mine = SN.comm.myTasks(e.id);
    const cur = mine.find((t) => t.state === 'taken') || mine[0];
    if (!cur) return { key: 'free', text: 'Frei, bereit für einen Auftrag' };
    return { key: 'work', text: (cur.u ? 'Dringend: ' : '') + cur.title + (mine.length > 1 ? ' (+' + (mine.length - 1) + ')' : '') };
  }

  /** Auslastung einer Abteilung → {dept, open, cap, people} (Minuten) */

/* ===== src/core/ai.js ===== */
try {
/* ==========================================================================
   SN.ai – Hülle für claude.use('sample') und claude.use('dictation')
   --------------------------------------------------------------------------
   Null-Verhalten: Ist die KI nicht verfügbar oder schlägt ein Aufruf fehl,
   liefern alle Funktionen null (nie eine Ausnahme). Der letzte Fehler steht
   in SN.ai.lastError {code, message} mit deutschem Text für die Oberfläche.
   KI nur auf ausdrückliche Nutzeraktion aufrufen, nie aus Schleifen/Takt.

   wird der Namensraum vorab in init() aufgelöst.
   ========================================================================== */

  'use strict';

  const ERR = {
    not_granted: 'KI wurde nicht erlaubt.',
    sampling_disabled: 'KI ist hier ausgeschaltet.',
    not_declared: 'KI ist für diese Seite nicht freigeschaltet.',
    rate_limited: 'Gerade zu viele KI-Anfragen. Bitte gleich noch einmal.',
    refused: 'Die KI hat die Anfrage abgelehnt.',
    invalid_json: 'Die KI-Antwort war nicht lesbar. Bitte noch einmal versuchen.',
    images_unavailable: 'Bilder können hier nicht an die KI gesendet werden.',
    image_rejected: 'Das Foto wurde nicht angenommen.',
    prompt_too_large: 'Zu viel Text auf einmal.',
    cancelled: 'Abgebrochen.',
    session_expired: 'Sitzung abgelaufen. Bitte Seite neu laden.',
    unavailable: 'KI ist hier nicht verfügbar (nur in Claude).',
    upstream_error: 'KI gerade gestört. Bitte später noch einmal.',
    no_gesture: 'Diktat bitte direkt mit dem Knopf starten.',
    dismissed: 'Diktat wurde nicht erlaubt.',
    stopped: 'Diktat beendet.',
  };
  const errorText = (code) => ERR[code] || ERR.upstream_error;

  async function text(prompt, opts) {

      return r.text;
    } catch (e) { return setErr(e); }
  }
  /** JSON-Antwort oder null (Felder bitte selbst prüfen) */
  async function json(prompt, opts) {
    await init(); opts = opts || {};
    if (!sample) return setErr({ code: 'unavailable' });

    } catch (e) { return setErr(e); }

  async function image(prompt, images, opts) {

  }
  function buildOpts(o) {
    const out = { modelTier: o.tier || 'quick', cache: o.cache === undefined ? false : o.cache };
    if (o.onText) out.onText = o.onText;
    if (o.signal) out.signal = o.signal;
    if (o.images && o.images.length) out.images = o.images;

   * Übersetzen. to = Sprachcode (Standard 'de').
   * → {text, from} oder null (dann Original anzeigen)

  async function translate(src, to) {

      + 'Antworte NUR mit JSON {"text":"Übersetzung","from":"zweistelliger Sprachcode des Originals"}.\n\nText: ' + JSON.stringify(String(src)));
    if (!r || typeof r.text !== 'string') return r === null ? null : setErr({ code: 'invalid_json' });

  const toGerman = (src) => translate(src, 'de');

  /* ---------- Diktat -------------------------------------------------------- */
  const dictation = {
    available: () => !!dict,
    /**
     * Zuhören starten – SYNCHRON im Klick-Handler aufrufen.
     * h = {onPartial(text), onFinal(text), onState(state, reason)} → Promise<boolean>

    start(h, language) {

      if (h.onFinal) offs.push(dict.onFinal((e) => h.onFinal(e.text)));

      }));

        offs.splice(0).forEach((f) => f());

      });

    stop() { return dict ? dict.stop().catch(() => {}) : Promise.resolve(); },
    active() { return !!(dict && dict.active()); },
  };

    LANGS, init, available, text, json, image, translate, toGerman, dictation, errorText,
    get lastError() { return state.lastError; },
  };
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/core/ai.js konnte nicht geladen werden:", e); }

/* ===== src/core/ops.js ===== */
try {
/* ==========================================================================
   SN.ops – Fotobericht, Lieferung (KKP · Paletten · Boxen), Wochenplan
   --------------------------------------------------------------------------
   Fotobericht: Schichtleitung → Filialleitung, laufend über die Schicht.
     Status gesendet → gesehen → beantwortet; ungesehen eskaliert (Frist „photo“).
   Lieferung: Einheiten mit Abteilungs-Mix. Eine KKP enthält oft Ware für
     4–6 Abteilungen → Laufweg. Aufwand je Einheit (Minuten, änderbar):
       Palette 8 · Box 2 · KKP 4 + 3 je Abteilung.
     Personen = Aufwand ÷ Zielzeit (Standard 60 Min), höchstens wer da ist.
     Touren: Einheiten gleichmäßig verteilt (größte zuerst), Abteilungen in
     Laufweg-Reihenfolge der Filiale.
   Wochenplan: erwartete Lieferungen je Tag → Bedarf in Stunden gegen die
     Kapazität der eingeplanten Personen; „Verteilen“ legt Aufträge für den
     Tag an (plannedFor), anteilig nach freier Kapazität, nie über das Limit.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, MIN = U.MIN;
  const now0 = (n) => (n === undefined ? SN.clock.now() : n);

  /* ---------- Fotobericht ------------------------------------------------ */
  const PHOTO_CATS = [
    { key: 'order', label: 'Regal / Ordnung', icon: 'layers' },
    { key: 'goods', label: 'Ware / Lieferung', icon: 'box' },
    { key: 'promo', label: 'Aktion / Werbung', icon: 'tag' },
    { key: 'clean', label: 'Sauberkeit', icon: 'spray' },
    { key: 'defect', label: 'Defekt', icon: 'wrench' },
    { key: 'staff', label: 'Personal', icon: 'users' },
    { key: 'other', label: 'Sonstiges', icon: 'camera' },
  ];
  const PHOTO_CAT = Object.fromEntries(PHOTO_CATS.map((c) => [c.key, c]));
  /** Empfänger: Filialleitung im Dienst, sonst alle; optional Admin vom Dienst */
  function photoTargets(to, now) {
    now = now0(now);
    if (to === 'admin') return [M.adminOnDuty(now)].filter(Boolean);
    const fl = M.staff().filter((e) => e.role === 'fl' || e.role === 'sfl');
    const on = fl.filter((e) => M.onDuty(e, now)).map((e) => e.id);
    return on.length ? on : fl.map((e) => e.id);
  }
  /** opts {cat, dept, body, orig, photos[], u, to: 'fl'|'admin'} */
  function photoReport(by, opts, now) {
    now = now0(now);
    const c = PHOTO_CAT[opts.cat] || PHOTO_CAT.other;
    const ids = photoTargets(opts.to, now).filter((id) => id !== by);
    if (!opts.photos || !opts.photos.length) return Promise.resolve({ ok: false, reason: 'Bitte mindestens ein Foto aufnehmen.' });
    return SN.comm.send({ kind: 'photo', cat: c.key, title: c.label, body: opts.body || '', orig: opts.orig, photos: opts.photos.slice(0, 4), dept: opts.dept, u: !!opts.u, to: { type: 'person', ids: ids.length ? ids : [M.adminOnDuty(now)] } }, by, now);
  }
  /** Schnellantworten der Filialleitung */
  const PHOTO_REPLIES = ['Passt so', 'Bitte nachbessern', 'Danke, gut gemacht', 'Ruf mich kurz an'];

  /* ---------- Lieferung --------------------------------------------------- */
  const UNIT = {
    kkp: { label: 'KKP', long: 'KKP (Kaufland Klapp Pallets)', icon: 'cart' },
    pal: { label: 'Palette', long: 'Paletten', icon: 'pallet' },
    box: { label: 'Box', long: 'Boxen (graue Kisten)', icon: 'box' },
  };
  function effortCfg() {
    const g = (M.settings().goods) || {};
    return { kkp: g.kkp || 4, kkpDept: g.kkpDept || 3, pal: g.pal || 8, box: g.box || 2, target: g.target || 60 };
  }
  const order = (d) => { const i = M.DEPTS.indexOf(d); return i < 0 ? 99 : i; };
  /** Minuten für eine Einheit {type, depts[]} */
  function unitMin(u, cfg) {
    cfg = cfg || effortCfg();
    if (u.type === 'pal') return cfg.pal;
    if (u.type === 'box') return cfg.box;
    return cfg.kkp + cfg.kkpDept * Math.max(1, (u.depts || []).length);
  }
  /**
   * Lieferung planen (ohne Schreiben). units: [{type, depts[]}]
   * → {min, people, available, rounds[{units, depts[], min}], perType{kkp,pal,box}, duration}
   */
  function planDelivery(units, now, opts) {
    now = now0(now); opts = opts || {};
    const cfg = effortCfg();
    const list = units.map((u, i) => Object.assign({ i, min: unitMin(u, cfg) }, u));
    const min = list.reduce((s, u) => s + u.min, 0);
    const available = opts.available !== undefined ? opts.available : SN.dist.candidates(now).length;
    const want = min ? Math.max(1, Math.ceil(min / cfg.target)) : 0;
    const people = available ? Math.min(want, available, list.length) : Math.min(want, list.length);
    const rounds = Array.from({ length: people }, () => ({ units: [], min: 0 }));
    for (const u of list.slice().sort((a, b) => b.min - a.min)) {
      const r = rounds.reduce((best, x) => (x.min < best.min ? x : best), rounds[0]);
      r.units.push(u); r.min += u.min;
    }
    for (const r of rounds) r.depts = U.uniq(r.units.flatMap((u) => u.depts || [])).sort((a, b) => order(a) - order(b));
    const perType = { kkp: 0, pal: 0, box: 0 };
    for (const u of list) perType[u.type] = (perType[u.type] || 0) + 1;
    return { min, want, people, available, rounds, perType, duration: rounds.length ? Math.max(...rounds.map((r) => r.min)) : 0, cfg };
  }
  /** Einheiten aus Zählern: kkp Anzahl mit Ø Abteilungen, Paletten, Boxen (Abteilungen gleichmäßig verteilt) */
  function unitsFromCounts(c, depts) {
    const out = [];
    const pool = depts && depts.length ? depts : M.DEPTS.filter((d) => !['Kasse', 'Info', 'Lager', 'Wareneinnahme', 'Leergut'].includes(d));
    let k = 0;
    const take = (n) => { const r = []; for (let i = 0; i < n; i++) r.push(pool[(k++) % pool.length]); return U.uniq(r); };
    for (let i = 0; i < (c.kkp || 0); i++) out.push({ type: 'kkp', depts: take(Math.max(1, Math.min(6, c.avg || 4))) });
    for (let i = 0; i < (c.pal || 0); i++) out.push({ type: 'pal', depts: take(1) });
    for (let i = 0; i < (c.box || 0); i++) out.push({ type: 'box', depts: take(1) });
    return out;
  }
  const unitLabel = (u) => UNIT[u.type].label + (u.no ? ' ' + u.no : '');
  /** Lieferung anlegen: LKW-Dokument + ein Auftrag je Tour mit Laufweg-Checkliste, dann verteilen */
  async function createDelivery(by, title, units, opts, now) {
    now = now0(now); opts = opts || {};
    units = units.map((u, i) => Object.assign({}, u, { no: i + 1 }));
    const p = planDelivery(units, now);
    if (!p.min) return { ok: false, reason: 'Bitte mindestens eine Einheit eintragen.' };
    const id = U.id('lkw');
    await SN.store.put('trucks', id, { id, title: title || 'Lieferung', at: now, state: 'open', units, min: p.min, people: p.people, pal: p.perType.pal, kkp: p.perType.kkp, box: p.perType.box, by });
    const due = now + (p.duration + 15) * MIN;
    let made = 0;
    for (let r = 0; r < p.rounds.length; r++) {
      const round = p.rounds[r];
      const what = ['kkp', 'pal', 'box'].map((t) => { const n = round.units.filter((u) => u.type === t).length; return n ? n + ' ' + (t === 'pal' ? (n === 1 ? 'Palette' : 'Paletten') : t === 'kkp' ? 'KKP' : (n === 1 ? 'Box' : 'Boxen')) : ''; }).filter(Boolean).join(', ');
      // Checkliste = Laufweg: je Abteilung, welche Einheiten dorthin gehören
      const checklist = round.depts.map((d) => ({ text: d + ' – ' + round.units.filter((u) => (u.depts || []).includes(d)).map(unitLabel).join(', '), done: false }));
      const res = await SN.comm.task(by, {
        title: (title || 'Lieferung') + ': Tour ' + (r + 1) + ' · ' + what, dept: 'Wareneinnahme', act: 'Warenverräumung', min: round.min,
        due, u: !!opts.u, escalate: true, checklist, truckId: id, route: round.depts,
        units: round.units.map((u) => ({ no: u.no, type: u.type, depts: u.depts || [] })), scans: {},
      });
      if (res.ok) made++;
    }
    const d = await SN.dist.run(by, now);
    await SN.comm.log(by, 'Lieferung „' + (title || 'Lieferung') + '“: ' + units.length + ' Einheiten, ' + p.people + ' Touren', now);
    return { ok: true, plan: p, tasks: made, dist: d, truckId: id };
  }

  /* ---------- Etikett-Scan je Einheit (KKP, Palette, Box) -------------------- */
  // Format leicht änderbar: Ziffern und Großbuchstaben, 8–20 Zeichen
  const SCAN_RULE = { re: /^[0-9A-Z]{8,20}$/, text: '8–20 Zeichen, nur Ziffern und Großbuchstaben' };
  /** Alle bereits gescannten Codes der Filiale → {code: {item, no}} */
  function scannedCodes() {
    const out = {};
    for (const it of SN.store.list('items')) for (const [c, v] of Object.entries(it.scans || {})) out[c] = { item: it, no: v.no };
    return out;
  }
  /** Fortschritt einer Tour: {total, done, next} */
  function scanState(it) {
    const units = it.units || [];
    const done = new Set(Object.values(it.scans || {}).map((v) => v.no));
    return { total: units.length, done: done.size, next: units.find((u) => !done.has(u.no)) || null, units, doneNos: done };
  }
  /**
   * Etikett scannen: ordnet den Code der nächsten offenen Einheit zu.
   * Letzte Einheit → Tour erledigt; alle Touren der Lieferung erledigt → Bericht ans System (Protokoll).
   */
  async function scanUnit(ref, by, raw, now) {
    now = now0(now);
    const it = SN.comm.get(ref);
    if (!it || !it.units) return { ok: false, reason: 'Tour nicht gefunden.' };
    const code = String(raw || '').trim().toUpperCase().replace(/\s+/g, '');
    if (!SCAN_RULE.re.test(code)) return { ok: false, reason: 'Etikett ungültig: ' + SCAN_RULE.text + '.' };
    const seen = scannedCodes()[code];
    if (seen) return { ok: false, reason: 'Dieses Etikett wurde schon gescannt (' + seen.item.title.split(':')[0] + ', Einheit ' + seen.no + ').' };
    const st = scanState(it);
    if (!st.next) return { ok: false, reason: 'Alle Einheiten dieser Tour sind schon gescannt.' };
    await SN.store.patch('items', it.id, { scans: { [code]: { no: st.next.no, at: now, by } }, state: 'taken', startedAt: it.startedAt || now });
    const after = scanState(SN.comm.get(it.id));
    let tourDone = false, truckDone = false;
    if (!after.next) {
      await SN.comm.done(it.id, by, {}, now);
      tourDone = true;
      const all = SN.store.list('items').filter((x) => x.truckId && x.truckId === it.truckId);
      if (all.length && all.every((x) => x.state === 'done')) {
        await SN.store.patch('trucks', it.truckId, { state: 'done', doneAt: now });
        await SN.comm.log(by, 'Lieferung vollständig verräumt, Bericht ans System: ' + all.reduce((s, x) => s + (x.units || []).length, 0) + ' Einheiten gescannt', now);
        truckDone = true;
      }
    }
    return { ok: true, code, unit: st.next, left: after.total - after.done, tourDone, truckDone };
  }

  /* ---------- Dienstplan-Scan (Admin) ---------------------------------------- */
  // Namen tolerant abgleichen: Groß-/Kleinschreibung, Akzente, ü/ue, „Nachname, Vorname“
  const norm = (s) => String(s || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ı/g, 'i').replace(/[^a-z ,]/g, ' ').replace(/\s+/g, ' ').trim();
  const words = (s) => { const n = norm(s); const p = n.includes(',') ? n.split(',').reverse().join(' ') : n; return p.split(' ').filter(Boolean).sort().join(' '); };
  /** → {state: 'found'|'missing'|'ambiguous', id?, candidates[]} */
  function matchName(name) {
    const key = words(name);
    if (!key) return { state: 'missing', candidates: [] };
    const all = M.staff();
    const exact = all.filter((e) => words(e.name) === key);
    if (exact.length === 1) return { state: 'found', id: exact[0].id, candidates: exact.map((e) => e.id) };
    const first = key.split(' ');
    const loose = exact.length ? exact : all.filter((e) => { const w = words(e.name).split(' '); return first.every((x) => w.includes(x)); });
    if (loose.length === 1) return { state: 'found', id: loose[0].id, candidates: [loose[0].id] };
    return { state: loose.length ? 'ambiguous' : 'missing', candidates: loose.map((e) => e.id) };
  }
  /** Zeilen [{name, days:[{d, off, s, e, p}]}] → Vorschau mit Zuordnung */
  function rosterPreview(rows) {
    return (rows || []).filter((r) => r && r.name).map((r) => Object.assign({ name: String(r.name), days: r.days || [] }, matchName(r.name)));
  }
  /** Bestätigte Zeilen übernehmen: Wochenplan je Person (plans/<id>) + Protokoll */
  async function applyRoster(by, rows, now) {
    let n = 0;
    for (const r of rows) {
      if (!r.id) continue;
      const days = M.DAYS.map((d) => { const x = (r.days || []).find((y) => y && y.d === d) || { off: true }; return { d, off: !!x.off, s: x.s || '06:00', e: x.e || '14:00', p: x.p == null ? null : +x.p }; });
      await SN.store.put('plans', r.id, { id: r.id, week: U.fmt.dayKey(now0(now)), days, source: 'dienstplan' });
      n++;
    }
    await SN.comm.log(by, 'Dienstplan übernommen: ' + n + ' Personen', now0(now));
    return { ok: true, count: n };
  }

  /* ---------- Ruhezeit (ArbZG § 5: mindestens 11 Stunden zwischen zwei Schichten) ---------- */
  const REST_H = 11;
  /** Beginn/Ende der Schicht von e am Wochentag wd (0 = Mo) in Stunden seit Wochenbeginn, oder null wenn frei */
  function slot(e, wd, shiftName) {
    if (shiftName) { const s = M.SHIFTS[shiftName]; if (!s) return null; return { s: wd * 24 + s.s, e: wd * 24 + s.e }; }
    if (!worksOn(e, wd)) return null;
    const x = shiftOn(e, wd);
    return { s: wd * 24 + x.s, e: wd * 24 + x.e };
  }
  /**
   * Prüft, ob e am Tag `day` (Mo..So) die Schicht `shiftName` (Früh/Spät) übernehmen kann, ohne die Ruhezeit
   * zu unterschreiten – gegen die Schicht am Vortag UND am Folgetag. → {ok, gapH, reason}
   */
  function restCheck(e, day, shiftName) {
    const wd = M.DAYS.indexOf(day);
    if (!e || wd < 0) return { ok: true, gapH: null };
    const mine = slot(e, wd, shiftName);
    if (!mine) return { ok: true, gapH: null };
    const prev = wd > 0 ? slot(e, wd - 1) : null, next = wd < 6 ? slot(e, wd + 1) : null;
    const gaps = [];
    if (prev) gaps.push({ gap: mine.s - prev.e, text: 'am Vortag bis ' + String(prev.e % 24).padStart(2, '0') + ':00' });
    if (next) gaps.push({ gap: next.s - mine.e, text: 'am Folgetag ab ' + String(next.s % 24).padStart(2, '0') + ':00' });
    const worst = gaps.sort((a, b) => a.gap - b.gap)[0];
    if (worst && worst.gap < REST_H) return { ok: false, gapH: worst.gap, reason: 'Ruhezeit zu kurz: nur ' + worst.gap + ' Std zwischen den Schichten (' + worst.text + '), vorgeschrieben sind ' + REST_H + ' Std.' };
    return { ok: true, gapH: worst ? worst.gap : null };
  }

  /* ---------- Werbewechsel (Angebotswoche beginnt montags) -------------------- */
  const PROMO_DEPTS = ['Obst und Gemüse', 'MoPro', 'Backshop und Frischetheke', 'Fertige Gerichte', 'Moon Food Abteilung', 'Trocken sortiment', 'Konserven', 'Getränkeabteilung', 'Alkoholische Getränke', 'Drogerie'];
  const PROMO_STEPS = ['Alte Aktionsware zurückbauen', 'Neue Aktionsfläche aufbauen', 'Preisschilder und Plakate prüfen'];
  /** Je Abteilung ein Auftrag mit Checkliste und Foto-Nachweis (die Leitung gibt frei) */
  async function createPromoChange(by, opts, now) {
    now = now0(now); opts = opts || {};
    const day = U.fmt.dayKey(now);
    const exists = SN.store.list('items').filter((it) => it.promoDay === day);
    if (exists.length && !opts.force) return { ok: false, reason: 'Der Werbewechsel für heute ist schon angelegt (' + exists.length + ' Abteilungen).' };
    const due = opts.due || now + 4 * U.HOUR;
    let made = 0;
    for (const dept of (opts.depts || PROMO_DEPTS)) {
      const r = await SN.comm.task(by, { title: 'Werbewechsel ' + dept, dept, act: 'Aktionsregal aufbauen', due, escalate: true, proofRequired: true, promoDay: day, checklist: PROMO_STEPS.map((text) => ({ text, done: false })) });
      if (r.ok) made++;
    }
    const d = await SN.dist.run(by, now);
    await SN.comm.log(by, 'Werbewechsel angelegt: ' + made + ' Abteilungen', now);
    return { ok: true, made, dist: d };
  }
  /** Fortschritt des Werbewechsels heute: {total, done, approved, open[]} */
  function promoProgress(now) {
    const day = U.fmt.dayKey(now0(now));
    const l = SN.store.list('items').filter((it) => it.promoDay === day);
    return { total: l.length, done: l.filter((it) => it.state === 'done').length, approved: l.filter((it) => it.approved === true).length, open: l.filter((it) => it.state !== 'done').map((it) => it.dept) };
  }

  /* ---------- Wochenplan --------------------------------------------------- */
  const hash = (s) => String(s).split('').reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  /** Arbeitet e am Tag (0 = Mo)? Plan hat Vorrang, sonst Mo–Sa mit einem rollierenden freien Tag. */
  function worksOn(e, wd) {
    const plan = SN.store.peek('plans', e.id);
    if (plan && plan.days && plan.days[wd]) return !plan.days[wd].off;
    if (wd === 6) return false;
    return (hash(e.id) % 6) !== wd;
  }
  /** Tagesschicht von e am Wochentag → {s, e} in Stunden */
  function shiftOn(e, wd) {
    const plan = SN.store.peek('plans', e.id);
    const d = plan && plan.days && plan.days[wd];
    if (d && !d.off) return { s: U.fmt.hm(d.s) / 60, e: U.fmt.hm(d.e) / 60 };
    const sh = M.SHIFTS[e.sh] || M.SHIFTS['Früh'];
    return { s: sh.s, e: Math.min(sh.e, sh.s + (e.h || 8) + (SN.dist.pauseFor(e.h || 8) / 60)) };
  }
  const worker = (e) => e.role === 'emp' || e.role === 'azubi';
  /** Woche ab Montag der Woche von ts → [{key, wd, label, date}] */
  function week(ts) {
    ts = now0(ts);
    const d0 = U.startOfDay(ts) - ((new Date(ts).getDay() + 6) % 7) * U.DAY;
    return M.DAYS.slice(0, 6).map((l, wd) => ({ key: U.fmt.dayKey(d0 + wd * U.DAY + 12 * U.HOUR), wd, label: l, date: d0 + wd * U.DAY }));
  }
  /** Prognose je Tag (Dokument goods/fc-<Tag>) → {kkp, pal, box, avg} */
  function forecast(dayKey) { return SN.store.peek('goods', 'fc-' + dayKey) || null; }
  function setForecast(dayKey, f) { return SN.store.put('goods', 'fc-' + dayKey, Object.assign({ d: dayKey }, f)); }
  /** Tag: Bedarf (Min) aus Prognose + echten Lieferungen, Kapazität (Min) der Eingeplanten */
  function dayLoad(day) {
    const f = forecast(day.key);
    const cfg = effortCfg();
    const fcMin = f ? (f.kkp || 0) * (cfg.kkp + cfg.kkpDept * (f.avg || 4)) + (f.pal || 0) * cfg.pal + (f.box || 0) * cfg.box : 0;
    const realMin = SN.store.list('trucks').filter((t) => U.fmt.dayKey(t.at) === day.key).reduce((s, t) => s + (t.min || 0), 0);
    const staff = M.staff().filter((e) => worker(e) && worksOn(e, day.wd));
    const cap = staff.reduce((s, e) => s + SN.dist.limitOf(e), 0);
    const planned = SN.store.list('items').filter((it) => it.kind === 'task' && it.plannedFor === day.key).reduce((s, it) => s + (it.min || 0), 0);
    const need = Math.max(fcMin, realMin);
    return { day, need, cap, staff, planned, pct: cap ? Math.round(need / cap * 100) : (need ? 999 : 0), forecast: f };
  }
  /** Aufträge für einen Tag anlegen und anteilig verteilen (nie über das Limit) */
  async function distributeDay(by, day, now) {
    now = now0(now);
    const L = dayLoad(day);
    const open = Math.max(0, L.need - L.planned);
    if (!open) return { ok: false, reason: 'Für diesen Tag ist schon alles verteilt.' };
    const f = L.forecast || {};
    const depts = M.DEPTS.filter((d) => !['Kasse', 'Info', 'Lager', 'Wareneinnahme', 'Leergut'].includes(d));
    const load = {};
    for (const e of L.staff) load[e.id] = SN.store.list('items').filter((it) => it.kind === 'task' && it.owner === e.id && it.plannedFor === day.key).reduce((s, it) => s + (it.min || 0), 0);
    let rest = open, made = 0, n = 0;
    const chunk = 45;
    while (rest > 0) {
      const min = Math.min(chunk, rest);
      // Person mit der meisten freien Kapazität, passende Abteilung bevorzugt
      const cand = L.staff.filter((e) => load[e.id] + min <= SN.dist.limitOf(e));
      if (!cand.length) break;
      const e = cand.reduce((b, x) => (SN.dist.limitOf(x) - load[x.id] > SN.dist.limitOf(b) - load[b.id] ? x : b), cand[0]);
      const dept = depts.includes(e.dept) ? e.dept : depts[n % depts.length];
      const sh = shiftOn(e, day.wd);
      const res = await SN.comm.send({
        kind: 'task', title: 'Warenverräumung ' + (f.kkp ? '(KKP-Ware) ' : '') + '– ' + dept, dept, act: 'Warenverräumung', min,
        owner: e.id, to: { type: 'person', ids: [e.id] }, plannedFor: day.key, due: day.date + sh.e * U.HOUR, escalate: false, planned: true,
      }, by, now);
      if (!res.ok) break;
      load[e.id] += min; rest -= min; made++; n++;
    }
    await SN.comm.log(by, 'Wochenplan ' + day.label + ' ' + day.key + ': ' + made + ' Aufträge verteilt', now);
    return { ok: true, made, rest };
  }

  SN.ops = {
    PHOTO_CATS, PHOTO_CAT, PHOTO_REPLIES, photoTargets, photoReport,
    UNIT, effortCfg, unitMin, planDelivery, unitsFromCounts, createDelivery, unitLabel,
    SCAN_RULE, scanState, scanUnit, scannedCodes, matchName, rosterPreview, applyRoster,

      points: [
        { text: 'Rampe und Fluchtweg frei', fix: 'Rampe: Fluchtweg freiräumen', type: 'report', cat: 'safety', dept: 'Wareneinnahme', u: true },
        { text: 'Leere Paletten und KKP geordnet', fix: 'Leere Paletten und KKP ordnen', type: 'task', act: 'Wareneinnahme', dept: 'Wareneinnahme' },
        { text: 'Rampenbereich sauber', fix: 'Rampenbereich reinigen', type: 'report', cat: 'clean', dept: 'Wareneinnahme' },
      ],
    },
  };
  const CHECK_ORDER = ['frische', 'kuehlung', 'kasse', 'leergut', 'rampe'];

  /* ---------- Hilfen ------------------------------------------------------ */
  const allItems = () => SN.store.list('items');
  const notFuture = (it, now) => !it.plannedFor || it.plannedFor <= U.fmt.dayKey(now);
  const openTasks = (now) => allItems().filter((it) => it.kind === 'task' && !C.isFinal(it) && it.state !== 'done' && !it.check && notFuture(it, now));
  const unanswered = (it) => (it.kind === 'report' || it.kind === 'absence') && !C.isFinal(it) && it.state !== 'taken' && !it.lage;
  const hot = (it, now) => !!(it.u || (it.esc && it.esc.level > 0) || (it.ackDue && now >= it.ackDue));
  const names = (ids, max) => { const n = ids.map(M.first); return n.length > (max || 3) ? n.slice(0, max || 3).join(', ') + ' und ' + (n.length - (max || 3)) + ' weitere' : n.join(', '); };
  const inArea = (a, it) => !!((a.depts && a.depts.includes(it.dept)) || (a.cats && it.cat && a.cats.includes(it.cat)));
  const sig = (level, text, extra) => Object.assign({ level, text }, extra);
  const plural = (n, one, many) => U.fmt.count(n, one, many);

  function repSig(list, now) {
    if (!list.length) return null;
    const crit = list.filter((it) => hot(it, now));
    const first = crit[0] || list[0];
    return sig(crit.length ? 'crit' : 'warn',
      plural(list.length, 'Meldung', 'Meldungen') + ' ohne Antwort' + (crit.length ? ', ' + crit.length + ' dringend oder eskaliert' : ''),
      { kind: 'reports', act: 'it-open', label: 'Ansehen', data: { id: first.id }, ids: list.map((i) => i.id) });
  }
  function callSigs(list, now) {
    const out = [];
    for (const it of list) {
      const st = C.callStatus(it);
      const late = (it.esc && it.esc.level > 0) || (it.ackDue && now >= it.ackDue);
      out.push(sig(late ? 'crit' : 'warn', it.title + ': ' + st.yes.length + ' von ' + st.need + ' Zusagen' + (it.dept ? ' (' + it.dept + ')' : ''),
        { kind: 'call', act: 'it-remind', label: 'Nachfassen', data: { id: it.id }, ids: [it.id] }));
    }
    return out;
  }
  const openCalls = () => allItems().filter((it) => it.kind === 'call' && !C.isFinal(it) && it.need > 0 && !C.callStatus(it).enough);

  /** Meldungen, Aufträge und Rufe, die fachlich zu einem Bereich gehören */
  function domainSignals(a, now) {
    const out = [];
    const tasks = openTasks(now).filter((it) => inArea(a, it));
    const late = tasks.filter((it) => it.due && it.due < now);
    if (late.length) out.push(sig('crit', plural(late.length, 'Auftrag', 'Aufträge') + ' überfällig', { kind: 'task', act: 'it-open', label: 'Ansehen', data: { id: late[0].id }, ids: late.map((i) => i.id) }));
    const soon = tasks.filter((it) => it.due && it.due >= now && it.due - now <= LIMITS.soonMin * MIN);
    if (soon.length) out.push(sig('warn', plural(soon.length, 'Auftrag', 'Aufträge') + ' in den nächsten ' + LIMITS.soonMin + ' Min fällig', { kind: 'task', act: 'it-open', label: 'Ansehen', data: { id: soon[0].id }, ids: soon.map((i) => i.id) }));

  /* ---------- Rundgang-Zustand -------------------------------------------- */
  function dueAt(def, now) { return U.startOfDay(now) + U.fmt.hm(def.at[M.currentShift(now)] || '23:59') * MIN; }
  /** → {key, label, state: idle|open|due|running|done, dueAt, run, misses, doneAt} */

      const soon = tasks.filter((it) => it.due && it.due >= now && it.due - now <= LIMITS.soonMin * MIN);
      if (soon.length) out.push(sig('warn', plural(soon.length, 'Auftrag', 'Aufträge') + ' bald fällig', { kind: 'task', ids: soon.map((i) => i.id) }));

        if (ph.length) out.push(sig('warn', plural(ph.length, 'Fotobericht', 'Fotoberichte') + ' noch ungesehen', { kind: 'photo', act: 'cp-go', label: 'Ansehen', data: { tab: 'photo' }, ids: ph.map((i) => i.id) }));

      const pa = D.pauseAlerts(now);
      if (pa.over.length) out.push(sig('warn', 'Pause überzogen: ' + names(pa.over.map((x) => x.id)) + ' – kurz nachfragen', { kind: 'pause', act: 'p-chat', label: 'Nachfragen', data: { id: pa.over[0].id }, ids: pa.over.map((x) => x.id) }));
      if (pa.due.length) out.push(sig('warn', plural(pa.due.length, 'Person sollte', 'Personen sollten') + ' jetzt Pause machen: ' + names(pa.due), { kind: 'pause', ids: pa.due }));

      if (bes.expected && bes.ratio < LIMITS.staffWarn) out.push(sig(bes.ratio < LIMITS.staffCrit ? 'crit' : 'warn', 'Besetzung ' + bes.present + ' von ' + bes.expected + ' laut Plan', { kind: 'staffing' }));

    }

  /** Besetzung der laufenden Schicht gegen Soll (Mitarbeitende und Azubis laut Schicht) */
  function staffing(now) {
    now = now0(now);
    const shift = M.currentShift(now);
    const plan = M.staff().filter((e) => (e.role === 'emp' || e.role === 'azubi') && e.sh === shift && M.shiftWindow(e, now));
    const present = plan.filter((e) => M.onDuty(e, now));
    return { shift, expected: plan.length, present: present.length, away: plan.filter((e) => M.isAway(e, now)).length, ratio: plan.length ? present.length / plan.length : 1 };
  }

  /** Ampel aller Bereiche → {areas[], counts{ok,warn,crit}, worst} */
  function ampel(now, opts) {
    now = now0(now); opts = opts || {};
    const areas = AREAS.map((a) => {
      const signals = areaSignals(a, now, opts.me);
      const status = worst(signals.map((s) => s.level));
      return { key: a.key, label: a.label, icon: a.icon, status, word: WORD[status], statusIcon: STATUS_ICON[status], reason: signals[0] ? signals[0].text : 'Alles ruhig', signals };
    });
    const counts = { ok: 0, warn: 0, crit: 0 };
    areas.forEach((a) => { counts[a.status]++; });

  /* ---------- Als Nächstes -------------------------------------------------- */

  function next(me, now, max, amp) {

      const base = escd ? 900 + it.esc.level : it.u ? 800 : 450;
      const age = Math.min(30, Math.round((now - it.createdAt) / MIN)) / 10;
      const a = it.kind === 'call' ? { act: 'call-yes', label: 'Ich komme' } : it.kind === 'handover' ? { act: 'it-ack', label: 'Erhalten' }
        : it.kind === 'shiftreq' ? { act: 'it-open', label: 'Ansehen' } : { act: 'it-take', label: 'Übernehmen' };
      add(Object.assign({ key: 'in-' + it.id, score: base + age, level: escd || it.u ? 'crit' : 'warn', icon: escd ? 'escalate' : it.u ? 'flame' : 'inbox',
        title: (escd ? 'Eskaliert: ' : it.u ? 'Dringend: ' : '') + it.title, sub: C.waitingOn(it, now) || M.name(it.from), data: { id: it.id } }, a));

    for (const it of openCalls()) {

      add({ key: 'call-' + it.id, score: 700, level: 'warn', icon: 'bell', title: it.title + ': noch keine Zusage', sub: st.yes.length + ' von ' + st.need + ' Zusagen · ' + U.fmt.ago(it.createdAt), act: 'it-remind', label: 'Nachfassen', data: { id: it.id } });
    }
    // 4. Fristen: überfälligster Auftrag
    const late = U.sortBy(openTasks(now).filter((it) => it.due && it.due < now + LIMITS.soonMin * MIN), (it) => it.due);
    if (late.length) {
      const t = late[0], over = t.due < now;
      add({ key: 'task-' + t.id, score: (over ? 600 : 520) + (t.u ? 50 : 0), level: over ? 'crit' : 'warn', icon: 'clock', title: (over ? 'Überfällig: ' : 'Bald fällig: ') + t.title,

    }

    const ps = D.pauseStatus(me, now);
    if (ps.state === 'due') add({ key: 'my-pause', score: 650, icon: 'coffee', title: 'Deine Pause ist fällig', sub: 'Seit 5,5 Std im Dienst', act: 'pause-start', label: 'Pause starten' });
    if (ps.state === 'over') add({ key: 'my-pause-over', score: 650, icon: 'coffee', title: 'Deine Pause ist abgelaufen', sub: 'Überzogen um ' + ps.over + ' Min', act: 'pause-end', label: 'Beenden' });
    const pa = D.pauseAlerts(now);
    const over = pa.over.filter((x) => x.id !== me.id);
    if (over.length) add({ key: 'pause-over', score: 560, icon: 'coffee', title: 'Pause überzogen: ' + names(over.map((x) => x.id)), sub: 'Kurz nachfragen, vielleicht ist etwas passiert', act: 'p-chat', label: 'Nachfragen', data: { id: over[0].id } });

    // 6. Lieferung ohne Tour
    const truck = amp.areas.find((a) => a.key === 'goods').signals.find((s) => s.kind === 'truck' && s.act);
    if (truck && /ohne Tour/.test(truck.text)) add({ key: 'truck', score: truck.level === 'crit' ? 580 : 380, level: truck.level, icon: 'truck', title: truck.text, sub: 'Ohne Tour wird nichts verräumt', act: truck.act, label: truck.label, data: truck.data });
    // 7. Rundgänge

    // Doppelte Schlüssel entfernen, sortieren

    return U.sortBy(out, (o) => -o.score).filter((o) => (seen.has(o.key) ? false : seen.add(o.key))).slice(0, max);

      kind: 'report', cat: c.key, title: c.label, body: opts.body || '', u: !!opts.u, up: true,

  /* ---------- Rundgänge: starten, abhaken, abschließen ----------------------- */
  /** Rundgang starten oder den laufenden dieser Schicht fortsetzen (ein Auftrag, Besitzerin = Schichtleitung) */
  async function startCheck(key, by, now) {

    const shift = M.currentShift(now) || (M.emp(by) || {}).sh || 'Früh';
    return C.send({
      kind: 'task', check: key, chkDay: U.fmt.dayKey(now), chkShift: shift, title: 'Rundgang: ' + def.label, dept: def.dept, act: 'Sonstiges', min: 0,

  /* ---------- Mein Team ------------------------------------------------------ */
  /** Zuständigkeitsbereich: Schichtleitung = scope, Teamleitung = Abteilungsgruppe */
  function scopeOf(me) {
    if (M.isAdmin(me)) return null;

    return { counts, rows, scope };
  }
  /** Ein-Tap-Ruf an eine Person: „Kurz zu <Name> kommen“, Eskalation über die Rufkette */
  function callPerson(by, toId, note, now) {
    now = now0(now);
    const e = M.emp(toId);
    if (!e) return fail('Person nicht gefunden.');
    if (M.inPause(e)) return fail(M.first(toId) + ' ist in Pause.');
    if (!M.onDuty(e, now)) return fail(M.first(toId) + ' ist nicht im Dienst.');
    return C.send({ kind: 'call', type: 'meeting', title: 'Kurz zu ' + M.first(by) + ' kommen', body: note || '', u: false, need: 1, answers: {}, personal: true, dept: M.deptOf(e, now), to: { type: 'person', ids: [toId] } }, by, now);
  }

  /* ---------- Ruhiger Modus -------------------------------------------------- */
  const qMem = {};
  const quiet = {
    /** Zustand {since, until} oder null (abgelaufen = aus) */
    get(empId, now) {
      now = now0(now);
      let s = qMem[empId];
      if (s === undefined) { s = U.ls.get('quiet.' + empId, null); qMem[empId] = s; }
      return s && s.until > now ? s : null;
    },
    isOn(empId, now) { return !!quiet.get(empId, now); },
    /** An bis Schichtende (sonst 4 Std), aus = null */
    set(empId, on, now) {
      now = now0(now);
      let s = null;
      if (on) { const w = M.shiftWindow(M.emp(empId), now); s = { since: now, until: w && w.e > now ? w.e : now + 4 * U.HOUR }; }
      qMem[empId] = s;
      U.ls.set('quiet.' + empId, s);
      return s;
    },
    /** Still Gesammeltes seit Beginn: {chat, items} */
    collected(me, now) {
      now = now0(now);
      const s = quiet.get(me.id, now);
      if (!s) return { chat: 0, items: 0 };
      const items = C.inbox(me.id).filter((it) => it.createdAt >= s.since && it.kind !== 'sos' && !(it.esc && it.esc.level > 0 && C.currentIds(it).includes(me.id))).length;

  SN.lead = {
    LV, WORD, STATUS_ICON, LIMITS, AREAS, AREA, CHECKS, CHECK_ORDER, LAGE,
    ampel, next, staffing, handoverState, checkStatus, dueChecks,
    upTargets, sendLage, lastLage, reportUp,

  function awayIn(e, s, en, now) {

      out.push('<div class="sn-alert sn-alert--warn" role="alert"><span class="sn-alert__icon">' + icon((M.CALL[it.type] || {}).icon || 'bell') + '</span>'
        + '<p class="sn-alert__title">' + esc(it.title) + '</p>'
        + '<p class="sn-alert__text">' + esc(M.name(it.from)) + ' · ' + esc(U.fmt.ago(it.createdAt)) + (it.body ? ' · ' + esc(it.body) : '') + '</p>'
        + '<div class="sn-alert__actions"><button class="sn-btn sn-btn--primary" data-act="call-yes" data-id="' + it.id + '">' + icon('run') + 'Ich komme</button>'
        + '<button class="sn-btn sn-btn--secondary" data-act="call-no" data-id="' + it.id + '">Kann nicht</button></div></div>');
    }
    // Eskaliert an mich (ich bin in der aktuellen Stufe und nicht ursprünglicher Empfänger)
    const escd = C.inbox(me.id).filter((it) => it.esc && it.esc.level > 0 && C.currentIds(it).includes(me.id) && it.kind !== 'sos' && it.kind !== 'call');
    if (escd.length) {
      const it = escd[0];
      out.push('<div class="sn-alert sn-alert--escalation" role="alert"><span class="sn-alert__icon">' + icon('escalate') + '</span>'
        + '<p class="sn-alert__title">Eskaliert an dich: ' + esc(it.title) + (escd.length > 1 ? ' (+' + (escd.length - 1) + ')' : '') + '</p>'
        + '<p class="sn-alert__text">' + esc(C.waitingOn(it, now)) + '</p>'
        + '<div class="sn-alert__actions"><button class="sn-btn sn-btn--on-accent" data-act="it-take" data-id="' + it.id + '">Übernehmen</button>'
        + '<button class="sn-btn sn-btn--on-accent" data-act="it-open" data-id="' + it.id + '">Ansehen</button></div></div>');
    }
    // neue Chatnachricht (nicht im Chat-Tab)
    if (st.tab !== 'chat' && !isQuiet()) {
      const t = C.threadsFor(me.id).find((x) => x.unread && (C.messages(x.id).slice(-1)[0] || {}).by !== me.id);
      const lm = t ? C.messages(t.id).slice(-1)[0] : null;
      if (t && lm) {
        t.preview = M.first(lm.by) + ': ' + (lm.text || 'Foto');
        out.push('<button type="button" class="sn-alert sn-alert--info sn-alert--tap" data-act="chat-open" data-tid="' + esc(t.id) + '"><span class="sn-alert__icon">' + icon('chat') + '</span>'
          + '<p class="sn-alert__title">Neue Nachricht · ' + esc(t.title) + '</p><p class="sn-alert__text">' + esc(t.preview || 'Antippen zum Lesen') + '</p></button>');
      }
    }
    return out.slice(0, 3).join('');
  }

  function snapshotInputs(root) {
    const snap = {};
    root.querySelectorAll('input[id],select[id],textarea[id]').forEach((x) => {
      if (x.type === 'file') return;
      snap[x.id] = x.type === 'checkbox' || x.type === 'radio' ? x.checked : x.value;
    });
    return snap;
  }
  function restoreInputs(root, snap) {
    for (const id of Object.keys(snap)) {
      const x = root.querySelector('#' + CSS.escape(id));
      if (!x) continue;
      if (x.type === 'checkbox' || x.type === 'radio') x.checked = snap[id];
      else if (x.tagName !== 'SELECT' || Array.from(x.options).some((o) => o.value === snap[id])) x.value = snap[id];
    }
  }

  let renderQueued = false;
  function render(keep) {
    if (!st.started) return;
    const me = SN.session.me();
    const now = SN.clock.now();
    const v = byId('view');
    header(me, now);
    byId('sos').hidden = !me;
    if (!me) { nav(null); fab(null); byId('banners').innerHTML = ''; v.innerHTML = loginView(); if (!keep) enter(v); return; }
    const list = navFor(me);
    // Zugriff: Gruppe passt (auch ohne eigenen Platz in der Navigation)
    const cur = views[st.tab];
    if (!cur || !cur.groups.includes(M.group(me)) || (cur.allow && !cur.allow(me))) st.tab = list[0] ? list[0].tab : null;
    const view = views[st.tab];
    nav(me);
    fab(me, view);
    byId('banners').innerHTML = banners(me, now);
    const top = v.scrollTop;
    const snap = keep ? snapshotInputs(v) : {};
    const active = keep && document.activeElement && v.contains(document.activeElement) ? document.activeElement.id : null;
    let html = '';
    try { html = view ? view.render({ me, now, params: st.params, sub: st.sub, ui: SN.ui }) : '<p>Keine Ansicht.</p>'; } catch (e) {
      console.error('[SN.ui] Ansicht fehlgeschlagen', st.tab, e);
      html = '<div class="sn-alert sn-alert--warn sn-alert--card" role="alert"><p class="sn-alert__title">Diese Ansicht hat einen Fehler.</p><p class="sn-alert__text">Bitte einen anderen Bereich wählen.</p></div>';
    }
    v.innerHTML = html;
    segments(v);
    if (keep) {
      v.classList.remove('is-enter');
      restoreInputs(v, snap);
      v.scrollTop = top;
      if (active) { const a = byId(active); if (a) a.focus({ preventScroll: true }); }
    }
    if (!keep) enter(v);
    if (view && view.mount) try { view.mount(v, { me, now }); } catch (e) { console.error(e); }
  }
  /** Rendern nach Datenänderung: gebündelt; während jemand tippt, erst nach Verlassen des Feldes */
  function requestRender() {
    if (renderQueued) return;
    renderQueued = true;
    setTimeout(() => {
      renderQueued = false;
      const a = document.activeElement;
      const typing = a && byId('view').contains(a) && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type !== 'checkbox' && a.type !== 'radio'));
      if (typing) { st.dirty = true; return; }
      render(true);
    }, 30);
  }

  /* ---------- Toast, Sheet --------------------------------------------------- */
  function toast(text, kind, ic) {
    const r = byId('toast');
    const el = document.createElement('div');
    el.className = 'sn-toast sn-toast--' + (kind || 'ok');
    el.setAttribute('role', 'status');
    el.innerHTML = '<span class="sn-toast__icon">' + icon(ic || (kind === 'warn' ? 'alert' : 'check')) + '</span><span class="sn-toast__text">' + esc(text) + '</span>';
    r.appendChild(el);
    U.vibrate(12);
    setTimeout(() => { el.classList.add('is-leaving'); setTimeout(() => el.remove(), 300); }, kind === 'warn' ? 4500 : 2800);
  }
  /** Ergebnis einer Kernfunktion anzeigen: {ok, reason} */
  function result(r, okText) {
    if (r && r.ok === false) { toast(r.reason || 'Hat nicht geklappt.', 'warn'); return false; }
    if (okText) toast(okText);
    return true;
  }

  let sheetOpen = false;
  function sheet(title, body, foot) {
    const p = byId('sheet-panel');
    p.innerHTML = '<div class="sn-sheet__handle"></div><div class="sn-sheet__head"><h2 class="sn-sheet__title" id="sheet-title">' + esc(title) + '</h2>'
      + '<button type="button" class="sn-btn sn-btn--ghost" data-act="sheet-close">Schließen</button></div>'
      + '<div class="sn-sheet__body">' + body + '</div>' + (foot ? '<div class="sn-sheet__foot">' + foot + '</div>' : '');
    const s = byId('sheet');
    s.classList.add('is-open'); s.setAttribute('aria-hidden', 'false');
    sheetOpen = true;
    setTimeout(() => { const f = p.querySelector('[autofocus]') || p.querySelector('input,textarea,select,button.sn-btn--primary'); if (f) f.focus(); }, 60);
    return p;
  }
  function closeSheet() {
    const s = byId('sheet');
    if (!s || !sheetOpen) return;
    s.classList.remove('is-open'); s.setAttribute('aria-hidden', 'true');
    sheetOpen = false;
    if (st.dirty) { st.dirty = false; render(true); }
  }
  const sheetVal = (id) => { const x = byId(id); return x ? (x.type === 'checkbox' ? x.checked : x.value) : null; };

  /* ---------- Login ------------------------------------------------------------ */
  function loginView() {
    const staff = M.staff();
    if (!staff.length) return setupView();
    const groups = { admin: [], lead: [], emp: [], clean: [] };
    for (const e of U.sortBy(staff, (x) => x.name)) groups[M.group(e)].push(e);
    const opt = (e) => '<option value="' + esc(e.id) + '">' + esc(e.name + ' · ' + M.role(e).label + (e.dept && M.group(e) !== 'admin' ? ' · ' + e.dept : '')) + '</option>';
    const demo = SN.store.mode === 'demo';
    const quick = demo ? [['emp', 'Anna Müller'], ['lead', 'Julia Becker'], ['admin', 'Mustafa'], ['admin', 'Sabine Krämer']]
      .map(([g, n]) => staff.find((e) => e.name === n)).filter(Boolean) : [];
    return '<section class="sn-login sn-glass">'
      + '<h2 class="sn-section-title">Anmelden</h2>'
      + '<p class="sn-muted">Jede Person hat ein eigenes Konto. ' + (demo ? 'Demo: PIN 1234 für alle.' : 'PIN von der Filialleitung.') + '</p>'
      + '<div class="sn-field"><label class="sn-label" for="lg-u">Konto</label><select class="sn-select" id="lg-u">'
      + ['admin', 'lead', 'emp', 'clean'].map((g) => groups[g].length ? '<optgroup label="' + esc(M.ROLE_GROUPS[g]) + '">' + groups[g].map(opt).join('') + '</optgroup>' : '').join('')
      + '</select></div>'
      + '<div class="sn-field"><label class="sn-label" for="lg-p">PIN</label><input class="sn-input" id="lg-p" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"></div>'
      + '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" data-act="login">Anmelden</button>'
      + (quick.length ? '<h3 class="sn-section-title">Demo: schnell ausprobieren als</h3><div class="sn-quick">' + quick.map((e) => '<button type="button" class="sn-btn sn-btn--secondary" data-act="login-quick" data-id="' + e.id + '">' + esc(e.name) + '<small>' + esc(M.role(e).label) + '</small></button>').join('') + '</div>' : '')
      + '<p class="sn-muted sn-small">' + (demo ? 'Demo-Modus: Daten nur in diesem Fenster.' : 'Filialbetrieb: alle mit Zugriff sehen dieselben Daten live.') + '</p>'
      + '</section>';
  }
  function setupView() {
    return '<section class="sn-login sn-glass"><h2 class="sn-section-title">Filialbetrieb einrichten</h2>'
      + '<p>Die gemeinsame Datenbank ist noch leer. Lege das erste Admin-Konto an. Weitere Mitarbeitende fügst du danach unter „Mehr → Team“ hinzu.</p>'
      + '<div class="sn-field"><label class="sn-label" for="su-n">Dein Name</label><input class="sn-input" id="su-n" autocomplete="name"></div>'
      + '<div class="sn-field"><label class="sn-label" for="su-r">Rolle</label><select class="sn-select" id="su-r"><option value="admin">Admin (Disponent)</option><option value="fl">Filialleiter/in</option><option value="sfl">Stellv. Filialleiter/in</option></select></div>'
      + '<div class="sn-field"><label class="sn-label" for="su-p">Eigene PIN (4–6 Ziffern)</label><input class="sn-input" id="su-p" inputmode="numeric" maxlength="6"></div>'
      + '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" data-act="setup">Konto anlegen</button></section>';
  }
  on('login', async () => {
    const r = await SN.session.login(sheetVal('lg-u'), sheetVal('lg-p'));
    if (!r.ok) return toast(r.reason, 'warn');
  });
  on('login-quick', (el) => { SN.session.login(el.dataset.id, SN.session.DEMO_PIN); });
  on('logout', () => { SN.session.logout(); });
  on('setup', async () => {
    const n = String(sheetVal('su-n') || '').trim(), p = String(sheetVal('su-p') || '').trim();
    if (n.length < 2) return toast('Bitte einen Namen eingeben.', 'warn');
    if (!/^\d{4,6}$/.test(p)) return toast('PIN: 4 bis 6 Ziffern.', 'warn');
    const id = U.id('e');
    const r = await SN.store.put('staff', id, { id, name: n, role: sheetVal('su-r'), dept: 'Info', sh: 'Früh', h: 8, lang: 'de', acts: [], pinHash: U.pinHash(id, p), aiAssist: false });
    if (!r.ok) return toast(SN.store.ERROR_TEXT[r.code] || 'Nicht gespeichert.', 'warn');
    await SN.store.put('settings', 'main', { adminOnDuty: id, deadlines: {}, callNeed: {} });
    await SN.session.login(id, p);
  });

  /* ---------- Ereignisse --------------------------------------------------------- */
  function onClick(ev) {
    const g = ev.target.closest('[data-go]');
    if (g) { ev.preventDefault(); go(g.dataset.go, Object.assign({}, g.dataset)); return; }
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = acts[el.dataset.act];
    if (!fn) return;
    ev.preventDefault();
    Promise.resolve().then(() => fn(el, ev)).catch((e) => { console.error('[SN.ui] Aktion', el.dataset.act, e); toast('Das hat nicht geklappt.', 'warn'); });
  }
  on('sheet-close', () => closeSheet());

  /* ---------- Takt: Eskalation, Erinnerungen, Vorlagen ------------------------------ */
  async function tick() {
    const me = SN.session.me();
    if (!me) return;
    const now = SN.clock.now();
    try { await SN.comm.escalateDue(now); } catch (e) { console.warn(e); }
    // Pausen-Erinnerung (einmal pro Schicht)
    try {
      const ps = SN.dist.pauseStatus(me, now);
      const key = 'p-' + me.id + '-' + U.fmt.dayKey(now);
      if (ps.state === 'due' && !st.notified[key] && !isQuiet()) { st.notified[key] = 1; toast('Seit 5,5 Std im Dienst: Bitte jetzt Pause nehmen.', 'warn', 'coffee'); }
      if (ps.state === 'over' && !st.notified[key + 'o'] && !isQuiet()) { st.notified[key + 'o'] = 1; toast('Deine Pause ist abgelaufen.', 'warn', 'coffee'); }
    } catch (e) { /* ohne Plan egal */ }
    // Vorlagen des Tages legt der Admin vom Dienst an
    if (M.isAdmin(me) && M.adminOnDuty(now) === me.id) {
      for (const tpl of SN.comm.dueTemplates(now)) { try { await SN.comm.runTemplate(tpl, me.id, now); } catch (e) { console.warn(e); } }
    }
    requestRender();
  }

  /* ---------- Start ------------------------------------------------------------------- */
  async function start(info) {
    st.started = true;
    document.addEventListener('click', onClick);
    document.addEventListener('change', (ev) => {
      const el = ev.target.closest('[data-change]');
      if (el && changes[el.dataset.change]) Promise.resolve().then(() => changes[el.dataset.change](el, ev)).catch((e) => console.error(e));
    });
    document.addEventListener('focusout', () => setTimeout(() => {
      const a = document.activeElement;
      if (st.dirty && !(a && byId('view').contains(a) && /INPUT|TEXTAREA/.test(a.tagName))) { st.dirty = false; render(true); }
    }, 0));
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') closeSheet();
      if (ev.key === 'Enter' && ev.target.id === 'lg-p') { ev.preventDefault(); acts.login(); }
      if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.enter) { ev.preventDefault(); const b = $('[data-act="' + ev.target.dataset.enter + '"]'); if (b) b.click(); }
    });
    for (const c of SN.store.COLS) SN.store.sub(c, requestRender);
    SN.session.onChange((id) => {
      st.tab = null; st.params = {}; st.sub = {};
      if (id) toast('Willkommen, ' + M.first(id));
      render(false);
      if (id) tick();
    });
    const last = info && info.mode === 'db' ? await SN.session.last() : null;
    if (last && SN.store.mode === 'db') {
      // gleiches claude.ai-Konto: Konto vorauswählen, PIN bleibt nötig
      setTimeout(() => { const s = byId('lg-u'); if (s) s.value = last; }, 0);
    }
    render(false);
    setInterval(tick, 15000);
    setInterval(() => { if (!sheetOpen) requestRender(); }, 30000);
  }

  SN.ui = {
    registerView, on, onChange, go, render, requestRender, sub, toast, result, sheet, closeSheet, sheetVal, icon, urgent, dept, iconActive,
    get tab() { return st.tab; }, get params() { return st.params; }, views, start, tick,
  };
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/ui/shell.js konnte nicht geladen werden:", e); }

/* ===== src/views/00-items.js ===== */
try {

   Gemeinsame Bausteine für alle Ansichten (SN.parts) und Aktionen auf Vorgängen

(function (SN) {

  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, esc = U.esc, icon = ui.icon;

  const empty = (title, text, ok) => '<div class="sn-empty' + (ok ? ' sn-empty--ok' : '') + '"><span class="sn-empty__icon">' + icon(ok ? 'check' : 'inbox') + '</span><p class="sn-empty__title">' + esc(title) + '</p>' + (text ? '<p class="sn-empty__text">' + esc(text) + '</p>' : '') + '</div>';

  const initials = (n) => String(n || '?').split(' ').map((x) => x[0]).join('').slice(0, 2).toUpperCase();

  function deadline(ts) {
    if (!ts) return '';

  function receipt(it, me) {

  }
  function body(it, me) {

  function actions(it, me) {

          else a.push(btn('Erledigt', 'it-done', { id: it.id }, 'primary', 'check'));
          a.push(btn('Nachfragen', 'it-ask', { id: it.id }, 'secondary', 'chat'));
          a.push(btn('Zurückgeben', 'it-giveback', { id: it.id }, 'ghost'));
        } else if (!it.owner) {
          a.push(btn('Übernehme ich', 'it-take', { id: it.id }, 'primary', 'check'));
          if (M.isLead(me)) a.push(btn('Zuteilen', 'it-assign', { id: it.id }, 'secondary', 'users'));
        } else if (M.isLead(me)) a.push(btn('Umverteilen', 'it-assign', { id: it.id }, 'ghost', 'users'));
        break;
      case 'report':
      case 'absence':
        if (rec && !mine) {
          if (it.state !== 'taken') a.push(btn('Übernehmen', 'it-take', { id: it.id }, 'primary', 'check'));
          else a.push(btn('Erledigt', 'it-done', { id: it.id }, 'primary', 'check'));
          a.push(btn('Weitergeben', 'it-forward', { id: it.id }, 'secondary', 'forward'));
          if (M.isLead(me) && it.kind === 'report' && !it.taskId) a.push(btn('Auftrag anlegen', 'it-totask', { id: it.id }, 'ghost', 'plus'));
        }
        break;
      case 'call':
        if (rec && !(it.answers || {})[me.id]) { a.push(btn('Ich komme', 'call-yes', { id: it.id }, 'primary', 'run')); a.push(btn('Kann nicht', 'call-no', { id: it.id }, 'secondary')); }
        if (mine || M.isLead(me)) a.push(btn('Schließen', 'it-close', { id: it.id }, 'ghost'));
        break;
      case 'shiftreq':
        if (rec && it.state === 'sent' || rec && it.state === 'seen') { a.push(btn('Annehmen', 'sr-yes', { id: it.id }, 'primary', 'check')); a.push(btn('Ablehnen', 'sr-no', { id: it.id }, 'secondary', 'x')); }
        if (it.swap && it.state === 'taken' && M.isLead(me)) { a.push(btn('Tausch freigeben', 'swap-ok', { id: it.id }, 'primary', 'check')); a.push(btn('Ablehnen', 'swap-no', { id: it.id }, 'ghost')); }
        break;
      case 'sos':
        if (!mine && M.isLead(me) && !(it.answers || {})[me.id]) a.push(btn('Hilfe kommt, ich gehe hin', 'sos-respond', { id: it.id }, 'primary', 'run'));
        break;
      default:
    }
    if (it.kind === 'task' && it.state === 'done' && it.proof && it.approved == null && M.isLead(me)) {
      a.push(btn('Nachweis ok', 'it-approve', { id: it.id, yes: '1' }, 'primary', 'check'));
      a.push(btn('Nachbessern', 'it-approve', { id: it.id, yes: '' }, 'ghost'));
    }
    return a.length ? '<div class="sn-card__actions">' + a.join('') + '</div>' : '';
  }

  /**
   * Karte für einen Vorgang. opts: {compact, showTimeline}
   */
  function itemCard(it, me, now, opts) {
    opts = opts || {};
    const fin = C.isFinal(it);
    // Eskalationsdetails sehen Absender, Leitung und die aktuell Zuständigen – nicht jede Empfängerin einer Info
    const insider = it.from === me.id || M.isLead(me) || it.kind === 'report' || it.kind === 'absence';
    const lvl = insider ? ((it.esc && it.esc.level) || 0) : 0;
    const cls = ['sn-card', it.kind === 'task' ? 'sn-task' : it.kind === 'report' || it.kind === 'absence' ? 'sn-report' : 'sn-message'];
    if (it.u && !fin) cls.push('sn-card--urgent');
    if (lvl > 0 && !fin) cls.push('sn-card--escalated');
    if (fin) cls.push('is-done');
    const cat = it.kind === 'report' ? M.CAT[it.cat] : null;
    const kindLabel = cat ? cat.label : M.KINDS[it.kind] || it.kind;
    const working = it.kind === 'task' && it.state === 'taken';
    const stateLabel = working ? 'In Arbeit' : M.STATES[it.state] || it.state;
    const stateIcon = fin ? 'check' : working ? 'play' : it.state === 'seen' ? 'eye' : it.state === 'sent' ? 'send' : lvlIcon(it);
    const due = it.kind === 'task' ? it.due : it.ackDue;
    const meta = [];
    if (due && !fin) meta.push('<div class="sn-meta__item">' + icon('clock') + '<dt class="sn-sr-only">Frist</dt><dd>' + deadline(due) + '</dd></div>');
    meta.push('<div class="sn-meta__item"><dt>Von</dt><dd>' + esc(it.from === me.id ? 'dir' : M.name(it.from)) + ' · ' + esc(U.fmt.ago(it.createdAt)) + '</dd></div>');
    if (it.dept) meta.push('<div class="sn-meta__item">' + icon('pin') + '<dt class="sn-sr-only">Abteilung</dt><dd>' + esc(it.dept) + '</dd></div>');
    if (it.kind === 'task' && it.min) meta.push('<div class="sn-meta__item"><dt>Dauer</dt><dd>ca. ' + esc(U.fmt.dur(it.min)) + (it.act ? ' · ' + esc(it.act) : '') + '</dd></div>');
    const wait = insider || it.kind === 'task' || it.kind === 'call' ? C.waitingOn(it, now) : '';
    return '<article class="' + cls.join(' ') + '" data-item="' + it.id + '">'
      + (it.u && !fin ? '<div class="sn-card__flag">' + ui.urgent() + (it.needAck && !fin ? ' · Bitte quittieren' : '') + '</div>' : lvl > 0 && !fin ? '<div class="sn-card__flag">' + icon('escalate') + 'Eskaliert · Stufe ' + lvl + '</div>' : '')
      + '<div class="sn-card__head"><h3 class="sn-card__title"><button type="button" class="sn-card__open" data-act="it-open" data-id="' + it.id + '">' + esc(it.title || kindLabel) + '</button></h3>'
      + chip(stateLabel, fin ? 'ok' : it.state === 'taken' ? 'info' : lvl > 0 ? 'escalated' : '', stateIcon) + '</div>'
      + '<p class="sn-card__kind">' + (cat ? icon(cat.icon, 'sn-icon--sm') + ' ' : '') + esc(kindLabel) + (it.to && it.from === me.id ? ' · an ' + esc(M.labelFor(C.recipients(it))) : '') + '</p>'
      + (opts.compact ? '' : body(it, me))
      + (it.photos && it.photos.length && !opts.compact ? '<div class="sn-photos">' + it.photos.slice(0, 4).map((p) => '<img alt="Foto zur Meldung" src="' + esc(p) + '">').join('') + '</div>' : '')
      + (it.checklist && it.checklist.length ? checklist(it, me) : '')
      + '<dl class="sn-meta">' + meta.join('') + '</dl>'
      + (wait && !fin ? '<p class="sn-waiting">' + icon('clock') + esc(wait) + '</p>' : '')
      + (it.kind === 'post' && it.needAck && (it.from === me.id || M.isLead(me)) ? ackbar(it, me) : receipt(it, me))
      + (opts.showTimeline ? steps(it) + timeline(it) : '')
      + (opts.noActions ? '' : actions(it, me))
      + '</article>';
  }
  const lvlIcon = (it) => (it.esc && it.esc.level > 0 ? 'escalate' : 'clock');
  function checklist(it, me) {
    const can = it.owner === me.id || M.isLead(me);
    return '<ul class="sn-checklist">' + it.checklist.map((c, i) => '<li><label class="sn-check"><input type="checkbox" data-change="check-item" data-id="' + it.id + '" data-i="' + i + '"' + (c.done ? ' checked' : '') + (can ? '' : ' disabled') + '>' + esc(c.text) + (c.at ? ' <small>' + esc(c.at) + '</small>' : '') + '</label></li>').join('') + '</ul>';
  }
  function list(items, me, now, emptyHtml, opts) {
    return items.length ? items.map((it) => itemCard(it, me, now, opts)).join('') : (emptyHtml || '');
  }

  /* ---------- Auswahl: Person ------------------------------------------- */
  function personPicker(name, ids, me, now, sel) {
    return '<div class="sn-pick" role="radiogroup">' + ids.map((id) => {
      const e = M.emp(id); if (!e) return '';
      const s = SN.dist.status(e, now);
      return '<label class="sn-choice sn-choice--person"><input type="radio" name="' + name + '" value="' + id + '"' + (sel === id ? ' checked' : '') + '><span><b>' + esc(e.name) + '</b><small>' + esc(M.role(e).label + ' · ' + (M.deptOf(e, now) || '') + ' · ' + s.text) + '</small></span></label>';
    }).join('') + '</div>';
  }
  const picked = (name) => { const x = document.querySelector('input[name="' + name + '"]:checked'); return x ? x.value : null; };

  /* ---------- Aktionen ---------------------------------------------------- */
  const me = () => SN.session.me();
  const now = () => SN.clock.now();
  const R = ui.result;

  ui.on('it-ack', async (el) => R(await C.ack(el.dataset.id, me().id), 'Quittiert – der Absender sieht es sofort'));
  ui.on('it-take', async (el) => { const r = await C.take(el.dataset.id, me().id); if (R(r, 'Übernommen – der Melder sieht es sofort')) ui.closeSheet(); });
  ui.on('it-start', async (el) => R(await C.start(el.dataset.id, me().id), 'Gestartet'));
  ui.on('it-remind', async (el) => { const r = await C.remind(el.dataset.id, me().id); R(r, r.ok ? 'Erinnerung an ' + r.count + ' gesendet' : ''); });
  ui.on('call-yes', async (el) => { const r = await C.answerCall(el.dataset.id, me().id, true); R(r, r.closed ? 'Danke! Genug Zusagen – Ruf geschlossen' : 'Danke – der Rufer sieht deine Zusage'); });
  ui.on('call-no', async (el) => R(await C.answerCall(el.dataset.id, me().id, false), 'Rückmeldung gesendet'));
  ui.on('sos-respond', async (el) => R(await C.sosRespond(el.dataset.id, me().id), 'Der Auslöser sieht: Hilfe kommt'));
  ui.on('it-close', async (el) => { const r = await C.done(el.dataset.id, me().id, {}); if (R(r, 'Abgeschlossen')) ui.closeSheet(); });
  ui.on('it-approve', async (el) => R(await C.approve(el.dataset.id, me().id, !!el.dataset.yes, el.dataset.yes ? '' : 'Bitte nachbessern'), el.dataset.yes ? 'Nachweis freigegeben' : 'Zurück zum Nachbessern'));
  ui.on('sr-yes', async (el) => R(await C.answerShiftReq(el.dataset.id, me().id, true, ''), 'Angenommen'));
  ui.on('sr-no', async (el) => R(await C.answerShiftReq(el.dataset.id, me().id, false, ''), 'Abgelehnt – die Leitung sieht es'));
  ui.on('swap-ok', async (el) => R(await C.approveSwap(el.dataset.id, me().id, true), 'Tausch freigegeben'));
  ui.on('swap-no', async (el) => R(await C.approveSwap(el.dataset.id, me().id, false), 'Tausch abgelehnt'));
  ui.onChange('check-item', async (el) => { await C.checkItem(el.dataset.id, me().id, +el.dataset.i, el.checked); });

  ui.on('it-translate', async (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    el.disabled = true; el.textContent = 'Übersetze …';
    const r = await SN.ai.translate(it.body, me().lang || 'de');
    if (!r) { el.disabled = false; return ui.toast((SN.ai.lastError && SN.ai.lastError.message) || 'Übersetzung nicht verfügbar.', 'warn'); }
    tr[it.id] = r.text; ui.render(true);
  });

  ui.on('it-open', async (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    await C.markSeen(it, me().id);
    const fresh = C.get(it.id);
    let extra = '';
    if (fresh.kind === 'post' && fresh.needAck && (fresh.from === me().id || M.isLead(me()))) {
      const s = C.ackStats(fresh);
      extra = s.open.length ? sec('Noch nicht quittiert', s.open.length) + '<ul class="sn-namelist">' + s.open.map((id) => '<li>' + esc(M.name(id)) + ((fresh.seen || {})[id] ? ' <small>gelesen</small>' : ' <small>nur gesendet</small>') + '</li>').join('') + '</ul>' : '';
    }
    ui.sheet(fresh.title || M.KINDS[fresh.kind], itemCard(fresh, me(), now(), { showTimeline: true }) + extra
      + '<div class="sn-field"><label class="sn-label" for="it-reply">Antwort / Rückfrage</label><textarea class="sn-textarea" id="it-reply" rows="2" placeholder="Kurz schreiben – in jeder Sprache"></textarea></div>',
      btn('Antwort senden', 'it-reply', { id: fresh.id }, 'primary', 'send'));
  });
  ui.on('it-reply', async (el) => {
    const t = String(ui.sheetVal('it-reply') || '').trim();
    if (!t) return ui.toast('Bitte Text eingeben.', 'warn');
    const r = await C.reply(el.dataset.id, me().id, t);
    if (R(r, 'Antwort gesendet')) ui.closeSheet();
  });
  ui.on('it-ask', (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    ui.go('chat', { tid: C.threadId.dm(me().id, it.from), draft: 'Zu „' + it.title + '“: ' });
  });

  ui.on('it-giveback', (el) => {
    ui.sheet('Auftrag zurückgeben', '<p>Der Auftrag wird wieder frei und neu verteilt – nicht wieder an dich.</p>'
      + '<fieldset class="sn-choices"><legend class="sn-label">Grund</legend>' + ['Keine Zeit mehr', 'Fehlt Material oder Ware', 'Nicht meine Tätigkeit', 'Sonstiges'].map((g, i) => '<label class="sn-choice"><input type="radio" name="gb" value="' + esc(g) + '"' + (i ? '' : ' checked') + '><span>' + esc(g) + '</span></label>').join('') + '</fieldset>',
      btn('Zurückgeben', 'it-giveback-go', { id: el.dataset.id }, 'primary'));
  });
  ui.on('it-giveback-go', async (el) => { const r = await C.giveBack(el.dataset.id, me().id, picked('gb')); if (R(r, 'Zurückgegeben')) { ui.closeSheet(); SN.dist.run(me().id); } });

  ui.on('it-done', (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    photoTmp = null;
    const needPhoto = it.kind === 'task' && it.proofRequired;
    const askText = it.kind === 'report' || it.kind === 'absence';
    if (!needPhoto && !askText) return C.done(it.id, me().id, {}).then((r) => R(r, 'Erledigt – danke!'));
    ui.sheet('Erledigt', (needPhoto ? '<p>Für diesen Auftrag ist ein Foto als Nachweis nötig. Die Leitung gibt es frei.</p><label class="sn-btn sn-btn--secondary sn-btn--block" for="done-photo">' + icon('camera') + '<span>Foto aufnehmen</span></label><input type="file" id="done-photo" accept="image/*" capture="environment" data-change="photo-tmp" hidden><div id="done-prev" class="sn-photos"></div>' : '')
      + (askText ? '<div class="sn-field"><label class="sn-label" for="done-text">Kurze Antwort an ' + esc(M.first(it.from)) + '</label><input class="sn-input" id="done-text" value="Ist erledigt, danke für die Meldung!"></div>' : ''),
      btn('Als erledigt melden', 'it-done-go', { id: it.id }, 'primary', 'check'));
  });
  ui.onChange('photo-tmp', async (el) => {
    const f = el.files && el.files[0]; if (!f) return;
    photoTmp = (await U.shrinkImage(f, 640, 0.6)).dataUrl;
    const p = document.getElementById('done-prev'); if (p) p.innerHTML = '<img alt="Nachweisfoto" src="' + photoTmp + '">';
  });
  ui.on('it-done-go', async (el) => {
    const r = await C.done(el.dataset.id, me().id, { photo: photoTmp || undefined, text: ui.sheetVal('done-text') || undefined });
    if (R(r, 'Erledigt – der Melder bekommt Bescheid')) { photoTmp = null; ui.closeSheet(); }
  });

  ui.on('it-forward', (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    const ids = M.staff().filter((e) => e.id !== me().id && M.isLead(e) || e.role === 'clean').map((e) => e.id);
    ui.sheet('Weitergeben an …', personPicker('fw', U.sortBy(ids, (id) => -M.level(M.emp(id))), me(), now())
      + '<div class="sn-field"><label class="sn-label" for="fw-note">Hinweis (optional)</label><input class="sn-input" id="fw-note"></div>',
      btn('Weitergeben', 'it-forward-go', { id: it.id }, 'primary', 'forward'));
  });
  ui.on('it-forward-go', async (el) => {
    const to = picked('fw'); if (!to) return ui.toast('Bitte eine Person wählen.', 'warn');
    const r = await C.forward(el.dataset.id, me().id, [to], ui.sheetVal('fw-note'));
    if (R(r, 'Weitergegeben an ' + M.first(to))) ui.closeSheet();
  });
  ui.on('it-totask', async (el) => { const r = await C.toTask(el.dataset.id, me().id, {}); if (R(r, 'Auftrag angelegt und verteilt')) SN.dist.run(me().id); });

  ui.on('it-assign', (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    const n = now();
    const cands = SN.dist.candidates(n).filter((e) => e.id !== it.owner);
    const ranked = U.sortBy(cands, (e) => (M.deptOf(e, n) === it.dept ? 0 : 1) * 1000 + SN.dist.loadOf(e.id) - SN.dist.limitOf(e, n) / 10).slice(0, 25);
    ui.sheet('Zuteilen: ' + it.title, '<p class="sn-muted">Gleiche Abteilung zuerst, dann geringste Auslastung. Über das Limit wird nie zugeteilt.</p>'
      + personPicker('as', ranked.map((e) => e.id), me(), n), btn('Zuteilen', 'it-assign-go', { id: it.id }, 'primary', 'check'));
  });
  ui.on('it-assign-go', async (el) => {
    const to = picked('as'); if (!to) return ui.toast('Bitte eine Person wählen.', 'warn');
    const it = C.get(el.dataset.id);
    const chk = SN.dist.canTake(M.emp(to), Object.assign({}, it, { owner: null }), now());
    if (!chk.ok) return ui.toast(chk.reason, 'warn');
    await SN.store.patch('items', it.id, { owner: to, to: { type: 'person', ids: [to] }, state: 'sent', startedAt: null });
    await C.log(me().id, 'Auftrag „' + it.title + '“ an ' + M.name(to) + ' zugeteilt');
    ui.toast('Zugeteilt an ' + M.first(to)); ui.closeSheet();
  });

  /* ---------- Fotos für Formulare --------------------------------------- */
  async function readPhotos(input, max) {
    const out = [];
    for (const f of Array.from(input.files || []).slice(0, max || 4)) out.push((await U.shrinkImage(f, 640, 0.6)).dataUrl);
    return out;
  }

  SN.parts = { sec, secHtml, empty, chip, btn, deadline, receipt, ackbar, steps, timeline, itemCard, list, personPicker, picked, initials, readPhotos, icon };
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/00-items.js konnte nicht geladen werden:", e); }

/* ===== src/views/10-home.js ===== */
try {
/* ==========================================================================
   Start (Mitarbeitende, Schicht-/Teamleitung) + SOS + Hilfe rufen + Pause
   Reihenfolge nach Wichtigkeit: Quittierpflicht → Kurzbriefing → Aufträge →
   Schnellaktionen → eigene Meldungen.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;

  function pauseTile(me, now) {
    const ps = SN.dist.pauseStatus(me, now);
    if (ps.state === 'running' || ps.state === 'over') {
      return '<button type="button" class="sn-tile' + (ps.state === 'over' ? ' sn-tile--warn' : '') + '" data-act="pause-end">' + icon('coffee', 'sn-icon--lg sn-tile__icon')
        + '<span><span class="sn-tile__label">Pause beenden</span><span class="sn-tile__sub">' + (ps.state === 'over' ? 'überzogen um ' + ps.over + ' Min' : 'bis ' + U.fmt.time(ps.until)) + '</span></span></button>';
    }
    const left = Math.max(0, ps.need - ps.taken);
    return '<button type="button" class="sn-tile" data-act="pause-start">' + icon('coffee', 'sn-icon--lg sn-tile__icon')
      + '<span><span class="sn-tile__label">Pause starten</span><span class="sn-tile__sub">' + (ps.need ? (left ? left + ' Min stehen dir zu' : 'Pause genommen') : 'kein Anspruch heute') + '</span></span></button>';
  }

  function tiles(me, now) {
    return '<div class="sn-tiles">'
      + '<button type="button" class="sn-tile" data-go="report">' + icon('camera', 'sn-icon--lg sn-tile__icon') + '<span><span class="sn-tile__label">Problem melden</span><span class="sn-tile__sub">3 Taps, geht sofort an die richtige Person</span></span></button>'
      + '<button type="button" class="sn-tile" data-act="call-sheet">' + icon('users', 'sn-icon--lg sn-tile__icon') + '<span><span class="sn-tile__label">Hilfe rufen</span><span class="sn-tile__sub">Kasse, Info, Wareneingang</span></span></button>'
      + pauseTile(me, now)
      + '<button type="button" class="sn-tile sn-tile--sos" data-act="sos">' + icon('sos', 'sn-icon--lg sn-tile__icon') + '<span><span class="sn-tile__label">SOS</span><span class="sn-tile__sub">Notfall melden</span></span></button>'
      + '</div>';
  }

  function hero(me, now) {
    const mine = C.myTasks(me.id);
    const done = C.doneTasks(me.id).filter((t) => U.fmt.dayKey(t.doneAt || 0) === U.fmt.dayKey(now));
    const tot = mine.length + done.length;
    const pct = tot ? Math.round(done.length / tot * 100) : 0;
    const min = mine.reduce((s, t) => s + (t.min || 0), 0);
    const w = M.shiftWindow(me, now);
    return '<section class="sn-card sn-hero"><div class="sn-ring sn-ring--' + (pct >= 50 ? 'ok' : 'warn') + '" style="--p:' + pct + '" role="img" aria-label="' + done.length + ' von ' + tot + ' Aufträgen erledigt"><span><span class="sn-ring__value">' + done.length + '/' + tot + '</span><span class="sn-ring__label">erledigt</span></span></div>'
      + '<div><p class="sn-hero__title">' + (mine.length ? 'Noch ' + U.fmt.count(mine.length, 'Auftrag', 'Aufträge') : 'Alles erledigt') + '</p>'
      + '<p class="sn-muted">' + (min ? 'ca. ' + U.fmt.dur(min) + ' Arbeit · ' : '') + (w && now < w.e && now >= w.s ? 'Schichtende in ' + U.fmt.dur((w.e - now) / U.MIN) : w && now < w.s ? 'Schicht beginnt ' + U.fmt.time(w.s) : 'Nicht im Dienst') + '</p></div></section>';
  }

  function render({ me, now }) {
    let h = '';
    const ack = C.toAck(me.id);
    if (ack.length) h += P.sec('Bitte quittieren', ack.length) + P.list(ack, me, now);
    const br = C.briefingFor(me.id, now);
    if (br && !ack.find((x) => x.id === br.id)) h += P.sec('Kurzbriefing deiner Schicht') + P.itemCard(br, me, now, { compact: false });
    h += hero(me, now) + tiles(me, now);
    if (M.isLead(me)) {
      const inb = C.inbox(me.id);
      h += P.sec('Für dich', inb.length) + (inb.length ? P.list(inb.slice(0, 4), me, now) + (inb.length > 4 ? '<button type="button" class="sn-btn sn-btn--ghost sn-btn--block" data-go="inbox">Alle ' + inb.length + ' im Eingang</button>' : '') : P.empty('Nichts offen', 'Neue Meldungen erscheinen hier sofort.', true));
    }
    const mine = C.myTasks(me.id);

      + '<fieldset class="sn-choices"><legend class="sn-label">Was ist passiert?</legend>' + M.SOS_TYPES.map((t) => '<label class="sn-choice"><input type="radio" name="sos-t" value="' + t.key + '" data-change="sos-type"><span>' + icon(t.icon) + esc(t.label) + '</span></label>').join('') + '</fieldset>'
      + '<div class="sn-field"><label class="sn-label" for="sos-note">Wo? (optional)</label><input class="sn-input" id="sos-note" placeholder="z. B. Kasse 3, Gang 7" value="' + esc(me.dept || '') + '"></div>'
      + (fa.length ? '<p class="sn-muted sn-small">Ersthelfer/innen im Dienst: ' + esc(fa.map((x) => x.name + (x.inPause ? ' (Pause)' : '')).join(', ')) + '</p>' : ''),
      '<button type="button" class="sn-btn sn-btn--ack sn-btn--hold" id="sos-hold" disabled>' + icon('sos') + '<span>Halten: SOS senden</span></button><p class="sn-muted sn-small">2 Sekunden gedrückt halten – verhindert Fehlalarm in der Tasche.</p>');
    const b = p.querySelector('#sos-hold');
    let t0 = 0, raf = 0;
    const stop = () => { cancelAnimationFrame(raf); t0 = 0; b.style.setProperty('--hold', '0'); };
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / 2000);
      b.style.setProperty('--hold', String(k));
      if (k >= 1) { stop(); send(); return; }
      raf = requestAnimationFrame(step);
    };
    b.addEventListener('pointerdown', (e) => { if (b.disabled) return; e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); });

    b.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.repeat && !t0) { t0 = performance.now(); raf = requestAnimationFrame(step); } });
    b.addEventListener('keyup', stop);

      const r = await C.sos(SN.session.id, sosType, ui.sheetVal('sos-note') || '');
      if (ui.result(r, 'SOS gesendet – bitte auch 112 oder 110 anrufen')) { U.vibrate(200); ui.closeSheet(); }
