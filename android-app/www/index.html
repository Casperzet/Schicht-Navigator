/* ===== src/core/comm.js ===== */
try {
/* ==========================================================================
   SN.comm – Kommunikationsmotor (M1) + Chat
   --------------------------------------------------------------------------
   Ein Modell für alle Vorgänge („Items“, Collection items):
     {id, kind, from, to:{type, ids[], shift?}, title, body, lang, orig?, u,
      createdAt, ackDue, state, acks:{empId:ts}, seen:{empId:ts}, owner,
      esc:{level, at, history:[{level, at, ids, key?, fwd?, by?}]}, thread:[]}
   kind: post | task | report | call | sos | handover | shiftreq | absence
   state: sent → seen → taken → done (außerdem closed/accepted/declined/cancelled)

   Regeln:
   - Jede Aktion schreibt über SN.store (patch mit tiefem Merge → gleichzeitige
     Quittungen verschiedener Personen kollidieren nicht).
   - Aktionen liefern Promise<{ok, item?, reason?}>; reason ist deutscher Text.
   - escalateDue(now) ist idempotent: Stufe und Zeitpunkte werden aus der
     Frist berechnet (nicht aus „jetzt“), mehrere Geräte schreiben dasselbe.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model;
  const MIN = U.MIN;
  const now0 = (n) => (n === undefined ? SN.clock.now() : n);

  /* ---------- Lesen ------------------------------------------------------ */
  const items = () => SN.store.list('items');
  const get = (idOrItem) => (typeof idOrItem === 'string' ? SN.store.peek('items', idOrItem) : idOrItem
    ? SN.store.peek('items', idOrItem.id) || idOrItem : null);
  const isFinal = (it) => M.FINAL_STATES.includes(it.state);
  const ok = (extra) => Object.assign({ ok: true }, extra);
  const fail = (reason) => Promise.resolve({ ok: false, reason });
  const PREFIX = { post: 'po', task: 'ta', report: 're', call: 'ca', sos: 'so', handover: 'ho', shiftreq: 'sr', absence: 'ab', photo: 'ph' };

  /** Empfänger eines Vorgangs (ohne Absender); Auftrag: Besitzer oder Abteilung */
  function recipients(it) {
    if (!it) return [];
    if (it.kind === 'task' && it.owner) return [it.owner];
    const ids = M.resolveTo(it.to);
    return it.to && it.to.type === 'person' && it.kind === 'task' ? ids : ids.filter((id) => id !== it.from);
  }
  const isRecipient = (it, empId) => recipients(it).includes(empId);

  /** Alle Beteiligten: Absender, Empfänger, Besitzer, Eskalationsstufen, Antwortende */
  function involved(it) {
    const h = (it.esc && it.esc.history) || [];
    return U.uniq([it.from, it.owner].concat(recipients(it), ...h.map((x) => x.ids || []), Object.keys(it.answers || {})));
  }
  /** Personen der aktuellen Eskalationsstufe (wen es gerade betrifft) */
  function currentIds(it) {
    const h = (it.esc && it.esc.history) || [];
    const last = h[h.length - 1];
    return last && last.ids ? last.ids : recipients(it);
  }

  /** Quittungszähler einer Anweisung: {done, total, open[], acked[]} */
  function ackStats(it) {
    const rec = recipients(it);
    const acks = it.acks || {};
    const acked = rec.filter((id) => acks[id]);
    return { done: acked.length, total: rec.length, acked, open: rec.filter((id) => !acks[id]) };
  }

  /** Zusagen eines Rufs: {yes[], no[], need, enough} */
  function callStatus(it) {
    const a = it.answers || {};
    const yes = Object.keys(a).filter((id) => a[id].a === 'yes');
    const no = Object.keys(a).filter((id) => a[id].a === 'no');
    const need = it.need === undefined ? 1 : it.need;
    return { yes, no, need, enough: need > 0 && yes.length >= need };
  }

  /** Braucht der Vorgang keine weitere Eskalation? */
  function satisfied(it) {
    if (isFinal(it)) return true;
    switch (it.kind) {
      case 'report': case 'absence': return it.state === 'taken';
      case 'call': return it.need === 0 || callStatus(it).enough;
      case 'sos': return Object.keys(it.answers || {}).length > 0;
      case 'post': return !it.needAck || ackStats(it).open.length === 0;
      case 'handover': return Object.keys(it.acks || {}).length > 0;
      case 'photo': return Object.keys(it.seen || {}).some((id) => id !== it.from) || it.state === 'taken';
      case 'task': return !it.escalate || it.state === 'done';
      default: return true;
    }
  }

  /* ---------- Senden ------------------------------------------------------ */
  /**
   * Vorgang anlegen. draft: beliebige Felder (kind, to, title, body, u, …).
   * Absender = by. Setzt Status, Frist (ackDue) und Eskalationsstartpunkt.
   */
  function send(draft, by, now) {
    now = now0(now);
    const me = M.emp(by);
    const kind = draft.kind || 'post';
    const it = Object.assign({
      kind, to: { type: 'person', ids: [] }, title: '', body: '', lang: 'de', u: false,
      state: 'sent', acks: {}, seen: {}, owner: null, thread: [],
      dept: me ? M.deptOf(me, now) : null, shift: M.currentShift(now) || (me && me.sh) || 'Früh',
    }, U.clone(draft), { id: draft.id || U.id(PREFIX[kind] || 'it'), from: by, createdAt: now });
    const min = M.deadlineMin(it);
    if (it.kind === 'task') it.ackDue = it.escalate && it.due ? it.due : null;
    else if (it.kind === 'post') it.ackDue = it.needAck ? now + min * MIN : null;
    else if (it.kind === 'shiftreq') it.ackDue = null;
    else it.ackDue = M.ackStart(it, now) + min * MIN;
    const rec = recipients(it);
    if (!rec.length && it.ackDue) it.ackDue = now; // niemand erreichbar → sofort eine Stufe höher
    it.esc = { level: 0, at: now, history: [{ level: 0, at: now, ids: rec }] };
    return SN.store.put('items', it.id, it).then((r) => (r.ok ? ok({ item: get(it.id) || it }) : { ok: false, reason: SN.store.ERROR_TEXT[r.code] || 'Nicht gespeichert.' }));
  }

  /** Anweisung / Info (M2). opts: {to, title, body, needAck, u, ackMin, briefing, kudos} */
  function post(by, opts) {
    return send(Object.assign({ kind: 'post', needAck: false }, opts), by);
  }

  /** Auftrag (M3). opts: {title, dept, act, min, due, u, owner, proofRequired, escalate, checklist[], templateId} */
  function task(by, opts) {
    const o = Object.assign({}, opts);
    o.act = o.act || 'Sonstiges';
    o.min = o.min || M.ACT_MIN[o.act] || 20;
    o.to = o.owner ? { type: 'person', ids: [o.owner] } : { type: 'dept', ids: [o.dept || 'Trocken sortiment'] };
    if (o.owner) {
      const chk = SN.dist ? SN.dist.canTake(M.emp(o.owner), o) : { ok: true };
      if (!chk.ok) return fail(chk.reason);
    }
    return send(Object.assign({ kind: 'task' }, o), by);
  }

  /**
   * Meldung von unten (M4). opts: {cat, dept, body, orig, lang, photos[], u}
   * Routing automatisch an die zuständige Person (Kategorie + Abteilung + Schicht).
   */
  function report(by, opts, now) {
    now = now0(now);
    const me = M.emp(by);
    const c = M.CAT[opts.cat] || M.CAT.other;
    const dept = c.dept || opts.dept || (me && M.deptOf(me, now)) || 'Info';
    const shift = M.currentShift(now) || (me && me.sh) || 'Früh';
    const ids = M.responsibleFor(c.key, dept, shift, now).filter((id) => id !== by);
    return send(Object.assign({}, opts, {
      kind: 'report', cat: c.key, dept, shift, title: opts.title || c.label,
      to: { type: 'person', ids: ids.length ? ids : M.responsibleFor(c.key, dept, shift, now) },
    }), by, now);
  }

  /* ---------- Reaktionen ------------------------------------------------- */
  /** Gesehen markieren (schreibt nur beim ersten Mal) */
  function markSeen(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it || (it.seen && it.seen[by])) return Promise.resolve(ok({ item: it, unchanged: true }));
    const p = { seen: { [by]: now } };
    if (it.state === 'sent' && isRecipient(it, by)) p.state = 'seen';
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Quittieren („Gelesen und verstanden“, Übergabe-Empfang) */
  function ack(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    if (it.acks && it.acks[by]) return Promise.resolve(ok({ item: it, unchanged: true }));
    const p = { acks: { [by]: now } };
    if (!it.seen || !it.seen[by]) p.seen = { [by]: now };
    if (it.kind === 'handover') { p.state = 'done'; p.doneAt = now; p.doneBy = by; }
    else if (it.state === 'sent') p.state = 'seen';
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Übernehmen (Meldung, Auftrag, Ausfall). Aufträge nur innerhalb des Limits. */
  function take(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    if (isFinal(it)) return fail('Schon abgeschlossen.');
    if (it.owner && it.owner !== by) return fail('Schon übernommen von ' + M.name(it.owner) + '.');
    if (it.kind === 'task' && it.owner !== by) {
      const chk = SN.dist.canTake(M.emp(by), it, now);
      if (!chk.ok) return fail(chk.reason);
    }
    const p = { owner: by, state: 'taken', takenAt: now, seen: { [by]: (it.seen && it.seen[by]) || now } };
    if (it.kind === 'task') { p.to = { type: 'person', ids: [by] }; p.startedAt = now; }
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Auftrag starten („Gesehen/Starte“) – zugeteilter Auftrag wird „in Arbeit“ */
  function start(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'task') return fail('Auftrag nicht gefunden.');
    if (it.owner && it.owner !== by) return fail('Der Auftrag gehört ' + M.name(it.owner) + '.');
    if (!it.owner) return take(it, by, now);
    return SN.store.patch('items', it.id, { state: 'taken', startedAt: now, seen: { [by]: (it.seen && it.seen[by]) || now } })
      .then(() => ok({ item: get(it.id) }));
  }

  /** Weitergeben an andere Personen (Kette startet bei den neuen Empfängern neu) */
  function forward(ref, by, toIds, note, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    toIds = U.uniq([].concat(toIds || [])).filter((id) => M.emp(id));
    if (!toIds.length) return fail('Bitte eine Person wählen.');
    const draft = Object.assign({}, it, { to: { type: 'person', ids: toIds }, owner: null });
    const min = M.deadlineMin(draft);
    const hist = ((it.esc && it.esc.history) || []).concat([{ level: 0, at: now, ids: toIds, fwd: true, by }]);
    const thread = (it.thread || []).concat([{ by, at: now, type: 'fwd', text: note || '', ids: toIds }]);
    return SN.store.patch('items', it.id, {
      to: { type: 'person', ids: toIds }, owner: null, state: 'sent',
      ackDue: min ? now + min * MIN : it.ackDue || null,
      esc: { level: 0, at: now, history: hist }, thread,
    }).then(() => ok({ item: get(it.id) }));
  }

  /**
   * Erledigt. opts: {text} kurze Antwort an den Melder, {photo} Foto-Nachweis (Media-ID).
   * Aufträge mit proofRequired brauchen ein Foto; die Leitung gibt frei (approve).
   */
  function done(ref, by, opts, now) {
    const it = get(ref); now = now0(now); opts = opts || {};
    if (!it) return fail('Vorgang nicht gefunden.');
    if (isFinal(it)) return Promise.resolve(ok({ item: it, unchanged: true }));
    if (it.kind === 'task' && it.proofRequired && !opts.photo) return fail('Bitte ein Foto als Nachweis anhängen.');
    const p = { state: 'done', doneAt: now, doneBy: by, owner: it.owner || by };
    if (opts.photo) { p.proof = opts.photo; p.approved = null; }
    if (opts.text) p.thread = (it.thread || []).concat([{ by, at: now, type: 'done', text: opts.text }]);
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Foto-Nachweis freigeben (yes) oder zurück zum Nachbessern */
  function approve(ref, by, yes, note, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'task') return fail('Auftrag nicht gefunden.');
    const thread = note ? (it.thread || []).concat([{ by, at: now, type: yes ? 'ok' : 'redo', text: note }]) : undefined;
    const p = yes ? { approved: true, approvedBy: by, approvedAt: now } : { approved: false, state: 'taken', doneAt: null };
    if (thread) p.thread = thread;
    return SN.store.patch('items', it.id, p).then(() => ok({ item: get(it.id) }));
  }

  /** Antwort / Rückfrage im Verlauf eines Vorgangs */
  function reply(ref, by, text, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    if (!String(text || '').trim()) return fail('Bitte einen Text eingeben.');
    const thread = (it.thread || []).concat([{ by, at: now, type: 'msg', text: String(text).trim() }]).slice(-100);
    return SN.store.patch('items', it.id, { thread, seen: { [by]: now } }).then(() => ok({ item: get(it.id) }));
  }

  /** Nachfassen: erinnert alle, die noch nicht quittiert haben → {ok, count} */
  function remind(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it) return fail('Vorgang nicht gefunden.');
    const open = it.kind === 'call'
      ? recipients(it).filter((id) => !(it.answers || {})[id])
      : ackStats(it).open;
    if (!open.length) return Promise.resolve(ok({ count: 0, item: it }));
    const n = ((it.remind && it.remind.n) || 0) + 1;
    return SN.store.patch('items', it.id, { remind: { at: now, by, ids: open, n } })
      .then(() => ok({ count: open.length, item: get(it.id) }));
  }

  /** Auftrag zurückgeben (mit Grund) – wird wieder frei, nicht erneut an dieselbe Person */
  function giveBack(ref, by, reason, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'task') return fail('Auftrag nicht gefunden.');
    if (!String(reason || '').trim()) return fail('Bitte einen Grund angeben.');
    const thread = (it.thread || []).concat([{ by, at: now, type: 'back', text: reason }]);
    return SN.store.patch('items', it.id, {
      owner: null, state: 'sent', help: false, startedAt: null, to: { type: 'dept', ids: [it.dept] },
      returned: { [by]: now }, thread,
    }).then(() => ok({ item: get(it.id) }));
  }

  /** ➕ Auftrag aus einer Meldung (Meldung gilt als übernommen) */
  async function toTask(ref, by, extra, now) {
    const it = get(ref); now = now0(now);
    if (!it) return { ok: false, reason: 'Meldung nicht gefunden.' };
    const actFor = { gap: 'Lücken füllen', price: 'Etikettierung', clean: 'Sonstiges', bottle: 'Leergut', delivery: 'Wareneinnahme' };
    const r = await task(by, Object.assign({
      title: it.title + (it.body ? ': ' + it.body : ''), dept: it.dept, act: actFor[it.cat] || 'Sonstiges',
      u: it.u, due: now + 60 * MIN, src: it.id, photos: it.photos || [],
    }, extra || {}));
    if (!r.ok) return r;
    const thread = (it.thread || []).concat([{ by, at: now, type: 'task', text: 'Auftrag erstellt', ref: r.item.id }]);
    await SN.store.patch('items', it.id, { owner: it.owner || by, state: it.state === 'done' ? 'done' : 'taken', takenAt: it.takenAt || now, thread, taskId: r.item.id });
    return ok({ item: r.item, report: get(it.id) });
  }

  /* ---------- Eskalation -------------------------------------------------- */
  /**
   * Fällige Vorgänge eine (oder mehrere) Stufen hochsetzen. Idempotent:
   * Zeitpunkte = abgelaufene Fristen, nicht „jetzt“. Schließt außerdem Rufe
   * mit genug Zusagen. Liefert die IDs geänderter Vorgänge.
   */
  function escalateDue(now) {
    now = now0(now);
    const changed = [];
    for (const it of items()) {
      if (it.kind === 'call' && it.state !== 'closed' && !isFinal(it) && callStatus(it).enough) {
        SN.store.patch('items', it.id, { state: 'closed', closedAt: now });
        changed.push(it.id);
        continue;
      }
      if (!it.ackDue || now < it.ackDue || satisfied(it)) continue;
      const chain = M.escalationChain(it, now);
      const max = chain.length - 1;
      let lvl = (it.esc && it.esc.level) || 0;
      if (lvl >= max) continue;
      const step = M.deadlineMin(it) * MIN || 5 * MIN;
      const hist = ((it.esc && it.esc.history) || []).slice();
      let due = it.ackDue;
      while (now >= due && lvl < max) {
        lvl++;
        hist.push({ level: lvl, at: due, ids: chain[lvl].ids, key: chain[lvl].key });
        due += step;
      }
      SN.store.patch('items', it.id, { esc: { level: lvl, at: hist[hist.length - 1].at, history: hist }, ackDue: due });
      changed.push(it.id);
    }
    return changed;
  }

  /** „Wartet auf …“-Text (leer, wenn nichts mehr offen ist) */
  function waitingOn(ref, now) {
    const it = get(ref); now = now0(now);
    if (!it) return '';
    const since = (ts) => U.fmt.dur(Math.max(0, (now - ts) / MIN));
    if (it.state === 'done') return it.doneBy ? 'Erledigt von ' + M.name(it.doneBy) : 'Erledigt';
    if (it.state === 'closed') return 'Geschlossen';
    if (it.state === 'accepted') return 'Angenommen';
    if (it.state === 'declined') return 'Abgelehnt';
    if (it.state === 'cancelled') return 'Zurückgezogen';
    switch (it.kind) {
      case 'post': {
        if (!it.needAck) return '';
        const s = ackStats(it);
        return s.open.length ? 'Wartet auf ' + U.fmt.count(s.open.length, 'Quittung', 'Quittungen') + ' (' + s.done + ' von ' + s.total + ')' : 'Alle haben quittiert';
      }
      case 'call': {
        const c = callStatus(it);
        if (c.need === 0) return 'Info an alle im Dienst';
        return 'Wartet auf Zusagen (' + c.yes.length + ' von ' + c.need + ')';
      }
      case 'task':
        if (it.owner) return (it.state === 'taken' ? 'In Arbeit bei ' : 'Zugeteilt an ') + M.name(it.owner);
        return 'Wartet auf Übernahme';
      case 'shiftreq':
        if (it.state === 'taken') return 'Wartet auf Freigabe der Leitung';
        return 'Wartet auf Antwort von ' + M.labelFor(recipients(it));
      case 'sos':
        if (Object.keys(it.answers || {}).length) return 'Hilfe kommt: ' + Object.keys(it.answers).map(M.first).join(', ');
        break;
      default:
        if (it.state === 'taken' && it.owner) return 'In Arbeit bei ' + M.name(it.owner);
    }
    const h = (it.esc && it.esc.history) || [];
    const last = h[h.length - 1] || { at: it.createdAt, ids: recipients(it) };
    const ids = last.ids || [];
    const label = last.key === 'slOpen' ? 'Schichtleitung' : last.key && M.STEP_LABEL[last.key] ? M.STEP_LABEL[last.key] : M.labelFor(ids);
    const isName = ids.length === 1 && label === M.name(ids[0]);
    const who = !isName && ids.length && ids.length <= 3 ? label + ' (' + ids.map(M.first).join(', ') + ')' : label;
    return 'Wartet auf ' + who + ' seit ' + since(last.at);
  }

  /** Zeitleiste eines Vorgangs für Melder und Empfänger: [{at, text, kind}] */
  function timeline(ref) {
    const it = get(ref);
    if (!it) return [];
    const out = [{ at: it.createdAt, kind: 'sent', text: 'Gesendet an ' + M.labelFor(((it.esc && it.esc.history[0]) || {}).ids || recipients(it)) }];
    for (const [id, ts] of Object.entries(it.seen || {})) if (id !== it.from) out.push({ at: ts, kind: 'seen', text: 'Gesehen von ' + M.name(id) });
    for (const [id, ts] of Object.entries(it.acks || {})) out.push({ at: ts, kind: 'ack', text: 'Quittiert von ' + M.name(id) });
    for (const h of ((it.esc && it.esc.history) || []).slice(1)) {
      out.push({ at: h.at, kind: h.fwd ? 'fwd' : 'esc', text: h.fwd ? 'Weitergegeben an ' + M.labelFor(h.ids || []) : 'Eskaliert an ' + (M.STEP_LABEL[h.key] || 'Schichtleitung') + ' (' + (h.ids || []).map(M.first).join(', ') + ')' });
    }
    for (const [id, a] of Object.entries(it.answers || {})) {
      out.push({ at: a.at, kind: 'answer', text: M.name(id) + ': ' + (a.a === 'yes' ? 'Ich komme' : a.a === 'coming' ? 'Hilfe kommt, ich gehe hin' : 'Kann nicht') });
    }
    if (it.takenAt && it.owner) out.push({ at: it.takenAt, kind: 'taken', text: 'Übernommen von ' + M.name(it.owner) });
    for (const t of it.thread || []) {
      if (t.type === 'fwd') continue;
      out.push({ at: t.at, kind: t.type || 'msg', text: M.name(t.by) + ': ' + (t.text || '') });
    }
    if (it.doneAt && it.state === 'done') out.push({ at: it.doneAt, kind: 'done', text: 'Erledigt' + (it.doneBy ? ' von ' + M.name(it.doneBy) : '') });
    if (it.closedAt) out.push({ at: it.closedAt, kind: 'closed', text: 'Geschlossen' });
    if (it.answeredAt) out.push({ at: it.answeredAt, kind: it.state, text: M.STATES[it.state] || '' });
    return U.sortBy(out, (x) => x.at);
  }

  /* ---------- Schnellruf (M5) -------------------------------------------- */
  /** Passende Personen für einen Ruf: im Dienst, nicht in Pause, passende Abteilung/Berechtigung */
  function callTargets(type, by, now) {
    now = now0(now);
    const c = M.CALL[type] || M.CALL.info;
    return M.staff().filter((e) => {
      if (e.id === by || !M.onDuty(e, now) || M.inPause(e) || e.role === 'clean') return false;
      if (!c.depts) return true;
      if (M.level(e) > 1) return false; // Leitung wird über die Eskalation erreicht
      return c.depts.includes(M.deptOf(e, now)) || (c.skill && e[c.skill]);
    }).map((e) => e.id);
  }
  /** Ruf auslösen: type kasse|info|goods|meeting. opts: {note, dept} */
  function call(by, type, opts, now) {
    now = now0(now); opts = opts || {};
    const c = M.CALL[type];
    if (!c) return fail('Unbekannter Ruf.');
    const ids = opts.ids || callTargets(type, by, now);
    const me = M.emp(by);
    return send({
      kind: 'call', type, title: c.label, body: opts.note || '', u: type !== 'meeting', need: M.callNeed(type), answers: {},
      dept: c.dept || opts.dept || (me && M.deptOf(me, now)), to: { type: 'person', ids }, standinFor: opts.standinFor || null,
    }, by, now);
  }
  /** Antwort auf einen Ruf: yes = „Ich komme“, sonst „Kann nicht“. Schließt bei genug Zusagen. */
  async function answerCall(ref, by, yes, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'call') return { ok: false, reason: 'Ruf nicht gefunden.' };
    if (isFinal(it)) return { ok: false, reason: 'Der Ruf ist schon geschlossen. Danke!' };
    await SN.store.patch('items', it.id, { answers: { [by]: { a: yes ? 'yes' : 'no', at: now } }, seen: { [by]: (it.seen && it.seen[by]) || now } });
    const cur = get(it.id);
    let closed = false;
    if (yes && callStatus(cur).enough && cur.state !== 'closed') {
      await SN.store.patch('items', it.id, { state: 'closed', closedAt: now });
      closed = true;
    }
    return ok({ item: get(it.id), closed });
  }

  /* ---------- SOS (M7) ---------------------------------------------------- */
  /** SOS: an Leitung und Admins im Dienst (Fallback: alle Leitungen) */
  function sos(by, type, note, now) {
    now = now0(now);
    const t = M.SOS_TYPES.find((x) => x.key === type) || M.SOS_TYPES[0];
    const leads = M.staff().filter((e) => e.id !== by && M.isLead(e) && M.onDuty(e, now)).map((e) => e.id);
    let ids = U.uniq(leads.concat(M.adminOnDuty(now))).filter((id) => id !== by);
    if (!ids.length) ids = M.staff().filter((e) => e.id !== by && M.isLead(e)).map((e) => e.id);
    return send({ kind: 'sos', type: t.key, title: 'SOS: ' + t.label, body: note || '', u: true, answers: {}, tel: t.tel, to: { type: 'person', ids } }, by, now);
  }
  /** Leitung antwortet „Hilfe kommt, ich gehe hin“ */
  function sosRespond(ref, by, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'sos') return fail('SOS nicht gefunden.');
    return SN.store.patch('items', it.id, {
      answers: { [by]: { a: 'coming', at: now } }, owner: it.owner || by, state: isFinal(it) ? it.state : 'taken',
      takenAt: it.takenAt || now, seen: { [by]: (it.seen && it.seen[by]) || now },
    }).then(() => ok({ item: get(it.id) }));
  }
  /** Ersthelfer/innen mit Status {id, name, onDuty, inPause} */
  function firstAiders(now) {
    now = now0(now);
    return M.staff().filter((e) => e.firstAid).map((e) => ({ id: e.id, name: e.name, onDuty: M.onDuty(e, now), inPause: M.inPause(e), dept: M.deptOf(e, now) }));
  }

  /* ---------- Schichtübergabe (M8) --------------------------------------- */
  /** Zusammenfassung für die Übergabe: offene Aufträge, Meldungen, Restware, Reinigung */
  function handoverSummary(shift, now) {
    now = now0(now);
    const open = items().filter((it) => !isFinal(it));
    const tasks = open.filter((it) => it.kind === 'task' && (!shift || it.shift === shift || !it.owner));
    const reports = open.filter((it) => it.kind === 'report' && it.cat !== 'clean');
    const cleaning = open.filter((it) => it.kind === 'report' && it.cat === 'clean');
    const rest = SN.store.list('rest').filter((r) => !r.done);
    const lines = [];
    if (tasks.length) lines.push(U.fmt.count(tasks.length, 'offener Auftrag', 'offene Aufträge'));
    if (reports.length) lines.push(U.fmt.count(reports.length, 'offene Meldung', 'offene Meldungen'));
    if (rest.length) lines.push(U.fmt.count(rest.length, 'Posten Restware', 'Posten Restware'));
    if (cleaning.length) lines.push(U.fmt.count(cleaning.length, 'Reinigung offen', 'Reinigungen offen'));
    return {
      shift, at: now,
      tasks: tasks.map((t) => ({ id: t.id, title: t.title, dept: t.dept, u: !!t.u, owner: t.owner })),
      reports: reports.map((r) => ({ id: r.id, title: r.title, dept: r.dept, u: !!r.u })),
      cleaning: cleaning.map((r) => ({ id: r.id, title: r.title, dept: r.dept })),
      rest: rest.map((r) => ({ id: r.id, name: r.name || r.note || 'Restware', dept: r.dept, place: r.place })),
      text: lines.length ? lines.join(', ') : 'Keine offenen Punkte',
    };
  }
  /** Übergabe an die nächste Schicht senden (Empfang muss quittiert werden) */
  function sendHandover(by, opts, now) {
    now = now0(now); opts = opts || {};
    const me = M.emp(by);
    const from = opts.fromShift || M.currentShift(now) || (me && me.sh) || 'Früh';
    const to = opts.toShift || M.nextShift(from);
    let ids = M.staff().filter((e) => e.role === 'sl' && e.sh === to).map((e) => e.id);
    if (!ids.length) ids = M.adminOnDuty(now);
    const sum = handoverSummary(from, now);
    return send({
      kind: 'handover', title: 'Übergabe ' + from + ' → ' + to, body: opts.notes || '', fromShift: from, toShift: to,
      summary: sum, shift: to, to: { type: 'person', ids: ids.filter((id) => id !== by) },
    }, by, now);
  }

  /* ---------- Schichtänderung nur als Anfrage (S2) ----------------------- */
  /** Anfrage: opts {day, date, shift, note, swap:boolean} – swap braucht Freigabe der Leitung */
  function shiftRequest(by, toId, opts, now) {
    opts = opts || {};
    if (!M.emp(toId)) return fail('Person nicht gefunden.');
    const title = opts.swap ? 'Schichttausch: ' + (opts.day || '') + ' ' + (opts.shift || '') : 'Kannst du ' + (opts.day || '') + ' ' + (opts.shift || '') + ' übernehmen?';
    return send({ kind: 'shiftreq', title: title.replace(/\s+/g, ' ').trim(), body: opts.note || '', req: { day: opts.day || null, date: opts.date || null, shift: opts.shift || null, swap: !!opts.swap }, to: { type: 'person', ids: [toId] } }, by, now);
  }
  /** Annehmen/Ablehnen. Tausch: annehmen → wartet auf Freigabe (state taken) */
  async function answerShiftReq(ref, by, accept, note, now) {
    const it = get(ref); now = now0(now);
    if (!it || it.kind !== 'shiftreq') return { ok: false, reason: 'Anfrage nicht gefunden.' };
    if (isFinal(it)) return { ok: false, reason: 'Die Anfrage ist schon beantwortet.' };
    if (!isRecipient(it, by)) return { ok: false, reason: 'Die Anfrage ist nicht an dich gerichtet.' };
    const swap = it.req && it.req.swap;
    const state = !accept ? 'declined' : swap ? 'taken' : 'accepted';
    const p = { state, answeredAt: now, answeredBy: by, owner: accept ? by : null, seen: { [by]: (it.seen && it.seen[by]) || now } };
    if (note) p.thread = (it.thread || []).concat([{ by, at: now, type: 'msg', text: note }]);
    await SN.store.patch('items', it.id, p);
    if (state !== 'taken') await log(by, 'Schichtanfrage ' + (accept ? 'angenommen' : 'abgelehnt') + ': ' + M.name(by) + ' · ' + it.title, now);
    return ok({ item: get(it.id) });
  }

  /* ---------- Kudos (S6), Stimmung (S7), Protokoll ----------------------- */

  function moodAggregate(day, shift) {

    const sh = M.SHIFTS[e.sh] || M.SHIFTS['Früh'];

    let rest = open, made = 0, n = 0;

  }
  on('sheet-close', () => closeSheet());

  /* ---------- Takt: Eskalation, Erinnerungen, Vorlagen ------------------------------ */
  async function tick() {
    const me = SN.session.me();
    if (!me) return;
    const now = SN.clock.now();
    try { await SN.comm.escalateDue(now); } catch (e) { console.warn(e); }
    // Pausen-Erinnerung (einmal pro Schicht)
    try {
      const ps = SN.dist.pauseStatus(me, now);
      const key = 'p-' + me.id + '-' + U.fmt.dayKey(now);
      if (ps.state === 'due' && !st.notified[key]) { st.notified[key] = 1; toast('☕ Seit 5,5 Std im Dienst: Bitte jetzt Pause nehmen.', 'warn'); }
      if (ps.state === 'over' && !st.notified[key + 'o']) { st.notified[key + 'o'] = 1; toast('☕ Deine Pause ist abgelaufen.', 'warn'); }
    } catch (e) { /* ohne Plan egal */ }
    // Vorlagen des Tages legt der Admin vom Dienst an
    if (M.isAdmin(me) && M.adminOnDuty(now) === me.id) {
      for (const tpl of SN.comm.dueTemplates(now)) { try { await SN.comm.runTemplate(tpl, me.id, now); } catch (e) { console.warn(e); } }
    }
    requestRender();
  }

  /* ---------- Start ------------------------------------------------------------------- */
  async function start(info) {
    st.started = true;
    document.addEventListener('click', onClick);
    document.addEventListener('change', (ev) => {
      const el = ev.target.closest('[data-change]');
      if (el && changes[el.dataset.change]) Promise.resolve().then(() => changes[el.dataset.change](el, ev)).catch((e) => console.error(e));
    });
    document.addEventListener('focusout', () => setTimeout(() => {
      const a = document.activeElement;
      if (st.dirty && !(a && byId('view').contains(a) && /INPUT|TEXTAREA/.test(a.tagName))) { st.dirty = false; render(true); }
    }, 0));
    document.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') closeSheet();
      if (ev.key === 'Enter' && ev.target.id === 'lg-p') { ev.preventDefault(); acts.login(); }
      if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.enter) { ev.preventDefault(); const b = $('[data-act="' + ev.target.dataset.enter + '"]'); if (b) b.click(); }
    });
    for (const c of SN.store.COLS) SN.store.sub(c, requestRender);
    SN.session.onChange((id) => {
      st.tab = null; st.params = {}; st.sub = {};
      if (id) toast('Willkommen, ' + M.first(id));
      render(false);
      if (id) tick();
    });
    const last = info && info.mode === 'db' ? await SN.session.last() : null;
    if (last && SN.store.mode === 'db') {
      // gleiches claude.ai-Konto: Konto vorauswählen, PIN bleibt nötig
      setTimeout(() => { const s = byId('lg-u'); if (s) s.value = last; }, 0);
    }
    render(false);
    setInterval(tick, 15000);
    setInterval(() => { if (!sheetOpen) requestRender(); }, 30000);
  }

  SN.ui = {
    registerView, on, onChange, go, render, requestRender, sub, toast, result, sheet, closeSheet, sheetVal, icon,
    get tab() { return st.tab; }, get params() { return st.params; }, views, start, tick,
  };
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/ui/shell.js konnte nicht geladen werden:", e); }

/* ===== src/views/00-items.js ===== */
try {
/* ==========================================================================
   Gemeinsame Bausteine für alle Ansichten (SN.parts) und Aktionen auf Vorgängen
   Eine Karte zeigt immer: was, von wem, Frist, Zustand („Wartet auf …“) und
   genau die Aktionen, die die angemeldete Person jetzt tun kann.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, esc = U.esc, icon = ui.icon;
  const tr = {}; // Übersetzungen (nur in dieser Sitzung)
  let photoTmp = null;

  /* ---------- kleine Bausteine ------------------------------------------- */
  const sec = (title, small) => '<h2 class="sn-section-title">' + esc(title) + (small !== undefined && small !== '' ? ' <small>' + esc(small) + '</small>' : '') + '</h2>';
  const empty = (title, text, ok) => '<div class="sn-empty' + (ok ? ' sn-empty--ok' : '') + '"><span class="sn-empty__icon">' + icon(ok ? 'check' : 'inbox') + '</span><p class="sn-empty__title">' + esc(title) + '</p>' + (text ? '<p class="sn-empty__text">' + esc(text) + '</p>' : '') + '</div>';
  const chip = (text, mod) => '<span class="sn-chip' + (mod ? ' sn-chip--' + mod : '') + '">' + esc(text) + '</span>';
  const btn = (label, act, data, mod, ic) => '<button type="button" class="sn-btn sn-btn--' + (mod || 'secondary') + '" data-act="' + act + '"'
    + Object.entries(data || {}).map(([k, v]) => ' data-' + k + '="' + esc(v) + '"').join('') + '>' + (ic ? icon(ic) : '') + '<span>' + esc(label) + '</span></button>';
  const initials = (n) => String(n || '?').split(' ').map((x) => x[0]).join('').slice(0, 2).toUpperCase();

  function deadline(ts) {
    if (!ts) return '';
    const l = U.fmt.left(ts);
    return '<span class="sn-deadline' + (l.late ? ' sn-deadline--overdue' : l.soon ? ' sn-deadline--soon' : '') + '">bis ' + U.fmt.time(ts) + ' · ' + esc(l.text) + '</span>';
  }
  function receipt(it, me) {
    if (it.from !== me.id) return '';
    const rec = C.recipients(it);
    if (!rec.length) return '';
    const ack = rec.filter((id) => (it.acks || {})[id]).length;
    const seen = rec.filter((id) => (it.seen || {})[id]).length;
    if (it.needAck) return '<span class="sn-receipt sn-receipt--' + (ack === rec.length ? 'ack' : seen ? 'read' : 'sent') + '">' + ack + ' von ' + rec.length + ' quittiert</span>';
    return '<span class="sn-receipt sn-receipt--' + (seen ? 'read' : 'sent') + '">' + (seen ? 'gelesen' : 'gesendet') + '</span>';
  }
  function ackbar(it, me) {
    const s = C.ackStats(it);
    if (!s.total) return '';
    const read = s.open.filter((id) => (it.seen || {})[id]).length;
    const sent = s.open.length - read;
    const pct = Math.round(s.done / s.total * 100);
    return '<section class="sn-ackbar"><div class="sn-ackbar__head"><p class="sn-ackbar__count">' + s.done + ' <small>von ' + s.total + ' quittiert</small></p><span class="sn-ackbar__pct">' + pct + ' %</span></div>'
      + '<div class="sn-ackbar__bar" role="img" aria-label="' + s.done + ' quittiert, ' + read + ' gelesen, ' + sent + ' nur gesendet">'
      + '<span class="sn-ackbar__seg sn-ackbar__seg--ack" style="--n:' + s.done + '"></span><span class="sn-ackbar__seg sn-ackbar__seg--read" style="--n:' + read + '"></span><span class="sn-ackbar__seg sn-ackbar__seg--sent" style="--n:' + sent + '"></span></div>'
      + (s.open.length && (it.from === me.id || M.isLead(me)) ? '<div class="sn-ackbar__actions">' + btn('Nachfassen · ' + s.open.length, 'it-remind', { id: it.id }, 'secondary', 'bell') + btn('Wer fehlt?', 'it-open', { id: it.id }, 'ghost') + '</div>' : '')
      + '</section>';
  }
  function steps(it) {
    const h = (it.esc && it.esc.history) || [];
    if (h.length < 2) return '';
    return '<ol class="sn-steps">' + h.map((x, i) => '<li class="sn-steps__item' + (i === h.length - 1 ? ' is-current' : ' is-done') + '"><span>' + esc(x.fwd ? 'Weitergegeben' : i === 0 ? 'Start' : 'Stufe ' + i) + '</span><small>' + esc(x.key && M.STEP_LABEL[x.key] ? M.STEP_LABEL[x.key] : M.labelFor(x.ids || [])) + ' · ' + U.fmt.time(x.at) + '</small></li>').join('') + '</ol>';
  }
  function timeline(it) {
    return '<ol class="sn-timeline">' + C.timeline(it).map((t) => '<li><time>' + U.fmt.time(t.at) + '</time> ' + esc(t.text) + '</li>').join('') + '</ol>';
  }
  function body(it, me) {
    if (!it.body) return '';
    const t = tr[it.id];
    const lang = me.lang || 'de';
    const canTr = SN.ai.available().text;
    return '<p class="sn-card__body">' + esc(it.body) + '</p>'
      + (it.orig && it.orig !== it.body ? '<p class="sn-muted sn-small">Original: ' + esc(it.orig) + '</p>' : '')
      + (t ? '<p class="sn-translation">🌐 ' + esc(t) + '</p>' : canTr && lang !== 'de' ? '<button type="button" class="sn-link" data-act="it-translate" data-id="' + it.id + '">🌐 In ' + esc(SN.ai.LANGS[lang] || lang) + ' übersetzen</button>' : '');
  }

  /* ---------- Aktionen je Art und Rolle --------------------------------- */
  function actions(it, me) {
    const a = [];
    const mine = it.from === me.id;
    const rec = C.isRecipient(it, me.id) || C.currentIds(it).includes(me.id);
    const fin = C.isFinal(it);
    if (fin) return '';
    switch (it.kind) {
      case 'post':
      case 'handover':
        if ((it.needAck || it.kind === 'handover') && rec && !(it.acks || {})[me.id]) return '<button type="button" class="sn-btn sn-btn--ack" data-act="it-ack" data-id="' + it.id + '">' + icon('check') + '<span>' + (it.kind === 'handover' ? 'Übergabe erhalten' : 'Gelesen und verstanden') + '</span></button>';
        if ((it.acks || {})[me.id]) return '<span class="sn-receipt sn-receipt--ack">quittiert ' + U.fmt.time(it.acks[me.id]) + '</span>';
        break;
      case 'task':
        if (it.owner === me.id) {
          if (it.state !== 'taken') a.push(btn('Starten', 'it-start', { id: it.id }, 'primary', 'play'));
          else a.push(btn('Erledigt', 'it-done', { id: it.id }, 'primary', 'check'));
          a.push(btn('Nachfragen', 'it-ask', { id: it.id }, 'secondary', 'chat'));
          a.push(btn('Zurückgeben', 'it-giveback', { id: it.id }, 'ghost'));
        } else if (!it.owner) {
          a.push(btn('Übernehme ich', 'it-take', { id: it.id }, 'primary', 'check'));
          if (M.isLead(me)) a.push(btn('Zuteilen', 'it-assign', { id: it.id }, 'secondary', 'users'));
        } else if (M.isLead(me)) a.push(btn('Umverteilen', 'it-assign', { id: it.id }, 'ghost', 'users'));
        break;
      case 'report':
      case 'absence':
        if (rec && !mine) {
          if (it.state !== 'taken') a.push(btn('Übernehmen', 'it-take', { id: it.id }, 'primary', 'check'));
          else a.push(btn('Erledigt', 'it-done', { id: it.id }, 'primary', 'check'));
          a.push(btn('Weitergeben', 'it-forward', { id: it.id }, 'secondary', 'forward'));
          if (M.isLead(me) && it.kind === 'report' && !it.taskId) a.push(btn('➕ Auftrag', 'it-totask', { id: it.id }, 'ghost'));
        }
        break;
      case 'call':
        if (rec && !(it.answers || {})[me.id]) { a.push(btn('Ich komme', 'call-yes', { id: it.id }, 'primary', 'run')); a.push(btn('Kann nicht', 'call-no', { id: it.id }, 'secondary')); }
        if (mine || M.isLead(me)) a.push(btn('Schließen', 'it-close', { id: it.id }, 'ghost'));
        break;
      case 'shiftreq':
        if (rec && it.state === 'sent' || rec && it.state === 'seen') { a.push(btn('Annehmen', 'sr-yes', { id: it.id }, 'primary', 'check')); a.push(btn('Ablehnen', 'sr-no', { id: it.id }, 'secondary', 'x')); }
        if (it.swap && it.state === 'taken' && M.isLead(me)) { a.push(btn('Tausch freigeben', 'swap-ok', { id: it.id }, 'primary', 'check')); a.push(btn('Ablehnen', 'swap-no', { id: it.id }, 'ghost')); }
        break;
      case 'sos':
        if (!mine && M.isLead(me) && !(it.answers || {})[me.id]) a.push(btn('Hilfe kommt, ich gehe hin', 'sos-respond', { id: it.id }, 'primary', 'run'));
        break;
      default:
    }
    if (it.kind === 'task' && it.state === 'done' && it.proof && it.approved == null && M.isLead(me)) {
      a.push(btn('Nachweis ok', 'it-approve', { id: it.id, yes: '1' }, 'primary', 'check'));
      a.push(btn('Nachbessern', 'it-approve', { id: it.id, yes: '' }, 'ghost'));
    }
    return a.length ? '<div class="sn-card__actions">' + a.join('') + '</div>' : '';
  }

  /**
   * Karte für einen Vorgang. opts: {compact, showTimeline}
   */
  function itemCard(it, me, now, opts) {
    opts = opts || {};
    const fin = C.isFinal(it);
    // Eskalationsdetails sehen Absender, Leitung und die aktuell Zuständigen – nicht jede Empfängerin einer Info
    const insider = it.from === me.id || M.isLead(me) || it.kind === 'report' || it.kind === 'absence';
    const lvl = insider ? ((it.esc && it.esc.level) || 0) : 0;
    const cls = ['sn-card', it.kind === 'task' ? 'sn-task' : it.kind === 'report' || it.kind === 'absence' ? 'sn-report' : 'sn-message'];
    if (it.u && !fin) cls.push('sn-card--urgent');
    if (lvl > 0 && !fin) cls.push('sn-card--escalated');
    if (fin) cls.push('is-done');
    const cat = it.kind === 'report' ? M.CAT[it.cat] : null;
    const kindLabel = cat ? cat.icon + ' ' + cat.label : M.KINDS[it.kind] || it.kind;
    const stateLabel = it.kind === 'task' && it.state === 'taken' ? '▶ In Arbeit' : M.STATES[it.state] || it.state;
    const due = it.kind === 'task' ? it.due : it.ackDue;
    const meta = [];
    if (due && !fin) meta.push('<div class="sn-meta__item">' + icon('clock') + '<dt class="sn-sr-only">Frist</dt><dd>' + deadline(due) + '</dd></div>');
    meta.push('<div class="sn-meta__item"><dt>Von</dt><dd>' + esc(it.from === me.id ? 'dir' : M.name(it.from)) + ' · ' + esc(U.fmt.ago(it.createdAt)) + '</dd></div>');
    if (it.dept) meta.push('<div class="sn-meta__item">' + icon('pin') + '<dt class="sn-sr-only">Abteilung</dt><dd>' + esc(it.dept) + '</dd></div>');
    if (it.kind === 'task' && it.min) meta.push('<div class="sn-meta__item"><dt>Dauer</dt><dd>ca. ' + esc(U.fmt.dur(it.min)) + (it.act ? ' · ' + esc(it.act) : '') + '</dd></div>');
    const wait = insider || it.kind === 'task' || it.kind === 'call' ? C.waitingOn(it, now) : '';
    return '<article class="' + cls.join(' ') + '" data-item="' + it.id + '">'
      + (it.u && !fin ? '<div class="sn-card__flag">🔥 Dringend' + (it.needAck && !fin ? ' · Bitte quittieren' : '') + '</div>' : lvl > 0 && !fin ? '<div class="sn-card__flag">Eskaliert · Stufe ' + lvl + '</div>' : '')
      + '<div class="sn-card__head"><h3 class="sn-card__title"><button type="button" class="sn-card__open" data-act="it-open" data-id="' + it.id + '">' + esc(it.title || kindLabel) + '</button></h3>'
      + chip(stateLabel, fin ? 'ok' : it.state === 'taken' ? 'info' : lvl > 0 ? 'escalated' : '') + '</div>'
      + '<p class="sn-card__kind">' + esc(kindLabel) + (it.to && it.from === me.id ? ' · an ' + esc(M.labelFor(C.recipients(it))) : '') + '</p>'
      + (opts.compact ? '' : body(it, me))
      + (it.photos && it.photos.length && !opts.compact ? '<div class="sn-photos">' + it.photos.slice(0, 4).map((p) => '<img alt="Foto zur Meldung" src="' + esc(p) + '">').join('') + '</div>' : '')
      + (it.checklist && it.checklist.length ? checklist(it, me) : '')
      + '<dl class="sn-meta">' + meta.join('') + '</dl>'
      + (wait && !fin ? '<p class="sn-waiting">' + icon('clock') + esc(wait) + '</p>' : '')
      + (it.kind === 'post' && it.needAck && (it.from === me.id || M.isLead(me)) ? ackbar(it, me) : receipt(it, me))
      + (opts.showTimeline ? steps(it) + timeline(it) : '')
      + actions(it, me)
      + '</article>';
  }
  function checklist(it, me) {
    const can = it.owner === me.id || M.isLead(me);
    return '<ul class="sn-checklist">' + it.checklist.map((c, i) => '<li><label class="sn-check"><input type="checkbox" data-change="check-item" data-id="' + it.id + '" data-i="' + i + '"' + (c.done ? ' checked' : '') + (can ? '' : ' disabled') + '>' + esc(c.text) + (c.at ? ' <small>' + esc(c.at) + '</small>' : '') + '</label></li>').join('') + '</ul>';
  }
  function list(items, me, now, emptyHtml, opts) {
    return items.length ? items.map((it) => itemCard(it, me, now, opts)).join('') : (emptyHtml || '');
  }

  /* ---------- Auswahl: Person ------------------------------------------- */
  function personPicker(name, ids, me, now, sel) {
    return '<div class="sn-pick" role="radiogroup">' + ids.map((id) => {
      const e = M.emp(id); if (!e) return '';
      const s = SN.dist.status(e, now);
      return '<label class="sn-choice sn-choice--person"><input type="radio" name="' + name + '" value="' + id + '"' + (sel === id ? ' checked' : '') + '><span><b>' + esc(e.name) + '</b><small>' + esc(M.role(e).label + ' · ' + (M.deptOf(e, now) || '') + ' · ' + s.text) + '</small></span></label>';
    }).join('') + '</div>';
  }
  const picked = (name) => { const x = document.querySelector('input[name="' + name + '"]:checked'); return x ? x.value : null; };

  /* ---------- Aktionen ---------------------------------------------------- */
  const me = () => SN.session.me();
  const now = () => SN.clock.now();
  const R = ui.result;

  ui.on('it-ack', async (el) => R(await C.ack(el.dataset.id, me().id), 'Quittiert – der Absender sieht es sofort'));
  ui.on('it-take', async (el) => { const r = await C.take(el.dataset.id, me().id); if (R(r, 'Übernommen – der Melder sieht es sofort')) ui.closeSheet(); });
  ui.on('it-start', async (el) => R(await C.start(el.dataset.id, me().id), 'Gestartet'));
  ui.on('it-remind', async (el) => { const r = await C.remind(el.dataset.id, me().id); R(r, r.ok ? 'Erinnerung an ' + r.count + ' gesendet' : ''); });
  ui.on('call-yes', async (el) => { const r = await C.answerCall(el.dataset.id, me().id, true); R(r, r.closed ? 'Danke! Genug Zusagen – Ruf geschlossen' : 'Danke – der Rufer sieht deine Zusage'); });
  ui.on('call-no', async (el) => R(await C.answerCall(el.dataset.id, me().id, false), 'Rückmeldung gesendet'));
  ui.on('sos-respond', async (el) => R(await C.sosRespond(el.dataset.id, me().id), 'Der Auslöser sieht: Hilfe kommt'));
  ui.on('it-close', async (el) => { const r = await C.done(el.dataset.id, me().id, {}); if (R(r, 'Abgeschlossen')) ui.closeSheet(); });
  ui.on('it-approve', async (el) => R(await C.approve(el.dataset.id, me().id, !!el.dataset.yes, el.dataset.yes ? '' : 'Bitte nachbessern'), el.dataset.yes ? 'Nachweis freigegeben' : 'Zurück zum Nachbessern'));
  ui.on('sr-yes', async (el) => R(await C.answerShiftReq(el.dataset.id, me().id, true, ''), 'Angenommen'));
  ui.on('sr-no', async (el) => R(await C.answerShiftReq(el.dataset.id, me().id, false, ''), 'Abgelehnt – die Leitung sieht es'));
  ui.on('swap-ok', async (el) => R(await C.approveSwap(el.dataset.id, me().id, true), 'Tausch freigegeben'));
  ui.on('swap-no', async (el) => R(await C.approveSwap(el.dataset.id, me().id, false), 'Tausch abgelehnt'));
  ui.onChange('check-item', async (el) => { await C.checkItem(el.dataset.id, me().id, +el.dataset.i, el.checked); });

  ui.on('it-translate', async (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    el.disabled = true; el.textContent = 'Übersetze …';
    const r = await SN.ai.translate(it.body, me().lang || 'de');
    if (!r) { el.disabled = false; return ui.toast((SN.ai.lastError && SN.ai.lastError.message) || 'Übersetzung nicht verfügbar.', 'warn'); }
    tr[it.id] = r.text; ui.render(true);
  });

  ui.on('it-open', async (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    await C.markSeen(it, me().id);
    const fresh = C.get(it.id);
    let extra = '';
    if (fresh.kind === 'post' && fresh.needAck && (fresh.from === me().id || M.isLead(me()))) {
      const s = C.ackStats(fresh);
      extra = s.open.length ? sec('Noch nicht quittiert', s.open.length) + '<ul class="sn-namelist">' + s.open.map((id) => '<li>' + esc(M.name(id)) + ((fresh.seen || {})[id] ? ' <small>gelesen</small>' : ' <small>nur gesendet</small>') + '</li>').join('') + '</ul>' : '';
    }
    ui.sheet(fresh.title || M.KINDS[fresh.kind], itemCard(fresh, me(), now(), { showTimeline: true }) + extra
      + '<div class="sn-field"><label class="sn-label" for="it-reply">Antwort / Rückfrage</label><textarea class="sn-textarea" id="it-reply" rows="2" placeholder="Kurz schreiben – in jeder Sprache"></textarea></div>',
      btn('Antwort senden', 'it-reply', { id: fresh.id }, 'primary', 'send'));
  });
  ui.on('it-reply', async (el) => {
    const t = String(ui.sheetVal('it-reply') || '').trim();
    if (!t) return ui.toast('Bitte Text eingeben.', 'warn');
    const r = await C.reply(el.dataset.id, me().id, t);
    if (R(r, 'Antwort gesendet')) ui.closeSheet();
  });
  ui.on('it-ask', (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    ui.go('chat', { tid: C.threadId.dm(me().id, it.from), draft: 'Zu „' + it.title + '“: ' });
  });

  ui.on('it-giveback', (el) => {
    ui.sheet('Auftrag zurückgeben', '<p>Der Auftrag wird wieder frei und neu verteilt – nicht wieder an dich.</p>'
      + '<fieldset class="sn-choices"><legend class="sn-label">Grund</legend>' + ['Keine Zeit mehr', 'Fehlt Material oder Ware', 'Nicht meine Tätigkeit', 'Sonstiges'].map((g, i) => '<label class="sn-choice"><input type="radio" name="gb" value="' + esc(g) + '"' + (i ? '' : ' checked') + '><span>' + esc(g) + '</span></label>').join('') + '</fieldset>',
      btn('Zurückgeben', 'it-giveback-go', { id: el.dataset.id }, 'primary'));
  });
  ui.on('it-giveback-go', async (el) => { const r = await C.giveBack(el.dataset.id, me().id, picked('gb')); if (R(r, 'Zurückgegeben')) { ui.closeSheet(); SN.dist.run(me().id); } });

  ui.on('it-done', (el) => {

      + '<p class="sn-muted">' + (min ? 'ca. ' + U.fmt.dur(min) + ' Arbeit · ' : '') + (w && now < w.e && now >= w.s ? 'Schichtende in ' + U.fmt.dur((w.e - now) / U.MIN) : w && now < w.s ? 'Schicht beginnt ' + U.fmt.time(w.s) : 'Nicht im Dienst') + '</p></div></section>';

      + '<fieldset class="sn-choices"><legend class="sn-label">Was ist passiert?</legend>' + M.SOS_TYPES.map((t) => '<label class="sn-choice"><input type="radio" name="sos-t" value="' + t.key + '" data-change="sos-type"><span>' + t.icon + ' ' + esc(t.label) + '</span></label>').join('') + '</fieldset>'

        + '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" data-act="rep-send" id="rep-send">' + icon('send') + '<span>Jetzt melden</span></button></section>';
    }
    const mine = C.sentBy(me.id).filter((it) => it.kind === 'report' || it.kind === 'absence');
    const open = mine.filter((it) => !C.isFinal(it)), closed = mine.filter((it) => C.isFinal(it)).slice(0, 5);
    h += P.sec('Meine Meldungen', open.length || '') + (open.length ? P.list(open, me, now, '', { showTimeline: true }) : P.empty('Keine offenen Meldungen', 'Du siehst hier jeden Schritt deiner Meldung.', true));
    if (closed.length) h += P.sec('Zuletzt erledigt') + P.list(closed, me, now, '', { compact: true });
    return h;
  }

  ui.registerView('report', { label: 'Melden', icon: 'report', groups: ['emp', 'lead', 'admin'], order: 30, render, show: (me) => !M.isLead(me) });

  ui.on('rep-cat', (el) => { photos = []; ui.sub('repDept', null); ui.sub('repCat', el.dataset.k); setTimeout(() => { const f = document.getElementById('rep-form'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); });
  ui.onChange('rep-dept', (el) => ui.sub('repDept', el.value));
  ui.onChange('rep-photo', async (el) => {
    const add = await P.readPhotos(el, 4 - photos.length);
    photos = photos.concat(add).slice(0, 4); ui.render(true);
  });
  ui.on('rep-send', async (el) => {
    const me = SN.session.me(), sub = ui.sub;
    const cat = sub('repCat'); if (!cat) return;
    const txt = String(ui.sheetVal('rep-text') || '').trim();
    el.disabled = true; el.querySelector('span').textContent = 'Wird gesendet …';
    let body = txt, orig = '';
    if (txt && SN.ai.available().text) {
      const t = await SN.ai.toGerman(txt);
      if (t && t.from && t.from !== 'de') { body = t.text; orig = txt; }
    }
    const r = await C.report(me.id, { cat, dept: ui.sheetVal('rep-dept') || undefined, body, orig: orig || undefined, photos: photos.slice(), u: !!ui.sheetVal('rep-u') });
    if (ui.result(r, 'Gemeldet – du siehst hier, wer reagiert')) { photos = []; ui.sub('repCat', null); }
    else { el.disabled = false; }
  });

  /* ---------- Diktat für beliebige Textfelder ------------------------------ */
  ui.on('mic', (el) => {
    const t = document.getElementById(el.dataset.target);
    if (!t) return;
    if (SN.ai.dictation.active()) { SN.ai.dictation.stop(); return; }
    const base = t.value;
    SN.ai.dictation.start({
      onPartial: (x) => { t.value = (base + ' ' + x).trim(); },
      onFinal: (x) => { t.value = (base + ' ' + x).trim(); },
      onState: (s) => { el.classList.toggle('is-active', s === 'listening'); el.querySelector('span').textContent = s === 'listening' ? 'Stopp' : 'Sprechen'; },
    }).then((ok) => { if (!ok) ui.toast('Sprechen ist hier nicht verfügbar. Bitte tippen.', 'warn'); });
  });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/30-report.js konnte nicht geladen werden:", e); }

/* ===== src/views/40-inbox.js ===== */
try {
/* ==========================================================================
   Eingang (Leitung, Admin) + Senden (Anweisung, Auftrag, Kurzbriefing, Lob, Ruf)
   Eingang: alles, was gerade bei mir liegt – zuerst Eskaliertes und 🔥.
   Gesendet: eigene Anweisungen mit Quittungsleiste und „Nachfassen“.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;

  function render({ me, now, sub }) {
    const f = sub.inTab || 'mine';
    const mine = C.inbox(me.id);
    const sent = C.sentBy(me.id).filter((it) => ['post', 'task', 'call', 'handover', 'shiftreq'].includes(it.kind) && !it.kudos && now - it.createdAt < 2 * U.DAY);
    const allOpen = M.isAdmin(me) ? C.urgentFirst(SN.store.list('items').filter((it) => ['report', 'absence', 'call', 'sos'].includes(it.kind) && !C.isFinal(it))) : [];
    const segs = [['mine', 'Für mich', mine.length], ['sent', 'Gesendet', sent.filter((x) => !C.isFinal(x)).length]];
    if (M.isAdmin(me)) segs.push(['all', 'Alle offen', allOpen.length]);
    let h = '<div class="sn-segment sn-segment--sticky" role="tablist">' + segs.map(([k, l, n]) => '<button type="button" role="tab" class="sn-segment__tab" data-act="in-tab" data-k="' + k + '" aria-selected="' + (f === k) + '">' + l + (n ? ' <span class="sn-badge sn-badge--neutral">' + n + '</span>' : '') + '</button>').join('') + '</div>';
    if (f === 'mine') {
      const esc1 = mine.filter((it) => it.esc && it.esc.level > 0), rest = mine.filter((it) => !(it.esc && it.esc.level > 0));
      if (!mine.length) return h + P.empty('Nichts offen', 'Meldungen, Ausfälle und Rufe an dich erscheinen hier sofort.', true);
      if (esc1.length) h += P.sec('Eskaliert – wartet zu lange', esc1.length) + P.list(esc1, me, now);
      if (rest.length) h += P.sec('Neu und offen', rest.length) + P.list(rest, me, now);
      return h;
    }
    if (f === 'sent') return h + (sent.length ? P.list(sent, me, now) : P.empty('Noch nichts gesendet', 'Über „Senden“ erreichst du Personen, Abteilungen oder die ganze Schicht.'));
    return h + (allOpen.length ? P.list(allOpen, me, now) : P.empty('Alles im Griff', 'Keine offenen Meldungen in der Filiale.', true));
  }

  ui.registerView('inbox', {
    label: 'Eingang', icon: 'inbox', groups: ['lead', 'admin'], order: 25, render,
    badge: (me) => { const l = C.inbox(me.id); return l.length ? { n: l.length, urgent: l.some((i) => i.u || (i.esc && i.esc.level > 0)) } : 0; },
    fab: () => ({ label: 'Senden', icon: 'send', act: 'send-sheet' }),
  });
  ui.on('in-tab', (el) => ui.sub('inTab', el.dataset.k));

  /* ---------- Senden ----------------------------------------------------------- */
  let mode = 'post';
  const choice = (name, opts, sel) => '<fieldset class="sn-choices"><legend class="sn-label">' + esc(opts.legend) + '</legend>' + opts.items.map(([v, l]) => '<label class="sn-choice"><input type="radio" name="' + name + '" value="' + esc(v) + '"' + (v === sel ? ' checked' : '') + (opts.change ? ' data-change="' + opts.change + '"' : '') + '><span>' + esc(l) + '</span></label>').join('') + '</fieldset>';
  const deptSelect = (id, sel) => '<select class="sn-select" id="' + id + '">' + M.DEPTS.map((d) => '<option value="' + esc(d) + '"' + (d === sel ? ' selected' : '') + '>' + esc((M.DEPT_ICONS[d] || '') + ' ' + d) + '</option>').join('') + '</select>';

  function targetFields(me, now) {
    const sh = M.currentShift(now) || me.sh || 'Früh';
    return choice('to-type', { legend: 'An wen?', change: 'send-to', items: [['shift', 'Ganze Schicht (' + sh + ')'], ['dept', 'Abteilung'], ['role', 'Rolle'], ['person', 'Person'], ['all', 'Alle']] }, 'shift')
      + '<div class="sn-field" data-to="dept" hidden><label class="sn-label" for="to-dept">Abteilung</label>' + deptSelect('to-dept', M.deptOf(me, now)) + '</div>'
      + '<div class="sn-field" data-to="role" hidden><label class="sn-label" for="to-role">Rolle</label><select class="sn-select" id="to-role">' + Object.entries(M.ROLE_TARGETS).map(([k, l]) => '<option value="' + k + '">' + esc(l) + '</option>').join('') + '</select></div>'
      + '<div class="sn-field" data-to="person" hidden><label class="sn-label" for="to-person">Person</label><select class="sn-select" id="to-person">' + U.sortBy(M.staff().filter((e) => e.id !== me.id), (e) => e.name).map((e) => '<option value="' + e.id + '">' + esc(e.name + ' · ' + M.role(e).label) + '</option>').join('') + '</select></div>'
      + '<label class="sn-check"><input type="checkbox" id="to-onduty" checked>Nur wer gerade im Dienst ist</label>';
  }
  function readTarget(now) {
    const t = P.picked('to-type') || 'shift';
    const sh = M.currentShift(now) || SN.session.me().sh;
    if (t === 'shift') return { type: 'shift', ids: [sh] };
    if (t === 'dept') return { type: 'dept', ids: [ui.sheetVal('to-dept')] };
    if (t === 'role') return { type: 'role', ids: [ui.sheetVal('to-role')] };
    if (t === 'person') return { type: 'person', ids: [ui.sheetVal('to-person')] };
    return { type: 'all', ids: [] };
  }
  function onlyOnDuty(to, now) {
    if (!ui.sheetVal('to-onduty') || to.type === 'person') return to;
    const ids = M.resolveTo(to, now).filter((id) => M.onDuty(M.emp(id), now) || M.isAdmin(M.emp(id)));
    return { type: 'person', ids, label: to };
  }

  function form(me, now) {
    if (mode === 'post' || mode === 'briefing') {
      return (mode === 'briefing' ? '<p class="sn-muted">Die 3 wichtigsten Infos zum Schichtbeginn. Alle der Schicht müssen quittieren.</p>' + [1, 2, 3].map((i) => '<div class="sn-field"><label class="sn-label" for="br-' + i + '">' + i + '. Info</label><input class="sn-input" id="br-' + i + '"></div>').join('')
        : targetFields(me, now)
          + '<div class="sn-field"><label class="sn-label" for="po-title">Betreff</label><input class="sn-input" id="po-title" placeholder="z. B. Rückruf Babybrei – Regal räumen"></div>'
          + '<div class="sn-field"><label class="sn-label" for="po-body">Text</label><textarea class="sn-textarea" id="po-body" rows="3"></textarea></div>'
          + '<label class="sn-switch">Quittierung verlangen<input type="checkbox" role="switch" id="po-ack" checked></label>')
        + '<label class="sn-check"><input type="checkbox" id="po-u">🔥 Dringend (Frist ' + M.settings().deadlines.postUrgent + ' statt ' + M.settings().deadlines.post + ' Min, dann eskaliert es an die Schichtleitung)</label>';
    }
    if (mode === 'task') {
      return '<div class="sn-field"><label class="sn-label" for="tk-title">Was ist zu tun?</label><textarea class="sn-textarea" id="tk-title" rows="2" placeholder="Ein Auftrag pro Zeile"></textarea></div>'
        + '<div class="sn-field"><label class="sn-label" for="tk-dept">Abteilung</label>' + deptSelect('tk-dept', M.deptOf(me, now)) + '</div>'
        + '<div class="sn-field"><label class="sn-label" for="tk-act">Tätigkeit (Dauer nach Richtwert)</label><select class="sn-select" id="tk-act">' + M.ACTS.map((a) => '<option value="' + esc(a.key) + '">' + esc(a.label) + '</option>').join('') + '</select></div>'
        + choice('tk-due', { legend: 'Frist', items: [['60', 'In 1 Stunde'], ['shift', 'Bis Schichtende'], ['tomorrow', 'Morgen']] }, 'shift')
        + '<label class="sn-check"><input type="checkbox" id="tk-u">🔥 Dringend</label>'
        + '<label class="sn-switch">Foto als Nachweis<input type="checkbox" role="switch" id="tk-proof"></label>'
        + '<label class="sn-switch">Eskalieren, wenn bis Frist nicht erledigt<input type="checkbox" role="switch" id="tk-esc" checked></label>'
        + '<p class="sn-muted sn-small">Wird automatisch verteilt: gleiche Abteilung und passende Tätigkeit zuerst, geringste Auslastung gewinnt, nie über das Limit.</p>';
    }
    if (mode === 'kudos') {
      return '<div class="sn-field"><label class="sn-label" for="ku-to">Für wen?</label><select class="sn-select" id="ku-to">' + U.sortBy(M.staff().filter((e) => e.id !== me.id), (e) => e.name).map((e) => '<option value="' + e.id + '">' + esc(e.name) + '</option>').join('') + '</select></div>'
        + '<div class="sn-field"><label class="sn-label" for="ku-text">Danke für …</label><input class="sn-input" id="ku-text" placeholder="z. B. die schnelle Hilfe an Kasse 3"></div>'
        + '<p class="sn-muted sn-small">Lob ist persönlich. Es gibt keine Zähler und keine Ranglisten.</p>';
    }
    return '';
  }

  function openSend() {
    const me = SN.session.me(), now = SN.clock.now();
    const modes = [['post', '📣 Anweisung'], ['task', '✅ Auftrag'], ['briefing', '☀️ Kurzbriefing'], ['kudos', '💛 Lob']];
    ui.sheet('Senden', '<div class="sn-segment" role="tablist">' + modes.map(([k, l]) => '<button type="button" role="tab" class="sn-segment__tab" data-act="send-mode" data-k="' + k + '" aria-selected="' + (k === mode) + '">' + l + '</button>').join('') + '</div>'
      + '<button type="button" class="sn-btn sn-btn--ghost sn-btn--block" data-act="call-sheet">' + icon('bell') + '<span>Schnellruf (Kasse öffnen, Besprechung …)</span></button>'
      + '<div id="send-form">' + form(me, now) + '</div>',
      '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" data-act="send-go">' + icon('send') + '<span>Senden</span></button>');
  }
  ui.on('send-sheet', () => { mode = 'post'; openSend(); });
  ui.on('send-mode', (el) => { mode = el.dataset.k; openSend(); });
  ui.onChange('send-to', (el) => document.querySelectorAll('[data-to]').forEach((x) => { x.hidden = x.dataset.to !== el.value; }));

  function dueFrom(v, now, me) {
    if (v === '60') return now + 60 * U.MIN;
    if (v === 'tomorrow') return U.startOfDay(now) + U.DAY + 12 * U.HOUR;
    const w = M.shiftWindow(me, now);
    return w && w.e > now ? w.e : now + 4 * U.HOUR;
  }

  ui.on('send-go', async (el) => {
    const me = SN.session.me(), now = SN.clock.now();
    let r;
    if (mode === 'post') {
      const title = String(ui.sheetVal('po-title') || '').trim();
      if (!title) return ui.toast('Bitte einen Betreff eingeben.', 'warn');
      const to = onlyOnDuty(readTarget(now), now);
      if (!M.resolveTo(to, now).filter((id) => id !== me.id).length) return ui.toast('Niemand erreichbar mit dieser Auswahl.', 'warn');
      r = await C.post(me.id, { to, title, body: ui.sheetVal('po-body') || '', needAck: !!ui.sheetVal('po-ack'), u: !!ui.sheetVal('po-u') });
    } else if (mode === 'briefing') {
      const lines = [1, 2, 3].map((i) => String(ui.sheetVal('br-' + i) || '').trim()).filter(Boolean);
      if (!lines.length) return ui.toast('Bitte mindestens eine Info eintragen.', 'warn');
      const sh = M.currentShift(now) || me.sh;
      r = await C.post(me.id, { to: { type: 'shift', ids: [sh] }, title: 'Kurzbriefing ' + sh + 'schicht', body: lines.map((l, i) => (i + 1) + '. ' + l).join('\n'), needAck: true, briefing: true, u: !!ui.sheetVal('po-u') });
    } else if (mode === 'task') {
      const lines = String(ui.sheetVal('tk-title') || '').split('\n').map((x) => x.trim()).filter(Boolean);
      if (!lines.length) return ui.toast('Bitte beschreiben, was zu tun ist.', 'warn');
