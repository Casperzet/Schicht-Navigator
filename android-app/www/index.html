/* ===== src/views/12-cockpit.js ===== */
try {

   Steuerpult (Schichtleitung, Teamleitung) – ersetzt „Start“ für die Gruppe lead

(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, L = SN.lead, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;

  /* ---------- Bausteine --------------------------------------------------- */
  function head(m, t, amp) {

      return ui.sheet('Hilfe nötig', '<p>Geht dringend an die Filialleitung und den Admin vom Dienst. Du siehst, wer reagiert.</p><div class="sn-field"><label class="sn-label" for="cp-lage-note">Was fehlt? (optional)</label><input class="sn-input" id="cp-lage-note" placeholder="z. B. 3 Leute an der Kasse fehlen"></div>',

    }
    R(await L.sendLage(me().id, el.dataset.k, ''), 'Lage gesendet: ' + L.LAGE[el.dataset.k].label);
  });
  ui.on('cp-lage-go', async (el) => {
    const r = await L.sendLage(me().id, el.dataset.k, String(ui.sheetVal('cp-lage-note') || '').trim());
    if (R(r, 'Hilfe angefordert – du siehst, wer reagiert')) ui.closeSheet();
  });

  /* Meldung nach oben: Kategorie → (Text) → Senden */
  ui.on('cp-up', (el) => {
    const c = M.CAT[el.dataset.k];
    if (!c) return;
    ui.sheet('An Filialleitung: ' + (UP[c.key] || UP.other)[0], '<p class="sn-muted">Geht direkt an ' + esc(M.labelFor(L.upTargets(me().id, now()))) + '. Du siehst, wann es gesehen wird.</p>'
      + '<div class="sn-field"><label class="sn-label" for="cp-up-text">Kurz dazu (optional)</label><input class="sn-input" id="cp-up-text" placeholder="z. B. Gang 7, Aktion steht nicht"></div>'
      + '<label class="sn-check"><input type="checkbox" id="cp-up-u">' + icon('flame') + ' Dringend</label>',
    P.btn('An Filialleitung senden', 'cp-up-go', { k: c.key }, 'primary', 'send'));
  });
  ui.on('cp-up-go', async (el) => {
    const r = await L.reportUp(me().id, el.dataset.k, { body: String(ui.sheetVal('cp-up-text') || '').trim(), u: !!ui.sheetVal('cp-up-u') });
    if (R(r, 'Gesendet – du siehst, wann es gesehen wird')) ui.closeSheet();
  });

  /* Rundgänge */
  ui.on('cp-check-start', async (el) => { const r = await L.startCheck(el.dataset.k, me().id); if (R(r)) { ui.go('cockpit', {}); } });
  ui.on('cp-pt', async (el) => {
    const it = C.get(el.dataset.id), i = +el.dataset.i;
    const cur = it && it.checklist[i];
    const s = cur && ((el.dataset.s === 'ok' && cur.done) || (el.dataset.s === 'miss' && cur.miss)) ? 'open' : el.dataset.s;
    R(await L.markPoint(el.dataset.id, me().id, i, s));
  });
  ui.on('cp-check-finish', async (el) => {
    if (el.getAttribute('aria-disabled') === 'true') return ui.toast('Bitte erst alle Punkte beantworten.', 'warn');
    const r = await L.finishCheck(el.dataset.id, me().id);
    if (!R(r)) return;
    ui.toast(r.misses ? U.fmt.count(r.misses, 'Mangel', 'Mängel') + ': ' + U.fmt.count(r.tasks.length, 'Auftrag', 'Aufträge') + ' und ' + U.fmt.count(r.reports.length, 'Meldung', 'Meldungen') + ' angelegt' : 'Rundgang ohne Mängel abgeschlossen');
  });

  /* Team */
  ui.on('cp-call', async (el) => R(await L.callPerson(me().id, el.dataset.id, ''), 'Ruf an ' + M.first(el.dataset.id) + ' gesendet – du siehst die Antwort'));

  /* Schichtübergabe */
  ui.on('cp-handover', () => {
    const m = me(), t = now(), h = L.handoverState(m, t);
    ui.sheet('Schichtübergabe', '<p>Automatisch dabei: ' + esc(C.handoverSummary(h.shift || m.sh, t).text) + '</p><div class="sn-field"><label class="sn-label" for="cp-ho-notes">Hinweise für die nächste Schicht</label><textarea class="sn-textarea" id="cp-ho-notes" rows="3" placeholder="z. B. Kühlregal 3 tropft, Techniker kommt 15 Uhr"></textarea></div>',
      P.btn('Übergabe senden', 'cp-ho-go', {}, 'primary', 'send'));
  });
  ui.on('cp-ho-go', async () => {
    const r = await C.sendHandover(me().id, { notes: String(ui.sheetVal('cp-ho-notes') || '').trim() });
    if (R(r, 'Übergabe gesendet – die nächste Schicht muss quittieren')) ui.closeSheet();
  });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/12-cockpit.js konnte nicht geladen werden:", e); }

/* ===== src/views/14-overview.js ===== */
try {
/* ==========================================================================
   Übersicht (Filialleitung, Admin) – erste Registerkarte
   Teil 1 „Meldungen“: Kennzahlen, Verlauf der letzten Stunden, Filter, Sammel-Liste
          aller Vorgänge mit Zustand, „Wartet auf …“ und Direktaktionen.
   Teil 2 „Anwesenheit“: wer ist im Dienst, wer fehlt (nur hier mit Grund),
          Besetzung je Abteilung gegen Soll, Pausen-Hinweise, Früh/Spät, Wochentag.
   Keine Ranglisten, keine Leistungsvergleiche von Personen.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, O = SN.overview, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  const LIMIT = 15;
  const DEPT_ICON = {
    'Trocken sortiment': 'dept-trocken', 'Getränkeabteilung': 'dept-getraenke', 'Kasse': 'dept-kasse', 'Info': 'dept-info', 'MoPro': 'dept-mopro',
    'Moon Food Abteilung': 'dept-moon', 'Alkoholische Getränke': 'dept-alkohol', 'Drogerie': 'dept-drogerie', 'Fertige Gerichte': 'dept-fertig',
    'Konserven': 'dept-konserven', 'Obst und Gemüse': 'dept-obst', 'Backshop und Frischetheke': 'dept-backshop', 'Lager': 'dept-lager',
    'Wareneinnahme': 'dept-wareneingang', 'Leergut': 'dept-leergut',
  };
  const tab = (sub) => sub.ovTab || 'items';

  /* ---------- Teil 1: Meldungen ------------------------------------------- */
  function kpi(k, value, label, opts) {
    opts = opts || {};
    const on = opts.on;
    return '<button type="button" class="sn-kpi sn-ov-kpi' + (opts.alert && value ? ' sn-kpi--alert' : '') + (opts.wide ? ' sn-ov-kpi--wide' : '') + '" data-act="ov-view" data-k="' + k + '" aria-pressed="' + (!!on) + '">'
      + '<span class="sn-ov-kpi__top">' + icon(opts.icon || 'inbox') + '<span class="sn-kpi__value">' + value + '</span></span>'
      + '<span class="sn-kpi__label">' + esc(label) + '</span>' + (opts.hint ? '<span class="sn-ov-kpi__hint">' + esc(opts.hint) + '</span>' : '') + '</button>';
  }

  function chart(now) {
    const h = O.hourly(now, 8);
    const max = Math.max(1, ...h.map((x) => x.total));
    const total = h.reduce((s, x) => s + x.total, 0);
    return '<section class="sn-card sn-ov-chart" aria-labelledby="ov-ch"><div class="sn-row sn-row--between"><h3 class="sn-ov-h" id="ov-ch">Neue Vorgänge je Stunde</h3><span class="sn-muted sn-small">' + esc(U.fmt.count(total, 'Vorgang', 'Vorgänge')) + ' in 8 Std</span></div>'
      + '<div class="sn-ov-bars" role="img" aria-label="' + esc(h.map((x) => x.hour + ' Uhr: ' + x.total).join(', ')) + '">'
      + h.map((x, i) => '<div class="sn-ov-bar' + (i === h.length - 1 ? ' is-now' : '') + '"><span class="sn-ov-bar__n">' + (x.total || '') + '</span><span class="sn-ov-bar__col">'
        + (x.open ? '<i class="sn-ov-bar__open" style="height:' + Math.round(x.open / max * 100) + '%"></i>' : '') + (x.done ? '<i class="sn-ov-bar__done" style="height:' + Math.round(x.done / max * 100) + '%"></i>' : '')
        + '</span><span class="sn-ov-bar__h">' + x.hour + '</span></div>').join('') + '</div>'
      + '<p class="sn-ov-legend"><span class="sn-ov-key sn-ov-key--open"></span>offen <span class="sn-ov-key sn-ov-key--done"></span>erledigt oder gesehen <span class="sn-muted">· Uhrzeit unten</span></p></section>';
  }

  function itemActions(it, me) {
    if (C.isFinal(it)) return P.btn('Ansehen', 'it-open', { id: it.id }, 'ghost', 'eye');
    const a = [];
    const waiting = O.isWaiting(it);
    switch (it.kind) {
      case 'report': case 'absence':
        if (it.state !== 'taken') a.push(P.btn('Übernehmen', 'it-take', { id: it.id }, 'primary', 'check'));
        else if (it.owner === me.id) a.push(P.btn('Erledigt', 'it-done', { id: it.id }, 'primary', 'check'));
        a.push(P.btn('Weitergeben', 'it-forward', { id: it.id }, 'secondary', 'forward'));
        a.push(P.btn('Antworten', 'it-open', { id: it.id }, 'secondary', 'chat'));
        if (waiting) a.push(P.btn('Nachfassen', 'it-remind', { id: it.id }, 'ghost', 'bell'));
        break;
      case 'photo':
        a.push(P.btn('Foto ansehen', 'ph-open', { id: it.id }, 'primary', 'image'));
        a.push(P.btn('Antworten', 'it-open', { id: it.id }, 'secondary', 'chat'));
        a.push(P.btn('Nachfassen', 'it-remind', { id: it.id }, 'ghost', 'bell'));
        break;
      case 'sos':
        if (it.from !== me.id && !(it.answers || {})[me.id]) a.push(P.btn('Hilfe kommt, ich gehe hin', 'sos-respond', { id: it.id }, 'primary', 'run'));
        a.push(P.btn('Ansehen', 'it-open', { id: it.id }, 'secondary', 'eye'));
        break;
      case 'call':
        a.push(P.btn('Nachfassen', 'it-remind', { id: it.id }, 'primary', 'bell'));
        a.push(P.btn('Ansehen', 'it-open', { id: it.id }, 'secondary', 'eye'));
        a.push(P.btn('Schließen', 'it-close', { id: it.id }, 'ghost'));
        break;
      default: // Anweisung, Übergabe
        a.push(P.btn('Nachfassen', 'it-remind', { id: it.id }, 'primary', 'bell'));
        a.push(P.btn(it.kind === 'post' ? 'Wer fehlt?' : 'Ansehen', 'it-open', { id: it.id }, 'secondary', 'eye'));
    }
    return a.join('');
  }

  function itemsTab({ me, now, sub }) {
    const staleMin = sub.ovStale || 10;
    const view = sub.ovView || 'open';
    const f = { view, kind: sub.ovKind || '', dept: sub.ovDept || '', shift: sub.ovShift || '', urgent: !!sub.ovUrgent, staleMin };
    const s = O.stats(now, { staleMin });
    const list = O.filter(f, now);
    const limit = sub.ovLimit || LIMIT;
    const filtered = view !== 'open' || f.kind || f.dept || f.shift || f.urgent;
    let h = '<div class="sn-kpis sn-ov-kpis">'
      + kpi('open', s.open, 'Offen', { on: view === 'open', icon: 'inbox' })
      + kpi('esc', s.escalated, 'Eskaliert', { on: view === 'esc', icon: 'escalate', alert: true })
      + kpi('unseen', s.unseenPhotos, 'Ungesehene Fotoberichte', { on: view === 'unseen', icon: 'camera', alert: true })
      + kpi('stale', s.stale, 'Unbeantwortet', { on: view === 'stale', icon: 'clock', hint: 'seit mehr als ' + staleMin + ' Min', alert: true })
      + kpi('done', s.doneToday, 'Heute erledigt', { on: view === 'done', icon: 'check-circle', wide: true }) + '</div>';
    h += chart(now);
    // Filter
    h += P.sec('Filter')
      + '<div class="sn-chips sn-chips--scroll" role="group" aria-label="Art">' + [['', 'Alle Arten']].concat(O.KINDS).map(([k, l]) => '<button type="button" class="sn-chip ' + ((f.kind || '') === k ? 'sn-chip--solid' : 'sn-chip--outline') + '" aria-pressed="' + ((f.kind || '') === k) + '" data-act="ov-kind" data-k="' + k + '">' + esc(l) + '</button>').join('') + '</div>'
      + '<div class="sn-filter"><div><label class="sn-label sn-sr-only" for="ov-dept">Abteilung</label><select class="sn-select" id="ov-dept" data-change="ov-dept"><option value="">Alle Abteilungen</option>' + M.DEPTS.map((d) => '<option value="' + esc(d) + '"' + (d === f.dept ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</select></div>'
      + '<button type="button" class="sn-chip ' + (f.urgent ? 'sn-chip--solid' : 'sn-chip--outline') + ' sn-ov-urgent" aria-pressed="' + f.urgent + '" data-act="ov-urgent">' + icon('flame') + 'Dringend</button></div>'
      + '<div class="sn-segment" role="group" aria-label="Schicht">' + [['', 'Alle'], ['Früh', 'Früh'], ['Spät', 'Spät']].map(([k, l]) => '<button type="button" class="sn-segment__tab" aria-pressed="' + ((f.shift || '') === k) + '" data-act="ov-shift" data-k="' + k + '">' + esc(l) + '</button>').join('') + '</div>'
      + '<div class="sn-row sn-ov-stale"><span class="sn-small">Unbeantwortet ab</span>' + O.STALE_CHOICES.map((m) => '<button type="button" class="sn-chip ' + (m === staleMin ? 'sn-chip--solid' : 'sn-chip--outline') + '" aria-pressed="' + (m === staleMin) + '" data-act="ov-stale" data-k="' + m + '">' + m + ' Min</button>').join('') + '</div>';
    const vl = (O.VIEWS.find((x) => x[0] === view) || [])[1];
    h += '<div class="sn-row sn-row--between sn-ov-listhead"><h2 class="sn-section-title" style="margin:0">' + esc(vl) + ' <small>' + list.length + '</small></h2>' + (filtered ? '<button type="button" class="sn-btn sn-btn--ghost" data-act="ov-reset">' + icon('x') + '<span>Filter zurücksetzen</span></button>' : '') + '</div>';
    if (!list.length) h += P.empty(view === 'open' || view === 'esc' || view === 'stale' || view === 'unseen' ? 'Alles im Griff' : 'Nichts gefunden', filtered ? 'Mit diesen Filtern gibt es keine Vorgänge.' : 'Keine offenen Vorgänge in der Filiale.', view !== 'done' && view !== 'all');
    else {
      h += list.slice(0, limit).map((it) => '<div class="sn-ov-item">' + P.itemCard(it, me, now, { compact: true, noActions: true }) + '<div class="sn-card__actions sn-ov-actions">' + itemActions(it, me) + '</div></div>').join('');
      if (list.length > limit) h += P.btn('Weitere ' + (list.length - limit) + ' anzeigen', 'ov-more', {}, 'secondary');
    }
    return h;
  }

  /* ---------- Teil 2: Anwesenheit ------------------------------------------ */
  const TYPE_ICON = { sick: 'thermometer', vac: 'sun', late: 'clock', other: 'user-x' };
  function awayRow(a, p) {
    const e = M.emp(a.id);
    return '<li class="sn-list__item sn-ov-away"><span class="sn-avatar sn-avatar--sm">' + esc(P.initials(M.name(a.id))) + '</span><div class="sn-list__body"><p class="sn-list__title">' + esc(M.name(a.id)) + '</p>'
      + '<p class="sn-list__sub">' + esc((a.dept || '–') + ' · ' + (e ? M.role(e).label : '')) + '</p>'
      + '<span class="sn-chip sn-chip--warn">' + icon(TYPE_ICON[a.type] || 'user-x') + esc(O.AWAY_TYPES[a.type] + ' · ' + a.period) + '</span></div>'
      + '<button type="button" class="sn-btn sn-btn--ghost" data-act="st-open" data-id="' + a.id + '" aria-label="Details zu ' + esc(M.name(a.id)) + '">' + icon('edit') + '<span>Details</span></button></li>';
  }
  function deptRow(r, sel) {
    const pct = r.need ? Math.min(100, Math.round(r.have / r.need * 100)) : 100;
    const txt = r.short ? 'Unterbesetzt: ' + r.short + ' fehlt' : 'Passt';
    return '<li><button type="button" class="sn-ov-dept' + (r.short ? ' is-short' : '') + (sel === r.dept ? ' is-sel' : '') + '" data-act="ap-dept" data-dept="' + esc(r.dept) + '" aria-pressed="' + (sel === r.dept) + '">'
      + '<span class="sn-ov-dept__name">' + icon(DEPT_ICON[r.dept] || 'tag') + '<span>' + esc(r.dept) + '</span></span>'
      + '<span class="sn-ov-dept__n"><b>' + r.have + '</b> von ' + r.need + '</span>'
      + '<span class="sn-ov-dept__bar" aria-hidden="true"><i style="width:' + pct + '%"></i></span>'
      + '<span class="sn-ov-dept__txt">' + (r.short ? icon('alert') : icon('check')) + esc(txt) + '</span></button></li>';
  }
  function presenceTab({ me, now, sub }) {
    const shift = sub.apShift || M.currentShift(now) || 'Früh';
    const idx = sub.apDay === undefined ? O.todayIdx(now) : sub.apDay;
    const p = O.presence(idx, shift, now);
    const dayName = M.DAYS[idx] + (p.isToday ? ' (heute)' : ' ' + U.fmt.date(O.dayStart(idx, now)).slice(4));
    let h = '<div class="sn-segment" role="group" aria-label="Schicht">' + M.SHIFT_NAMES.map((s) => '<button type="button" class="sn-segment__tab" aria-pressed="' + (s === shift) + '" data-act="ap-shift" data-k="' + s + '">' + esc(M.SHIFTS[s].label) + '</button>').join('') + '</div>'
      + '<div class="sn-chips sn-chips--scroll" role="group" aria-label="Wochentag">' + M.DAYS.map((d, i) => '<button type="button" class="sn-chip ' + (i === idx ? 'sn-chip--solid' : 'sn-chip--outline') + '" aria-pressed="' + (i === idx) + '" data-act="ap-day" data-k="' + i + '">' + d + (i === O.todayIdx(now) ? ' · heute' : '') + '</button>').join('') + '</div>';
    h += '<p class="sn-muted sn-small sn-ov-ctx">' + esc(dayName + ' · ' + M.SHIFTS[shift].label) + (p.live ? ' · läuft jetzt' : p.isToday ? ' · Vorschau' : ' · Plan') + '</p>';
    const k = (v, l, o) => '<div class="sn-kpi' + (o && o.alert && v ? ' sn-kpi--alert' : '') + '"><span class="sn-kpi__value">' + v + '</span><span class="sn-kpi__label">' + esc(l) + '</span></div>';
    h += '<div class="sn-kpis sn-ov-kpis3">' + k(p.present, p.live ? 'Im Dienst' : 'Eingeplant') + (p.live ? k(p.counts.free, 'Frei') + k(p.counts.work, 'Arbeiten') + k(p.counts.pause, 'Pause') : k(p.leads, 'Leitung') + k(p.cleaning, 'Reinigung'))
      + k(p.away.length, 'Abwesend', { alert: true }) + (p.live ? k(p.leads, 'Leitung') : '') + '</div>';
    // Hinweise
    const hints = [];
    for (const s of p.short) hints.push('<div class="sn-alert sn-alert--warn sn-alert--card"><span class="sn-alert__icon">' + icon('alert') + '</span><p class="sn-alert__title">' + esc(s.dept) + ' unterbesetzt: ' + s.have + ' von ' + s.need + '</p>'
      + (p.live ? '<div class="sn-alert__actions">' + P.btn('Verstärkung holen', 'ov-reinf', { dept: s.dept }, 'primary', 'users') + '</div>' : '<p class="sn-alert__text">Bitte rechtzeitig Plan oder Einspringer klären.</p>') + '</div>');
    if (p.pauseDue.length) hints.push('<div class="sn-alert sn-alert--info sn-alert--card"><span class="sn-alert__icon">' + icon('coffee') + '</span><p class="sn-alert__title">Pause fällig: ' + (p.pauseDue.length > 5 ? esc(U.fmt.count(p.pauseDue.length, 'Person', 'Personen')) : esc(p.pauseDue.map(M.first).join(', '))) + '</p><p class="sn-alert__text">Seit 5,5 Std im Dienst ohne Pause. Bitte kurz erinnern.</p></div>');
    if (p.pauseOver.length) hints.push('<div class="sn-alert sn-alert--warn sn-alert--card"><span class="sn-alert__icon">' + icon('coffee') + '</span><p class="sn-alert__title">Pause überzogen: ' + esc(p.pauseOver.map((x) => M.first(x.id)).join(', ')) + '</p><p class="sn-alert__text">Kurz nachfragen – ohne Vorwurf, vielleicht ist etwas passiert.</p></div>');
    if (hints.length) h += P.sec('Hinweise', hints.length) + hints.join('');
    // Abwesend
    h += P.sec('Abwesend', p.away.length) + (p.away.length ? '<ul class="sn-list">' + p.away.map((a) => awayRow(a, p)).join('') + '</ul><p class="sn-muted sn-small">Gründe sehen nur Filialleitung und Admin.</p>' : P.empty('Niemand abwesend', 'Alle Eingeplanten sind da.', true));
    // Besetzung
    const sel = sub.apDept || '';
    h += P.sec('Besetzung gegen Soll') + '<ul class="sn-ov-depts">' + p.byDept.map((r) => deptRow(r, sel)).join('') + '</ul>';
    if (sel) {
      const r = p.byDept.find((x) => x.dept === sel);
      const ids = r ? r.ids : [];
      h += '<div class="sn-row sn-row--between sn-ov-listhead"><h2 class="sn-section-title" style="margin:0">' + esc(sel) + ' <small>' + ids.length + '</small></h2><button type="button" class="sn-btn sn-btn--ghost" data-act="ap-dept" data-dept="">' + icon('x') + '<span>Auswahl aufheben</span></button></div>'
        + (ids.length ? ids.map((id) => (p.live && P.livePerson ? P.livePerson(M.emp(id), now) : '<div class="sn-card sn-ov-plain"><div class="sn-person-row"><span class="sn-avatar">' + esc(P.initials(M.name(id))) + '</span><div><p><b>' + esc(M.name(id)) + '</b></p><p class="sn-muted sn-small">' + esc(M.role(M.emp(id)).label + ' · eingeplant') + '</p></div></div></div>')).join('') : P.empty('Niemand eingeplant', 'In dieser Abteilung ist für die Schicht niemand im Dienst.'));
    }
    h += '<div class="sn-row sn-ov-links">' + P.btn('Personal bearbeiten', 'go-staff', {}, 'secondary', 'users') + P.btn('Soll-Besetzung ändern', 'go-staffing', {}, 'ghost', 'settings') + '</div>';
    return h;
  }

  function render(ctx) {
    const t = tab(ctx.sub);
    const s = O.stats(ctx.now);
    const head = '<div class="sn-segment sn-segment--sticky" role="tablist">'
      + '<button type="button" role="tab" class="sn-segment__tab" aria-selected="' + (t === 'items') + '" data-act="ov-tab" data-k="items">' + icon('inbox') + 'Meldungen' + (s.open ? ' <span class="sn-badge">' + s.open + '</span>' : '') + '</button>'
      + '<button type="button" role="tab" class="sn-segment__tab" aria-selected="' + (t === 'presence') + '" data-act="ov-tab" data-k="presence">' + icon('users') + 'Anwesenheit</button></div>';
    return '<div class="sn-ov">' + head + (t === 'items' ? itemsTab(ctx) : presenceTab(ctx)) + '</div>';
  }

  ui.registerView('overview', {
    label: 'Übersicht', icon: 'home', groups: ['admin'], order: 10, render,
    fab: () => ({ label: 'Senden', icon: 'send', act: 'send-sheet' }),
    badge: (me) => { const n = O.stats().escalated; return n ? { n, urgent: true } : 0; },
  });

  /* ---------- Aktionen ------------------------------------------------------- */
  ui.on('ov-tab', (el) => ui.sub('ovTab', el.dataset.k));

    return h + (allOpen.length ? P.list(allOpen, me, now) : P.empty('Alles im Griff', 'Keine offenen Meldungen in der Filiale.', true));
  }

  ui.registerView('inbox', {
    label: 'Eingang', icon: 'inbox', groups: ['lead', 'admin'], order: 25, render,
    badge: (me) => { const l = C.inbox(me.id); return l.length ? { n: l.length, urgent: l.some((i) => i.u || (i.esc && i.esc.level > 0)) } : 0; },
    fab: () => ({ label: 'Senden', icon: 'send', act: 'send-sheet' }),
  });
  ui.on('in-tab', (el) => ui.sub('inTab', el.dataset.k));

  /* ---------- Senden ----------------------------------------------------------- */
  let mode = 'post';
  const choice = (name, opts, sel) => '<fieldset class="sn-choices"><legend class="sn-label">' + esc(opts.legend) + '</legend>' + opts.items.map(([v, l]) => '<label class="sn-choice"><input type="radio" name="' + name + '" value="' + esc(v) + '"' + (v === sel ? ' checked' : '') + (opts.change ? ' data-change="' + opts.change + '"' : '') + '><span>' + esc(l) + '</span></label>').join('') + '</fieldset>';
  const deptSelect = (id, sel) => '<select class="sn-select" id="' + id + '">' + M.DEPTS.map((d) => '<option value="' + esc(d) + '"' + (d === sel ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</select>';

  function targetFields(me, now) {
    const sh = M.currentShift(now) || me.sh || 'Früh';
    return choice('to-type', { legend: 'An wen?', change: 'send-to', items: [['shift', 'Ganze Schicht (' + sh + ')'], ['dept', 'Abteilung'], ['role', 'Rolle'], ['person', 'Person'], ['all', 'Alle']] }, 'shift')
      + '<div class="sn-field" data-to="dept" hidden><label class="sn-label" for="to-dept">Abteilung</label>' + deptSelect('to-dept', M.deptOf(me, now)) + '</div>'
      + '<div class="sn-field" data-to="role" hidden><label class="sn-label" for="to-role">Rolle</label><select class="sn-select" id="to-role">' + Object.entries(M.ROLE_TARGETS).map(([k, l]) => '<option value="' + k + '">' + esc(l) + '</option>').join('') + '</select></div>'
      + '<div class="sn-field" data-to="person" hidden><label class="sn-label" for="to-person">Person</label><select class="sn-select" id="to-person">' + U.sortBy(M.staff().filter((e) => e.id !== me.id), (e) => e.name).map((e) => '<option value="' + e.id + '">' + esc(e.name + ' · ' + M.role(e).label) + '</option>').join('') + '</select></div>'
      + '<label class="sn-check"><input type="checkbox" id="to-onduty" checked>Nur wer gerade im Dienst ist</label>';
  }
  function readTarget(now) {
    const t = P.picked('to-type') || 'shift';
    const sh = M.currentShift(now) || SN.session.me().sh;
    if (t === 'shift') return { type: 'shift', ids: [sh] };
    if (t === 'dept') return { type: 'dept', ids: [ui.sheetVal('to-dept')] };
    if (t === 'role') return { type: 'role', ids: [ui.sheetVal('to-role')] };
    if (t === 'person') return { type: 'person', ids: [ui.sheetVal('to-person')] };
    return { type: 'all', ids: [] };
  }
  function onlyOnDuty(to, now) {
    if (!ui.sheetVal('to-onduty') || to.type === 'person') return to;
    const ids = M.resolveTo(to, now).filter((id) => M.onDuty(M.emp(id), now) || M.isAdmin(M.emp(id)));
    return { type: 'person', ids, label: to };
  }

  function form(me, now) {
    if (mode === 'post' || mode === 'briefing') {
      return (mode === 'briefing' ? '<p class="sn-muted">Die 3 wichtigsten Infos zum Schichtbeginn. Alle der Schicht müssen quittieren.</p>' + [1, 2, 3].map((i) => '<div class="sn-field"><label class="sn-label" for="br-' + i + '">' + i + '. Info</label><input class="sn-input" id="br-' + i + '"></div>').join('')
        : targetFields(me, now)
          + '<div class="sn-field"><label class="sn-label" for="po-title">Betreff</label><input class="sn-input" id="po-title" placeholder="z. B. Rückruf Babybrei – Regal räumen"></div>'
          + '<div class="sn-field"><label class="sn-label" for="po-body">Text</label><textarea class="sn-textarea" id="po-body" rows="3"></textarea></div>'
          + '<label class="sn-switch">Quittierung verlangen<input type="checkbox" role="switch" id="po-ack" checked></label>')
        + '<label class="sn-check"><input type="checkbox" id="po-u"><span><span class="sn-inline">' + ui.urgent() + '</span> (Frist ' + M.settings().deadlines.postUrgent + ' statt ' + M.settings().deadlines.post + ' Min, dann eskaliert es an die Schichtleitung)</span></label>';
    }
    if (mode === 'task') {
      return '<div class="sn-field"><label class="sn-label" for="tk-title">Was ist zu tun?</label><textarea class="sn-textarea" id="tk-title" rows="2" placeholder="Ein Auftrag pro Zeile"></textarea></div>'
        + '<div class="sn-field"><label class="sn-label" for="tk-dept">Abteilung</label>' + deptSelect('tk-dept', M.deptOf(me, now)) + '</div>'
        + '<div class="sn-field"><label class="sn-label" for="tk-act">Tätigkeit (Dauer nach Richtwert)</label><select class="sn-select" id="tk-act">' + M.ACTS.map((a) => '<option value="' + esc(a.key) + '">' + esc(a.label) + '</option>').join('') + '</select></div>'
        + choice('tk-due', { legend: 'Frist', items: [['60', 'In 1 Stunde'], ['shift', 'Bis Schichtende'], ['tomorrow', 'Morgen']] }, 'shift')
        + '<label class="sn-check"><input type="checkbox" id="tk-u"><span class="sn-inline">' + ui.urgent() + '</span></label>'
        + '<label class="sn-switch">Foto als Nachweis<input type="checkbox" role="switch" id="tk-proof"></label>'
        + '<label class="sn-switch">Eskalieren, wenn bis Frist nicht erledigt<input type="checkbox" role="switch" id="tk-esc" checked></label>'
        + '<p class="sn-muted sn-small">Wird automatisch verteilt: gleiche Abteilung und passende Tätigkeit zuerst, geringste Auslastung gewinnt, nie über das Limit.</p>';
    }
    if (mode === 'kudos') {
      return '<div class="sn-field"><label class="sn-label" for="ku-to">Für wen?</label><select class="sn-select" id="ku-to">' + U.sortBy(M.staff().filter((e) => e.id !== me.id), (e) => e.name).map((e) => '<option value="' + e.id + '">' + esc(e.name) + '</option>').join('') + '</select></div>'
        + '<div class="sn-field"><label class="sn-label" for="ku-text">Danke für …</label><input class="sn-input" id="ku-text" placeholder="z. B. die schnelle Hilfe an Kasse 3"></div>'
        + '<p class="sn-muted sn-small">Lob ist persönlich. Es gibt keine Zähler und keine Ranglisten.</p>';
    }
    return '';
  }

  function openSend() {
    const me = SN.session.me(), now = SN.clock.now();
    const modes = [['post', 'Anweisung', 'report'], ['task', 'Auftrag', 'tasks'], ['briefing', 'Briefing', 'sun'], ['kudos', 'Lob', 'heart']];
    ui.sheet('Senden', '<div class="sn-segment" role="tablist">' + modes.map(([k, l, ic]) => '<button type="button" role="tab" class="sn-segment__tab sn-segment__tab--icon" data-act="send-mode" data-k="' + k + '" aria-selected="' + (k === mode) + '">' + icon(ic) + '<span>' + l + '</span></button>').join('') + '</div>'
      + '<button type="button" class="sn-btn sn-btn--ghost sn-btn--block" data-act="call-sheet">' + icon('bell') + '<span>Schnellruf (Kasse öffnen, Besprechung …)</span></button>'
      + '<div id="send-form">' + form(me, now) + '</div>',
      '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" data-act="send-go">' + icon('send') + '<span>Senden</span></button>');
  }
  ui.on('send-sheet', () => { mode = 'post'; openSend(); });
  ui.on('send-mode', (el) => { mode = el.dataset.k; openSend(); });
  ui.onChange('send-to', (el) => document.querySelectorAll('[data-to]').forEach((x) => { x.hidden = x.dataset.to !== el.value; }));

  function dueFrom(v, now, me) {
    if (v === '60') return now + 60 * U.MIN;
    if (v === 'tomorrow') return U.startOfDay(now) + U.DAY + 12 * U.HOUR;
    const w = M.shiftWindow(me, now);
    return w && w.e > now ? w.e : now + 4 * U.HOUR;
  }

  ui.on('send-go', async (el) => {
    const me = SN.session.me(), now = SN.clock.now();
    let r;
    if (mode === 'post') {
      const title = String(ui.sheetVal('po-title') || '').trim();
      if (!title) return ui.toast('Bitte einen Betreff eingeben.', 'warn');
      const to = onlyOnDuty(readTarget(now), now);
      if (!M.resolveTo(to, now).filter((id) => id !== me.id).length) return ui.toast('Niemand erreichbar mit dieser Auswahl.', 'warn');
      r = await C.post(me.id, { to, title, body: ui.sheetVal('po-body') || '', needAck: !!ui.sheetVal('po-ack'), u: !!ui.sheetVal('po-u') });
    } else if (mode === 'briefing') {
      const lines = [1, 2, 3].map((i) => String(ui.sheetVal('br-' + i) || '').trim()).filter(Boolean);
      if (!lines.length) return ui.toast('Bitte mindestens eine Info eintragen.', 'warn');
      const sh = M.currentShift(now) || me.sh;
      r = await C.post(me.id, { to: { type: 'shift', ids: [sh] }, title: 'Kurzbriefing ' + sh + 'schicht', body: lines.map((l, i) => (i + 1) + '. ' + l).join('\n'), needAck: true, briefing: true, u: !!ui.sheetVal('po-u') });
    } else if (mode === 'task') {
      const lines = String(ui.sheetVal('tk-title') || '').split('\n').map((x) => x.trim()).filter(Boolean);
      if (!lines.length) return ui.toast('Bitte beschreiben, was zu tun ist.', 'warn');
      const due = dueFrom(P.picked('tk-due'), now, me);
      for (const title of lines) {
        r = await C.task(me.id, { title, dept: ui.sheetVal('tk-dept'), act: ui.sheetVal('tk-act'), due, u: !!ui.sheetVal('tk-u'), proofRequired: !!ui.sheetVal('tk-proof'), escalate: !!ui.sheetVal('tk-esc') });
        if (!r.ok) break;
      }
      if (r.ok) { const d = await SN.dist.run(me.id); ui.result(r, lines.length + ' gesendet. ' + SN.dist.resultText(d)); ui.closeSheet(); return; }
    } else if (mode === 'kudos') {
      const text = String(ui.sheetVal('ku-text') || '').trim();
      if (!text) return ui.toast('Bitte kurz schreiben, wofür.', 'warn');
      r = await C.kudos(me.id, ui.sheetVal('ku-to'), text);
    }
    if (ui.result(r, mode === 'kudos' ? 'Lob gesendet' : 'Gesendet – du siehst live, wer es gelesen und quittiert hat')) { ui.closeSheet(); ui.go('inbox', {}); ui.sub('inTab', 'sent'); }
  });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/40-inbox.js konnte nicht geladen werden:", e); }

/* ===== src/views/45-photo.js ===== */
try {
/* ==========================================================================
   Fotobericht – Schichtleitung meldet laufend per Foto an die Filialleitung
   Schichtleitung: Kamera zuerst (1 Tap) → Kategorie → optional Text → Senden.
   Filialleitung/Admin: Foto-Feed, Ungesehenes zuerst, Schnellantwort.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, O = SN.ops, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  let shots = [];        // [{url, busy}]
  let cat = 'order';

  const isBoss = (me) => M.isAdmin(me);
  const unseenFor = (me) => SN.store.list('items').filter((it) => it.kind === 'photo' && C.isRecipient(it, me.id) && !(it.seen || {})[me.id]);

  function photoCard(it, me, now) {
    const seenBy = Object.keys(it.seen || {}).filter((id) => id !== it.from);
    const replies = (it.thread || []).filter((t) => t.type !== 'fwd');
    const fresh = C.isRecipient(it, me.id) && !(it.seen || {})[me.id];
    return '<article class="sn-card sn-photo-card' + (it.u ? ' sn-card--urgent' : '') + (fresh ? ' is-new' : '') + '" data-item="' + it.id + '">'
      + (it.u ? '<div class="sn-card__flag">' + ui.urgent() + '</div>' : '')
      + (it.photosRemoved && !(it.photos || []).length ? '<p class="sn-photo-card__gone">' + icon('trash') + ' ' + U.fmt.count(it.photosRemoved, 'Foto', 'Fotos') + ' nach Löschfrist entfernt (Datenschutz)</p>' : '')
      + '<div class="sn-photo-card__media" data-act="ph-open" data-id="' + it.id + '">' + (it.photos || []).slice(0, 4).map((p, i) => '<img alt="Fotobericht ' + (i + 1) + '" loading="lazy" src="' + esc(p) + '">').join('') + (fresh ? '<span class="sn-photo-card__new">Neu</span>' : '') + '</div>'
      + '<div class="sn-photo-card__body"><div class="sn-card__head"><h3 class="sn-card__title">' + icon((O.PHOTO_CAT[it.cat] || {}).icon || 'camera', 'sn-icon--sm') + ' ' + esc(it.title) + '</h3>'
      + '<span class="sn-receipt sn-receipt--' + (replies.length ? 'ack' : seenBy.length ? 'read' : 'sent') + '">' + (replies.length ? 'beantwortet' : seenBy.length ? 'gesehen' : 'gesendet') + '</span></div>'
      + '<p class="sn-muted sn-small">' + esc((it.from === me.id ? 'Du' : M.name(it.from)) + ' · ' + (it.dept || '') + ' · ' + U.fmt.when(it.createdAt) + (it.from === me.id ? ' · an ' + M.labelFor(C.recipients(it)) : '')) + '</p>'
      + (it.body ? '<p class="sn-card__body">' + esc(it.body) + '</p>' : '')
      + replies.map((r) => '<p class="sn-photo-card__reply"><b>' + esc(M.first(r.by)) + ':</b> ' + esc(r.text) + ' <small>' + U.fmt.time(r.at) + '</small></p>').join('')
      + (C.isRecipient(it, me.id) ? '<div class="sn-chips">' + O.PHOTO_REPLIES.map((q) => '<button type="button" class="sn-chip sn-chip--outline" data-act="ph-reply" data-id="' + it.id + '" data-x="' + esc(q) + '">' + esc(q) + '</button>').join('') + '</div>' : '')
      + '</div></article>';
  }

  function leadView({ me, now }) {
    const mine = C.sentBy(me.id, 'photo').filter((it) => now - it.createdAt < 2 * U.DAY);
    const today = mine.filter((it) => U.fmt.dayKey(it.createdAt) === U.fmt.dayKey(now));
    const to = M.labelFor(O.photoTargets('fl', now));
    let h = '<section class="sn-shoot">'
      + (shots.length
        ? '<div class="sn-shoot__strip">' + shots.map((s, i) => '<figure><img alt="Aufnahme ' + (i + 1) + '" src="' + esc(s.url) + '"><button type="button" aria-label="Foto entfernen" data-act="ph-del" data-i="' + i + '">' + icon('x') + '</button></figure>').join('')
          + (shots.length < 4 ? '<label class="sn-shoot__more" for="ph-cam">' + icon('plus') + '<span>Noch ein Foto</span></label>' : '') + '</div>'
        : '<label class="sn-shoot__cam" for="ph-cam"><span class="sn-shoot__lens">' + icon('camera', 'sn-icon--lg') + '</span><b>Foto aufnehmen</b><small>Geht direkt an ' + esc(to) + '</small></label>')
      + '<input type="file" id="ph-cam" accept="image/*" capture="environment" hidden data-change="ph-shot">'
      + '</section>';
    if (shots.length) {
      h += '<div class="sn-chips sn-chips--scroll" role="radiogroup" aria-label="Kategorie">' + O.PHOTO_CATS.map((c) => '<button type="button" role="radio" aria-checked="' + (c.key === cat) + '" class="sn-chip ' + (c.key === cat ? 'sn-chip--solid' : 'sn-chip--outline') + '" data-act="ph-cat" data-k="' + c.key + '">' + icon(c.icon) + esc(c.label) + '</button>').join('') + '</div>'
        + '<div class="sn-field"><label class="sn-label" for="ph-text">Kurz dazu (optional)</label><input class="sn-input" id="ph-text" placeholder="z. B. Aktion Gang 7 steht, 2 Paletten offen"></div>'
        + '<div class="sn-row" style="gap:8px"><label class="sn-check"><input type="checkbox" id="ph-u"><span class="sn-inline">' + ui.urgent() + '</span></label><label class="sn-check"><input type="checkbox" id="ph-admin">auch Admin vom Dienst</label></div>'
        + '<button type="button" class="sn-btn sn-btn--primary sn-btn--lg sn-btn--block" data-act="ph-send" id="ph-send">' + icon('send') + '<span>An ' + esc(to) + ' senden</span></button>';
    }
    h += '<div class="sn-row sn-row--between"><h2 class="sn-section-title">Heute gemeldet</h2><span class="sn-chip sn-chip--outline">' + today.length + ' Fotoberichte</span></div>'
      + (mine.length ? mine.map((it) => photoCard(it, me, now)).join('') : P.empty('Noch kein Fotobericht', 'Ein Foto sagt der Filialleitung mehr als ein Anruf.'));
    return h;
  }

  function bossView({ me, now, sub }) {
    const all = U.sortBy(SN.store.list('items').filter((it) => it.kind === 'photo' && (C.isRecipient(it, me.id) || M.isAdmin(me)) && now - it.createdAt < 3 * U.DAY), (it) => -it.createdAt);
    const f = sub.phF || 'new';
    const unseen = all.filter((it) => !(it.seen || {})[me.id] && it.from !== me.id);
    const list = f === 'new' ? unseen : all;
    return '<div class="sn-segment sn-segment--sticky" role="tablist"><button type="button" role="tab" class="sn-segment__tab" data-act="ph-f" data-k="new" aria-selected="' + (f === 'new') + '">Ungesehen' + (unseen.length ? ' <span class="sn-badge">' + unseen.length + '</span>' : '') + '</button>'
      + '<button type="button" role="tab" class="sn-segment__tab" data-act="ph-f" data-k="all" aria-selected="' + (f === 'all') + '">Alle (' + all.length + ')</button></div>'
      + (list.length ? list.map((it) => photoCard(it, me, now)).join('') : P.empty(f === 'new' ? 'Alles gesehen' : 'Noch keine Fotoberichte', 'Neue Fotos der Schichtleitung erscheinen hier sofort.', f === 'new'));
  }

  ui.registerView('photo', {
    label: 'Foto', icon: 'camera', groups: ['lead', 'admin'], order: 15,
    render: (ctx) => (isBoss(ctx.me) ? bossView(ctx) : leadView(ctx)),
    badge: (me) => (isBoss(me) ? unseenFor(me).length : C.sentBy(me.id, 'photo').filter((it) => (it.thread || []).some((t) => t.by !== me.id && t.at > (it.readReplies || 0))).length),
  });

  ui.onChange('ph-shot', async (el) => {
    const f = el.files && el.files[0]; if (!f) return;
    const img = await U.shrinkImage(f, 1280, 0.72);
    const i = shots.push({ url: img.dataUrl, busy: true }) - 1;
    ui.render(true);
    try { shots[i].url = await SN.store.upload(img.blob, img.dataUrl); } catch (e) { ui.toast('Foto konnte nicht hochgeladen werden – wird im Bericht mitgeschickt.', 'warn'); }
    shots[i].busy = false;
  });
  ui.on('ph-del', (el) => { shots.splice(+el.dataset.i, 1); ui.render(true); });
  ui.on('ph-cat', (el) => { cat = el.dataset.k; ui.render(true); });
  ui.on('ph-f', (el) => ui.sub('phF', el.dataset.k));
  ui.on('ph-send', async (el) => {
    if (shots.some((s) => s.busy)) return ui.toast('Foto wird noch hochgeladen …', 'info');
    el.disabled = true;
    const me = SN.session.me();
    const txt = String(ui.sheetVal('ph-text') || '').trim();
    let body = txt, orig;
    if (txt && SN.ai.available().text) { const t = await SN.ai.toGerman(txt); if (t && t.from && t.from !== 'de') { body = t.text; orig = txt; } }
    const r = await O.photoReport(me.id, { cat, dept: M.deptOf(me, SN.clock.now()), body, orig, photos: shots.map((s) => s.url), u: !!ui.sheetVal('ph-u') });
    if (r.ok && ui.sheetVal('ph-admin')) await O.photoReport(me.id, { cat, dept: M.deptOf(me, SN.clock.now()), body, orig, photos: shots.map((s) => s.url), u: !!ui.sheetVal('ph-u'), to: 'admin' });
    if (ui.result(r, 'Gesendet – du siehst, wann es gesehen wird')) { shots = []; cat = 'order'; ui.render(false); } else el.disabled = false;
  });
  ui.on('ph-reply', async (el) => {
    const me = SN.session.me();
    await C.markSeen(el.dataset.id, me.id);
    ui.result(await C.reply(el.dataset.id, me.id, el.dataset.x), 'Antwort gesendet');
  });
  ui.on('ph-open', async (el) => {
    const it = C.get(el.dataset.id); if (!it) return;
    const me = SN.session.me();
    if (it.from === me.id && (it.thread || []).length) await SN.store.patch('items', it.id, { readReplies: SN.clock.now() });
    else await C.markSeen(it.id, me.id);
    ui.sheet(it.title, '<div class="sn-photo-full">' + (it.photos || []).map((p) => '<img alt="Foto" src="' + esc(p) + '">').join('') + '</div>' + (it.body ? '<p>' + esc(it.body) + '</p>' : '')
      + '<p class="sn-muted sn-small">' + esc(M.name(it.from) + ' · ' + U.fmt.when(it.createdAt)) + '</p>'
      + '<div class="sn-field"><label class="sn-label" for="it-reply">Antwort</label><textarea class="sn-textarea" id="it-reply" rows="2"></textarea></div>',
    P.btn('Antwort senden', 'it-reply', { id: it.id }, 'primary', 'send'));
  });
  SN.photoOpen = () => ui.go('photo', {});
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/45-photo.js konnte nicht geladen werden:", e); }

/* ===== src/views/50-chat.js ===== */
try {
/* ==========================================================================
   Chat (M6): 1:1, Abteilungskanal, Kanal „Leitung“. Lesehaken, Schnellantworten,
   Übersetzen-Knopf an jeder Nachricht, Direkt-Knöpfe zu den Admins.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  const tr = {};
  let openTid = null;

  function threadView(tid, me, now, draft) {
    const msgs = C.messages(tid);
    const info = C.threadInfo(tid);
    const quick = M.isLead(me) ? ['Danke!', 'Bitte zur Info kommen', 'Pause jetzt möglich', 'Komm bitte zur Rampe'] : ['Verstanden', 'Ich komme', 'Brauche Hilfe', 'Bin in der Pause'];
    let lastDay = '';
    const canTr = SN.ai.available().text;
    const body = msgs.map((m) => {
      const out = m.by === me.id;
      const day = U.fmt.dayKey(m.at);
      const sep = day !== lastDay ? '<p class="sn-chat__day">' + esc(U.fmt.date(m.at)) + '</p>' : '';
      lastDay = day;
      return sep + '<div class="sn-bubble' + (out ? ' sn-bubble--out' : '') + '">'
        + (!out && info.type !== 'dm' ? '<p class="sn-bubble__author">' + esc(M.name(m.by)) + '</p>' : '')

          + '<span class="sn-list__sub">' + (last ? esc(M.first(last.by) + ': ' + (last.text || 'Foto')) + ' · ' + esc(U.fmt.ago(last.at)) : 'Noch keine Nachrichten') + '</span></span></button></li>';
      }).join('') + '</ul>';
  }

  function render({ me, now, params }) {
    if (params.tid && params.tid !== openTid) { openTid = params.tid; params.tid = null; }
    if (openTid && !C.canUseThread(openTid, me.id)) openTid = null;
    return openTid ? threadView(openTid, me, now, params.draft) : listView(me);
  }
  function mount(root, { me }) {

/* ===== src/views/60-live.js ===== */
try {
/* ==========================================================================
   Live (Admin/Filialleitung) und Team (Schicht-/Teamleitung) – S1
   Oben „Brennpunkte“ mit Direkt-Aktion, darunter die Personen der Schicht mit
   Status. Je Person: Auftrag, Chat, Umsetzen. Keine Ranglisten.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, C = SN.comm, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;

  function scopeOf(me) {
    if (M.isAdmin(me)) return null;
    if (me.role === 'tl' && me.group && M.DEPT_GROUPS[me.group]) return M.DEPT_GROUPS[me.group].depts;
    return me.scope && me.scope.length ? me.scope : [me.dept];
  }

  function hotspots(me, now, scope) {
    let hs = C.hotspots(now);
    if (scope) hs = hs.filter((h) => !h.item ? scope.includes(h.dept) : (h.item.kind === 'sos' || !h.item.dept || scope.includes(h.item.dept)));
    if (!hs.length) return '';
    return P.sec('Brennpunkte', hs.length) + hs.slice(0, 8).map((h) => {
      const it = h.item;
      let act = '';
      if (h.type === 'report' && it) act = P.btn('Übernehmen', 'it-take', { id: it.id }, 'primary') + P.btn('Ansehen', 'it-open', { id: it.id }, 'ghost');
      else if (h.type === 'post' && it) act = P.btn('Nachfassen', 'it-remind', { id: it.id }, 'secondary', 'bell');
      else if (h.type === 'task' && it) act = P.btn('Verteilen', 'live-dist', {}, 'primary') + P.btn('Zuteilen', 'it-assign', { id: it.id }, 'ghost');
      else if (h.type === 'call' && it) act = P.btn('Ansehen', 'it-open', { id: it.id }, 'secondary');
      else if (h.type === 'sos' && it) act = P.btn('Ansehen', 'it-open', { id: it.id }, 'primary');
      else if (h.type === 'dept') act = P.btn('Verteilen', 'live-dist', { dept: h.dept }, 'secondary');
      return '<div class="sn-card' + (h.level >= 2 ? ' sn-card--escalated' : h.type === 'sos' ? ' sn-card--urgent' : '') + '" style="padding:12px"><p style="margin:0 0 8px;font-weight:600">' + esc(h.text) + '</p><div class="sn-card__actions">' + act + '</div></div>';
    }).join('');
  }

  function person(e, now) {
    const s = SN.dist.status(e, now);
    const st = s.key === 'pause' ? 'pause' : s.key === 'away' || s.key === 'off' ? 'off' : '';
    const lim = SN.dist.limitOf(e, now), load = SN.dist.loadOf(e.id);
    return '<div class="sn-card" style="padding:10px" data-n="' + esc((e.name + ' ' + (M.deptOf(e, now) || '')).toLowerCase()) + '"><div class="sn-person-row">'
      + '<span class="sn-avatar' + (M.isLead(e) ? ' sn-avatar--lead' : '') + '">' + esc(P.initials(e.name)) + '<span class="sn-avatar__status' + (st ? ' sn-avatar__status--' + st : '') + '" aria-hidden="true"></span></span>'
      + '<div><p><b>' + esc(e.name) + '</b> <span class="sn-muted sn-small">' + esc(M.role(e).label) + ' · ' + esc(M.deptOf(e, now) || '') + (e.loan && e.loan.until > now ? ' ↔' : '') + '</span></p>'
      + '<p class="sn-muted sn-small">' + esc(s.text) + (lim ? ' · ' + Math.round(load / lim * 100) + ' % verplant' : '') + '</p></div></div>'
      + '<div class="sn-card__actions">' + P.btn('Auftrag', 'p-task', { id: e.id }, 'secondary', 'plus') + P.btn('Chat', 'p-chat', { id: e.id }, 'ghost', 'chat') + P.btn('Umsetzen', 'p-move', { id: e.id }, 'ghost', 'forward') + '</div></div>';
  }

  function render({ me, now, sub }) {
    const scope = scopeOf(me);
    const on = M.staff().filter((e) => e.role !== 'clean' && !M.isAdmin(e) && M.onDuty(e, now) && (!scope || scope.includes(M.deptOf(e, now))));
    const sts = on.map((e) => SN.dist.status(e, now).key);
    const free = sts.filter((k) => k === 'free').length, pause = sts.filter((k) => k === 'pause').length;
    const openRep = SN.store.list('items').filter((it) => (it.kind === 'report' || it.kind === 'absence') && !C.isFinal(it) && (!scope || scope.includes(it.dept))).length;
    const pa = SN.dist.pauseAlerts(now);
    let h = '<div class="sn-kpis"><div class="sn-kpi"><span class="sn-kpi__value">' + on.length + '</span><span class="sn-kpi__label">im Dienst</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + free + '</span><span class="sn-kpi__label">frei</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + pause + '</span><span class="sn-kpi__label">Pause</span></div>'
      + '<div class="sn-kpi' + (openRep ? ' sn-kpi--alert' : '') + '"><span class="sn-kpi__value">' + openRep + '</span><span class="sn-kpi__label">Meldungen</span></div></div>';
    if (scope) h += '<p class="sn-muted sn-small">Dein Bereich: ' + esc(scope.join(', ')) + '</p>';
    h += hotspots(me, now, scope);
    const over = (pa.over || []).filter((x) => !scope || scope.includes(M.deptOf(M.emp(x.id || x), now)));
    if (over.length) h += '<div class="sn-alert sn-alert--warn sn-alert--card"><p class="sn-alert__title">Pause überzogen: ' + esc(over.map((x) => M.first(x.id || x)).join(', ')) + '</p><p class="sn-alert__text">Kurz nachfragen – ohne Vorwurf, vielleicht ist etwas passiert.</p></div>';
    h += '<div class="sn-row" style="gap:8px;margin:12px 0">' + P.btn('Schnellruf', 'call-sheet', {}, 'secondary', 'bell') + P.btn('Neu verteilen', 'live-dist', {}, 'secondary', 'users') + '</div>';
    const dept = sub.liveDept || '';
    const q = (sub.liveQ || '').toLowerCase();
    const opts = scope || M.DEPTS;
    h += '<div class="sn-filter"><div><label class="sn-label sn-sr-only" for="live-q">Suche</label><input class="sn-input" id="live-q" placeholder="Name suchen" data-change="live-q" value="' + esc(sub.liveQ || '') + '"></div>'
      + '<div><label class="sn-label sn-sr-only" for="live-dept">Abteilung</label><select class="sn-select" id="live-dept" data-change="live-dept"><option value="">Alle Abteilungen</option>' + opts.map((d) => '<option value="' + esc(d) + '"' + (d === dept ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</select></div></div>';
    const order = { free: 0, work: 1, pause: 2, away: 3, off: 4 };
    const list = U.sortBy(on.filter((e) => (!dept || M.deptOf(e, now) === dept) && (!q || e.name.toLowerCase().includes(q))), (e) => order[SN.dist.status(e, now).key] * 1000 + (M.deptOf(e, now) || '').charCodeAt(0));
    h += P.sec('Personen', list.length) + (list.length ? list.map((e) => person(e, now)).join('') : P.empty('Niemand gefunden', 'Filter ändern oder Schicht prüfen.'));
    return h;
  }

  const fab = () => ({ label: 'Senden', icon: 'send', act: 'send-sheet' });
  // Admin: „Live“ ist in die Übersicht (Anwesenheit) gewandert und nur noch ohne Navigationsplatz erreichbar
  ui.registerView('live', { label: 'Live', icon: 'users', groups: ['admin'], order: 11, render, fab, show: () => false });
  SN.parts.livePerson = person;
  ui.registerView('team', { label: 'Team', icon: 'users', groups: ['lead'], order: 22, render, fab, show: () => false });

  ui.onChange('live-q', (el) => ui.sub('liveQ', el.value));
  ui.onChange('live-dept', (el) => ui.sub('liveDept', el.value));
  ui.on('live-dist', async (el) => { const r = await SN.dist.run(SN.session.id, undefined, el.dataset.dept ? { dept: el.dataset.dept } : undefined); ui.toast(SN.dist.resultText(r)); });
  ui.on('p-chat', (el) => SN.chatOpen(C.threadId.dm(SN.session.id, el.dataset.id)));

  ui.on('p-task', (el) => {
    const e = M.emp(el.dataset.id), now = SN.clock.now();
    ui.sheet('Auftrag für ' + e.name, '<p class="sn-muted sn-small">Frei: ' + U.fmt.dur(SN.dist.freeOf(e, now)) + ' bis zum Limit · ' + esc(SN.dist.status(e, now).text) + '</p>'
      + '<div class="sn-field"><label class="sn-label" for="pt-title">Was ist zu tun?</label><textarea class="sn-textarea" id="pt-title" rows="2"></textarea></div>'
      + '<div class="sn-field"><label class="sn-label" for="pt-act">Tätigkeit</label><select class="sn-select" id="pt-act">' + M.ACTS.map((a) => '<option' + ((e.acts || [])[0] === a.key ? ' selected' : '') + ' value="' + esc(a.key) + '">' + esc(a.label + ((e.acts || []).includes(a.key) ? ' (passt)' : '')) + '</option>').join('') + '</select></div>'
      + '<label class="sn-check"><input type="checkbox" id="pt-u">' + SN.ui.urgent() + '</label>',
    P.btn('Senden', 'p-task-go', { id: e.id }, 'primary', 'send'));
  });
  ui.on('p-task-go', async (el) => {
    const me = SN.session.me(), e = M.emp(el.dataset.id), now = SN.clock.now();
    const title = String(ui.sheetVal('pt-title') || '').trim();
    if (!title) return ui.toast('Bitte beschreiben, was zu tun ist.', 'warn');
    const w = M.shiftWindow(e, now);
    const r = await C.task(me.id, { title, dept: M.deptOf(e, now), act: ui.sheetVal('pt-act'), owner: e.id, u: !!ui.sheetVal('pt-u'), due: w && w.e > now ? w.e : now + 2 * U.HOUR, escalate: true });
    if (ui.result(r, 'Auftrag an ' + M.first(e.id) + ' gesendet')) ui.closeSheet();
  });
  ui.on('p-move', (el) => {
    const e = M.emp(el.dataset.id);
    ui.sheet(e.name + ' umsetzen', '<p>Jetzt: <b>' + esc(M.deptOf(e, SN.clock.now())) + '</b></p><div class="sn-field"><label class="sn-label" for="mv-to">Nach Abteilung</label><select class="sn-select" id="mv-to">' + M.DEPTS.map((d) => '<option value="' + esc(d) + '">' + esc(d) + '</option>').join('') + '</select></div>'
      + '<fieldset class="sn-choices"><legend class="sn-label">Wie lange?</legend><label class="sn-choice"><input type="radio" name="mv-d" value="120" checked><span>2 Std</span></label><label class="sn-choice"><input type="radio" name="mv-d" value="240"><span>4 Std</span></label><label class="sn-choice"><input type="radio" name="mv-d" value="0"><span>Dauerhaft</span></label></fieldset>',
    P.btn('Umsetzen', 'p-move-go', { id: e.id }, 'primary', 'forward'));
  });
  ui.on('p-move-go', async (el) => {
    const r = await SN.dist.loan(el.dataset.id, ui.sheetVal('mv-to'), +P.picked('mv-d'));
    if (ui.result(r, M.first(el.dataset.id) + ' ist jetzt in ' + ui.sheetVal('mv-to'))) { ui.closeSheet(); await C.log(SN.session.id, M.name(el.dataset.id) + ' umgesetzt nach ' + ui.sheetVal('mv-to')); }
  });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/60-live.js konnte nicht geladen werden:", e); }

/* ===== src/views/65-goods.js ===== */
try {
/* ==========================================================================
   Lieferung – KKP · Paletten · Boxen → Personen → Touren mit Laufweg
   Schnell: Zähler + „Abteilungen je KKP“. Genau: je KKP Abteilungen antippen.
   ========================================================================== */
(function (SN) {
  'use strict';

  const SHELF = M.DEPTS.filter((d) => !['Kasse', 'Info', 'Lager', 'Wareneinnahme', 'Leergut'].includes(d));

  function units() {
    if (st.exact && st.units) return st.units;
    return O.unitsFromCounts({ kkp: st.kkp, pal: st.pal, box: st.box, avg: st.avg }, SHELF);
  }
  const stepper = (k, label, sub, ic) => '<div class="sn-stepper"><span class="sn-stepper__icon" aria-hidden="true">' + icon(ic, 'sn-icon--lg') + '</span><span class="sn-stepper__text"><b>' + esc(label) + '</b><small>' + esc(sub) + '</small></span>'
    + '<button type="button" class="sn-stepper__btn" data-act="gd-step" data-k="' + k + '" data-d="-1" aria-label="' + esc(label) + ' weniger">' + icon('minus') + '</button><output class="sn-stepper__val" aria-live="polite">' + st[k] + '</output>'
    + '<button type="button" class="sn-stepper__btn" data-act="gd-step" data-k="' + k + '" data-d="1" aria-label="' + esc(label) + ' mehr">' + icon('plus') + '</button></div>';

  function render({ me, now }) {

    let h = '<section class="sn-card sn-goods"><h2 class="sn-section-title" style="margin-top:0"><span class="sn-inline">' + icon('truck') + 'Was ist angekommen?</span></h2>'

      + stepper('pal', 'Paletten', cfg.pal + ' Min je Palette', 'pallet')
      + stepper('box', 'Boxen', 'graue Kisten · ' + cfg.box + ' Min', 'box')
      + '<fieldset class="sn-choices sn-choices--row"><legend class="sn-label">Abteilungen je KKP (Ø)</legend>' + [1, 2, 3, 4, 5, 6].map((n) => '<label class="sn-choice"><input type="radio" name="gd-avg" value="' + n + '" data-change="gd-avg"' + (n === st.avg ? ' checked' : '') + '><span>' + n + '</span></label>').join('') + '</fieldset>'

        + SHELF.map((d) => '<button type="button" class="sn-chip ' + ((u.depts || []).includes(d) ? 'sn-chip--solid' : 'sn-chip--outline') + '" data-act="gd-dept" data-i="' + i + '" data-d="' + esc(d) + '">' + icon(M.DEPT_ICONS[d] || 'pin') + esc(d) + '</button>').join('') + '</div></div>').join('');
    }

    // Schema: Einheiten → Minuten → Personen
    const t = (k) => us.filter((u) => u.type === k);
    const tm = (k) => t(k).reduce((s, u) => s + O.unitMin(u, cfg), 0);
    h += '<section class="sn-card sn-schema" aria-label="Schema Aufwand und Personen">'

/* ===== src/views/66-scan.js ===== */
try {
/* ==========================================================================
   Etikett-Scan für Lieferungs-Touren: jede KKP, Palette, Box wird beim
   Abschluss gescannt (Kamera mit BarcodeDetector, Handeingabe, Demo-Scan).
   Format- und Doppelprüfung; ohne Netz landet der Scan in der Warteschlange.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, O = SN.ops, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  let cam = null; // {stream, timer}

  function stopCam() {
    if (!cam) return;
    clearInterval(cam.timer);
    cam.stream.getTracks().forEach((t) => t.stop());
    cam = null;
  }
  function body(it, msg, bad) {
    const st = O.scanState(it);
    return '<p class="sn-muted">Einheit für Einheit scannen. Nach der letzten ist die Tour erledigt.</p>'
      + '<ol class="sn-scanlist">' + st.units.map((u) => '<li class="' + (st.doneNos.has(u.no) ? 'is-done' : st.next && st.next.no === u.no ? 'is-next' : '') + '">'
        + icon(st.doneNos.has(u.no) ? 'check-circle' : st.next && st.next.no === u.no ? 'play' : 'circle', 'sn-icon--sm') + ' ' + esc(O.unitLabel(u)) + (u.depts && u.depts.length ? ' <small>' + esc(u.depts.join(', ')) + '</small>' : '') + '</li>').join('') + '</ol>'
      + (msg ? '<div class="sn-alert sn-alert--' + (bad ? 'warn' : 'info') + ' sn-alert--card" role="alert"><p class="sn-alert__title">' + esc(msg) + '</p></div>' : '')
      + '<video id="scan-video" playsinline muted hidden></video>'
      + '<div class="sn-field"><label class="sn-label" for="scan-code">Etikett-Code</label><input class="sn-input" id="scan-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="' + esc(O.SCAN_RULE.text) + '" data-enter="scan-go"></div>'
      + '<div class="sn-row" style="gap:8px">' + ('BarcodeDetector' in window ? P.btn('Kamera', 'scan-cam', { id: it.id }, 'secondary', 'camera') : '') + P.btn('Demo-Scan', 'scan-demo', { id: it.id }, 'ghost') + '</div>';
  }
  function open(id, msg, bad) {
    const it = SN.comm.get(id); if (!it) return;
    const st = O.scanState(it);
    ui.sheet('Etikett scannen · ' + st.done + ' von ' + st.total, body(it, msg, bad), P.btn('Senden', 'scan-go', { id }, 'primary', 'send'));
  }
  async function submit(id, code) {
    const r = await O.scanUnit(id, SN.session.id, code);
    if (!r.ok) { U.vibrate(80); open(id, r.reason, true); return; }
    U.vibrate(25);
    if (r.truckDone) { stopCam(); ui.closeSheet(); ui.toast('Lieferung komplett verräumt – Bericht ans System gesendet'); return; }
    if (r.tourDone) { stopCam(); ui.closeSheet(); ui.toast('Tour erledigt – danke!'); return; }
    open(id, O.unitLabel(r.unit) + ' gescannt · noch ' + r.left + (SN.store.pending ? ' · wird gesendet, sobald Netz da ist' : ''), false);
  }

  ui.on('scan-open', (el) => open(el.dataset.id));
  ui.on('scan-go', (el) => {
    const id = el.dataset.id || (document.querySelector('[data-act="scan-go"][data-id]') || {}).dataset.id;
    const v = ui.sheetVal('scan-code');
    if (!v) return ui.toast('Bitte Code eingeben oder scannen.', 'warn');
    submit(id, v);
  });
  ui.on('scan-demo', (el) => submit(el.dataset.id, 'KL' + String(Date.now()).slice(-9) + Math.floor(Math.random() * 90 + 10)));
  ui.on('scan-cam', async (el) => {
    const id = el.dataset.id;
    try {
      stopCam();
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = document.getElementById('scan-video');
      v.hidden = false; v.srcObject = stream; await v.play();
      const det = new window.BarcodeDetector();
      cam = { stream, timer: setInterval(async () => {
        const sheetOpen = document.getElementById('sheet').classList.contains('is-open');
        if (!sheetOpen) return stopCam();
        try { const r = await det.detect(v); if (r && r.length) { stopCam(); submit(id, r[0].rawValue); } } catch (e) { /* weiter versuchen */ }
      }, 300) };
    } catch (e) { ui.toast('Kamera nicht verfügbar – bitte Code eintippen.', 'warn'); }
  });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/66-scan.js konnte nicht geladen werden:", e); }

  const hrs = (m) => (m >= 120 ? Math.round(m / 60) + ' Std' : U.fmt.dur(m));
  const pos = (h) => ((h - H0) / (H1 - H0) * 100).toFixed(2) + '%';

  function render({ me, now, sub }) {
    const days = O.week(now);
    const todayKey = U.fmt.dayKey(now);
    const selKey = sub.wkDay || (days.find((d) => d.key === todayKey) || days[0]).key;
    const loads = days.map((d) => O.dayLoad(d));
    const L = loads.find((l) => l.day.key === selKey) || loads[0];
    const maxNeed = Math.max(1, ...loads.map((l) => l.need));
    let h = '<div class="sn-week-strip" role="tablist" aria-label="Wochentage">' + loads.map((l) => {
      const pct = l.need / maxNeed * 130; // relativ zum stärksten Tag der Woche
      const lvl = l.pct > 100 ? 'over' : l.pct > 80 || l.need === maxNeed ? 'warn' : 'ok';
      return '<button type="button" role="tab" aria-selected="' + (l.day.key === selKey) + '" class="sn-wday sn-wday--' + lvl + (l.day.key === todayKey ? ' is-today' : '') + '" data-act="wk-day" data-k="' + l.day.key + '">'
        + '<span class="sn-wday__d">' + esc(l.day.label) + '</span><span class="sn-wday__n">' + new Date(l.day.date).getDate() + '.</span>'
        + '<span class="sn-wday__bar" aria-hidden="true"><i style="height:' + Math.max(4, pct / 1.3) + '%"></i></span>'
        + '<span class="sn-wday__p">' + (l.need ? hrs(l.need) : '–') + '</span><span class="sn-wday__s">' + icon('user', 'sn-icon--xs') + l.staff.length + '</span></button>';
    }).join('') + '</div>';

    const f = L.forecast || {};
    h += '<section class="sn-card sn-daycard"><div class="sn-row sn-row--between"><h2 class="sn-section-title" style="margin:0">' + esc(L.day.label + ', ' + U.fmt.date(L.day.date).split(', ')[1]) + '</h2>'
      + '<span class="sn-chip ' + (L.pct > 100 ? 'sn-chip--urgent' : L.pct > 80 ? 'sn-chip--warn' : 'sn-chip--ok') + '">' + (L.pct > 100 ? 'Überlastet' : L.pct > 80 ? 'Knapp' : 'Im Rahmen') + '</span></div>'
      + '<div class="sn-kpis"><div class="sn-kpi"><span class="sn-kpi__value">' + hrs(L.need) + '</span><span class="sn-kpi__label">Lager-Bedarf</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + hrs(L.cap) + '</span><span class="sn-kpi__label">Kapazität (80 %)</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + hrs(L.planned) + '</span><span class="sn-kpi__label">schon verteilt</span></div>'
      + '<div class="sn-kpi"><span class="sn-kpi__value">' + L.staff.length + '</span><span class="sn-kpi__label">eingeplant</span></div></div>'
      + '<p class="sn-small">Erwartet: ' + (f.kkp || 0) + ' KKP (Ø ' + (f.avg || 4) + ' Abt.) · ' + (f.pal || 0) + ' Paletten · ' + (f.box || 0) + ' Boxen</p>'
      + (M.isLead(me) ? '<div class="sn-row" style="gap:8px">' + P.btn('Lieferung erwarten', 'wk-fc', { k: L.day.key }, 'secondary', 'plus') + P.btn('Aufgaben verteilen', 'wk-dist', { k: L.day.key }, 'primary', 'users') + '</div>' : '')
      + '</section>';

    // Zeitleiste
    const tasks = SN.store.list('items').filter((it) => it.kind === 'task' && it.plannedFor === L.day.key);
    const staff = U.sortBy(L.staff, (e) => O.shiftOn(e, L.day.wd).s * 100 + e.name.charCodeAt(0));
    h += '<section class="sn-card sn-timeline-day"><div class="sn-tl-axis" aria-hidden="true">' + [6, 10, 14, 18, 22].map((x) => '<span style="left:' + pos(x) + '">' + String(x).padStart(2, '0') + '</span>').join('') + '</div>'
      + staff.map((e) => {
        const s = O.shiftOn(e, L.day.wd);
        const mine = tasks.filter((it) => it.owner === e.id);
        const used = mine.reduce((a, it) => a + (it.min || 0), 0), lim = SN.dist.limitOf(e);
        return '<div class="sn-tl-row' + (e.id === me.id ? ' is-me' : '') + '"><div class="sn-tl-name"><b>' + esc(e.name.split(' ')[0]) + ' ' + esc((e.name.split(' ')[1] || '').slice(0, 1)) + '.</b><small>' + esc(e.dept || '') + '</small></div>'
          + '<div class="sn-tl-track"><span class="sn-tl-shift sn-tl-shift--' + (e.sh === 'Spät' ? 'late' : 'early') + '" style="left:' + pos(s.s) + ';width:calc(' + pos(s.e) + ' - ' + pos(s.s) + ')"><i style="width:' + Math.min(100, lim ? used / lim * 100 : 0) + '%"></i></span></div>'
          + (mine.length ? '<div class="sn-tl-tasks">' + mine.map((it) => '<span class="sn-chip sn-chip--outline">' + esc(it.title.replace(/^Warenverräumung (\(KKP-Ware\) )?– /, '')) + ' · ' + it.min + '′</span>').join('') + '</div>' : '')
          + '</div>';
      }).join('') + (staff.length ? '' : P.empty('Niemand eingeplant')) + '<p class="sn-muted sn-small">Balken = Schicht · dunkle Füllung = verplante Zeit bis zum Limit (80 % der Arbeitszeit).</p></section>';
    return h;
  }

  ui.registerView('week', { groups: ['lead', 'admin', 'emp'], order: 75, render });
  ui.on('wk-day', (el) => ui.sub('wkDay', el.dataset.k));
  ui.on('wk-fc', (el) => {
    const f = O.forecast(el.dataset.k) || { kkp: 8, pal: 3, box: 6, avg: 4 };
    const n = (id, l, v) => '<div class="sn-field"><label class="sn-label" for="' + id + '">' + l + '</label><input class="sn-input" type="number" min="0" max="80" id="' + id + '" value="' + v + '" inputmode="numeric"></div>';
    ui.sheet('Erwartete Lieferung', '<div class="sn-filter">' + n('fc-kkp', icon('cart', 'sn-icon--sm') + ' KKP', f.kkp || 0) + n('fc-pal', icon('pallet', 'sn-icon--sm') + ' Paletten', f.pal || 0) + n('fc-box', icon('box', 'sn-icon--sm') + ' Boxen', f.box || 0) + '</div>' + n('fc-avg', 'Ø Abteilungen je KKP', f.avg || 4),
      P.btn('Speichern', 'wk-fc-save', { k: el.dataset.k }, 'primary', 'check'));
  });
  ui.on('wk-fc-save', async (el) => {
    const v = (id) => Math.max(0, parseInt(ui.sheetVal(id), 10) || 0);
    await O.setForecast(el.dataset.k, { kkp: v('fc-kkp'), pal: v('fc-pal'), box: v('fc-box'), avg: Math.min(6, Math.max(1, v('fc-avg') || 4)) });
    ui.toast('Prognose gespeichert'); ui.closeSheet();
  });
  ui.on('wk-dist', async (el) => {
    const day = O.week(SN.clock.now()).find((d) => d.key === el.dataset.k);
    const r = await O.distributeDay(SN.session.id, day);
    ui.result(r, r.ok ? r.made + ' Aufgaben verteilt' + (r.rest > 0 ? ' · ' + U.fmt.dur(r.rest) + ' passen nicht ins Limit' : '') : '');
  });
  SN.weekOpen = () => ui.go('week', {});
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/75-week.js konnte nicht geladen werden:", e); }

  ui.on('sf-save', async () => {
    const st = {};
    M.DEPTS.forEach((d, i) => { st[d] = {}; for (const sh of M.SHIFT_NAMES) st[d][sh] = Math.min(20, num('sf-' + i + '-' + sh)); });
    await SN.store.patch('settings', 'main', { staffing: st }); await C.log(SN.session.id, 'Soll-Besetzung geändert'); ui.toast('Besetzung gespeichert');
  });
  ui.on('duty', async (el) => { await SN.store.patch('settings', 'main', { adminOnDuty: el.dataset.id }); await C.log(SN.session.id, 'Admin vom Dienst: ' + M.name(el.dataset.id)); ui.toast(M.first(el.dataset.id) + ' ist jetzt Admin vom Dienst'); });
  ui.on('dl-save', async () => {
    const d = {}; for (const k of Object.keys(M.DEADLINE_LABELS)) d[k] = Math.max(1, num('dl-' + k) || M.DEFAULT_DEADLINES[k]);
    await SN.store.patch('settings', 'main', { deadlines: d }); await C.log(SN.session.id, 'Eskalationsfristen geändert'); ui.toast('Fristen gespeichert');
  });

  /* ---------- Stimmung, Protokoll ----------------------------------------------- */
  function mood(now) {
    let h = '<p class="sn-muted">Anonym, nur als Summe je Schicht und erst ab 5 Antworten. Keine Auswertung einzelner Personen.</p>';
    for (let i = 0; i < 7; i++) {
      const d = U.fmt.dayKey(now - i * U.DAY);
      for (const sh of M.SHIFT_NAMES) {
        const a = C.moodAggregate(d, sh);
        h += '<div class="sn-card" style="padding:10px"><b>' + esc(U.fmt.date(now - i * U.DAY) + ' · ' + sh) + '</b>' + (a ? '<div class="sn-bars">' + ['Sehr gut', 'Gut', 'Geht so', 'Schlecht'].map((m, k) => '<div><span>' + icon('mood-' + (k + 1)) + ' ' + esc(m) + '</span><i style="width:' + Math.round((a.c[k + 1] || 0) / a.n * 100) + '%"></i><span>' + (a.c[k + 1] || 0) + '</span></div>').join('') + '</div>' : '<p class="sn-muted sn-small">Weniger als 5 Antworten – nicht angezeigt.</p>') + '</div>';
      }
    }
    return h;
  }
  function logView(now) {
    const l = SN.store.peek('log', U.fmt.dayKey(now));
    const e = l ? l.entries.slice().reverse() : [];
    return '<p class="sn-muted">Änderungen an Team, Plänen, Zuteilungen und Einstellungen – nachvollziehbar statt „über Nacht geändert“.</p>' + (e.length ? '<ol class="sn-timeline">' + e.map((x) => '<li><time>' + U.fmt.time(x.at) + '</time> ' + esc(M.name(x.by) + ': ' + x.text) + '</li>').join('') + '</ol>' : P.empty('Heute noch keine Änderungen'));
  }

  function render({ me, now, sub }) {
    const tabs = [['goods', 'Lieferung', 'truck'], ['stock', 'Restware', 'package'], ['tpl', 'Vorlagen', 'repeat'], ['set', 'Einstellungen', 'settings'], ['mood', 'Stimmung', 'mood-2'], ['log', 'Protokoll', 'receipt']];
    const t = sub.moreTab || 'goods';
    const head = '<div class="sn-chips" role="tablist">' + tabs.map(([k, l, ic]) => '<button type="button" role="tab" class="sn-chip' + (k === t ? ' sn-chip--solid' : ' sn-chip--outline') + '" aria-selected="' + (k === t) + '" data-act="more-tab" data-k="' + k + '">' + icon(ic) + ' ' + l + '</button>').join('') + '</div>';
    const body = t === 'goods' ? SN.ui.views.ware.render({ me, now, sub, params: {} }) : t === 'stock' ? stock() : t === 'tpl' ? templates() : t === 'set' ? settings(me, now) : t === 'mood' ? mood(now) : logView(now);
    const quick = '<div class="sn-quicklinks">' + P.btn('Personal', 'go-staff', {}, 'secondary', 'users') + P.btn('Wochenplan', 'go-week', {}, 'secondary', 'tasks') + (M.canAiAssist(me) ? P.btn('KI-Diktat', 'go-ai', {}, 'secondary', 'mic') : '') + P.btn('Ich / Abmelden', 'go-me', {}, 'ghost', 'user') + '</div>';
    return quick + head + body;
  }
  ui.registerView('more', { label: 'Mehr', icon: 'menu', groups: ['admin'], order: 50, render });
  ui.on('more-tab', (el) => ui.sub('moreTab', el.dataset.k));
  ui.on('go-week', () => ui.go('week', {}));
  ui.on('go-ai', () => ui.go('ai', {}));
  ui.on('go-me', () => ui.go('me', {}));

  /* ---------- KI-Sprachassistent (K1) ---------------------------------------------- */
  let found = [];
  function aiRender({ me }) {
    const can = SN.ai.available();
    return '<p class="sn-muted">Sprich oder tippe, was wer machen soll. Die KI legt daraus Aufträge an – du bestätigst vor dem Senden. Beispiel: „Anna soll in der Drogerie die Lücken füllen, dringend. Kemal baut das Aktionsregal Getränke auf.“</p>'
      + (can.text ? '' : '<div class="sn-alert sn-alert--info sn-alert--card"><p class="sn-alert__title">KI nur in der Claude-Ansicht verfügbar.</p></div>')
      + '<div class="sn-field"><label class="sn-label" for="ai-text">Diktat</label><textarea class="sn-textarea" id="ai-text" rows="4"></textarea></div>'
      + '<div class="sn-row" style="gap:8px">' + (can.dictation ? P.btn('Sprechen', 'mic', { target: 'ai-text' }, 'secondary', 'mic') : '') + P.btn('Aufträge erkennen', 'ai-go', {}, 'primary') + '</div>'
      + (found.length ? P.sec('Erkannt – bitte prüfen', found.length) + found.map((f, i) => '<div class="sn-card' + (f.u ? ' sn-card--urgent' : '') + '" style="padding:12px"><b>' + (f.u ? SN.ui.urgent() + ' ' : '') + esc(f.t) + '</b><p class="sn-small">' + esc(f.dept + ' · ' + f.act) + '</p>'
        + '<div class="sn-field"><label class="sn-label" for="ai-who-' + i + '">Für ' + (f.who && !f.wid ? '<span class="sn-chip sn-chip--urgent">„' + esc(f.who) + '“ nicht gefunden</span>' : '') + '</label><select class="sn-select" id="ai-who-' + i + '"><option value="">Automatisch verteilen</option>' + U.sortBy(SN.dist.candidates(SN.clock.now()), (e) => e.name).map((e) => '<option value="' + e.id + '"' + (e.id === f.wid ? ' selected' : '') + '>' + esc(e.name) + '</option>').join('') + '</select></div></div>').join('')
        + P.btn('Alle senden und verteilen', 'ai-send', {}, 'primary', 'send') : '');
  }
  ui.registerView('ai', { label: 'KI', icon: 'mic', groups: ['admin'], order: 60, render: aiRender, allow: (me) => M.canAiAssist(me), show: () => false });
  ui.on('ai-go', async (el) => {
    const tx = String(ui.sheetVal('ai-text') || '').trim(); if (!tx) return ui.toast('Bitte zuerst sprechen oder tippen.', 'warn');
    el.disabled = true;
    const out = await SN.ai.json('Ein Admin einer Supermarkt-Filiale diktiert Aufträge (beliebige Sprache): ' + JSON.stringify(tx) + '. Antworte NUR mit JSON-Array von Objekten {"t":"Auftrag auf Deutsch","dept":"einer von: ' + M.DEPTS.join(', ') + '","act":"einer von: ' + M.ACTS.map((a) => a.key).join(', ') + '","u":true wenn dringend,"who":"Name der Person oder leer"}.', { tier: 'default' });
    el.disabled = false;
    if (!Array.isArray(out)) return ui.toast('Nicht erkannt. KI nur in Claude verfügbar.', 'warn');
    const cands = SN.dist.candidates(SN.clock.now());
    found = out.filter((x) => x && x.t).map((x) => {
      const w = String(x.who || '').toLowerCase().trim();
      const hit = w ? cands.filter((e) => e.name.toLowerCase() === w || e.name.toLowerCase().split(' ')[0] === w.split(' ')[0]) : [];
      return { t: String(x.t).slice(0, 140), dept: M.DEPTS.includes(x.dept) ? x.dept : 'Info', act: M.ACT_MIN[x.act] ? x.act : 'Sonstiges', u: !!x.u, who: x.who || '', wid: hit.length === 1 ? hit[0].id : '' };
    });
    ui.render(true);
  });
  ui.on('ai-send', async () => {
    const me = SN.session.me(), now = SN.clock.now();
    let n = 0;
    for (let i = 0; i < found.length; i++) {
      const f = found[i], wid = ui.sheetVal('ai-who-' + i) || null;
      const r = await C.task(me.id, { title: f.t, dept: f.dept, act: f.act, u: f.u, owner: wid || undefined, due: now + 4 * U.HOUR, escalate: true });
      if (r.ok) n++; else ui.toast(f.t + ': ' + r.reason, 'warn');
    }
    const d = await SN.dist.run(me.id);
    found = []; ui.toast(n + ' Aufträge gesendet. ' + SN.dist.resultText(d)); ui.render(true);
  });
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/80-more.js konnte nicht geladen werden:", e); }

/* ===== src/views/82-roster.js ===== */
try {
/* ==========================================================================
   Dienstplan-Scan (Admin): Foto des Dienstplans → KI liest Namen und Zeiten →
   Vorschau „gefunden / nicht gefunden / mehrdeutig“ → nur Bestätigtes übernehmen.
   ========================================================================== */
(function (SN) {
  'use strict';
  const U = SN.util, M = SN.model, O = SN.ops, ui = SN.ui, P = SN.parts, esc = U.esc, icon = ui.icon;
  let rows = [];

  function preview() {
    const people = U.sortBy(M.staff(), (e) => e.name);
    const found = rows.filter((r) => r.state === 'found').length;
    return '<p>' + found + ' von ' + rows.length + ' Namen sicher zugeordnet. Nicht gefundene bitte zuordnen oder abwählen.</p>'
      + '<table class="sn-roster"><tbody>' + rows.map((r, i) => '<tr><td><label class="sn-check"><input type="checkbox" id="ro-on-' + i + '"' + (r.state === 'found' ? ' checked' : '') + '></label></td>'
        + '<td><b class="' + (r.state === 'found' ? '' : 'is-miss') + '">' + esc(r.name) + '</b><br><small>' + (r.state === 'found' ? icon('check-circle', 'sn-icon--xs') + ' gefunden' : r.state === 'ambiguous' ? icon('alert', 'sn-icon--xs') + ' mehrdeutig' : icon('x-circle', 'sn-icon--xs') + ' nicht gefunden') + ' · '
        + esc((r.days || []).filter((d) => !d.off).map((d) => d.d + ' ' + d.s + '–' + d.e).join(', ') || 'frei') + '</small>'
        + '<select class="sn-select" id="ro-id-' + i + '" aria-label="Zuordnung für ' + esc(r.name) + '"><option value="">– Person wählen –</option>'
        + (r.candidates.length ? r.candidates : people.map((e) => e.id)).map((id) => '<option value="' + id + '"' + (id === r.id ? ' selected' : '') + '>' + esc(M.name(id)) + '</option>').join('')
        + '</select></td></tr>').join('') + '</tbody></table>';
  }
  ui.onChange('roster-photo', async (el) => {
    const f = el.files && el.files[0]; if (!f) return;
    if (!SN.ai.available().images) return ui.toast('Dienstplan lesen geht nur in der Claude-Ansicht. Pläne einzeln unter „Ich“ bearbeiten.', 'warn');
    ui.toast('Dienstplan wird gelesen …', 'info');
    const img = await U.shrinkImage(f, 1600, 0.75);
    const out = await SN.ai.image('Das Foto zeigt den Dienstplan einer Supermarkt-Filiale: pro Mitarbeiter Name und Arbeitszeiten je Tag. Antworte NUR mit JSON-Array [{"name":"Vorname Nachname","days":[{"d":"Mo","off":false,"s":"HH:MM","e":"HH:MM","p":Pause in Minuten oder null}]}] mit Mo bis So. off=true bei frei, Urlaub oder krank.', [img.blob]);
    if (!Array.isArray(out)) return ui.toast('Dienstplan nicht erkannt. Bitte gerader und näher fotografieren.', 'warn');
    rows = O.rosterPreview(out);
    ui.sheet('Dienstplan prüfen', preview(), P.btn('Bestätigte übernehmen', 'roster-apply', {}, 'primary', 'check'));
  });
  ui.on('roster-apply', async () => {
    const sel = rows.map((r, i) => Object.assign({}, r, { id: ui.sheetVal('ro-on-' + i) ? ui.sheetVal('ro-id-' + i) || null : null })).filter((r) => r.id);
    if (!sel.length) return ui.toast('Keine Zeile ausgewählt.', 'warn');
    const r = await O.applyRoster(SN.session.id, sel);
    ui.result(r, r.count + ' Wochenpläne übernommen'); ui.closeSheet(); rows = [];
  });
  SN.rosterTest = (data) => { rows = O.rosterPreview(data); ui.sheet('Dienstplan prüfen', preview(), P.btn('Bestätigte übernehmen', 'roster-apply', {}, 'primary', 'check')); };
})(window.SN = window.SN || {});
} catch (e) { console.error("[SN] Modul src/views/82-roster.js konnte nicht geladen werden:", e); }

/* ===== src/views/90-clean.js ===== */
try {
/* ==========================================================================

   Der Melder sieht sofort „Reinigung kommt“ und „Sauber“.
