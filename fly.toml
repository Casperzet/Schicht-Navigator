# Fly.io: `fly launch --copy-config --no-deploy`, dann
#   fly volumes create daten --size 1 --region fra
#   fly secrets set FILIAL_KEY=<langer zufälliger Schlüssel>
#   fly deploy
app = "schicht-navigator"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  MEDIA_DAYS = "30"

[[mounts]]
  source = "daten"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # SSE-Verbindungen brauchen eine laufende Maschine
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
